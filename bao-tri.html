<!DOCTYPE html>

<meta content="#0b1020" name="theme-color"/>
<style>
:root{
  --bg:#0b1020; --card:#151d33; --ink:#e9eef9; --ink-soft:#98a3bb; --ink-dim:#5f6b85;
  --line:#27314f; --mc:#60a5fa; --mc2:#c084fc;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(96,165,250,.15), transparent 60%),
    radial-gradient(1000px 640px at -10% 30%, rgba(192,132,252,.10), transparent 55%),
    linear-gradient(180deg,#0e1428 0%, var(--bg) 100%);
  color:var(--ink);line-height:1.6;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.box{max-width:460px;text-align:left}
.wordmark{font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--ink-soft)}
.wordmark i{font-style:normal;background:linear-gradient(92deg,var(--mc),var(--mc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin-top:22px;font-size:clamp(30px,7vw,42px);letter-spacing:-.03em;line-height:1.12;font-weight:800;
  background:linear-gradient(94deg,#e9eef9 30%,var(--mc) 70%,var(--mc2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--ink-soft);margin-top:14px;font-size:16px}
.dim{margin-top:26px;font-size:13px;color:var(--ink-dim)}
.dim a{color:var(--ink-dim)}
</style>
</head>
<body>
  <div class="box">
    <div class="wordmark">Stop <i>&amp;</i> Think</div>
    <h1>Đang nâng cấp.</h1>
    <p>Thư viện đang được làm lại từ đầu — giao diện mới, đọc dễ hơn. Quay lại sau vài hôm nhé.</p>
    <p class="dim">flamindi.com · viết bởi Quang Ton · <a href="/pages/dang-nhap.html?redirect=%2F" style="color:var(--ink-dim)">đăng nhập</a></p>
  </div>
</body>
