<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đăng nhập — Stop &amp; Think</title>
<script id="dark-mode-init">(function(){try{var t=localStorage.getItem('st-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="description" content="Đăng nhập Stop & Think."/>
<meta name="robots" content="noindex,nofollow"/>
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="../apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
<link as="font" crossorigin="" href="/assets/fonts/inter-vietnamese-400-normal.woff2" rel="preload" type="font/woff2"/>
<link as="font" crossorigin="" href="/assets/fonts/fraunces-vietnamese-700-normal.woff2" rel="preload" type="font/woff2"/>
<link href="/assets/fonts.v1.css" rel="stylesheet"/>
<style>
:root {
  --rust: #8b3a2b; --rust-deep: #5e2418;
  --copper: #c4923c; --copper-light: #d9b073;
  --cream: #ffffff; --cream-soft: #f7f7f7; --paper: #ebe1cf; --paper-deep: #f5ede0;
  --ink: #1a1410; --muted: #4a3f33;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--paper-deep); color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 17px; line-height: 1.6;
  min-height: 100vh;
  display: flex; flex-direction: column;
}
h1, .brand, .auth-h1 { font-family: 'Fraunces', Georgia, serif; }
.auth-header { padding: 20px 32px; }
.brand {
  font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.brand .dot { width: 6px; height: 6px; background: var(--copper); border-radius: 50%; }
.brand .amp { color: var(--rust); font-style: normal; font-weight: 400; }
.auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 64px; }
.auth-card {
  width: 100%; max-width: 440px;
  background: var(--cream-soft);
  border: 2px solid var(--ink);
  padding: 40px 32px;
  position: relative;
}
.auth-card::before {
  content: ''; position: absolute; top: -2px; left: -2px;
  width: 56px; height: 4px; background: var(--rust);
}
.auth-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--rust); margin-bottom: 14px;
}
.auth-h1 { font-size: 30px; font-weight: 700; line-height: 1.15; margin-bottom: 8px; }
.auth-sub { font-size: 15px; color: var(--muted); margin-bottom: 28px; }
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; font-weight: 600; color: var(--muted);
  margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 12px 14px; font-size: 16px;
  background: var(--cream); color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 0;
  font-family: inherit; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus { border-color: var(--rust); box-shadow: 3px 3px 0 var(--copper-light); }
.field-row { display: flex; justify-content: space-between; align-items: baseline; }
.field-row a { font-size: 12px; color: var(--rust); text-decoration: none; }
.field-row a:hover { text-decoration: underline; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 14px 20px; font-size: 14px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  border: 1.5px solid var(--ink); cursor: pointer;
  font-family: 'Manrope', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none;
}
.btn-primary { background: var(--rust); color: var(--cream); border-color: var(--rust); }
.btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-google { background: var(--cream); color: var(--ink); }
.btn-google:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--copper); }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
.sep {
  display: flex; align-items: center; gap: 12px;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin: 22px 0;
}
.sep::before, .sep::after { content: ''; flex: 1; height: 1px; background: rgba(26, 20, 16, 0.18); }
.msg { font-size: 14px; padding: 12px 14px; margin-bottom: 16px; border-left: 3px solid; }
.msg-error { background: rgba(139, 58, 43, 0.08); border-color: var(--rust); color: var(--rust-deep); }
.msg-ok { background: rgba(196, 146, 60, 0.12); border-color: var(--copper); color: var(--ink); }
.auth-foot { font-size: 14px; color: var(--muted); margin-top: 20px; text-align: center; }
.auth-foot a { color: var(--rust); font-weight: 600; text-decoration: none; border-bottom: 1px solid currentColor; }

[data-theme="dark"] body { background: #1a1410; color: #f5ede0; }
[data-theme="dark"] .brand { color: #f5ede0; }
[data-theme="dark"] .auth-card { background: #2a201a; border-color: #f5ede0; }
[data-theme="dark"] .auth-card::before { background: var(--copper); }
[data-theme="dark"] .auth-h1 { color: #f5ede0; }
[data-theme="dark"] .auth-sub, [data-theme="dark"] .auth-foot, [data-theme="dark"] .field label, [data-theme="dark"] .sep { color: #c4b59f; }
[data-theme="dark"] .field input { background: #1a1410; color: #f5ede0; border-color: #c4b59f; }
[data-theme="dark"] .field input:focus { border-color: var(--copper); }
[data-theme="dark"] .btn-google { background: #2a201a; color: #f5ede0; border-color: #c4b59f; }
[data-theme="dark"] .btn-primary { background: var(--copper); color: #1a1410; border-color: var(--copper); }

@media (max-width: 480px) {
  .auth-card { padding: 32px 22px; }
  .auth-h1 { font-size: 26px; }
}
</style>
</head>
<body>
<header class="auth-header">
  <a class="brand" href="/">
    <span class="dot"></span>Stop <span class="amp">&amp;</span> Think
  </a>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tag">Quay lại</div>
    <h1 class="auth-h1">Đăng nhập</h1>
    <p class="auth-sub">Nhập email hoặc dùng Google để vào tài khoản.</p>

    <div id="msg" class="msg" hidden></div>

    <a class="btn btn-google" href="/api/auth/google?redirect=/">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      Đăng nhập bằng Google
    </a>

    <div class="sep">Hoặc dùng email</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="f-email">Email</label>
        <input id="f-email" name="email" type="email" required autocomplete="email" placeholder="ban@vidu.com"/>
      </div>
      <div class="field">
        <div class="field-row">
          <label for="f-password">Mật khẩu</label>
          <a href="/quen-mat-khau">Quên?</a>
        </div>
        <input id="f-password" name="password" type="password" required autocomplete="current-password"/>
      </div>

      <button id="submitBtn" type="submit" class="btn btn-primary">Đăng nhập</button>
    </form>

    <p class="auth-foot">Chưa có tài khoản? <a href="/dang-ky">Đăng ký</a></p>
  </div>
</main>

<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');

function showMsg(text, kind = 'error') {
  msg.textContent = text;
  msg.className = 'msg msg-' + (kind === 'ok' ? 'ok' : 'error');
  msg.hidden = false;
}

function getRedirect() {
  try {
    const r = new URL(window.location.href).searchParams.get('redirect');
    if (r && r.startsWith('/') && !r.startsWith('//')) return r;
  } catch (_) {}
  return '/';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.hidden = true;
  const fd = new FormData(form);
  const payload = {
    email: (fd.get('email') || '').toString().trim().toLowerCase(),
    password: (fd.get('password') || '').toString()
  };
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showMsg(data.error || 'Đăng nhập thất bại. Thử lại.');
    } else {
      try { sessionStorage.removeItem('st_user_v1'); } catch (_) {}
      window.location.href = getRedirect();
    }
  } catch (err) {
    showMsg('Không kết nối được. Thử lại sau.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
