<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đặt lại mật khẩu — Stop &amp; Think</title>
<script id="dark-mode-init">(function(){try{var t=localStorage.getItem('st-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="robots" content="noindex,nofollow"/>
<link href="../favicon.svg" rel="icon" type="image/svg+xml"/>
<link as="font" crossorigin="" href="/assets/fonts/inter-vietnamese-400-normal.woff2" rel="preload" type="font/woff2"/>
<link href="/assets/fonts.v1.css" rel="stylesheet"/>
<style>
:root {
  --rust:#2f6fed; --rust-deep:#1e4fc0; --copper:#0fb6d4; --copper-light:#7fa4f5;
  --cream:#ffffff; --cream-soft:#f7f7f7; --paper-deep:#edf0f8;
  --ink:#1a2233; --muted:#4e5a74;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--paper-deep); color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px; line-height:1.6; min-height:100vh;
  display:flex; flex-direction:column;
}
h1,.brand,.auth-h1 { font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.auth-header { padding:20px 32px; }
.brand {
  font-size:20px; font-weight:600; letter-spacing:-0.02em;
  display:inline-flex; align-items:center; gap:10px;
  text-decoration:none; color:var(--ink);
}
.brand .dot { width:6px; height:6px; background:var(--copper); border-radius:50%; }
.brand .amp { color:var(--rust); font-style:normal; font-weight:400; }
.auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 20px 64px; }
.auth-card {
  width:100%; max-width:440px; background:var(--cream-soft);
  border:2px solid var(--ink); padding:40px 32px; position:relative;
}
.auth-card::before {
  content:''; position:absolute; top:-2px; left:-2px;
  width:56px; height:4px; background:var(--rust);
}
.auth-tag {
  font-family:'JetBrains Mono',monospace; font-size:11px;
  letter-spacing:0.2em; text-transform:uppercase;
  color:var(--rust); margin-bottom:14px;
}
.auth-h1 { font-size:30px; font-weight:700; line-height:1.15; margin-bottom:8px; }
.auth-sub { font-size:15px; color:var(--muted); margin-bottom:28px; }
.field { margin-bottom:16px; }
.field label {
  display:block; font-size:12px; letter-spacing:0.08em;
  text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:6px;
}
.field input {
  width:100%; padding:12px 14px; font-size:16px;
  background:var(--cream); color:var(--ink);
  border:1.5px solid var(--ink); border-radius:0;
  font-family:inherit; outline:none;
  transition:border-color 0.15s, box-shadow 0.15s;
}
.field input:focus { border-color:var(--rust); box-shadow:3px 3px 0 var(--copper-light); }
.field .hint { font-size:12px; color:var(--muted); margin-top:4px; }
.btn {
  display:inline-flex; align-items:center; justify-content:center;
  width:100%; padding:14px 20px; font-size:14px; font-weight:600;
  letter-spacing:0.1em; text-transform:uppercase;
  border:1.5px solid var(--ink); cursor:pointer;
  font-family:'Manrope',sans-serif;
  transition:transform 0.15s, box-shadow 0.15s;
  background:var(--rust); color:var(--cream); border-color:var(--rust);
}
.btn:hover { transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--ink); }
.btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; box-shadow:none; }
.msg { font-size:14px; padding:12px 14px; margin-bottom:16px; border-left:3px solid; }
.msg-error { background:rgba(139,58,43,0.08); border-color:var(--rust); color:var(--rust-deep); }
.msg-ok { background:rgba(196,146,60,0.12); border-color:var(--copper); color:var(--ink); }
.skel { color:var(--muted); text-align:center; padding:24px 0; }
.auth-foot { font-size:14px; color:var(--muted); margin-top:20px; text-align:center; }
.auth-foot a { color:var(--rust); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor; }

[data-theme="dark"] body { background:#1a2233; color:#edf0f8; }
[data-theme="dark"] .brand { color:#edf0f8; }
[data-theme="dark"] .auth-card { background:#1a2233; border-color:#edf0f8; }
[data-theme="dark"] .auth-card::before { background:var(--copper); }
[data-theme="dark"] .auth-h1 { color:#edf0f8; }
[data-theme="dark"] .auth-sub, [data-theme="dark"] .auth-foot, [data-theme="dark"] .field label, [data-theme="dark"] .skel { color:#cfd8e8; }
[data-theme="dark"] .field input { background:#1a2233; color:#edf0f8; border-color:#cfd8e8; }
[data-theme="dark"] .field input:focus { border-color:var(--copper); }
[data-theme="dark"] .btn { background:var(--copper); color:#1a2233; border-color:var(--copper); }

@media (max-width:480px) { .auth-card { padding:32px 22px; } .auth-h1 { font-size:26px; } }
</style>
</head>
<body>
<header class="auth-header">
  <a class="brand" href="/"><span class="dot"></span>Stop <span class="amp">&amp;</span> Think</a>
</header>
<main class="auth-wrap">
  <div class="auth-card" id="card">
    <div class="auth-tag">Mật khẩu mới</div>
    <h1 class="auth-h1">Đặt lại mật khẩu</h1>
    <p class="skel" id="loading">Đang kiểm tra link…</p>
  </div>
</main>
<script>
function getToken() {
  try { return new URL(window.location.href).searchParams.get('token') || ''; }
  catch (_) { return ''; }
}
function renderInvalid(reason) {
  const map = {
    missing: 'Link thiếu token.',
    not_found: 'Link không hợp lệ.',
    used: 'Link đã được dùng rồi.',
    expired: 'Link đã hết hạn (quá 1 giờ).'
  };
  document.getElementById('card').innerHTML = `
    <div class="auth-tag">Lỗi</div>
    <h1 class="auth-h1">Link không hợp lệ</h1>
    <p class="auth-sub">${map[reason] || 'Không thể đặt lại mật khẩu.'} Yêu cầu link mới ở dưới.</p>
    <p class="auth-foot"><a href="/quen-mat-khau">Yêu cầu lại link</a></p>
  `;
}
function renderForm() {
  document.getElementById('card').innerHTML = `
    <div class="auth-tag">Mật khẩu mới</div>
    <h1 class="auth-h1">Đặt lại mật khẩu</h1>
    <p class="auth-sub">Chọn mật khẩu mới. Bạn sẽ được đăng nhập ngay sau đó.</p>
    <div id="msg" class="msg" hidden></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="f-pw">Mật khẩu mới</label>
        <input id="f-pw" name="password" type="password" required minlength="8" autocomplete="new-password"/>
        <div class="hint">Tối thiểu 8 ký tự, có cả chữ và số.</div>
      </div>
      <button id="btn" type="submit" class="btn">Đặt lại mật khẩu</button>
    </form>
  `;
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.hidden = true;
    const pw = (new FormData(form).get('password') || '').toString();
    btn.disabled = true; btn.textContent = 'Đang lưu…';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ token: getToken(), password: pw })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        msg.textContent = data.error || 'Lỗi khi đặt lại mật khẩu.';
        msg.className = 'msg msg-error';
        msg.hidden = false;
        btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
        return;
      }
      try { sessionStorage.removeItem('st_user_v1'); } catch (_) {}
      window.location.href = '/tai-khoan';
    } catch (_) {
      msg.textContent = 'Không kết nối được. Thử lại sau.';
      msg.className = 'msg msg-error'; msg.hidden = false;
      btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
    }
  });
}

(async function () {
  const token = getToken();
  if (!token) { renderInvalid('missing'); return; }
  try {
    const res = await fetch('/api/auth/reset-password?token=' + encodeURIComponent(token));
    const data = await res.json().catch(() => ({ valid: false }));
    if (data.valid) renderForm();
    else renderInvalid(data.reason || 'not_found');
  } catch (_) {
    renderInvalid('not_found');
  }
})();
</script>
</body>
</html>
