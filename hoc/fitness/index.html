<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Log — Tiến độ tập luyện</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --track:#eceff3;
  --line:#e6e9ee; --txt:#141a24; --mut:#6b7480; --soft:#9aa2ad;
  --acc:#2f6bff; --acc-d:#1f4fd6; --acc2:#0e9f6e; --warn:#f59e0b;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --shadow-h:0 2px 4px rgba(16,24,40,.05), 0 14px 34px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:
    radial-gradient(1100px 460px at 50% -160px, #eaf0ff 0%, rgba(234,240,255,0) 60%), var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.wrap{max-width:1160px;margin:0 auto;padding:40px 26px 90px;}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:27px;margin:0;letter-spacing:-.025em;font-weight:750;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#7aa2ff);
  box-shadow:0 0 0 4px rgba(47,107,255,.14)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 26px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;position:sticky;top:0;z-index:5;
  padding:12px 0;background:linear-gradient(var(--bg) 62%, rgba(245,246,248,0));}
.filters button{background:var(--panel);color:var(--mut);border:1px solid var(--line);
  padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:.16s ease;box-shadow:var(--shadow)}
.filters button:hover{color:var(--txt);border-color:#d3d9e2;transform:translateY(-1px)}
.filters button.on{background:linear-gradient(180deg,var(--acc),var(--acc-d));color:#fff;
  border-color:transparent;box-shadow:0 6px 16px rgba(47,107,255,.28)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(var(--acc),#7aa2ff)}
.kpi.streak::before{background:linear-gradient(var(--warn),#fbbf24)}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .n small{font-size:15px;color:var(--soft);font-weight:600}
.kpi .l{color:var(--mut);font-size:12px;margin-top:8px;font-weight:500}
.section-title{font-size:15px;font-weight:700;margin:34px 0 14px;color:var(--txt);letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px}
.section-title .c{color:var(--soft);font-weight:500;font-size:12.5px}
.acttabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.acttabs button{display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;
  cursor:pointer;box-shadow:var(--shadow);transition:.14s ease}
.acttabs button:hover{border-color:var(--acc);color:var(--acc-d);transform:translateY(-1px)}
.acttabs button .e{font-size:15px;line-height:1}
.acttabs button .n2{min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;
  justify-content:center;background:#eef3ff;color:var(--acc-d);border-radius:6px;font-size:11px;font-weight:700}
.acts{display:flex;flex-direction:column;gap:14px}
.act{display:flex;gap:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px 24px;box-shadow:var(--shadow);transition:.15s ease;scroll-margin-top:84px}
.act:hover{box-shadow:var(--shadow-h);border-color:#d3d9e2}
.act-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.act-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:2px}
.act-title{display:flex;gap:12px;align-items:center}
.act-title .e{font-size:26px;line-height:1}
.act-title .name{font-size:18px;font-weight:700;letter-spacing:-.02em}
.act-title .cat{display:inline-block;margin-top:4px;font-size:10px;color:var(--acc-d);background:#eef3ff;
  border:1px solid #dfe8ff;text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:2px 7px;border-radius:5px}
.act-total{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.act-total small{font-size:13px;color:var(--soft);font-weight:600;letter-spacing:0}
.act-side{flex:0 0 300px;border-left:1px solid var(--line);padding-left:26px;display:flex;flex-direction:column;gap:16px}
.pct-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:.95;font-variant-numeric:tabular-nums}
.pct-lbl{font-size:12px;color:var(--mut);margin:5px 0 11px;font-weight:500}
.pbar{height:9px;background:var(--track);border-radius:4px;overflow:hidden}
.pbar .pfill{height:100%;border-radius:4px;transition:width .3s}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini .mv{font-size:21px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.mini .mv.up{color:var(--acc2)}.mini .mv.down{color:#e5484d}
.mini .ml{font-size:10px;color:var(--soft);margin-top:5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.status{margin-top:auto;text-align:center;font-size:12.5px;font-weight:700;padding:10px;border-radius:8px;letter-spacing:.01em}
.status.g{background:#e7f7f0;color:#0a7d55}.status.b{background:#eaf1ff;color:var(--acc-d)}.status.w{background:#fff4e2;color:#b26a00}
.bars{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:20px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .col .v{font-size:9.5px;color:var(--mut);line-height:1;margin-bottom:3px;white-space:nowrap;
  font-weight:600;font-variant-numeric:tabular-nums}
.bars .col:hover .v{color:var(--acc-d)}
.bars .col .dl{font-size:8.5px;color:var(--soft);margin-top:5px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .col:hover .dl{color:var(--mut)}
.bars .bar{width:100%;background:var(--track);border-radius:5px 5px 3px 3px;min-height:3px;transition:.15s}
.bars .bar.hot{background:linear-gradient(180deg,#5b8bff,var(--acc));box-shadow:0 1px 4px rgba(47,107,255,.22)}
.bars .col:hover .bar.hot{background:linear-gradient(180deg,#4f83ff,var(--acc-d))}
.empty{color:var(--mut);font-size:14px;background:var(--panel);border:1px dashed #d7dce4;
  border-radius:var(--radius);padding:34px;text-align:center;box-shadow:var(--shadow)}
/* heatmap */
.heatwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow)}
.heat-grid{display:flex;gap:8px;align-items:flex-start;overflow-x:auto;padding-bottom:2px}
.heat-wd{display:flex;flex-direction:column;gap:3px;padding-top:19px;flex:0 0 auto}
.heat-wd span{height:14px;line-height:14px;font-size:9px;color:var(--soft);text-align:right;min-width:22px}
.heat-cols{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.heat-months{display:flex;gap:3px;height:14px}
.heat-months .m{width:14px;height:14px;font-size:10px;color:var(--mut);white-space:nowrap;font-weight:500}
.heat{display:flex;gap:3px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat .cell{width:14px;height:14px;border-radius:4px;background:#e9edf2}
.heat .cell.l1{background:#c5e8d2}.heat .cell.l2{background:#7fd0a0}
.heat .cell.l3{background:#37b877}.heat .cell.l4{background:#0e9f6e}
.heat-legend{color:var(--soft);font-size:11px;margin-top:12px;display:flex;gap:6px;align-items:center}
.heat-legend .lg{width:14px;height:14px;display:inline-block;border-radius:4px;background:#e9edf2}
.heat-legend .lg.l1{background:#c5e8d2}.heat-legend .lg.l2{background:#7fd0a0}
.heat-legend .lg.l3{background:#37b877}.heat-legend .lg.l4{background:#0e9f6e}
.heat .cell.today{outline:2px solid var(--acc);outline-offset:1px}
.heat .col.wknow{box-shadow:0 0 0 2px var(--acc);border-radius:5px}
.heat-cap{margin-top:10px;font-size:11.5px;color:var(--mut);font-weight:500}
.heat-cap b{color:var(--acc-d)}
/* log */
.log .day{margin-bottom:18px}
.log .date{font-size:12px;color:var(--soft);margin:0 0 8px 2px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.log .row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;margin-bottom:7px;box-shadow:var(--shadow);transition:.15s}
.log .row:hover{border-color:#dbe1ea;transform:translateX(2px)}
.log .row .e{font-size:18px;width:26px;text-align:center}
.log .row .d{flex:1}
.log .row .d b{font-weight:650}
.log .row .d span{color:var(--mut);font-size:13px;margin-left:8px}
.footer{color:var(--soft);font-size:11px;margin-top:44px;text-align:center}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.act{flex-direction:column}.act-side{flex-basis:auto;border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><span class="dot"></span> Fitness Log</h1>
  </div>
  <div class="sub" id="sub"></div>

  <div class="filters" id="filters">
    <button data-p="today">Hôm nay</button>
    <button data-p="week" class="on">Tuần này</button>
    <button data-p="month">Tháng này</button>
    <button data-p="90">90 ngày</button>
    <button data-p="all">Tất cả</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="section-title">Theo hoạt động <span class="c" id="actcount"></span></div>
  <div class="acttabs" id="acttabs"></div>
  <div id="cards"></div>

  <div class="section-title">Độ đều đặn <span class="c">— 17 tuần gần nhất</span></div>
  <div class="heatwrap">
    <div class="heat-grid">
      <div class="heat-wd" id="heatWd"></div>
      <div class="heat-cols">
        <div class="heat-months" id="heatMonths"></div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
    <div class="heat-legend"><span>Ít</span>
      <span class="lg"></span><span class="lg l1"></span><span class="lg l2"></span>
      <span class="lg l3"></span><span class="lg l4"></span><span>Nhiều</span></div>
    <div class="heat-cap" id="heatCap"></div>
  </div>

  <div class="section-title">Nhật ký <span class="c" id="logcount"></span></div>
  <div class="log" id="log"></div>

  <div class="footer" id="foot"></div>
</div>

<script>
const FIT = {"generated": "2026-08-16T15:30:53", "today": "2026-08-16", "activities": {"squat": {"slug": "squat", "display": "Squat", "metric": "reps", "unit": "lần", "category": "strength", "emoji": "💪", "goal_per_week": 3, "goal": {"kind": "session_week", "target": 3}, "first_seen": "2026-08-16"}}, "entries": [{"date": "2026-08-16", "sets": null, "reps": 40, "total_reps": 40, "weight_kg": null, "duration_min": null, "distance_km": null, "hours": null, "note": "webcam tự đếm (dem-squat)", "activity": "squat", "display": "Squat", "metric": "reps", "unit": "lần", "category": "strength", "emoji": "💪", "primary": 40, "id": "c59172498b", "ts": "2026-08-16T15:30:46"}]};
const A = FIT.activities, E = FIT.entries;
const TODAY = new Date(FIT.today + "T00:00:00");
let period = "week";

const g = n => (Math.round(n*100)/100).toString();
const parseD = s => new Date(s + "T00:00:00");
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
function startOf(p){
  const d = new Date(TODAY);
  if(p==="today") return d;
  if(p==="week"){ const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; }
  if(p==="month"){ d.setDate(1); return d; }
  if(p==="90"){ d.setDate(d.getDate()-89); return d; }
  return new Date("1970-01-01T00:00:00");
}
function inRange(e){ return parseD(e.date) >= startOf(period) && parseD(e.date) <= TODAY; }

function fmt(e){
  let s;
  if(e.metric==="reps"){
    if(e.sets && e.weight_kg) s = e.sets+"×"+e.reps+" @ "+e.weight_kg+"kg";
    else if(e.sets) s = e.sets+"×"+e.reps+" ("+e.total_reps+" lần)";
    else if(e.weight_kg) s = e.reps+" lần @ "+e.weight_kg+"kg";
    else s = (e.total_reps||e.reps)+" lần";
  } else if(e.metric==="duration"){ s = e.duration_min+" phút"; }
  else if(e.metric==="hours"){ s = g(e.hours)+" giờ"; }
  else { s = e.distance_km+" km"; if(e.duration_min) s += " · "+e.duration_min+" phút"; }
  if(e.note) s += " — "+e.note;
  return s;
}
function relDay(dateStr){
  const diff = Math.round((TODAY - parseD(dateStr))/86400000);
  if(diff<=0) return "hôm nay"; if(diff===1) return "hôm qua";
  if(diff<7) return diff+" ngày trước";
  if(diff<30) return Math.floor(diff/7)+" tuần trước";
  return Math.floor(diff/30)+" tháng trước";
}

function currentStreak(){
  const days = new Set(E.map(e=>e.date));
  let s=0, d=new Date(TODAY);
  // allow streak to count from today or yesterday
  if(!days.has(iso(d))) d.setDate(d.getDate()-1);
  while(days.has(iso(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}

function render(){
  const ents = E.filter(inRange);
  document.querySelectorAll("#filters button").forEach(b=>b.classList.toggle("on",b.dataset.p===period));
  const pl = {today:"hôm nay",week:"tuần này",month:"tháng này","90":"90 ngày qua",all:"toàn bộ"}[period];

  // KPIs
  const days = new Set(ents.map(e=>e.date));
  const acts = new Set(ents.map(e=>e.activity));
  document.getElementById("kpis").innerHTML = [
    ["Buổi tập", days.size, ""],
    ["Lượt ghi", ents.length, ""],
    ["Hoạt động", acts.size, ""],
    ["Chuỗi ngày", currentStreak(), "🔥"],
  ].map(k=>`<div class="kpi"><div class="n">${k[1]} <small>${k[2]}</small></div><div class="l">${k[0]} · ${pl}</div></div>`).join("");

  // cards per activity
  const byAct = {};
  ents.forEach(e=>{ (byAct[e.activity]=byAct[e.activity]||[]).push(e); });
  const slugs = Object.keys(A).sort((x,y)=>((byAct[y]||[]).length)-((byAct[x]||[]).length));
  document.getElementById("actcount").textContent = slugs.length? "— "+slugs.length+" mục" : "";
  const cardsEl = document.getElementById("cards");
  const tabsEl = document.getElementById("acttabs"); tabsEl.innerHTML="";
  if(!slugs.length){ cardsEl.className=""; cardsEl.innerHTML=`<div class="empty">Chưa có hoạt động nào. Ghi buổi tập đầu tiên: "hôm nay squat 20, chống đẩy 15".</div>`; }
  else{
    cardsEl.className="acts";
    cardsEl.innerHTML = slugs.map(slug=>{
      const a=A[slug], es=byAct[slug]||[];
      const total = es.reduce((s,e)=>s+(e.primary||0),0);
      const dayMap={}; es.forEach(e=>dayMap[e.date]=(dayMap[e.date]||0)+(e.primary||0));
      const nd=Object.keys(dayMap).length;
      const best= nd? Math.max(...Object.values(dayMap)) : 0;
      const avg = nd? total/nd : 0;
      // chart series
      const series=[];
      if(period==="week"){                 // căn theo tuần thật: T2 (cột đầu) -> CN
        const mon=startOf("week");
        for(let i=0;i<7;i++){ const dd=new Date(mon); dd.setDate(dd.getDate()+i);
          series.push([iso(dd), dayMap[iso(dd)]||0]); }
      } else if(period==="today"){
        series.push([iso(TODAY), dayMap[iso(TODAY)]||0]);
      } else {                              // month / 90 / all: 21 ngày gần nhất
        let span = period==="month"?31: period==="90"?90: 30;
        span=Math.min(span,21);
        for(let i=span-1;i>=0;i--){ const dd=new Date(TODAY); dd.setDate(dd.getDate()-i);
          series.push([iso(dd), dayMap[iso(dd)]||0]); }
      }
      const mx=Math.max(1,...series.map(s=>s[1]));
      const bars=series.map(s=>{const v=s[1];const h=v>0?Math.max(6,Math.round(v/mx*66)):0;
        const p=s[0].split("-");const dl=(+p[2])+"/"+(+p[1]);
        return `<div class="col" title="${s[0]}: ${g(v)} ${a.unit}"><span class="v">${v>0?g(v):''}</span><div class="bar ${v>0?'hot':''}" style="height:${h}%"></div><span class="dl">${dl}</span></div>`;}).join("");
      // % achieved vs weekly-frequency goal
      const minDate = es.length? es.map(e=>e.date).sort()[0] : FIT.today;
      const eff = period==="today"?1: period==="week"?7: period==="month"?TODAY.getDate(): period==="90"?90:
                  Math.max(7, Math.round((TODAY-parseD(minDate))/86400000)+1);
      const gobj = a.goal || {kind:"session_week", target:(a.goal_per_week||3)};
      let target, ach, pctLbl;
      if(gobj.kind==="volume_day"){ target=gobj.target*eff; ach=total;
        pctLbl=`${g(total)}/${g(target)} ${a.unit} · mục tiêu ${g(gobj.target)} ${a.unit}/ngày`; }
      else if(gobj.kind==="volume_week"){ target=gobj.target*eff/7; ach=total;
        pctLbl=`${g(total)}/${g(target)} ${a.unit} · mục tiêu ${g(gobj.target)} ${a.unit}/tuần`; }
      else { target=Math.max(1,gobj.target*eff/7); ach=nd;
        pctLbl=`${nd}/${Math.round(target)} buổi · mục tiêu ${g(gobj.target)}/tuần`; }
      const pct = Math.min(100, Math.round(ach/(target||1)*100));
      const col = pct>=100?"var(--acc2)": pct>=60?"var(--acc)":"var(--warn)";
      const sc = pct>=100?"g": pct>=60?"b":"w";
      const st = pct>=100?"Đạt mục tiêu 🎯": pct>=60?"Đang bám tốt 💪":"Cần đẩy thêm ⏳";
      // trend vs previous equal-length period
      let trendTxt="—", trendCls="";
      if(period!=="all"){
        const s0=startOf(period); const ps=new Date(s0); ps.setDate(ps.getDate()-eff);
        let prev=0; E.forEach(e=>{ if(e.activity===slug){ const dt=parseD(e.date); if(dt>=ps&&dt<s0) prev+=(e.primary||0);} });
        if(prev>0){ const ch=Math.round((total-prev)/prev*100); trendTxt=(ch>=0?"▲ +":"▼ ")+ch+"%"; trendCls=ch>=0?"up":"down"; }
        else if(total>0){ trendTxt="mới ✦"; trendCls="up"; }
      }
      return `<div class="act" id="act-${slug}">
        <div class="act-main">
          <div class="act-head">
            <div class="act-title"><span class="e">${a.emoji}</span>
              <div><div class="name">${a.display}</div><span class="cat">${a.category}</span></div></div>
            <div class="act-total">${g(total)} <small>${a.unit}</small></div>
          </div>
          <div class="bars">${bars}</div>
        </div>
        <div class="act-side">
          <div>
            <div class="pct-num" style="color:${col}">${pct}%</div>
            <div class="pct-lbl">${pctLbl}</div>
            <div class="pbar"><div class="pfill" style="width:${pct}%;background:${col}"></div></div>
          </div>
          <div class="kpi-grid">
            <div class="mini"><div class="mv">${g(best)}</div><div class="ml">PR ${a.unit}</div></div>
            <div class="mini"><div class="mv">${g(avg)}</div><div class="ml">TB/buổi</div></div>
            <div class="mini"><div class="mv ${trendCls}">${trendTxt}</div><div class="ml">vs kỳ trước</div></div>
          </div>
          <div class="status ${sc}">${st}</div>
        </div>
      </div>`;
    }).join("");
    tabsEl.innerHTML = slugs.map(slug=>{
      const a=A[slug]; const nd=new Set((byAct[slug]||[]).map(e=>e.date)).size;
      return `<button data-goto="act-${slug}"><span class="e">${a.emoji}</span>${a.display}<span class="n2">${nd}</span></button>`;
    }).join("");
  }

  // heatmap (fixed: last 17 weeks, not affected by filter)
  renderHeat();

  // log (respects filter)
  const logEl=document.getElementById("log");
  const byDay={}; ents.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  const dl=Object.keys(byDay).sort().reverse();
  document.getElementById("logcount").textContent = ents.length? "— "+ents.length+" lượt" : "";
  if(!dl.length){ logEl.innerHTML=`<div class="empty">Trống.</div>`; }
  else{
    logEl.innerHTML=dl.map(dt=>{
      const rows=byDay[dt].map(e=>`<div class="row"><div class="e">${e.emoji}</div><div class="d"><b>${e.display}</b><span>${fmt(e)}</span></div></div>`).join("");
      const dd=parseD(dt); const wd=["CN","T2","T3","T4","T5","T6","T7"][dd.getDay()];
      return `<div class="day"><div class="date">${wd} · ${dt} · ${relDay(dt)}</div>${rows}</div>`;
    }).join("");
  }

  document.getElementById("sub").textContent =
    `${E.length} lượt ghi · ${Object.keys(A).length} hoạt động · cập nhật ${FIT.generated.replace("T"," ")}`;
  document.getElementById("foot").textContent = "fitness-log · file tạo tự động, mở offline bất cứ đâu.";
}

function renderHeat(){
  const dayCount={}; E.forEach(e=>{ dayCount[e.date]=(dayCount[e.date]||0)+1; });
  const weeks=17;
  const start=new Date(TODAY); const w=(start.getDay()+6)%7;
  start.setDate(start.getDate()-w-7*(weeks-1));
  const MON=["Th1","Th2","Th3","Th4","Th5","Th6","Th7","Th8","Th9","Th10","Th11","Th12"];
  const WD=["T2","","T4","","T6","",""];
  const dd=["CN","T2","T3","T4","T5","T6","T7"];
  // month labels (one slot per week-column; label only when the month changes)
  let months="", prevM=-1;
  for(let c=0;c<weeks;c++){ const d=new Date(start); d.setDate(d.getDate()+c*7);
    const m=d.getMonth(); let lbl=""; if(m!==prevM){ lbl=MON[m]; prevM=m; }
    months+=`<div class="m">${lbl}</div>`; }
  // weekday labels down the left
  let wd=""; for(let r=0;r<7;r++) wd+=`<span>${WD[r]}</span>`;
  // grid
  let cols="";
  for(let c=0;c<weeks;c++){ let col='<div class="col'+(c===weeks-1?' wknow':'')+'">';
    for(let r=0;r<7;r++){ const d=new Date(start); d.setDate(d.getDate()+c*7+r); const key=iso(d);
      if(d<=TODAY){ const n=dayCount[key]||0; let cls="cell";
        if(n>=4)cls+=" l4"; else if(n===3)cls+=" l3"; else if(n===2)cls+=" l2"; else if(n===1)cls+=" l1";
        if(key===FIT.today) cls+=" today";
        col+=`<div class="${cls}" title="${dd[d.getDay()]} ${key} · ${n} lượt"></div>`; }
      else col+='<div class="cell" style="visibility:hidden"></div>';
    } col+='</div>'; cols+=col; }
  document.getElementById("heatMonths").innerHTML=months;
  document.getElementById("heatWd").innerHTML=wd;
  document.getElementById("heat").innerHTML=cols;
  const t=parseD(FIT.today), full=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"][t.getDay()];
  const p2=x=>String(x).padStart(2,"0");
  document.getElementById("heatCap").innerHTML =
    `▢ ô viền xanh = <b>hôm nay</b> · khung xanh = <b>tuần này</b> · Hôm nay: <b>${full}, ${p2(t.getDate())}/${p2(t.getMonth()+1)}/${t.getFullYear()}</b>`;
}

document.getElementById("filters").addEventListener("click",ev=>{
  if(ev.target.dataset.p){ period=ev.target.dataset.p; render(); }
});
document.getElementById("acttabs").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  const el=document.getElementById(b.dataset.goto);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
});
render();
</script>
