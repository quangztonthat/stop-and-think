<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>N5 — Test theo Gate</title><style>
:root{--bg:#fafaf7;--card:#fff;--soft:#f3f3ee;--border:#e0e0d8;--text:#1a1a1f;--soft-t:#3f3f4a;--dim:#7a7a85;--accent:#2f6fed;--accent2:#2258c8;--green:#0a7a4f;--red:#c1342b;--blue:#1e5fbf;--serif:'Fraunces',Georgia,serif;--sans:'Be Vietnam Pro','Segoe UI',system-ui,Arial,sans-serif;--mono:'Cascadia Code',Consolas,monospace;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 100px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2)}
h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:.2em 0 .1em}h1 em{font-style:italic;color:var(--accent)}
a.home{color:var(--accent2);font-size:13px;text-decoration:none}
.bar{height:10px;background:var(--soft);border-radius:20px;overflow:hidden;margin:14px 0 4px}.bar>i{display:block;height:100%;background:var(--green);width:0;transition:.4s}
.barlab{font-size:13px;color:var(--dim);margin-bottom:14px}
.path{display:grid;gap:12px}
.gate{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--dim);border-radius:14px;padding:15px 17px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.04)}
.gate.open{border-left-color:var(--accent)}.gate.pass{border-left-color:var(--green)}.gate.lock{opacity:.55;cursor:not-allowed}.gate.review{background:linear-gradient(0deg,var(--soft),var(--card))}
.gate .ico{font-size:22px;width:30px;text-align:center}
.gate .t{flex:1}.gate .t b{font-size:17px}.gate .t .s{font-size:13px;color:var(--dim)}
.gate .st{font-size:13px;font-weight:600;text-align:right;min-width:70px}
.st.p{color:var(--green)}.st.f{color:var(--red)}.st.n{color:var(--dim)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;font-size:13px}
.btn{border:1px solid var(--accent);background:var(--soft);color:var(--accent2);border-radius:10px;padding:7px 13px;font-weight:600;cursor:pointer;font-family:inherit;font-size:13px}
.note{background:var(--soft);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--soft-t);margin:14px 0}
.ban{background:#fbeceb;color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
/* test */
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 16px;margin:12px 0}
.q .num{font-size:12px;color:var(--dim)}.q .tag{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;float:right}
.q .prompt{font-size:16px;margin:5px 0 10px;white-space:pre-wrap}
.play{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.ghost{border:1px solid var(--accent);background:var(--soft);color:var(--accent2);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:6px}
.script{display:none;margin:8px 0;padding:8px 12px;background:var(--soft);border-left:3px solid var(--accent);border-radius:8px;font-family:var(--serif);font-size:16px}
.opt{display:block;border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin:6px 0;cursor:pointer;font-size:15px}.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:var(--soft)}.opt.correct{border-color:var(--green);background:#eaf6f0}.opt.wrong{border-color:var(--red);background:#fbeceb}
.explain{display:none;margin-top:8px;padding:8px 12px;background:var(--soft);border-left:3px solid var(--accent);border-radius:8px;font-size:14px}
.submit{margin:18px 0;width:100%;font-size:16px;font-weight:600;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
.result{display:none;background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:14px;padding:16px;margin:10px 0;position:sticky;top:8px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.result h2{font-family:var(--serif);margin:.1em 0;font-size:24px}.pass{color:var(--green)}.fail{color:var(--red)}.brk{font-size:13px;color:var(--dim);margin-top:5px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px}
.sec-h{font-family:var(--serif);font-size:18px;color:var(--accent2);border-bottom:2px solid var(--accent);padding-bottom:4px;margin:22px 0 2px}

/* ===== FLAMINDI THEME OVERRIDE (dong bo trang chu flamindi.com) ===== */
:root{
  --accent:#2f6fed;--accent-2:#2258c8;--accent2:#2258c8;--gold:#0fb6d4;--cyan:#0fb6d4;--blue:#2f6fed;
  --bg:#f7f9fe;--bg-elevated:#ffffff;--bg-card:#ffffff;--card:#ffffff;--bg-soft:#eef2fb;--soft:#eef2fb;
  --border:#e4e9f2;--border-soft:#eef1f7;--border-strong:#cfd8e8;
  --text:#1a2233;--text-soft:#4e5a74;--text-dim:#6b7691;
  --ink:#1a2233;--ink-soft:#4e5a74;--muted:#6b7691;--soft-t:#4e5a74;--dim:#6b7691;
  --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(47,111,237,.14),transparent 60%),radial-gradient(1000px 640px at -10% 30%,rgba(15,182,212,.09),transparent 55%),linear-gradient(#f7f9fe,#edf0f8) fixed !important;}

<script>const QBANK=[{"b": 1, "s": "moji", "p": "「がくせい」 nghĩa là gì?", "c": ["bạn bè", "sinh viên", "người Nhật", "giáo viên"], "a": 1, "e": "がくせい = sinh viên. せんせい = giáo viên, ともだち = bạn, にほんじん = người Nhật."}, {"b": 1, "s": "moji", "p": "Câu chào lần đầu gặp mặt là?", "c": ["おやすみ", "はじめまして", "さようなら", "いただきます"], "a": 1, "e": "はじめまして dùng khi gặp lần đầu. さようなら = tạm biệt, おやすみ = chúc ngủ ngon."}, {"b": 1, "s": "moji", "p": "「にじゅっさい」 nghĩa là?", "c": ["20 giờ", "20 tuổi", "2 tuổi", "2 giờ"], "a": 1, "e": "～さい là trợ số đếm tuổi → にじゅっさい = 20 tuổi. Giờ dùng ～じ."}, {"b": 1, "s": "bunpou", "p": "わたし＿＿がくせいです。", "c": ["は", "か", "の", "を"], "a": 0, "e": "は nêu chủ đề ('Tôi thì là sinh viên'). は ở đây đọc là 'wa'."}, {"b": 1, "s": "bunpou", "p": "Trợ từ は trong câu trên đọc là?", "c": ["ha", "wa", "pa", "ba"], "a": 1, "e": "Khi làm trợ từ chủ đề, は đọc là 'wa', không phải 'ha'."}, {"b": 1, "s": "bunpou", "p": "Biến thành câu hỏi: クアンさんはがくせいです＿＿。", "c": ["か", "の", "よ", "ね"], "a": 0, "e": "Thêm か cuối câu → câu hỏi. Trả lời はい (vâng) / いいえ (không)."}, {"b": 1, "s": "bunpou", "p": "わたし＿＿なまえはクアンです。(tên CỦA tôi)", "c": ["は", "の", "を", "に"], "a": 1, "e": "の nối hai danh từ chỉ sở hữu: わたしの なまえ = tên của tôi."}, {"b": 1, "s": "bunpou", "p": "Chọn câu ĐÚNG nghĩa 'Anh Tanaka là giáo viên.'", "c": ["たなかさんはせんせいです。", "せんせいはたなかさんを。", "たなかさんをせんせいです。", "たなかさんはせんせいか。"], "a": 0, "e": "Mẫu A は B です: たなかさんは せんせい です."}, {"b": 1, "s": "choukai", "q": "Quang đến từ đâu?", "au": ["はじめまして。クアンです。ベトナムからきました。", "はじめまして。たなかです。"], "sc": ["A: はじめまして。クアンです。ベトナムからきました。", "B: はじめまして。たなかです。"], "c": ["Nhật Bản", "Hàn Quốc", "Việt Nam", "Trung Quốc"], "a": 2, "e": "「ベトナムからきました」 = 'đến từ Việt Nam'. から = từ (nơi xuất phát)."}, {"b": 2, "s": "moji", "p": "「これ」 nghĩa là gì?", "c": ["cái đó (gần người nghe)", "cái nào", "cái kia (xa)", "đây / cái này (gần người nói)"], "a": 3, "e": "これ=cái này gần người nói; それ gần người nghe; あれ xa cả hai; どれ = cái nào."}, {"b": 2, "s": "moji", "p": "「とけい」 là cái gì?", "c": ["chìa khóa", "đồng hồ", "điện thoại", "cái ô"], "a": 1, "e": "とけい (tokei) = đồng hồ. でんわ = điện thoại, かさ = ô."}, {"b": 2, "s": "moji", "p": "「どこ」 dùng để hỏi điều gì?", "c": ["cái nào", "nơi chốn (ở đâu)", "cái gì", "ai"], "a": 1, "e": "どこ (doko) = ở đâu. なに/なん = cái gì, だれ = ai, どれ = cái nào."}, {"b": 2, "s": "moji", "p": "Để nói 'người kia (ở xa)' ta dùng?", "c": ["あのひと", "これ", "このひと", "そのひと"], "a": 0, "e": "あの = chỉ vật/người ở XA cả hai. あのひと (ano hito) = người kia."}, {"b": 2, "s": "bunpou", "p": "＿＿は ほんです。 (Cái này là sách — đứng một mình)", "c": ["この", "これ", "どの", "ここ"], "a": 1, "e": "これ đứng MỘT MÌNH làm chủ ngữ. この phải gắn danh từ ngay sau (この ほん)."}, {"b": 2, "s": "bunpou", "p": "＿＿ ほんは わたしのです。 (quyển sách NÀY)", "c": ["ここ", "どれ", "これ", "この"], "a": 3, "e": "Trước danh từ (ほん) phải dùng この, không dùng これ."}, {"b": 2, "s": "bunpou", "p": "わたしは がくせい＿＿。 (Tôi KHÔNG phải sinh viên)", "c": ["も", "です", "じゃ ありません", "ですか"], "a": 2, "e": "Phủ định của です là じゃ ありません."}, {"b": 2, "s": "bunpou", "p": "それは ＿＿ですか。 (Cái đó là CÁI GÌ?)", "c": ["どれ", "どこ", "だれ", "なん"], "a": 3, "e": "Hỏi 'cái gì' = なん/なに; trước です đọc なん. だれ = ai, どこ = ở đâu."}, {"b": 2, "s": "bunpou", "p": "これは ＿＿ かさですか。 (Cái ô này CỦA AI?)", "c": ["だれの", "だれ", "どこ", "なんの"], "a": 0, "e": "だれの = của ai (だれ + の sở hữu + danh từ)."}, {"b": 2, "s": "bunpou", "p": "クアンさんは がくせいです。わたし＿＿ がくせいです。 (Tôi CŨNG...)", "c": ["は", "か", "も", "の"], "a": 2, "e": "も thay は để nói 'cũng': わたしも = tôi cũng."}, {"b": 2, "s": "choukai", "q": "Nhà ga ở đâu?", "au": ["すみません、えきは どこですか。", "えきですか。あそこです。"], "sc": ["A: すみません、えきは どこですか。", "B: えきですか。あそこです。"], "c": ["Bên phải", "Ở đằng kia", "Ở đây", "Không biết"], "a": 1, "e": "あそこ (asoko) = ở đằng kia, xa cả hai người."}, {"b": 2, "s": "choukai", "q": "Vật đó là gì?", "au": ["それは なんですか。", "これですか。でんわです。"], "sc": ["A: それは なんですか。", "B: これですか。でんわです。"], "c": ["Sách", "Chìa khóa", "Đồng hồ", "Điện thoại"], "a": 3, "e": "でんわ (denwa) = điện thoại."}, {"b": 3, "s": "moji", "p": "「よん」/「し」 là số mấy?", "c": ["9", "4", "40", "7"], "a": 1, "e": "4 đọc よん hoặc し."}, {"b": 3, "s": "moji", "p": "「げつようび」 là thứ mấy?", "c": ["thứ Tư", "thứ Sáu", "Chủ nhật", "thứ Hai"], "a": 3, "e": "月曜日 (getsuyoubi) = thứ Hai."}, {"b": 3, "s": "moji", "p": "「いま」 nghĩa là gì?", "c": ["bây giờ", "hôm nay", "buổi sáng", "ngày mai"], "a": 0, "e": "いま (今) = bây giờ. きょう = hôm nay, あした = ngày mai."}, {"b": 3, "s": "moji", "p": "「ひゃく」 là số bao nhiêu?", "c": ["8", "10", "100", "1000"], "a": 2, "e": "ひゃく (百) = 100."}, {"b": 3, "s": "bunpou", "p": "4時 đọc đúng là?", "c": ["しじ", "よじ", "よんふん", "よんじ"], "a": 1, "e": "4時 = よじ (yoji) — bất quy tắc, không phải よんじ."}, {"b": 3, "s": "bunpou", "p": "9時 đọc đúng là?", "c": ["しちじ", "くじ", "きゅうじ", "くふん"], "a": 1, "e": "9時 = くじ (kuji), không phải きゅうじ."}, {"b": 3, "s": "bunpou", "p": "Hỏi 'Bây giờ mấy giờ?' là?", "c": ["いま なんですか。", "いま だれですか。", "いま どこですか。", "いま なんじですか。"], "a": 3, "e": "なんじ = mấy giờ."}, {"b": 3, "s": "bunpou", "p": "'9 giờ rưỡi' nói là?", "c": ["くじ さんじゅう", "くはん", "きゅうじはん", "くじはん"], "a": 3, "e": "くじ + はん (rưỡi) = くじはん."}, {"b": 3, "s": "bunpou", "p": "「何曜日ですか」 hỏi về điều gì?", "c": ["ai", "thứ mấy trong tuần", "mấy giờ", "ngày bao nhiêu"], "a": 1, "e": "何曜日 (なんようび) = thứ mấy."}, {"b": 3, "s": "choukai", "q": "Bây giờ mấy giờ?", "au": ["いま なんじですか。", "しちじです。"], "sc": ["A: いま なんじですか。", "B: しちじです。"], "c": ["4 giờ", "1 giờ", "9 giờ", "7 giờ"], "a": 3, "e": "しちじ (shichiji) = 7 giờ."}, {"b": 3, "s": "choukai", "q": "Bài kiểm tra thứ mấy?", "au": ["テストは なんようびですか。", "きんようびです。"], "sc": ["A: テストは なんようびですか。", "B: きんようびです。"], "c": ["thứ Hai", "thứ Bảy", "thứ Sáu", "Chủ nhật"], "a": 2, "e": "きんようび (金曜日) = thứ Sáu."}, {"b": 4, "s": "moji", "p": "「食べます」 nghĩa là gì?", "c": ["xem", "ăn", "mua", "uống"], "a": 1, "e": "食べます (tabemasu) = ăn. 飲みます = uống."}, {"b": 4, "s": "moji", "p": "「のみます」 nghĩa là gì?", "c": ["đi", "nghe", "đọc", "uống"], "a": 3, "e": "飲みます (nomimasu) = uống."}, {"b": 4, "s": "moji", "p": "「がっこう」 nghĩa là gì?", "c": ["trường học", "công ty", "nhà ga", "nhà"], "a": 0, "e": "学校 (gakkou) = trường học. かいしゃ = công ty."}, {"b": 4, "s": "moji", "p": "「まいにち」 nghĩa là gì?", "c": ["bây giờ", "mỗi ngày", "buổi sáng", "ngày mai"], "a": 1, "e": "毎日 (mainichi) = mỗi ngày."}, {"b": 4, "s": "bunpou", "p": "パン＿＿ たべます。 (ăn bánh mì)", "c": ["で", "を", "に", "へ"], "a": 1, "e": "を đánh dấu tân ngữ (vật bị ăn)."}, {"b": 4, "s": "bunpou", "p": "バス＿＿ いきます。 (đi bằng xe buýt)", "c": ["に", "を", "へ", "で"], "a": 3, "e": "で chỉ phương tiện."}, {"b": 4, "s": "bunpou", "p": "がっこう＿＿ いきます。 (đi đến trường)", "c": ["を", "から", "で", "へ"], "a": 3, "e": "へ (đọc 'e') chỉ đích đến; に cũng được."}, {"b": 4, "s": "bunpou", "p": "しちじ＿＿ おきます。 (thức dậy lúc 7 giờ)", "c": ["へ", "に", "を", "で"], "a": 1, "e": "に gắn sau mốc giờ cụ thể."}, {"b": 4, "s": "bunpou", "p": "Phủ định của 「たべます」 là?", "c": ["たべます", "たべません", "たべないです", "たべました"], "a": 1, "e": "～ます → ～ません (phủ định lịch sự)."}, {"b": 4, "s": "choukai", "q": "Buổi sáng uống gì?", "au": ["あさ なにを のみますか。", "みずを のみます。"], "sc": ["A: あさ なにを のみますか。", "B: みずを のみます。"], "c": ["cà phê", "sữa", "trà", "nước"], "a": 3, "e": "みず (mizu) = nước."}, {"b": 4, "s": "choukai", "q": "Đi công ty bằng gì?", "au": ["なんで かいしゃへ いきますか。", "でんしゃで いきます。"], "sc": ["A: なんで かいしゃへ いきますか。", "B: でんしゃで いきます。"], "c": ["tàu điện", "xe hơi", "xe buýt", "đi bộ"], "a": 0, "e": "でんしゃ (densha) = tàu điện. なんで = bằng gì."}, {"b": 5, "s": "moji", "p": "「会います」 nghĩa là gì?", "c": ["gặp", "làm việc", "ngủ", "nói chuyện"], "a": 0, "e": "会います (aimasu) = gặp."}, {"b": 5, "s": "moji", "p": "「きのう」 nghĩa là gì?", "c": ["ngày mai", "tuần trước", "sáng nay", "hôm qua"], "a": 3, "e": "昨日 (kinou) = hôm qua. けさ = sáng nay, せんしゅう = tuần trước."}, {"b": 5, "s": "moji", "p": "「えいが」 nghĩa là gì?", "c": ["công viên", "phim", "nhà hàng", "mua sắm"], "a": 1, "e": "映画 (eiga) = phim."}, {"b": 5, "s": "moji", "p": "「こうえん」 nghĩa là gì?", "c": ["công ty", "trường học", "công viên", "cửa hàng"], "a": 2, "e": "公園 (kouen) = công viên."}, {"b": 5, "s": "bunpou", "p": "きのう function unlocked(g){var s=load();if(s._all)return true;if(!g.prev)return true;return passed(g.prev);}

function jv(){if(!('speechSynthesis'in window))return null;var vs=speechSynthesis.getVoices();return vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('ja')===0;})[0]||null;}
var RATE=0.9;
function speakSeq(lines){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();var v=jv(),i=0;function nx(){if(i>=lines.length)return;var u=new SpeechSynthesisUtterance(lines[i].replace(/\s+/g,''));if(v)u.voice=v;u.lang='ja-JP';u.rate=RATE;u.onend=function(){i++;setTimeout(nx,250);};speechSynthesis.speak(u);}nx();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n){return shuffle(a).slice(0,Math.min(n,a.length));}
var V=document.getElementById('view');
/* ---------- HUB ---------- */
function hub(){
 try{speechSynthesis.cancel();}catch(e){}
 var st=load();var done=GATES.filter(function(g){return st[g.id]&&st[g.id].pass;}).length;
 var h='<div class="bar"><i style="width:'+(done/GATES.length*100)+'%"></i></div><div class="barlab">Đã qua <b>'+done+'/'+GATES.length+'</b> chặng</div>';
 h+='<div class="note"><b>Cách dùng:</b> làm lần lượt từng Gate; mỗi Gate rút ngẫu nhiên câu hỏi từ các bài tương ứng. Qua Gate (≥70%) sẽ mở Gate kế. Hai <b>Review tổng</b> là đề thi thử full chấm theo ngưỡng N5 (tổng ≥44%, mỗi phần qua ngưỡng liệt).</div>';
 h+='<div class="path">';
 GATES.forEach(function(g){
  var s=st[g.id];var op=unlocked(g);var cls=s&&s.pass?'pass':(op?'open':'lock');if(g.review)cls+=' review';
  var ico=s&&s.pass?'✅':(op?(g.review?'🔁':'▶'):'🔒');
  var stt=s?('<span class="st '+(s.pass?'p':'f')+'">'+(s.pass?'Đạt':'Chưa')+' · '+s.best+'%</span>'):'<span class="st n">chưa làm</span>';
  h+='<div class="gate '+cls+'" data-g="'+g.id+'"><div class="ico">'+ico+'</div><div class="t"><b>'+g.name+'</b><div class="s">'+g.sub+'</div></div>'+stt+'</div>';
 });
 h+='</div>';
 h+='<div class="tools"><button class="btn" id="tall">🔓 Mở tất cả (bỏ khóa)</button><button class="btn" id="treset">Xoá tiến độ</button></div>';
 h+='<div class="foot">Tiến độ lưu trong trình duyệt này. Audio phần Nghe cần máy có giọng tiếng Nhật.</div>';
 V.innerHTML=h;window.scrollTo(0,0);
 document.querySelectorAll('.gate').forEach(function(el){el.onclick=function(){var g=GATES.filter(function(x){return x.id===el.dataset.g;})[0];if(!unlocked(g)){return;}runGate(g);};});
 document.getElementById('tall').onclick=function(){var s=load();s._all=!s._all;save(s);hub();};
 document.getElementById('treset').onclick=function(){if(confirm('Xoá toàn bộ tiến độ test?')){localStorage.removeItem(KEY);hub();}};
}
/* ---------- build a gate test ---------- */
function build(g){
 var pool=QBANK.filter(function(q){return q.b>=g.from&&q.b<=g.to;});
 var by={moji:[],bunpou:[],choukai:[]};pool.forEach(function(q){by[q.s].push(q);});
 var items=[];['moji','bunpou','choukai'].forEach(function(s){items=items.concat(sample(by[s],g.pick[s]||0));});
 return items.map(function(q){var idx=shuffle(q.c.map(function(_,i){return i;}));var nc=idx.map(function(k){return q.c[k];});var na=idx.indexOf(q.a);var o=JSON.parse(JSON.stringify(q));o.c=nc;o.a=na;return o;});
}
var SECN={moji:'文字・語彙 (Từ vựng – Chữ)',bunpou:'文法・読解 (Ngữ pháp – Đọc)',choukai:'聴解 (Nghe)'};
function runGate(g){
 try{speechSynthesis.cancel();}catch(e){}
 var items=build(g);var picks={};
 var h='<a class="home" id="back">← Về Hub</a><h1 style="font-size:24px">'+g.name+'</h1><div class="barlab">'+g.sub+' · '+items.length+' câu'+(g.final?' · chấm theo ngưỡng N5':' · cần ≥'+g.pass+'%')+'</div>';
 if(g.final)h+='<div class="note">Đề full 3 phần: làm hết rồi bấm <b>Nộp bài</b>. Đạt = tổng ≥44% <b>và</b> mỗi phần (Ngôn ngữ+Đọc, Nghe) qua ngưỡng liệt (~32%).</div>';
 h+='<div class="result" id="res"></div>';
 var cur='';
 items.forEach(function(q,i){
   if(q.s!==cur){cur=q.s;h+='<div class="sec-h">'+SECN[q.s]+'</div>';}
   var o='';q.c.forEach(function(c,ci){o+='<label class="opt" data-k="'+i+'" data-i="'+ci+'">'+c+'</label>';});
   var head='<div class="num">Câu '+(i+1)+'<span class="tag">B'+q.b+'</span></div>';
   if(q.s==='choukai'){
     h+='<div class="q" id="q'+i+'">'+head+'<div style="margin:6px 0"><button class="play" data-pl="'+i+'">▶ Phát</button><button class="ghost" data-sh="'+i+'">Hiện lời</button></div><div class="script" id="sc'+i+'">'+(q.sc||q.au).map(function(l){return '<div>'+l+'</div>';}).join('')+'</div><div class="prompt">'+q.q+'</div>'+o+'<div class="explain" id="ex'+i+'"></div></div>';
   } else {
     h+='<div class="q" id="q'+i+'">'+head+'<div class="prompt">'+q.p+'</div>'+o+'<div class="explain" id="ex'+i+'"></div></div>';
   }
 });
 h+='<button class="submit" id="sub">Nộp bài &amp; chấm điểm</button><div class="foot">Tốc độ Nghe: '+
    '<span class="ghost rt" data-rt="0.7">0.7×</span><span class="ghost rt" data-rt="0.9">0.9×</span><span class="ghost rt" data-rt="1">1.0×</span></div>';
 V.innerHTML=h;window.scrollTo(0,0);
 document.getElementById('back').onclick=hub;
 document.querySelectorAll('[data-pl]').forEach(function(b){b.onclick=function(){speakSeq(items[+b.dataset.pl].au);};});
 document.querySelectorAll('[data-sh]').forEach(function(b){b.onclick=function(){var s=document.getElementById('sc'+b.dataset.sh);s.style.display=s.style.display==='block'?'none':'block';};});
 document.querySelectorAll('.rt').forEach(function(b){b.onclick=function(){RATE=parseFloat(b.dataset.rt);};});
 document.querySelectorAll('.opt').forEach(function(o){o.onclick=function(){if(document.getElementById('res').style.display==='block')return;var k=+o.dataset.k;document.querySelectorAll('.opt[data-k="'+k+'"]').forEach(function(x){x.classList.remove('sel');});o.classList.add('sel');picks[k]=+o.dataset.i;};});
 document.getElementById('sub').onclick=function(){grade(g,items,picks);};
}
function grade(g,items,picks){
 var sec={moji:[0,0],bunpou:[0,0],choukai:[0,0]};var t=0;
 items.forEach(function(q,i){sec[q.s][1]++;var ch=picks[i];document.querySelectorAll('.opt[data-k="'+i+'"]').forEach(function(o){var oi=+o.dataset.i;if(oi===q.a)o.classList.add('correct');else if(oi===ch)o.classList.add('wrong');});if(ch===q.a){t++;sec[q.s][0]++;}var e=document.getElementById('ex'+i);if(q.e){e.style.display='block';e.innerHTML='<b>Giải thích:</b> '+q.e;}var sc=document.getElementById('sc'+i);if(sc)sc.style.display='block';});
 var n=items.length,pct=Math.round(t/n*100),pass;
 var lang=sec.moji[0]+sec.bunpou[0],langN=sec.moji[1]+sec.bunpou[1];
 var lpct=langN?Math.round(lang/langN*100):100,lis=sec.choukai[1]?Math.round(sec.choukai[0]/sec.choukai[1]*100):100;
 if(g.final){pass=pct>=44&&lpct>=31.7&&lis>=31.7;}else{pass=pct>=g.pass;}
 var st=load();var prev=st[g.id]?st[g.id].best:0;st[g.id]={best:Math.max(prev,pct),pass:(st[g.id]&&st[g.id].pass)||pass};save(st);
 var r=document.getElementById('res');var extra='';
 if(g.final){extra='<div class="brk">Ngôn ngữ+Đọc: <b>'+lang+'/'+langN+'</b> ('+lpct+'%) · Nghe: <b>'+sec.choukai[0]+'/'+sec.choukai[1]+'</b> ('+lis+'%)</div>';if(!pass){var why=[];if(pct<44)why.push('tổng <44%');if(lpct<31.7)why.push('Ngôn ngữ+Đọc dưới ngưỡng');if(lis<31.7)why.push('Nghe dưới ngưỡng');extra+='<div class="brk">Chưa đạt: '+why.join('; ')+'</div>';}}
 r.innerHTML='<h2>'+t+'/'+n+' đúng ('+pct+'%)</h2><div><span class="'+(pass?'pass':'fail')+'">'+(pass?'✅ ĐẠT — đã mở chặng kế':'❌ CHƯA ĐẠT — thử lại')+'</span></div>'+extra+
   '<div class="brk" style="margin-top:8px"><button class="btn" id="ag">Làm lại</button> <button class="btn" id="hb">Về Hub</button></div>';
 r.style.display='block';r.scrollIntoView({behavior:'smooth'});
 document.getElementById('ag').onclick=function(){runGate(g);};document.getElementById('hb').onclick=hub;
}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=function(){};
hub();
</script></body></html>
