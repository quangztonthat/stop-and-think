<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rèn mắt quan sát – lộ trình 12 tuần</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  --bg:#FFFFFF;--surface:#F2F5F8;--surface2:#E4EBF1;--ink:#051C2C;--muted:#55687A;--line:#D3DCE4;
  --accent:#2251FF;--accent-ink:#FFFFFF;--cyan:#00A9F4;--good:#0B8A62;--good-bg:#DDF3EA;--bad:#C8372A;--bad-bg:#FBE3DF;
  --hero:#051C2C;--hero-ink:#FFFFFF;--hero-muted:#A6BBCA;--hero-line:rgba(255,255,255,.07);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#03111C;--surface:#0A2132;--surface2:#112E45;--ink:#E8F0F6;--muted:#9AB0C1;--line:#1D3C53;
    --accent:#6584FF;--accent-ink:#FFFFFF;--cyan:#3CC4FF;--good:#3CCB97;--good-bg:#0F3A2C;--bad:#FF7B68;--bad-bg:#43201B;
    --hero:#0A2132;--hero-ink:#FFFFFF;--hero-muted:#9AB0C1;--hero-line:rgba(255,255,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#03111C;--surface:#0A2132;--surface2:#112E45;--ink:#E8F0F6;--muted:#9AB0C1;--line:#1D3C53;
  --accent:#6584FF;--accent-ink:#FFFFFF;--cyan:#3CC4FF;--good:#3CCB97;--good-bg:#0F3A2C;--bad:#FF7B68;--bad-bg:#43201B;
  --hero:#0A2132;--hero-ink:#FFFFFF;--hero-muted:#9AB0C1;--hero-line:rgba(255,255,255,.06);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;padding:0 clamp(16px,3vw,40px)}
.brand{font-weight:800;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:16px 12px 13px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.brand span,.sync{display:none}}

main{padding:24px clamp(16px,3vw,40px) 60px}
section.view{display:none}
section.view.on{display:block}
.sec{margin-top:36px}
.sec>h2{font-size:22px;margin-bottom:6px}
.sec>.lead{color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border-radius:14px;padding:18px}
.card h3{font-size:18px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:clamp(20px,4vw,40px);
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:28px 28px}
.hero .kicker{color:var(--hero-muted);font-weight:600}
.hero h1{font-size:clamp(30px,5.5vw,56px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.hero .goal{color:var(--hero-muted);font-size:17px;max-width:70ch}
.hero .meter{display:flex;gap:4px;margin-top:22px}
.hero .meter i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.hero .meter i.d{background:var(--cyan)}
.hero .meter i.c{background:#fff}
.hero .btn{margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}

/* tasks */
.tasks{display:grid;gap:12px;margin-top:16px}
.task{display:grid;grid-template-columns:40px 1fr;gap:14px;background:var(--surface);border-radius:14px;padding:16px 18px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.task h3{font-size:17px}
.task .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.light{background:#fff;color:#051C2C}

/* flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;counter-reset:f;margin-top:8px}
.flow li{list-style:none;position:relative;padding:16px 16px 16px 16px;background:var(--surface);border-right:2px solid var(--bg)}
.flow li:first-child{border-radius:14px 0 0 14px}
.flow li:last-child{border-radius:0 14px 14px 0;border-right:0}
.flow li b{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:4px}
.flow li b::before{counter-increment:f;content:counter(f);width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.flow li span{color:var(--muted);font-size:14px}
@media (max-width:700px){.flow{grid-template-columns:1fr}.flow li,.flow li:first-child,.flow li:last-child{border-radius:0;border-right:0;border-bottom:2px solid var(--bg)}.flow li:first-child{border-radius:14px 14px 0 0}.flow li:last-child{border-radius:0 0 14px 14px;border-bottom:0}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.today td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--good-bg);color:var(--good)}
.tag.a{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* plan */
.phase{margin-top:28px}
.phase>h2{font-size:20px}
.phase>p{color:var(--muted);margin:4px 0 12px}
details.wk{background:var(--surface);border-radius:14px;margin-top:10px;overflow:hidden}
details.wk>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary b{font-size:17px}
details.wk.cur{outline:2px solid var(--accent)}
.wk-body{padding:0 18px 18px;display:grid;gap:12px}
.wk-body .tbl{background:var(--bg)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}

/* field */
details.fx{background:var(--surface);border-radius:14px;margin-top:10px}
details.fx>summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.fx>summary::-webkit-details-marker{display:none}
details.fx>summary b{font-size:17px}
.fx-body{padding:0 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.fx-body ol,.fx-body ul{margin:6px 0 0;padding-left:20px}
.fx-body li{margin:4px 0}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.log{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.hist{margin-top:10px;font-size:14px;color:var(--muted)}
.hist div{padding:4px 0;border-bottom:1px solid var(--line)}

/* drill stage */
#stage{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage.on{display:flex}
.st-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,40px);border-bottom:1px solid var(--line)}
.st-top b{font-size:17px}
.st-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:22px;line-height:1}
.st-body{flex:1;overflow:auto;padding:20px clamp(16px,3vw,40px);display:flex;flex-direction:column;align-items:center;gap:14px}
.hint{color:var(--muted);text-align:center;font-weight:500}
.bar{width:min(100%,560px);height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;width:min(100%,640px)}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:34px;background:var(--surface);border:2px solid transparent;border-radius:12px;padding:0;cursor:default;color:var(--ink);opacity:1}
button.cell{cursor:pointer}
button.cell:disabled{cursor:default;opacity:1}
.cell.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.cell.ok{background:var(--good-bg);border-color:var(--good)}
.cell.bad{background:var(--bad-bg);border-color:var(--bad)}
.cell.miss{border:2px dashed var(--good)}
.cell.mask{background:var(--surface2)}
.dotbox{width:min(88vw,420px);aspect-ratio:1;background:var(--surface);border-radius:14px;display:grid;place-items:center;overflow:hidden}
.dotbox svg{width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:8px}
.pad button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;cursor:pointer}
.pad button.ok{background:var(--accent);color:#fff;border:0;font-size:17px}
.entry{font-size:38px;font-weight:800;min-height:48px;font-variant-numeric:tabular-nums}
.result{width:min(100%,560px);background:var(--surface);border-radius:14px;padding:18px;text-align:center}
.result .big{font-size:44px;font-weight:800}
.result .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* chart */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.seethink{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seethink>div{border-radius:12px;padding:14px;background:var(--surface)}
.seethink h4{font-size:15px;margin-bottom:6px}
.seethink ul{margin:0;padding-left:18px;font-size:15px}
.note{border-left:4px solid var(--cyan);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;font-size:15px}
.tl td:first-child{white-space:nowrap;font-weight:700}
.ok-t{color:var(--good);font-weight:700}
.bad-t{color:var(--bad);font-weight:700}
h3.sub{font-size:18px;margin:22px 0 8px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.formula{font-weight:700;margin:8px 0}
.plain{margin:6px 0 0;padding-left:20px}
.plain li{margin:5px 0}
.case{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.case>h3{font-size:19px;margin-bottom:4px}
.tag.b{background:var(--bad-bg);color:var(--bad)}
/* luyện ảnh */
.scnbox{width:min(100%,1100px);border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.scnbox svg{display:block;width:100%;height:auto}
.qcards{display:grid;gap:12px;width:min(100%,860px)}
.qcard{background:var(--surface);border-radius:14px;padding:14px 16px}
.qcard h4{font-size:16px;margin:8px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:15px}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));color:var(--ink)}
.lchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.review{width:min(100%,1100px);display:grid;gap:16px}
tr.okr td:first-child{box-shadow:inset 4px 0 var(--good)}
tr.badr td:first-child{box-shadow:inset 4px 0 var(--bad)}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (min-width:900px){.scn-rot{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
      <span>Rèn mắt</span>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#homnay" data-v="homnay">Hôm nay</a>
      <a href="#luyen" data-v="luyen">Luyện máy</a>
      <a href="#luyenanh" data-v="luyenanh">Luyện ảnh</a>
      <a href="#thucdia" data-v="thucdia">Thực địa</a>
      <a href="#tiendo" data-v="tiendo">Tiến độ</a>
      <a href="#lotrinh" data-v="lotrinh">Lộ trình</a>
    </nav>
    <div class="sync" id="sync">Lưu trên máy này</div>
  </div>
</header>

<main>
  <section class="view" id="v-homnay"></section>
  <section class="view" id="v-lotrinh"></section>
  <section class="view" id="v-luyen"></section>
  <section class="view" id="v-luyenanh"></section>
  <section class="view" id="v-thucdia"></section>
  <section class="view" id="v-tiendo"></section>
</main>

<div id="stage" role="dialog" aria-modal="true">
  <div class="st-top"><b id="st-title">Bài tập</b><button class="st-x" id="st-x" aria-label="Đóng">×</button></div>
  <div class="st-body" id="st-body"></div>
</div>

<script>
/* ================= DỮ LIỆU ================= */
const POOL=["🍎","🍌","🍇","🍉","🍋","🥕","🌽","🍄","🥐","🧀","🍔","🍕","🍩","🍪","☕","🍵","🥤","⚽","🏀","🎾","🎲","🎯","🎸","🎹","🎺","📷","📱","💻","📚","📎","🔑","🔒","💡","🔋","🧲","🧭","⏰","🎈","🎁","👟","👓","🎩","🧢","🌂","🧸","🚗","🚲","🚀","⛵","🏠","🌵","🌻","🌙","⭐","🔥","⚓","🐶","🐱","🐟","🐢","🦋","🐝","🦉","🐸","🍒","🥑","🧤","🪁","🛎","🧯"];

const LAYERS=[
  ["Tổng thể","Đây là nơi gì, chia mấy vùng lớn, ánh sáng từ đâu."],
  ["Theo vùng","Quét theo thứ tự cố định: trái sang phải, trên xuống dưới, gần ra xa."],
  ["Đếm","Bao nhiêu người, ghế, cửa, màn hình, vật cùng loại."],
  ["Chữ và số","Biển, nhãn, logo, giờ, giá, số phòng."],
  ["Trạng thái","Mới hay cũ, bật hay tắt, sạch hay bẩn, ngăn nắp hay bừa."],
  ["Cái thiếu, cái lạ","Thứ lẽ ra phải có mà không thấy; thứ không hợp chỗ."]
];

const FIELD={
  list30:{name:"Liệt kê 30 chi tiết",min:3,metric:"Số chi tiết",
    steps:["Lấy vật được gợi ý trong ngày, đặt trước mặt.","Bấm giờ 3 phút. Viết càng nhiều chi tiết càng tốt: màu, chất liệu, chữ in, số, vết xước, mép, đáy, mặt sau.","Chỉ viết thứ người khác nhìn vào cũng thấy giống bạn. Không viết cảm nhận (đẹp, xấu, sang).","Hết giờ, đếm số dòng và ghi vào ô bên dưới."]},
  room:{name:"Phòng 60 giây",min:1,metric:"Chi tiết đúng",m2:"Dòng sai (nhớ nhầm, bịa)",m2s:"sai",rate:"tỉ lệ đúng",
    steps:["Vào một nơi ít quen (gợi ý trong ngày).","Nhìn đúng thời gian của ngày đó (60, 30 hoặc 20 giây). Từ tuần 4, quét theo 6 lớp.","Quay đi hoặc ra ngoài, viết lại mọi thứ trong 3 phút.","Quay lại kiểm từng dòng. Chỉ đếm dòng đúng; dòng sai ghi riêng để biết mình hay bịa ở đâu."],layers:true},
  draw:{name:"Vẽ lại từ trí nhớ",min:5,metric:"Số chỗ sai (càng ít càng tốt)",
    steps:["Chọn thứ ngày nào cũng thấy (gợi ý trong ngày).","Không nhìn, vẽ lại trong 5 phút: bố cục, vị trí chữ, số, nút, màu.","Mở ra so sánh, khoanh chỗ sai và chỗ thiếu.","Ghi số chỗ sai. Lần sau vẽ lại đúng vật đó và so."]},
  seethink:{name:"Thấy hay Suy",min:5,metric:"Dòng Suy đủ căn cứ",m2:"Dòng Suy bị gạch (thiếu căn cứ)",m2s:"bị gạch",rate:"đủ căn cứ",
    steps:["Ngồi ở nơi có người (gợi ý trong ngày). Chọn một người, nhìn kín đáo, không nhìn chằm chằm.","Kẻ hai cột. Cột THẤY: thứ ai cũng kiểm được (đeo đồng hồ tay trái, gót giày mòn phía ngoài).","Cột SUY: điều bạn đoán (có thể thuận tay phải).","Mỗi dòng Suy phải trỏ tới ít nhất 2 dòng Thấy, kèm 1 cách giải thích khác và 1 cách kiểm chứng (hỏi gì, nhìn gì). Thiếu thì gạch. Đếm dòng Suy còn lại và dòng bị gạch."]},
  route:{name:"Đường quen, thứ mới",min:10,metric:"Số thứ mới",
    steps:["Đi đoạn đường quen (gợi ý trong ngày): đi bộ, ngồi taxi hoặc ngồi sau. Không làm khi đang tự lái xe.","Tìm 5 thứ trước nay chưa để ý.","Ghi tên và vị trí cụ thể: cạnh cái gì, bên trái hay phải.","Hôm sau đi qua, kiểm lại 1 thứ xem mình ghi đúng không."]},

  try{
    if(!o||typeof o!=="object"||Array.isArray(o)||o.v!==1)return null;
    if(!["runs","field","bench"].every(k=>Array.isArray(o[k]))||!(o.scn==null||Array.isArray(o.scn)))return null;
    if(!o.done||typeof o.done!=="object"||Array.isArray(o.done))return null;
    if(o.start!=null&&!(typeof o.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.start)))return null;
    if(!o.lv||typeof o.lv!=="object"||Array.isArray(o.lv))return null;
    const lv=Object.assign(blank().lv,o.lv||{});
    if(!Object.values(lv).every(x=>Number.isInteger(x)&&x>=1&&x<=15))return null;
    const num=x=>typeof x==="number"&&isFinite(x);
    if(!(o.runs||[]).every(r=>r&&num(r.t)&&typeof r.g==="string"&&num(r.acc)))return null;
    if(!(o.field||[]).every(r=>r&&num(r.t)&&typeof r.id==="string"))return null;
    if(!(o.bench||[]).every(b=>b&&num(b.t)))return null;
    if(!(o.scn||[]).every(x=>x&&typeof x==="object"))return null;
    if(!Object.values(o.done||{}).every(x=>x&&typeof x==="object"))return null;
    const n=Object.assign(blank(),JSON.parse(JSON.stringify(o)));n.lv=lv;
    ["runs","field","bench","scn"].forEach(k=>{if(!Array.isArray(n[k]))n[k]=[]});if(!n.done)n.done={};
    return n;
  }catch(e){return null}
}
/* Dấu "đã xong" lưu NGÀY THẬT. Bản cũ lưu số 1: đổi một lần sang ngày tính từ ngày bắt đầu lúc đó, để dời lịch về sau không dịch lịch sử. */
function migrateDone(){if(!S.start)return;Object.keys(S.done||{}).forEach(k=>{const o=S.done[k];if(!o)return;const [w,d]=k.split("-").map(Number);["a","f","j"].forEach(p=>{if(o[p]===1){const dt=fromKey(S.start);dt.setDate(dt.getDate()+(w-1)*7+(d-1));o[p]=dkey(dt)}})})}
try{const r=localStorage.getItem(KEY);if(r){const n=validState(JSON.parse(r));if(n){S=n;migrateDone()}}}catch(e){}
let docRef=null,saveT=null;
function save(){S.u=Date.now();trim();try{localStorage.setItem(KEY,JSON.stringify(S));saveWarn("")}catch(e){saveWarn("Không lưu được trên trình duyệt này. Vào Tiến độ, bấm Sao lưu để giữ dữ liệu.")}clearTimeout(saveT);saveT=setTimeout(pushDb,800)}
function saveWarn(t){let b=document.getElementById("savewarn");if(!t){if(b)b.remove();return}if(!b){b=document.createElement("div");b.id="savewarn";b.setAttribute("role","alert");b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bad);color:#fff;font-weight:600;font-size:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))";document.body.appendChild(b)}b.textContent=t}
function trim(){if(S.runs.length>600)S.runs=S.runs.slice(-600);if(S.field.length>600)S.field=S.field.slice(-600);if(S.scn&&S.scn.length>200)S.scn=S.scn.slice(-200)}
async function pushDb(){if(!docRef)return;try{await docRef.set(JSON.parse(JSON.stringify(S)));const y=document.getElementById("sync");if(y){y.textContent="Đồng bộ với tài khoản";y.style.color=""}}catch(e){const y=document.getElementById("sync");if(y){y.textContent="Chưa đồng bộ được, dữ liệu vẫn trên máy này";y.style.color="var(--bad)"}}}
async function initDb(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){
      const o=JSON.parse(JSON.stringify(snap.data()||{}));
      const nv=validState(o);if(nv&&(o.u||0)>(S.u||0)){S=nv;migrateDone();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderAll()}
      else if((S.u||0)>(o.u||0))pushDb();
    }else if(S.u)pushDb();
    document.getElementById("sync").textContent="Đồng bộ với tài khoản";
  }catch(e){}
}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const range=n=>Array.from({length:n},(_,i)=>i);
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const pct=x=>Math.round(x*100)+"%";
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fromKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function ddmm(t){const d=new Date(t);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function pos(){
  if(!S.start)return null;
  const idx=Math.max(0,Math.round((fromKey(dkey())-fromKey(S.start))/86400000));
  return {idx,w:Math.min(12,Math.floor(idx/7)+1),d:idx>=84?7:idx%7+1,over:idx>=84};
}
function dayKey(w,d){return w+"-"+d}
function mark(part){const p=pos();if(!p||p.over)return;const k=dayKey(p.w,p.d);S.done[k]=S.done[k]||{};S.done[k][part]=dkey()}
function doneCount(w,d){const o=S.done[dayKey(w,d)]||{};return (o.a?1:0)+(o.f?1:0)+(o.j?1:0)}
function activeDays(){const s=new Set();S.runs.forEach(r=>s.add(dkey(new Date(r.t))));S.field.forEach(r=>s.add(dkey(new Date(r.t))));
  Object.values(S.done||{}).forEach(o=>{if(o)["a","f","j"].forEach(p=>{const v=o[p];if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v))s.add(v)})});return s}
function streak(){const s=activeDays();let n=0;const d=new Date();if(!s.has(dkey(d)))d.setDate(d.getDate()-1);while(s.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}

function runTimer(id,secs){
  clearInterval(timerH);const end=Date.now()+secs*1000;
  const show=t=>{const b=$("#tm-"+id);if(b)b.textContent=t};
  const tick=()=>{const l=Math.max(0,Math.round((end-Date.now())/1000));show(String(Math.floor(l/60)).padStart(2,"0")+":"+String(l%60).padStart(2,"0"));
    if(l<=0){clearInterval(timerH);timerH=null;show("Hết giờ");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}};
  tick();timerH=setInterval(tick,250);
}

function lineChart(series,labels,opt){
  opt=opt||{};const W=640,H=230,L=40,R=12,T=14,B=32;
  const all=series.flatMap(s=>s.values.filter(v=>v!=null));
  if(!all.length)return `<p class="muted small">Chưa đủ dữ liệu để vẽ.</p>`;
  const mx=opt.max!=null?opt.max:Math.max(...all)*1.1||1,mn=opt.min!=null?opt.min:0;
  const n=labels.length,x=i=>n<=1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  const ticks=range(5).map(i=>mn+(mx-mn)*i/4);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${opt.pct?Math.round(t)+"%":Math.round(t*10)/10}</text>`).join("");
  const step=Math.ceil(n/8);
  g+=labels.map((lb,i)=>i%step===0||i===n-1?`<text x="${x(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="var(--muted)">${esc(lb)}</text>`:"").join("");
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(pts.length>1)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    g+=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`).join("");
    if(opt.labels)g+=s.values.map((v,i)=>v==null?"":`<text x="${x(i)}" y="${y(v)-8}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${opt.pct?Math.round(v)+"%":v}</text>`).join("");
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}

    <div class="seethink">
      <div><h4>Thấy (ai nhìn cũng kiểm được)</h4><ul><li>Đồng hồ đeo tay trái</li><li>Gót giày mòn phía ngoài</li><li>Laptop dán nhãn tài sản công ty</li><li>Hai lần nhìn đồng hồ trong 5 phút</li><li>Nhắn tin bằng tay phải, tay trái cầm cốc</li></ul></div>
      <div><h4>Suy (ít nhất 2 dòng Thấy, 1 cách giải thích khác, 1 cách kiểm)</h4><ul><li>Có thể thuận tay phải (đồng hồ tay trái; nhắn tin bằng tay phải). Khác: đeo tay trái theo thói quen. Kiểm: xem ký tên bằng tay nào.</li><li>Đang vội, có hẹn sau (nhìn đồng hồ 2 lần; laptop chưa cất). Khác: đang chờ một cuộc gọi. Kiểm: hỏi “anh có kịp giờ không?”.</li></ul><p class="small muted" style="margin-top:6px">Hai dòng Thấy chưa làm suy đoán thành đúng; chỉ bước kiểm mới xác nhận.</p></div>

const stage=$("#stage"),stBody=$("#st-body");
let laters=[],rafH=null;
function later(ms,fn){const h=setTimeout(fn,ms);laters.push(h);return h}
function clearAll(){laters.forEach(clearTimeout);laters=[];cancelAnimationFrame(rafH)}
function openStage(title){clearAll();$("#st-title").textContent=title;stage.classList.add("on");document.body.style.overflow="hidden"}
function closeStage(){clearAll();stage.classList.remove("on");document.body.style.overflow="";renderAll()}
$("#st-x").onclick=closeStage;
function countdown(ms,onTick,onDone){const t0=performance.now();const f=()=>{const left=Math.max(0,ms-(performance.now()-t0));onTick(left);if(left<=0){onDone();return}rafH=requestAnimationFrame(f)};rafH=requestAnimationFrame(f)}

function playChg(cfg,onEnd){

    tr++;

    const empty=range(cells).filter(i=>lay[i]===null),aft=lay.slice(),fresh=POOL.filter(e=>!its.includes(e));

    if(type==="replace"){target=pick(ps);aft[target]=pick(fresh)}else if(type==="remove"){target=pick(ps);aft[target]=null}else{target=pick(empty);aft[target]=pick(fresh)}

function clusters(g){

/* Mỗi cảnh sinh từ một số seed: cùng seed thì ra đúng cảnh cũ, nên xem lại được bài đã làm. */
function mkRng(seed){
  let a=seed>>>0;
  const f=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};

    s:arr=>{arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}};
  R.n=(arr,k)=>R.s(arr).slice(0,k);
  return R;
}

function numOpts(R,n,min=0,max=99){

  </div>
  <div class="sec"><h2>Lịch sử, bấm để xem lại</h2>
    ${runs.length?`<div class="tbl"><table><thead><tr><th>Ngày</th><th>Cảnh</th><th class="num">Mức</th><th class="num">Nhìn</th><th class="num">Đúng</th><th>Sai ở lớp</th><th></th></tr></thead><tbody>
      ${runs.slice(-15).reverse().map((r,j)=>{const idx=runs.length-1-j,miss=(r.by||[]).map((v,i)=>v[1]>v[0]?LNAME[i]:null).filter(Boolean);
        return `<tr><td>${ddmm(r.t)}</td><td>${esc(SCN_KINDS[r.kind]?SCN_KINDS[r.kind].name:r.kind)}</td><td class="num">${r.lv}</td><td class="num">${r.view} giây</td><td class="num"><b>${r.ok}/${r.n}</b></td><td class="small">${miss.length?esc(miss.join(", ")):"-"}</td><td><button class="btn ghost sm" data-rv="${idx}">Xem lại</button></td></tr>`}).join("")}
    </tbody></table></div>`:`<p class="muted">Chưa có lần nào.</p>`}
  </div>`;
  el.querySelectorAll("[data-scn]").forEach(b=>b.onclick=()=>startScene(b.dataset.scn));
  el.querySelectorAll("[data-rv]").forEach(b=>b.onclick=()=>{const r=S.scn[+b.dataset.rv];const sc=buildScene(r.kind,r.seed,r.lv);openStage(`Xem lại · ${sc.title} · ${ddmm(r.t)}`);scReview(sc,r.ans,r.recall||"",null)});
}
function startScene(kind){
  norm();
  if(!SCN_KINDS[kind])kind=pick(Object.keys(SCN_KINDS));
  const lv=S.lv.scn,sc=buildScene(kind,(Math.random()*4294967295)>>>0,lv);
  openStage(`Luyện ảnh · ${sc.title} · mức ${lv}`);
  stBody.innerHTML=`<div class="result"><p class="big" style="font-size:26px">Nhìn ${sc.cfg.view} giây, rồi trả lời ${sc.qs.length} câu</p>
    <p class="muted" style="margin-top:8px">Quét theo 6 lớp: tổng thể, theo vùng, đếm, chữ và số, trạng thái, cái thiếu và cái lạ. Câu hỏi không báo trước.</p>
    <p class="muted small scn-rot" style="margin-top:6px">Trên điện thoại, xoay ngang màn hình để ảnh lớn hơn.</p>
    <div class="row"><button class="btn" id="sc-go">Bắt đầu nhìn</button></div></div>`;
  $("#sc-go").onclick=()=>scView(sc);
}
function scView(sc){
  const ms=sc.cfg.view*1000,t0=performance.now();
  stBody.innerHTML=`<p class="hint">Còn <b id="cd">${sc.cfg.view}</b> giây</p><div class="bar"><i id="bar"></i></div><div class="scnbox">${scnSvg(sc)}</div><button class="btn ghost" id="skip">Tôi nhìn xong</button>`;
  let gone=false;const done=()=>{if(gone)return;gone=true;cancelAnimationFrame(rafH);sc.used=Math.round((performance.now()-t0)/1000);scRecall(sc)};
  countdown(ms,l=>{const cd=$("#cd"),b=$("#bar");if(cd)cd.textContent=Math.ceil(l/1000);if(b)b.style.width=(l/ms*100)+"%"},done);
  $("#skip").onclick=done;
}
function scRecall(sc){
  stBody.innerHTML=`<div class="result" style="text-align:left;width:min(100%,820px)"><h3 style="font-size:19px">Ghi nhanh những gì anh nhớ</h3>
    <p class="muted small" style="margin-top:4px">Không bắt buộc. Viết theo 6 lớp, mỗi ý một dòng; chỉ ghi thứ đã thấy. Bản ghi này sẽ đặt cạnh toàn bộ cảnh ở bước rà soát.</p>
    <textarea id="sc-rc" style="margin-top:10px;min-height:150px" placeholder="1. …&#10;2. …"></textarea>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="sc-q">Sang câu hỏi</button></div></div>`;
  $("#sc-q").onclick=()=>scQuiz(sc,$("#sc-rc").value.trim().slice(0,2000));
}
function scQuiz(sc,recall){
  const ans=sc.qs.map(()=>-1);
  stBody.innerHTML=`<p class="hint">Trả lời từ trí nhớ. Không chắc thì chọn phương án gần nhất; bỏ trống tính là sai.</p>
    <div class="qcards">${sc.qs.map((q,i)=>`<div class="qcard"><span class="tag">${q.L+1}. ${LNAME[q.L]}</span><h4>${i+1}. ${esc(q.q)}</h4>
      <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${esc(cap(o))}</button>`).join("")}</div></div>`).join("")}</div>
    <p class="hint" id="sc-cnt">Đã trả lời 0/${sc.qs.length}</p><button class="btn" id="sc-grade">Chấm điểm</button>`;
  stBody.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.q;ans[i]=+b.dataset.o;
    stBody.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.toggle("on",x===b));
    $("#sc-cnt").textContent=`Đã trả lời ${ans.filter(a=>a>=0).length}/${sc.qs.length}`});
  $("#sc-grade").onclick=()=>scGrade(sc,ans,recall);
  stBody.scrollTop=0;
}
function scGrade(sc,ans,recall){
  const by=LNAME.map(()=>[0,0]);let ok=0;
  sc.qs.forEach((q,i)=>{by[q.L][1]++;if(ans[i]===q.a){ok++;by[q.L][0]++}});
  const acc=ok/sc.qs.length,lv=sc.lv;let msg="Giữ nguyên mức.";
  if(acc>=0.85&&lv<MAXLV){S.lv.scn=lv+1;msg=`Lên mức ${lv+1}: lần sau nhìn ${scnCfg(lv+1).view} giây.`}
  else if(acc<0.6&&lv>1){S.lv.scn=lv-1;msg=`Xuống mức ${lv-1}: lần sau nhìn ${scnCfg(lv-1).view} giây.`}
  S.scn.push({t:Date.now(),kind:sc.kind,seed:sc.seed,lv,view:sc.cfg.view,used:sc.used||sc.cfg.view,n:sc.qs.length,ok,by,ans,recall});
  S.runs.push({t:Date.now(),g:"scn",lv,acc:+acc.toFixed(3),rt:null,b:0});
  mark("a");save();
  scReview(sc,ans,recall,msg);
}
function scReview(sc,ans,recall,msg){
  const marks=sc.qs.map((q,i)=>ans[i]===q.a),ok=marks.filter(Boolean).length,by=LNAME.map(()=>[0,0]);
  sc.qs.forEach((q,i)=>{by[q.L][1]++;if(marks[i])by[q.L][0]++});
  const invBy=LNAME.map((_,L)=>sc.inv.filter(x=>x.L===L));
  stBody.innerHTML=`<div class="review">
    <div class="result" style="width:100%"><div class="big">${ok}/${sc.qs.length}</div><p>${pct(ok/sc.qs.length)} đúng${msg?` · ${esc(msg)}`:""}</p>
      <div class="lchips">${by.map((v,i)=>v[1]?`<span class="tag ${v[0]===v[1]?"g":"b"}">${i+1}. ${LNAME[i]} ${v[0]}/${v[1]}</span>`:"").join("")}</div></div>
    <div class="scnbox" id="sc-img">${scnSvg(sc,marks)}</div>
    <p class="muted small" style="text-align:center">Khung xanh liền: trả lời đúng · khung đỏ nét đứt: trả lời sai. Bấm một dòng trong bảng để chỉ khoanh chỗ đó.</p>
    <div class="tbl"><table><thead><tr><th>#</th><th>Lớp</th><th>Câu hỏi</th><th>Anh chọn</th><th>Đáp án</th><th>Trong ảnh</th></tr></thead><tbody>
      ${sc.qs.map((q,i)=>`<tr class="${marks[i]?"okr":"badr"}" data-row="${i}" style="cursor:pointer"><td>${i+1}</td><td class="small">${LNAME[q.L]}</td><td>${esc(q.q)}</td>
        <td class="${marks[i]?"ok-t":"bad-t"}">${ans[i]>=0?esc(cap(q.opts[ans[i]])):"Bỏ trống"}</td><td><b>${esc(cap(q.opts[q.a]))}</b></td><td class="small">${esc(q.why||"")}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="cols2">
      <div class="card"><h3>Toàn bộ cảnh theo 6 lớp</h3>${invBy.map((a,L)=>a.length?`<p style="margin-top:8px"><b>${L+1}. ${LNAME[L]}</b></p><ul class="plain">${a.map(x=>`<li>${esc(cap(x.t))}</li>`).join("")}</ul>`:"").join("")}</div>
      <div class="card"><h3>Anh đã ghi nhớ</h3>${recall?`<p style="white-space:pre-wrap;margin-top:6px">${esc(recall)}</p><p class="muted small" style="margin-top:10px">Đối chiếu từng dòng với cột bên trái: dòng nào sai, dòng nào là suy đoán, lớp nào không ghi được gì.</p>`:`<p class="muted small">Lần này không ghi. Lần sau thử ghi trước khi trả lời: viết ra là bước giúp nhớ lâu.</p>`}</div>
    </div>
    <div class="row" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="sc-new">Cảnh mới cùng loại</button><button class="btn ghost" id="sc-done">Xong</button></div>
  </div>`;
  const img=$("#sc-img");let sel=-1;
  stBody.querySelectorAll("[data-row]").forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.row;sel=sel===i?-1:i;
    stBody.querySelectorAll("[data-row]").forEach(x=>x.classList.toggle("sel",+x.dataset.row===sel));
    img.querySelectorAll(".mk").forEach(m=>m.style.display=sel<0||+m.dataset.i===sel?"":"none");
    if(sel>=0)img.scrollIntoView({block:"nearest",behavior:"smooth"})});
  $("#sc-new").onclick=()=>startScene(sc.kind);$("#sc-done").onclick=closeStage;
  stBody.scrollTop=0;
}

/* ================= KHỞI ĐỘNG ================= */
function renderAll(){norm();renderToday();renderScenes();renderPlan();renderTrain();renderField();renderProgress();renderEvidence()}
renderAll();route();initDb();
</script>
</body>
