<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mate Puzzles — 1000 bài chiếu hết</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a2233;--muted:#5b6780;--line:#e2e7f0;--blue:#2f6fed;--green:#2f9e6b;
      --bg:#f6f8fc;--card:#fff;--lt:#ebecd0;--dk:#779556}
html[data-theme="dark"]{--ink:#e8edf7;--muted:#9aa6bf;--line:#26314a;--blue:#5b8cff;--green:#34d399;
      --bg:#0b1120;--card:#151d2e;--lt:#ebecd0;--dk:#779556}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 70px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.topbar{max-width:1080px;margin:0 auto;padding:16px 18px 0}
.topbar a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
.topbar a:hover{color:var(--blue)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.bar button{padding:6px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
     border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.bar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.main{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
     width:min(88vw,432px);aspect-ratio:1;border-radius:5px;overflow:hidden;user-select:none;
     box-shadow:0 2px 14px rgba(20,30,50,.18)}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.sq.l{background:var(--lt)} .sq.d{background:var(--dk)}
.sq.sel::after{content:"";position:absolute;inset:0;background:rgba(255,255,51,.5);pointer-events:none}
.pc{width:92%;height:92%;display:block;cursor:grab}
.pc svg{width:100%;height:100%;display:block;pointer-events:none}
.co{position:absolute;font-size:11px;font-weight:700;pointer-events:none;line-height:1}
.co.r{top:3px;left:4px} .co.f{bottom:2px;right:4px}
.sq.l .co{color:var(--dk)} .sq.d .co{color:var(--lt)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ctrl button{padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
     border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
.ctrl button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.ctrl button.done{background:var(--green);border-color:var(--green);color:#fff}
.fb{margin-top:10px;font-size:14px;font-weight:600;min-height:20px}
.fb.ok{color:var(--green)} .fb.no{color:#c8483c}
.opt{margin-top:12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.opt input{width:15px;height:15px;cursor:pointer}
.task{font-size:18px;font-weight:700;margin-bottom:4px}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;word-break:break-all}
.sol{display:none;margin-top:14px;padding:12px 14px;background:rgba(47,111,237,.08);
     border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
     font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:600}
.sol.show{display:block}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:22px}
.grid button{width:46px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--muted);
     border-radius:6px;cursor:pointer;font-size:11px;font-variant-numeric:tabular-nums}
.grid button.ok{background:var(--green);border-color:var(--green);color:#fff}
.grid button.cur{outline:2px solid var(--blue);outline-offset:1px;color:var(--ink);font-weight:700}
#theme{position:fixed;left:14px;bottom:14px;width:40px;height:40px;border-radius:999px;
     border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:17px}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← Mục lục cờ vua</a></div>
<div class="wrap">
<header><h1>Mate Puzzles</h1><span class="stat" id="stat"></span></header>

<div class="bar" id="filters"></div>

<div class="main">
  <div class="card">
    <div id="board"></div>
    <div class="ctrl">
      <button onclick="undo()">Lùi</button>
      <button onclick="reset()">Đặt lại</button>
      <button onclick="flip()">Xoay bàn</button>
      <button class="primary" onclick="toggleSol()">Lời giải</button>
      <button id="doneBtn" onclick="toggleDone()">Đã làm</button>
    </div>
    <div class="fb" id="fb"></div>
  </div>

  <div class="card">
    <div class="task" id="task"></div>
    <div class="meta" id="meta"></div>
    <div class="ctrl">
      <button onclick="go(-1)">← Trước</button>
      <button onclick="go(1)">Sau →</button>
      <button onclick="randomPuzzle()">Ngẫu nhiên</button>
    </div>
    <div class="sol" id="sol"></div>
    <label class="opt"><input type="checkbox" id="autoNext" onchange="saveAuto()">
      Giải đúng thì tự sang bài sau</label>
  </div>
</div>

<div class="grid" id="grid"></div>
</div>

<button id="theme" onclick="toggleTheme()">🌙</button>

var KEY='matepuzzles.done', TKEY='matepuzzles.theme';
var done, list=[], idx=0, pos=[], flipped=false, sel=-1, hist=[], ply=0, offline=false;

try{ done = new Set(JSON.parse(localStorage.getItem(KEY)||'[]')); }catch(e){ done = new Set(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(Array.from(done))); }catch(e){} }

function fenToPos(fen){
  var rows = fen.split(' ')[0].split('/'), a = [];
  for(var r=0;r<8;r++){
    var row = rows[r];
    for(var i=0;i<row.length;i++){
      var c = row[i];
      if(c >= '1' && c <= '8'){ for(var k=0;k<+c;k++) a.push(''); }
      else a.push(c);
    }
  }
  while(a.length<64) a.push('');
  return a;
}
function drawBoard(){
  var b = document.getElementById('board');
  b.innerHTML='';
  for(var v=0; v<64; v++){
    var i = flipped ? 63-v : v;
    var r = Math.floor(i/8), c = i%8;
    var sq = document.createElement('div');
    sq.className = 'sq ' + ((r+c)%2===0 ? 'l' : 'd') + (i===sel ? ' sel' : '');
    sq.setAttribute('data-i', i);
    if(c === (flipped ? 7 : 0)){
      var cr = document.createElement('span'); cr.className='co r';
      cr.textContent = String(8-r); sq.appendChild(cr);
    }
    if(r === (flipped ? 0 : 7)){
      var cf = document.createElement('span'); cf.className='co f';
      cf.textContent = 'abcdefgh'[c]; sq.appendChild(cf);
    }
    var p = pos[i];
    if(p){
      var s = document.createElement('span');
      s.className = 'pc';
      s.innerHTML = PIECES[p] || '';
      s.draggable = true;
      sq.appendChild(s);
    }
    b.appendChild(sq);
  }
}
function sameSide(a, b){
  return (a === a.toUpperCase()) === (b === b.toUpperCase());
}
function sqOf(s){ return (8 - parseInt(s.charAt(1),10))*8 + 'abcdefgh'.indexOf(s.charAt(0)); }
function nameOf(i){ return 'abcdefgh'.charAt(i%8) + (8 - Math.floor(i/8)); }

function applyMove(from, to, promo){
  var p = pos[from];
  if((p === 'P' || p === 'p') && (from%8) !== (to%8) && !pos[to]){
    pos[p === 'P' ? to+8 : to-8] = '';          // bat tot qua duong
  }
  pos[to] = promo ? (p === 'P' ? promo.toUpperCase() : promo.toLowerCase()) : p;
  pos[from] = '';
}
function move(from, to){
  hist.push({p: pos.slice(), y: ply, o: offline});
  applyMove(from, to, null);
  sel = -1;
  checkLine(from, to);
  drawBoard(); feedback();
}
function undo(){
  if(!hist.length) return;
  var h = hist.pop();
  pos = h.p; ply = h.y; offline = h.o; sel = -1;
  drawBoard(); feedback();
}
function checkLine(from, to){
  var u = list[idx].uci;
  if(offline || ply >= u.length) return;
  var exp = u[ply];
  if(exp.substring(0,4) !== nameOf(from) + nameOf(to)){ offline = true; return; }
  if(exp.length > 4) pos[to] = (pos[to] === 'P' ? exp.charAt(4).toUpperCase() : exp.charAt(4));
  ply++;
  if(ply < u.length){
    var mine = idx;
    setTimeout(function(){
      if(mine !== idx) return;
      hist.push({p: pos.slice(), y: ply, o: offline});
      var e = u[ply];
      applyMove(sqOf(e.substring(0,2)), sqOf(e.substring(2,4)), e.length > 4 ? e.charAt(4) : null);
      ply++; drawBoard(); feedback();
    }, 300);
  } else {
    if(!done.has(list[idx].id)){ done.add(list[idx].id); save(); }
    if(autoNext()){ var m = idx; setTimeout(function(){ if(m === idx) go(1); }, 1100); }
  }
}
function feedback(){
  var el = document.getElementById('fb'), u = list[idx].uci;
  var db = document.getElementById('doneBtn');
  db.className = done.has(list[idx].id) ? 'done' : '';
  db.textContent = done.has(list[idx].id) ? '✓ Đã làm' : 'Đã làm';
  stat(); buildGrid();
  if(ply >= u.length){ el.className = 'fb ok'; el.textContent = 'Chiếu hết! ✓ đã đánh dấu đã làm'; return; }
  if(offline){ el.className = 'fb no'; el.textContent = 'Chưa khớp lời giải — bấm Đặt lại để thử lại'; return; }
  if(ply > 0){ el.className = 'fb ok'; el.textContent = 'Đúng rồi — còn ' + Math.ceil((u.length-ply)/2) + ' nước'; return; }
  el.className = 'fb'; el.textContent = '';
}
function autoNext(){ var c = document.getElementById('autoNext'); return c && c.checked; }
function saveAuto(){ try{ localStorage.setItem('matepuzzles.autonext', autoNext() ? '1' : '0'); }catch(e){} }
function sqIndex(el){
  while(el && !el.hasAttribute('data-i')) el = el.parentElement;
  return el ? +el.getAttribute('data-i') : -1;
}
document.addEventListener('click', function(e){
  if(!document.getElementById('board').contains(e.target)) return;
  var i = sqIndex(e.target);
  if(i < 0) return;
  if(sel < 0){ if(pos[i]){ sel = i; drawBoard(); } return; }
  if(i === sel){ sel = -1; drawBoard(); return; }
  if(pos[i] && sameSide(pos[i], pos[sel])){ sel = i; drawBoard(); return; }
  move(sel, i);
});
document.addEventListener('dragstart', function(e){
  var i = sqIndex(e.target);
  if(i >= 0 && pos[i]){ e.dataTransfer.setData('text/plain', String(i)); sel = -1; }
});
document.addEventListener('dragover', function(e){
  if(document.getElementById('board').contains(e.target)) e.preventDefault();
});
document.addEventListener('drop', function(e){
  var to = sqIndex(e.target);
  var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
  if(to >= 0 && from >= 0 && to !== from){
    e.preventDefault();
    move(from, to);
  }
});

function buildFilters(){
  var defs=[['all','Tất cả'],['1','Mate in 1'],['2','Mate in 2'],['3','Mate in 3'],['4','Mate in 4'],['todo','Chưa làm']];
  var h='';
  for(var i=0;i<defs.length;i++) h += '<button data-k="'+defs[i][0]+'" onclick="setFilter(\''+defs[i][0]+'\')">'+defs[i][1]+'</button>';
  document.getElementById('filters').innerHTML = h;
}
function setFilter(k){
  list = PUZZLES.filter(function(p){
    return k==='all' ? true : k==='todo' ? !done.has(p.id) : p.n === +k;
  });
  if(!list.length) list = PUZZLES.slice();
  var bs = document.querySelectorAll('#filters button');
  for(var i=0;i<bs.length;i++) bs[i].className = (bs[i].getAttribute('data-k')===k ? 'on' : '');
  idx = 0; render();
}
function stat(){
  document.getElementById('stat').textContent =
    'Đã làm ' + done.size + '/' + PUZZLES.length + '  •  đang xem ' + list.length + ' bài';
}
function buildGrid(){
  var h='';
  for(var i=0;i<list.length;i++){
    h += '<button class="'+(done.has(list[i].id)?'ok ':'')+(i===idx?'cur':'')+'" onclick="jump('+i+')">'+list[i].id+'</button>';
  }
  document.getElementById('grid').innerHTML = h;
}
function jump(i){ idx=i; render(); }
function go(d){ idx = (idx + d + list.length) % list.length; render(); }
function randomPuzzle(){ idx = Math.floor(Math.random()*list.length); render(); }

function render(){
  var p = list[idx];
  pos = fenToPos(p.fen); sel = -1; hist = []; ply = 0; offline = false;
  var turn = p.fen.split(' ')[1];
  flipped = (turn === 'b');
  drawBoard();
  document.getElementById('task').textContent =
    (turn === 'w' ? 'Trắng' : 'Đen') + ' đi — chiếu hết sau ' + p.n + ' nước';
  document.getElementById('meta').textContent = 'Bài #' + p.id + '  •  ' + (p.src||'') + '  •  ' + p.fen;
  document.getElementById('sol').textContent = fmt(p.solution, turn);
  document.getElementById('sol').className = 'sol';
  feedback();
}
function fmt(sol, turn){
  var s='', n=1, i=0;
  if(turn === 'b'){ s = '1... ' + sol[0] + '   '; n = 2; i = 1; }
  for(; i<sol.length; i+=2){
    s += n + '. ' + sol[i] + (sol[i+1] ? ' ' + sol[i+1] : '') + '   '; n++;
  }
  return s.trim();
}
function reset(){ pos = fenToPos(list[idx].fen); sel = -1; hist = []; ply = 0; offline = false; drawBoard(); feedback(); }
function flip(){ flipped = !flipped; drawBoard(); }
function toggleSol(){
  var el = document.getElementById('sol');
  el.className = el.className.indexOf('show') >= 0 ? 'sol' : 'sol show';
}
function toggleDone(){
  var p = list[idx];
  if(done.has(p.id)) done.delete(p.id); else done.add(p.id);
  save();
  feedback();
}
function toggleTheme(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('theme').textContent = dark ? '🌙' : '☀️';
  try{ localStorage.setItem(TKEY, dark ? 'light' : 'dark'); }catch(e){}
}
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') go(1);
  else if(e.key === 'ArrowLeft') go(-1);
  else if(e.key === ' '){ e.preventDefault(); toggleSol(); }
});
try{
  if(localStorage.getItem(TKEY) === 'dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('theme').textContent = '☀️';
  }
}catch(e){}
try{ document.getElementById('autoNext').checked = localStorage.getItem('matepuzzles.autonext') === '1'; }catch(e){}
buildFilters(); setFilter('all');
</script>
</body>
</html>
