<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Coach — Fischer · 60 ván đáng nhớ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-card:#ffffff;--bg-soft:#f3f5fb;--border:#e4e9f2;--border-soft:#eef1f7;
  --text:#1a2233;--text-soft:#4e5a74;--text-dim:#6b7691;
  --accent:#2f6fed;--accent-2:#2258c8;--cyan:#0fb6d4;
  --good:#0e9f6e;--good-soft:rgba(14,159,110,.08);--good-bd:rgba(14,159,110,.22);
  --warn:#e0a52e;--warn-soft:rgba(224,165,46,.10);--warn-bd:rgba(224,165,46,.28);
  --danger:#d64545;--danger-soft:rgba(214,69,69,.08);--danger-bd:rgba(214,69,69,.22);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(23,32,56,.06),0 12px 32px rgba(23,32,56,.10);
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);line-height:1.65;font-size:16px;min-height:100vh;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(47,111,237,.14),transparent 60%),radial-gradient(1000px 640px at -10% 30%,rgba(15,182,212,.09),transparent 55%),linear-gradient(#f7f9fe,#edf0f8) fixed;}
.topbar{max-width:1560px;margin:0 auto;padding:18px 28px 0;display:flex;gap:20px;font-size:13px;font-weight:600;flex-wrap:wrap}
.topbar a{color:var(--text-soft);text-decoration:none;padding-bottom:5px;border-bottom:2px solid transparent;transition:.15s}
.topbar a:hover{color:var(--accent)}
.topbar a.active{color:var(--accent);border-bottom-color:var(--accent)}
.hero{padding:46px 28px 30px;text-align:center}
.hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.hero h1{font-weight:800;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.035em}
.hero h1 em{font-style:normal}
.hero-sub{font-size:clamp(15px,1.8vw,18px);color:var(--text-soft);max-width:820px;margin:14px auto 0;line-height:1.6}
.wrap{max-width:1560px;margin:0 auto;padding:22px 28px 90px}
.notice{background:var(--bg-soft);border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:12px;padding:14px 18px;font-size:14px;color:var(--text-soft);margin:0 auto 26px;max-width:1100px}
.notice b{color:var(--text)}

/* ---------- index ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1;min-width:230px;font-family:var(--sans);font-size:15px;padding:11px 15px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}
.chip{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-soft);cursor:pointer;font-family:var(--sans);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-left:auto}
.glist{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:44px minmax(210px,1.3fr) minmax(160px,1.1fr) minmax(120px,.9fr) 74px minmax(150px,1fr);gap:10px;align-items:center;
  background:#fff;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;transition:.13s;text-align:left;font-family:var(--sans);width:100%}
.grow:hover{border-color:var(--accent);border-left-color:var(--accent);transform:translateX(2px)}
.grow.win{border-left-color:var(--good)}.grow.los{border-left-color:var(--danger)}.grow.drw{border-left-color:var(--warn)}
.g-n{font-family:var(--mono);font-size:13px;color:var(--text-dim);font-weight:600}
.g-p{font-weight:700;font-size:15px;letter-spacing:-.01em}
.g-p .fs{color:var(--accent)}
.g-e,.g-o{font-size:13px;color:var(--text-soft)}
.g-r{font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;border-radius:6px;padding:3px 0}
.g-r.win{background:var(--good-soft);color:var(--good)}.g-r.los{background:var(--danger-soft);color:var(--danger)}.g-r.drw{background:var(--warn-soft);color:var(--warn)}
.g-t{font-size:13px;color:var(--text-dim);font-style:italic}
@media (max-width:900px){.grow{grid-template-columns:36px 1fr 64px;grid-auto-rows:auto}.g-e,.g-o,.g-t{grid-column:2/4;font-size:12px}}

/* ---------- game view ---------- */
.gv{display:none}.gv.on{display:block}
.idx.off{display:none}
.gv-nav{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:14px;font-weight:700;padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--text-soft);border-color:var(--border)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
.ghead{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:22px}
.gbadge{font-family:var(--mono);font-size:26px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--cyan));width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 22px rgba(47,111,237,.26)}
.ghead-main{flex:1;min-width:260px}
.gname{font-weight:800;font-size:clamp(22px,3.2vw,30px);letter-spacing:-.03em;line-height:1.15}
.gname .fs{color:var(--accent)}
.gtitle{font-style:italic;color:var(--text-soft);font-size:16px;margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:11px}
.fact{font-family:var(--mono);font-size:11px;color:var(--text-soft);background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:999px;padding:4px 10px}
.fact.win{background:var(--good-soft);border-color:var(--good-bd);color:var(--good);font-weight:700}
.fact.los{background:var(--danger-soft);border-color:var(--danger-bd);color:var(--danger);font-weight:700}
.fact.drw{background:var(--warn-soft);border-color:var(--warn-bd);color:var(--warn);font-weight:700}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:30px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}

/* moves + notes flow */
.flow{min-width:0}
.flow.nocm .note,.flow.nocm .ctx,.flow.nocm .end{display:none}
.mvt{display:grid;grid-template-columns:46px 1fr 1fr;gap:2px 8px;background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:10px;padding:9px 12px;margin:10px 0}
.mvt .mn{font-family:var(--mono);font-size:13px;color:var(--text-dim);padding:3px 0}
.mv{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text);background:none;border:1px solid transparent;border-radius:6px;padding:3px 7px;cursor:pointer;text-align:left;transition:.1s;letter-spacing:.01em}
.mv:hover{background:rgba(47,111,237,.10);color:var(--accent)}
.mv.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.mv.el{color:var(--text-dim);cursor:default;font-weight:400}
.mv.el:hover{background:none;color:var(--text-dim)}
.note{font-size:15.5px;color:var(--text-soft);line-height:1.7;margin:12px 0 12px 2px;padding-left:14px;border-left:2px solid var(--border)}
.note b{color:var(--text);font-weight:700}
.note em{font-style:normal;font-family:var(--mono);font-size:13.5px;color:var(--text-dim)}
.note .ln{font-family:var(--mono);font-size:14px;color:var(--text);background:var(--bg-soft);border-radius:5px;padding:1px 5px}
.fg{font-style:normal;font-size:1.2em;line-height:0;color:var(--accent);vertical-align:-1px}
.note b .fg,.ctx b .fg,.end b .fg{color:var(--accent)}
.dich{background:rgba(47,111,237,.055);border:1px solid rgba(47,111,237,.20);border-left:3px solid var(--accent);border-radius:11px;padding:13px 17px;margin:12px 0;font-size:15.5px;color:var(--text);line-height:1.7}
.dich .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:6px}
html[data-theme="dark"] .dich{background:rgba(91,140,255,.10);border-color:rgba(91,140,255,.28)}
.ctx{background:linear-gradient(160deg,#fff,#f3f5fb);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:16px 20px;margin-bottom:16px;font-size:16px;color:var(--text-soft);line-height:1.7}
.ctx b{color:var(--text)}
.ctx .lab,.end .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;display:block;margin-bottom:7px}
.end{background:var(--good-soft);border:1px solid var(--good-bd);border-radius:12px;padding:16px 20px;margin-top:22px;font-size:16px;color:var(--text-soft);line-height:1.7}
.end .lab{color:var(--good)}
.end b{color:var(--text)}
.dia{margin:16px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.dia .cap{font-size:14px;color:var(--text-soft);font-style:italic}
.dia .cap b{font-style:normal;color:var(--text);font-family:var(--mono);font-size:13px}

/* board */
.bwrap{position:sticky;top:18px}
.bcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.bnames{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--text-soft);margin-bottom:6px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1/1;border-radius:5px;overflow:hidden;user-select:none;container-type:inline-size;box-shadow:0 2px 10px rgba(23,32,56,.14)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;line-height:1;overflow:hidden}
.sq.l{background:#ebecd0}.sq.d{background:#739552}
.sq.hl{box-shadow:inset 0 0 0 .5cqi rgba(255,214,0,.85)}
.sq .cr,.sq .cf{position:absolute;font-family:var(--sans);font-size:2.4cqi;font-weight:700;line-height:1;letter-spacing:0}
.sq .cr{top:3%;left:5%}
.sq .cf{bottom:2%;right:5%}
.sq.l .cr,.sq.l .cf{color:#739552}
.sq.d .cr,.sq.d .cf{color:#ebecd0}
.pc{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 .5px .8px rgba(0,0,0,.28))}
.bbar{display:flex;gap:6px;align-items:center;margin-top:12px}
.bbar .btn{padding:7px 12px;font-size:14px}
.bpos{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-left:auto;text-align:right}
.bhint{font-size:12.5px;color:var(--text-dim);margin-top:9px;line-height:1.5}
/* ---------- sổ tay ---------- */
.kit{display:none}.kit.on{display:block}
.kit-head{padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px}
.kit-head h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.03em}
.kit-head p{color:var(--text-soft);font-size:15.5px;margin-top:8px;max-width:820px;line-height:1.65}
.kit-part{margin-bottom:34px}
.kit-part>h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.kit-part>.pi{color:var(--text-soft);font-size:15px;margin-bottom:14px;max-width:820px}
.kit-grp{margin-bottom:18px}
.kit-grp>h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.kit-list{display:grid;gap:6px}
.kit-it{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(150px,1fr) minmax(0,1.6fr);gap:8px 16px;align-items:start;
  background:#fff;border:1px solid var(--border-soft);border-left:3px solid var(--border);border-radius:9px;padding:10px 14px}
.kit-it .en{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)}
.kit-it .vi{font-size:15px;font-weight:600;color:var(--accent)}
.kit-it .nt{font-size:14.5px;color:var(--text-soft);line-height:1.6}
@media (max-width:820px){.kit-it{grid-template-columns:1fr}.kit-it .nt{grid-column:1}}
.foot{text-align:center;margin-top:44px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--text-dim);line-height:1.9}
</style>
</head>

var CM={"1":{"tiv":"Quá ít, quá muộn","ctx":"Fischer <b>14 tuổi</b> khi chơi ván này. Trắng không tranh trung tâm ngay mà dựng thế <b>Ấn Độ đảo</b> — e4, d3, g3, ♗g2, ♘bd2, nhập thành, rồi mới bung ra. Sherwin không đi nước nào hỏng hẳn trong khai cuộc, nhưng bỏ lỡ vài cơ hội cân bằng. Fischer cộng dồn những lợi thế nhỏ — trung tâm rộng hơn, rồi <b>cặp Tượng</b> — và kết bằng một đòn thí Mã vào h7 khi Đen đang loay hoay xếp lại quân.","end":"Đòn thí ở nước 18 nhìn thì bất ngờ, nhưng nó <b>không phải liều</b>. Trước khi thí, Fischer đã có sẵn bốn thứ chĩa về cánh Vua: Hậu c2, Tượng g2 trên đường chéo dài, tốt h đã lên h4, và Mã đứng g5. Thí quân chỉ là bước cuối cùng của một quá trình dồn quân. Chi tiết kỹ thuật đáng nhớ thứ hai là <b>đường đi của Xe</b>: ♖e1–e4–e3–h3. Xe không có cột mở thì đi vòng qua hàng ngang để vào chỗ có việc.","notes":[{"at":13,"t":"<b>7…♖b8</b> — Xe rời a8 sang b8 để chuẩn bị đẩy …b5–b4, mở cột b ở cánh Hậu. Lúc này chưa có cột nào mở nên nhìn khá bí ẩn, nhưng ý đồ là phản công ở cánh Đen mạnh hơn."},{"at":17,"t":"Đến đây Đen đã chơi …d6 và …b6, giữ tốt ở e6–d6 và <b>chưa đẩy …d5</b>. Đó là điểm mấu chốt: trung tâm còn để trống cho Trắng, và Trắng đã c3 + d3, sẵn sàng d4. Cách cân bằng thông thường ở thế này là …b5 rồi đổi ở d4 để mở cột c."},{"at":19,"t":"<b>10…♕c7?</b> — Hậu ra c7 nhìn xuống cột c, nhưng để Trắng rảnh tay ở trung tâm. Đúng nhịp là <b>10…cxd4 11 cxd4 d5</b>: đổi xong ở d4 rồi chốt trung tâm bằng …d5, và nước e4–e5 của Trắng không còn nữa."},{"at":20,"t":"<b>11 e5!</b> — Tốt tiến lên e5 đuổi Mã f6 và cắt đôi bàn cờ. Từ giờ Đen không còn ô tốt cho quân ở nửa bàn bên Trắng."},{"at":21,"t":"<b>11…♘d5</b> — Mã lùi vào giữa thay vì ăn. Ăn thì thế cờ mở ra đúng ý Trắng: <b>11…dxe5 12 dxe5</b> và chính con tốt đó lại đánh vào ô f6, Mã Đen phải chạy tiếp một lần nữa."},{"at":24,"t":"<b>13 ♘e4!</b> — Mã nhảy vào ô e4 đánh thẳng vào Tượng d6. Tượng đó chỉ có mỗi ♕c7 đỡ, còn ♘e4 thì có ♖e1 đứng sau lưng — nên Đen buộc phải để đổi. Sau khi đổi xong, Trắng còn <b>hai Tượng</b>, Đen còn một Tượng và hai Mã — đúng thứ lợi thế nhỏ mà Fischer nhắm tới."},{"at":25,"t":"<b>13…c4</b> — Đen khoá tốt lên c4 để cột c không mở ra. Được cái an toàn, nhưng tốt c4 thành mục tiêu lâu dài và Đen bỏ hẳn sức ép vào tốt d4."},{"at":28,"t":"<b>15 ♘g5!</b> — Mã sang g5 chĩa vào h7. Cộng với Tượng g2 đang nằm trên đường chéo dài, Trắng bắt đầu dồn quân về Vua Đen. Đây là nước đầu tiên của kế hoạch tấn công."},{"at":29,"t":"<b>15…♘ce7?</b> — Mã c6 lùi về e7 để giữ ô g6 và f5, nhưng quân Đen thành chật chội: Tượng c8 và Xe f8 vẫn chưa có việc gì làm. Đơn giản hơn là <b>15…h6 16 ♘e4</b> đuổi Mã đi luôn — Trắng không có gì ở e6, vì <b>16 ♘xe6 fxe6</b> chỉ là đổi một Mã lấy một tốt."},{"at":30,"t":"<b>16 ♕c2!</b> — Hậu ra c2, đứng trên đường chéo b1–h7, tức là <b>ngắm thẳng vào h7</b>. Bây giờ đã có hai quân nhắm cùng một điểm."},{"at":32,"t":"<b>17 h4</b> — Tốt biên tiến lên, dọa h5 đuổi Mã và mở đường cho Xe h1. Đến lúc này Trắng đã dồn bốn thứ về cánh Vua: Hậu, Tượng g2, Mã g5 và tốt h."},{"at":33,"t":"Đen đưa Mã về <b>f6</b> giữ h7. Trên giấy tờ thì h7 đã có Mã f6 và Vua g8 canh — đủ. Nhưng đây chính là thế cờ mà Fischer đang chờ."},{"at":34,"t":"<b>18 ♘xh7!</b> — Thí Mã lấy tốt h7. Ăn bằng Vua còn tệ hơn ăn bằng Mã: <b>18…♔xh7 19 h5</b> và Mã g6 <b>bị ghim</b> vào Vua h7 bởi ♕c2 trên đường chéo b1–h7 — nó không còn một nước đi hợp lệ nào, trong khi tốt h5 đang đánh nó. Đây là đổi một quân lấy hàng phòng ngự, không phải đổi lấy vật chất."},{"at":35,"t":"<b>18…♘xh7</b> — Sherwin ăn bằng Mã để Vua khỏi ra chỗ bị ghim. Cái giá là quanh Vua chỉ còn hai tốt f7 và g7, còn Mã h7 thì đứng ở góc, không đỡ được gì."},{"at":37,"t":"<b>19…♘h4!</b> — Đen chọn cách chống trả tốt nhất: không lùi mà đâm Mã vào h4, đánh vào Tượng g2 — mà ♗g2 thì chỉ có mỗi Vua g1 đỡ. Sherwin không chịu chết đứng."},{"at":38,"t":"<b>20 ♗f4</b> — Chưa ăn Mã vội. Tượng ra f4 <b>đánh ♕d6</b>, bắt Hậu Đen phải bỏ chỗ trước đã; ăn ngay <b>20 gxh4</b> thì Đen được một nhịp tự do."},{"at":40,"t":"<b>21 gxh4</b> — Trắng ăn Mã và chấp nhận tốt cánh Vua vỡ nát. Đổi lại, tốt h vẫn chạy tiếp được — đó mới là thứ quan trọng."},{"at":42,"t":"<b>22 h6!</b> — Tốt lên h6 khoét nốt lớp vỏ cuối cùng quanh Vua Đen. Chỉ mỗi tốt g7 với tới nó, mà <b>22…gxh6 23 ♗xh6</b> thì Tượng vào ngay ô vừa trống và đánh luôn Xe f8."},{"at":45,"t":"<b>23…♔xg7?</b> — Vua tự ra ăn tốt ở g7. Bây giờ Vua đứng giữa <b>cột g và cột h đều mở toang</b>, và quanh nó chỉ còn đúng một tốt f7. Đây là chỗ thế cờ sập hẳn."},{"at":46,"t":"<b>24 ♖e4!</b> — Xe rời cột e đi ngang. Không có cột mở thì đi vòng."},{"at":48,"t":"<b>25 ♖e3!</b> — Bước hai của cùng một hành trình: e4 → e3 → h3."},{"at":50,"t":"<b>26 ♖h3</b> — Xe vào cột h. Bây giờ Hậu, Tượng và Xe cùng vây một Vua trần."},{"at":52,"t":"<b>27 ♗e5+</b> — Chiếu, và Đen chỉ còn năm nước hợp lệ. Chặn bằng Xe thì <b>27…♖f6 28 ♗xf6+ ♘xf6</b> — mất chất ngay. Sherwin phải chặn bằng Mã."},{"at":54,"t":"<b>28 ♕d2!</b> — Hậu lùi về d2 để sang g5, ép nốt vào ô yếu quanh Vua."},{"at":57,"t":"<b>29…♕e7</b> — Bắt buộc: sau <b>29 ♕g5</b> thì Mã f6 bị ♗e5 và ♕g5 cùng đánh mà chỉ có Vua f7 đỡ, nên Đen phải đưa thêm Hậu về giữ."},{"at":58,"t":"<b>30 ♗xf6</b> — Đổi bỏ quân giữ nhà cuối cùng của Đen."},{"at":60,"t":"<b>31 ♖h7+</b> — Xe cắm vào h7 mà không sợ bị ăn, vì ♕g5 đang canh ô g7: <b>31…♕g7 32 ♖xg7+</b> và Đen không được ăn lại, mất trắng Hậu. Chỉ còn 31…♔e8."},{"at":64,"t":"<b>33 ♗c6+</b> và Đen xin thua. Chỉ còn đúng hai nước chặn, và cả hai đều mất Xe: <b>33…♗d7 34 ♗xd7+ ♔xd7 35 ♕xf8</b>, hoặc <b>33…♖d7 34 ♗xd7+ ♔xd7 35 ♕xf8</b>."}]},"2":{"tiv":"Hạ con Rồng","ctx":"Portoroz 1958. Đen chọn biến Rồng của Phòng thủ Sicilia: tốt lên g6 rồi <b>♗g7</b> chĩa dọc đường chéo dài a1–h8. Trắng đáp bằng thế trận Nam Tư — ♗e3, f3, ♕d2, nhập thành cánh Hậu — nghĩa là hai Vua ở hai cánh khác nhau và ván cờ thành cuộc đua đẩy tốt. Fischer đi nhanh hơn một nhịp: tốt h và tốt g lần lượt bóc từng lớp vỏ quanh Vua Đen, một Xe được đem đổi lấy Mã để mở đường cho tốt, và ván kết bằng một tốt thông ở cột d cùng đòn chiếu hết ở h6.","end":"Ván này là mẫu chuẩn của cuộc đua hai cánh. Hai điều đáng nhớ. Thứ nhất, <b>tốt đi trước, quân theo sau</b>: h4–h5 rồi g4–g5 không nhằm ăn gì cả, chúng chỉ để mở cột và đuổi quân giữ nhà; chỉ khi ♘f6 buộc phải rời chỗ thì đòn thí chất ở h5 mới có nghĩa. Thứ hai, <b>một quân đứng đúng đường chéo quyết định ván cờ từ rất xa</b>: Tượng b3 không ăn một quân nào suốt ván, nhưng chính nó cấm Vua Đen ăn tốt ở f7 — và đó đúng là lúc thế cờ sập.","notes":[{"at":9,"t":"<b>5…g6</b> — Đen vào biến Rồng: tốt g6 dọn chỗ cho ♗g7. Con Tượng đó sẽ là quân mạnh nhất của Đen, nhưng nó cũng là quân giữ nhà duy nhất ở cánh Vua. Mọi việc Trắng làm về sau đều xoay quanh chuyện gỡ nó ra hoặc phá lớp tốt che nó."},{"at":12,"t":"<b>7 f3</b> — Tốt f3 làm hai việc: giữ chắc tốt e4 và cấm Mã Đen nhảy vào g4. Quan trọng hơn, nó dọn đường cho tốt h tiến lên mà không cần quân nào yểm hộ. Cùng ♗e3 và ♕d2, đây là thế trận Nam Tư: nhập thành cánh Hậu rồi dồn tốt sang cánh Vua."},{"at":16,"t":"<b>9 ♗c4</b> — Tượng vào đường chéo a2–g8, ngắm thẳng f7. Chi tiết này quyết định ván cờ, dù phải chờ tới nước 24 mới thấy tác dụng: chừng nào còn Tượng trắng ô của Trắng trên đường chéo đó, Vua Đen không tự bảo vệ được ô f7."},{"at":17,"t":"<b>9…♘xd4 10 ♗xd4</b> — Đen đổi Mã cho nhẹ thế, nhưng nước ăn lại đưa Tượng vào <b>d4</b>, mặt đối mặt với ♗g7 trên đường chéo dài. Từ đây Trắng lúc nào cũng có sẵn nước đổi ♗xg7."},{"at":22,"t":"<b>12 0-0-0</b> — Hai Vua nay ở hai cánh khác nhau. Từ đây mỗi bên đẩy tốt về phía Vua đối phương mà không sợ làm hở nhà mình. Đen khởi động trước với …♕a5 và …b5; Trắng sẽ trả lời bằng h4–h5."},{"at":26,"t":"<b>14 ♘d5</b> — Tốt b4 vừa tấn công Mã c3. Thay vì lùi, Mã nhảy tới d5, nơi nó đụng cả ♘f6 lẫn tốt e7. Đen phải đổi, và câu hỏi duy nhất là đổi bằng quân nào."},{"at":27,"t":"<b>14…♗xd5</b> — Ăn bằng Mã cũng có cái giá riêng: <b>14…♘xd5 15 exd5 ♗d7 16 ♗xg7 ♔xg7 17 ♕d4+</b> — Trắng gỡ đúng con Tượng Rồng rồi chiếu ngay sau đó. Larsen giữ Mã và bỏ Tượng trắng ô."},{"at":28,"t":"<b>15 ♗xd5</b> — Đen đã đổi bằng Tượng e6, tức là bỏ hẳn <b>Tượng trắng ô</b>. Từ giờ các ô sáng quanh Vua Đen — f7, e6, h5 — không còn quân nào canh, trong khi Trắng vẫn giữ đủ hai Tượng."},{"at":29,"t":"<b>15…♖ac8?</b> — Xe ra cột c, nhưng cột c chưa mở và ô c2 đã có Vua b1 cùng Hậu d2 canh. Đen tiêu một nhịp cho một quân không có việc, đúng vào lúc từng nhịp đều đáng giá trong cuộc đua."},{"at":30,"t":"<b>16 ♗b3!</b> — Tượng lùi khỏi tầm bị đánh và thành quân thứ ba canh c2, nên Xe c8 hết sạch mục tiêu. Nhưng lý do chính là đường chéo: từ b3 Tượng nhìn thẳng f7, và tám nước sau chính điều đó khiến Vua Đen không được phép ăn tốt ở f7."},{"at":34,"t":"<b>18 h5!</b> — Tốt h đâm tiếp. Đen không ăn, vì <b>18…gxh5 19 ♖xh5</b> là Xe Trắng vào thẳng cột h và tốt h7 chỉ còn Vua với Mã f6 đỡ. Nên Trắng sẽ tự đổi ở g6 và lấy cột h mà không mất gì."},{"at":40,"t":"<b>21 g5</b> — Tốt thứ hai vào việc, đuổi ♘f6 — quân duy nhất của Đen còn với tới h5 và h7. Mã không có ô lùi nào tử tế nên phải ra h5, ngay trước mũi Xe h1."},{"at":41,"t":"<b>21…♘h5</b> — Mã buộc phải đi, mà lùi thì tệ hơn: <b>21…♘d7 22 ♖h8+!</b> và Đen chỉ có hai nước ăn lại (…♔xh8 hoặc …♗xh8) — lớp che cuối cùng của Vua biến mất ngay."},{"at":42,"t":"<b>22 ♖xh5!</b> — Thí chất: Xe đổi lấy Mã. Trắng không nhắm ăn quân mà nhắm <b>dọn đường cho tốt g</b>. Đen ăn lại bằng tốt g, cột g trống ra, và tốt g5 chỉ còn hai bước là tới f7."},{"at":43,"t":"<b>22…gxh5</b> — Gần như bắt buộc. Không ăn lại thì Trắng ăn không một quân: <b>22…♔f8 23 ♖xh7</b>, Xe vẫn nguyên và Trắng hơn hẳn một Mã."},{"at":44,"t":"<b>23 g6</b> — Tốt vào g6, đụng cả f7 lẫn h7. Vua Đen không còn một tốt nào che, trong khi quân Đen đứng cả ở cánh Hậu: hai Xe ở c7 và c8, Hậu ở b5."},{"at":46,"t":"<b>24 gxf7+</b> — Đây là lúc nước 9 ♗c4 và 16 ♗b3 trả công: Vua <b>không được phép</b> ăn tốt f7, vì Tượng b3 vẫn canh ô đó. Ăn bằng Xe cũng không xong: <b>24…♖xf7 25 ♗xf7 ♔xf7</b> và Trắng lấy lại đủ chất, Vua Đen trơ giữa bàn. Larsen bước sang f8 và chịu một tốt Trắng cắm ngay trong nhà."},{"at":49,"t":"<b>25…d5!</b> — Nước chống trả đúng chỗ: tốt d5 <b>chắn ngang đường chéo b3–f7</b>, nên Tượng b3 hết canh ô f7 và Đen ăn lại được con tốt cắm trong nhà."},{"at":50,"t":"<b>26 exd5!</b> — Trắng ăn lại bằng <b>tốt</b> chứ không bằng Tượng. Lý do rất cụ thể: ăn bằng tốt thì trên bàn xuất hiện một tốt thông ở cột d, và tốt đó mới là quân kết liễu; <b>26 ♗xd5 ♖xf7</b> thì Trắng chẳng còn gì để chạy."},{"at":52,"t":"<b>27 d6</b> — Tốt thông chạy. Đen chỉ chặn nó được bằng cách bám ô d7 — lúc này ♕b5 và ♖f7 cùng nhìn vào đó — nên Trắng đi tiếp 28 ♗g5 để gỡ Xe f6 ra khỏi việc."},{"at":55,"t":"<b>28…♕b7</b> — Hậu về b7 canh ô d7, cố chặn tốt thông. Nhưng tốt vẫn đi được, vì ♕d2 đứng ngay sau nó trên cột d: <b>30 d7 ♕xd7 31 ♕xd7</b>."},{"at":60,"t":"<b>31 ♕d6+</b> và Đen xin thua. Chỉ còn đúng hai nước đáp: <b>31…♗e7 32 ♕h6#</b>, còn <b>31…♔g7 32 ♖g1+ ♔h7 33 ♕xf6</b> nhặt Tượng trong khi tốt d7 vẫn đứng nguyên."}]},"3":{"tiv":"Cái ôm của gấu","ctx":"Cũng ở Portoroz 1958, lần này Fischer cầm Đen trước Petrosian. Đen chơi Phòng thủ Ấn Độ Vua: nhường trung tâm cho Trắng rồi phá lại bằng …e5 và …f5. Trắng đóng trung tâm bằng d5, và sau một đợt đổi quân sớm ở e5 và g3, ván cờ chuyển thành cuộc siết chậm — đúng chất Petrosian: đổi bằng hết những quân mạnh của Đen, đưa Mã về ô d4 không ai đuổi được, rồi mới mở cánh Hậu bằng b4 và c5. Đen mất một tốt và phải vào tàn cuộc Xe khó, nhưng cứu được nhờ hai tốt chồng ở cột c chạy đúng lúc. Ván hòa.","end":"Bài học đầu là cách siết: Petrosian không đi tìm đòn nào cả. Ông đổi lần lượt từng quân đỡ đòn của Đen (Tượng g7, rồi Hậu), đưa Mã về d4, và chỉ mở cánh Hậu khi quân Đen đã lùi hết về giữ nhà. Bài học thứ hai nằm ở tàn cuộc và đi ngược sách vở: <b>tốt chồng không phải lúc nào cũng là điểm yếu</b>. Hai tốt cột c của Đen trông rất xấu, nhưng một Xe chỉ ăn được một con — con thứ hai chạy tiếp, và chính nó cứu ván cờ.","notes":[{"at":16,"t":"<b>9 d5</b> — Trắng đóng trung tâm. Tốt d5 đuổi ♘c6 và khoá luôn ♗g7 sau bức tường tốt e5. Cấu trúc này định sẵn kế hoạch hai bên cho cả ván: Trắng chơi ở cánh Hậu bằng c4–c5, Đen phải phá ở cánh Vua bằng …f5."},{"at":19,"t":"<b>10…f5</b> — Đúng bài Ấn Độ Vua: Đen đập vào e4 để mở cột f và cho ♗g7 thở. Nhưng Mã h5 đang đứng chơ vơ, không quân nào đỡ — và Trắng bám ngay vào chỗ đó."},{"at":22,"t":"<b>12 ♘xe5!</b> — Mã ăn tốt e5 được là vì <b>Mã h5 đang treo</b>: cả <b>12…dxe5 13 ♕xh5</b> lẫn <b>12…♗xe5 13 ♕xh5</b> đều để Trắng nhặt luôn con Mã và ăn không một tốt. Đen buộc phải chen một nước ở giữa thay vì ăn lại ngay."},{"at":24,"t":"<b>13 hxg3</b> — Ăn lại bằng tốt h, không bằng Vua. Bộ tốt g chồng lên nhau nhìn xấu, nhưng đổi lại <b>cột h mở ra</b> cho Xe Trắng trong khi Đen vẫn còn nguyên tốt h7 để làm mục tiêu."},{"at":25,"t":"<b>13…♗xe5?</b> — Đen ăn lại bằng Tượng. Nghe hợp lý vì Tượng chiếm ô trung tâm, nhưng ở e5 nó không có gì che, và Trắng có sẵn một tốt để đuổi nó đi. <b>13…dxe5</b> giữ Tượng ở nhà trên g7 thì đỡ hơn nhiều."},{"at":26,"t":"<b>14 f4!</b> — Đuổi Tượng và chiếm trung tâm cùng lúc. Ăn không được — <b>14…♗xf4 15 gxf4</b> là mất quân — nên Tượng phải lùi về g7, tức là Đen mất trắng hai nhịp, còn Trắng dựng được bộ tốt d5–f4."},{"at":30,"t":"<b>16 ♗d4</b> — Tượng vào đường chéo dài, mặt đối mặt với ♗g7. Đó là quân giữ nhà chính của Đen nên Trắng muốn đổi nó; năm nước sau việc đổi diễn ra thật, và Đen phải ăn lại bằng Xe."},{"at":32,"t":"<b>17 ♖e1?</b> — Xe rời cột h, đúng cột duy nhất đang mở về phía Vua Đen. Sáu nước sau Trắng phải tự đưa nó quay lại — <b>23 ♖h1</b> — nghĩa là mất không mấy nhịp."},{"at":34,"t":"<b>18 ♗f3!</b> — Tượng rời g2 sang f3, nơi nó nhìn h5 và không còn vướng đường chéo dài nữa. Đen có một điểm yếu lâu dài là tốt f5: nó không có tốt e hay tốt g bên cạnh đỡ, nên nó là <b>tốt cô lập</b> mà mọi quân Trắng dần chĩa vào."},{"at":49,"t":"<b>25…♖f7!</b> — Fischer kéo Xe từ g7 về f7. Việc này dọn ô g7 cho Hậu, và Hậu ra g7 là để mời đổi. Thế cờ đang chật thì cách hạ áp lực tốt nhất là bớt quân mạnh trên bàn."},{"at":66,"t":"<b>34 ♘c2!</b> — Mã lùi để đi vòng sang d4. Không có cột nào để tấn công thì việc đầu tiên là đưa quân về ô tốt nhất: từ d4 Mã kiểm soát c6, e6, b5 và f5 — đúng những ô Đen cần dùng."},{"at":71,"t":"<b>36…♘g8?</b> — Mã lùi vào tận góc, cách xa cánh Hậu nhất có thể. Trắng phá ngay: <b>37 b4!</b>, và sau <b>37…axb4 38 axb4</b> cột a mở ra đúng lúc quân giữ của Đen đứng sai chỗ."},{"at":72,"t":"<b>37 b4!</b> — Trắng mở cánh Hậu đúng lúc Mã Đen vừa lùi về tận g8. Đen chọn đường nào cũng thiệt: đổi ở b4 thì cột a mở ra cho Xe Trắng, không đổi thì bộ tốt b4–c4 tiến tiếp."},{"at":78,"t":"<b>40 ♖a1!</b> — Cột a lúc này <b>trống hoàn toàn</b>, không một quân nào đứng trên đó. Xe vào cột trống rồi đi tiếp a6–a7, ép thẳng vào tốt c7 và hàng bảy của Đen."},{"at":88,"t":"<b>45 c5!</b> — Đòn phá ở đúng chỗ Trắng mạnh hơn. Sau <b>45…bxc5 46 bxc5 dxc5</b>, cấu trúc Đen vỡ: hai tốt chồng ở cột c, tốt c7 đứng trơ trước Xe a7, và ô e5 bỏ trống cho Mã Trắng."},{"at":92,"t":"<b>47 ♘f3!</b> — Mã đi vòng lên e5. Đen không còn tốt d6 hay f6 nên không có cách nào đuổi nó khỏi ô đó, và từ e5 Mã đụng thẳng ♗d7 lẫn ô f7."},{"at":93,"t":"<b>47…♔f7!</b> — Vua ra đón trước. Trắng vẫn vào được e5, nhưng phải đổi sạch: <b>48 ♘e5+ ♔e7 49 ♘xd7 ♘xd7 50 ♗xf5</b> — Đen mất tốt f5, đổi lại bàn cờ vơi quân, và đó là hướng cứu duy nhất."},{"at":101,"t":"<b>51…♔d6?</b> — Vua bước lên đỡ, nhưng đứng ngay cạnh con Mã d7 đang bị ♗f5 nhòm. Trắng đổi Tượng lấy Mã, Vua phải ăn lại, và ván chuyển thành tàn cuộc Xe trong đó cặp tốt f–g của Trắng chạy nhanh hơn."},{"at":112,"t":"<b>57 ♖h1?</b> — Xe rời cột h về hàng cuối để canh ô phong hậu. Chỗ hụt là Đen có <b>hai</b> tốt ở cột c, c4 và c7: một Xe chỉ chặn hay ăn được một con. Từ đây tốt c cứ chạy."},{"at":120,"t":"<b>61 ♖c1</b> — Xe buộc phải đứng lại canh ô c1, và từ giờ nó <b>không rời đi được nữa</b>: bỏ cột c hay bỏ hàng một là tốt c2 phong Hậu ngay. Trắng còn hai tốt nhưng chỉ còn mỗi Vua để đẩy chúng."},{"at":123,"t":"<b>62…♖g8!</b> — Xe về g8 chặn được cả hai tốt cùng lúc: nó đứng chắn cột g và canh luôn ô f8 trên hàng cuối. Đến đây mỗi bên đều nắm một thứ đối phương không xử lý nổi."},{"at":132,"t":"<b>67 f7</b> — hai bên chấp nhận hòa. Nguồn cứu của Đen rất cụ thể: <b>67…♖xg6+ 68 ♔xg6 ♔b2 69 f8=♕ c2</b> — Đen bỏ Xe lấy tốt g6 rồi dồn tốt xuống c2 với Vua kèm ngay bên, còn Vua Trắng ở tận g6. Tốt cột c đứng ở c2 là ca hòa sách vở chống Hậu: Vua Đen nấp vào a1, và ăn tốt thì Đen hết nước đi mà không bị chiếu."}]},"4":{"tiv":"Khéo léo và đòn phối hợp","ctx":"Mar del Plata 1959, Fischer cầm Đen trong Phòng thủ Sicilia. Đen đẩy …e5 sớm: được thế chủ động ở trung tâm nhưng để lại ô yếu d5 vĩnh viễn. Pilnik chơi rất chậm — ♕e1, ♖d1–d2, ♕f2 — và trong lúc đó Đen kịp xếp xong quân. Trắng cắm Mã vào d5, đổi Tượng lấy Mã, và cuối cùng để lại cho Đen <b>cặp Tượng</b> cùng một tốt a3 cô lập trên cột mở. Đen ép qua cột b, đưa Xe xuống hàng hai, rồi kết ván bằng một đòn ghim vào Vua đã nấp ở h1 từ nước 23.","end":"Hai thứ đáng mang đi. Thứ nhất, <b>đổi quân cũng phải có lý do</b>: Pilnik đổi Tượng lấy Mã ở nước 15 chỉ để tránh một con Mã khó chịu, nhưng cái giá là cặp Tượng cho đối thủ và một tốt cô lập cho mình — đúng hai thứ đó thắng ván cờ. Thứ hai, <b>đòn ghim đáng để trả giá</b>: Fischer chịu thua chất ở nước 37 vì thấy trước Xe Trắng sẽ bị kẹt đúng giữa Tượng e4 và Vua h1. Ô mà Vua chui vào để trú ở nước 23 chính là ô làm Vua chết ở nước 41.","notes":[{"at":11,"t":"<b>6…e5</b> — Đen đuổi Mã d4 và chiếm trung tâm bằng tốt. Cái giá là ô <b>d5</b> không còn tốt nào canh được nữa; suốt ván Trắng sẽ tìm cách đưa quân vào đó. Đây là món đánh đổi có ý thức, không phải sơ suất."},{"at":18,"t":"<b>10 f3</b> — Tốt f3 giữ e4, nhưng nó bịt luôn ô f3 của Mã và tạm gác nước f4 lại. Mãi đến nước 18 Trắng mới đẩy được f4, mà lúc đó Đen đã xếp xong quân. Trắng chọn thế trận chờ — chờ thì vẫn phải có kế hoạch, và ba nước tiếp theo cho thấy Trắng chưa có."},{"at":19,"t":"<b>10…♕c7</b> — Hậu ra c7 nhắm cột c và đỡ thêm cho e5. Có cách đơn giản hơn để xoá hẳn ô yếu: <b>10…d5 11 exd5 ♘xd5 12 ♘xd5 ♗xd5</b>, đổi sạch ngay tại d5 thì chẳng còn gì cho Trắng cắm quân vào. Fischer không chọn — anh để nguyên cái lỗ đó và tin mình xử lý được."},{"at":22,"t":"<b>12 ♖d1</b> — Xe vào cột d, nơi tốt d6 của Đen đang được <b>♕c7 và ♗e7</b> đỡ hai lần còn Trắng chưa có quân nào đánh. Cộng với ♕e1 nước trước và ♖d2 nước sau, Trắng tiêu ba nhịp để xếp lại quân mà không tạo ra một lời đe doạ nào."},{"at":25,"t":"<b>13…♘b6</b> — Mã nhắm ô c4. Từ c4 nó đụng cả ♖d2 lẫn tốt b2 cùng lúc, và Trắng không đuổi được: muốn đẩy <b>b2–b3</b> thì vướng đúng con ♘b3 của mình đang đứng đó. Trắng phải xử lý con Mã này ngay bây giờ."},{"at":26,"t":"<b>14 ♕f2?</b> — Hậu xuống f2 xếp sau ♗e3 để chuẩn bị ♗xb6. Nhưng đây là nước chậm: Đen chỉ cần <b>14…♘c4</b> là Mã vào đúng ô mơ ước, đánh ♖d2 và tốt b2 (tốt này không ai đỡ) một lượt. Trắng đuổi được nó, nhưng phải trả giá: <b>15 ♗xc4 bxc4</b> — cặp Tượng về tay Đen, và chính con tốt c4 mới lại quay ra đánh ♘b3."},{"at":27,"t":"<b>14…♖ab8?</b> — Fischer bỏ lỡ. Xe ra b8 để chuẩn bị …b4 sau này, nhưng nó tặng Trắng đúng một nhịp — và Trắng dùng ngay nhịp đó."},{"at":28,"t":"<b>15 ♗xb6!</b> — Trắng đổi Tượng lấy Mã trước khi Mã kịp vào c4. Được: hết một quân khó chịu. Mất: sau 15…♖xb6 Đen còn <b>♗e6 và ♗e7</b>, tức cặp Tượng, còn các ô đen quanh trung tâm Trắng không còn Tượng nào giữ."},{"at":31,"t":"<b>16…♘xd5</b> — Ăn bằng Mã, không ăn bằng Tượng. Nếu <b>16…♗xd5 17 exd5</b> thì Đen chỉ còn một Tượng và cái lợi thế vừa kiếm được biến mất. Ăn bằng Mã thì sau <b>17 exd5 ♗d7</b> Đen vẫn có đủ hai Tượng d7 và e7 — đúng thứ sẽ quyết định tàn cuộc."},{"at":32,"t":"<b>17 exd5</b> — Ô yếu d5 hết yếu vì đã có tốt Trắng đứng đó. Nhưng kiểm quân lại thì: Trắng chỉ còn <b>một Tượng (♗e2)</b>, Đen có <b>hai</b>. Và trung tâm giờ đứng im, cứng đờ — thứ thế cờ mà bên có hai Tượng chỉ cần chờ nó mở ra."},{"at":35,"t":"<b>18…♗f6</b> — Tượng lùi về f6 không phải để trốn mà để chuẩn bị ăn lại ở e5 <b>bằng Tượng</b>. Đổi ngay <b>18…exf4 19 ♕xf4</b> thì Đen chẳng được gì, còn tốt d6 lẻ ra cho Hậu Trắng nhòm. Hai nước sau đúng như tính: 20 fxe5 ♗xe5."},{"at":39,"t":"<b>20…♗xe5</b> — Tượng vào e5 và thành quân mạnh nhất trên bàn: nó đứng giữa, đụng tốt h2 lẫn tốt c3, và Trắng không còn tốt f nào để đuổi nó. Đổi lại Đen chấp nhận tốt d6 lẻ."},{"at":44,"t":"<b>23 ♔h1</b> — Trắng dọn Vua khỏi cột g và khỏi đường chéo g1–a7 (Hậu Đen sẽ ra b6 hai nước sau). Nước phòng xa hợp lý, nhưng nó đặt Vua lên đường chéo <b>a8–h1</b>, và ván cờ kết thúc đúng trên đường chéo đó."},{"at":46,"t":"<b>24 cxb4</b> — Trắng ăn lại và tự mở cửa nhà mình. Giữ kín bằng <b>24 c4</b> thì cả cột a lẫn cột b đều đóng, Đen không biết đục vào đâu. Sau <b>24 cxb4 axb4</b> cột a mở toang, mà đứng ngay trên cột đó là tốt <b>a3</b> của Trắng — Xe Đen chỉ việc về a8, và nó về thật ở nước 28."},{"at":50,"t":"<b>26 ♘c6</b> — Mã nhảy vào giữa, đánh cùng lúc <b>♖b8</b> và <b>♗e5</b>. Nghe thì ghê, nhưng đếm lại: ♘c6 chỉ có ♖c2 và tốt d5 đỡ, còn ♕b6 với ♗d7 của Đen đang nhìn thẳng vào nó. Fischer không cứu quân nào cả."},{"at":51,"t":"<b>26…bxa3!</b> — Đen không đỡ mà ăn tốt trước. Sau <b>27 ♕xb6 ♖xb6 28 bxa3</b>, Trắng ôm một <b>tốt a3 cô lập</b> trên cột đã mở, và Xe Đen về a8 nhắm thẳng vào nó. Còn nếu Trắng tham quân, <b>27 ♘xb8 ♕xf2 28 ♖xf2 axb2</b> thì tốt b2 chỉ còn một bước nữa là phong: <b>29 ♖xb2 ♗xb2</b>, Đen nhỉnh hơn một tốt và ♘b8 kẹt cứng trong góc."},{"at":56,"t":"<b>29 ♘xe5?</b> — Trắng đổi Mã lấy con Tượng khoẻ, nhưng đó là quân giữ thăng bằng cuối cùng. Sau <b>29…dxe5</b>, quân Trắng còn lại không đỡ nổi hai Xe: tốt a3 đang bị ♖a8 đánh mà không ai đỡ, Xe Đen vào được hàng hai ngay nước sau, và Đen là bên đi trước."},{"at":59,"t":"<b>30…♖b2!</b> — Xe chiếm hàng hai và đánh ngay <b>♗e2 đang trơ trọi không ai đỡ</b>. Trắng không có cách đỡ Tượng cho tử tế nên phản đòn <b>31 ♖c7</b>, đánh lại ♗d7: nếu Đen tham <b>31…♖xe2 32 ♖xd7</b> thì quân lại đều. Fischer không ăn — anh chơi …♗f5, giữ nguyên cả hai thứ đang treo."},{"at":63,"t":"<b>32…♗e4+</b> — Chiếu, và Trắng đúng ba nước đáp: <b>♔g1, ♗f3, ♖f3</b>. Cả ba đều là nhượng bộ. Đây là lần đầu ô h1 phải trả giá."},{"at":66,"t":"<b>34 d6</b> — Trắng không đứng yên được: tốt <b>a3</b> đang bị ♖a8 đánh và <b>không quân nào đỡ</b>. Nên Trắng đẩy tốt d thành tốt thông, tạo việc khác. Đen chặn ngay: <b>34…♖d8 35 ♖e1 ♖xd6 36 ♖xe5</b> — tốt d mất, tốt e5 cũng mất, quân lại đều, nhưng Đen đã đổi được cái tốt thông nguy hiểm đó lấy một tốt thường."},{"at":70,"t":"<b>36 ♖xe5</b> — Quân đều nhau. Nhưng Trắng còn một chuyện chưa xử: <b>♗f3 không ai đỡ</b>. Đen chỉ ra ngay bằng <b>36…♖f6!</b>, Xe sang cột f đánh Tượng, và Trắng phải kéo Xe về <b>37 ♖e3</b> để giữ. Con Xe vừa đi vào đúng chỗ nó sẽ chết."},{"at":73,"t":"<b>37…♖xf3!</b> — Đổi Xe lấy Tượng, tức là Đen tự để Trắng hơn chất. Nhưng sau <b>38 ♖xf3 ♗e4</b> thì Xe f3 <b>bị ghim</b> vào Vua h1, không nhúc nhích được. Đưa Xe kia về đỡ, <b>39 ♖c3 ♖f2</b>, thì f3 có hai quân đánh mà chỉ một quân đỡ — vẫn mất."},{"at":79,"t":"<b>40…♔g7</b> và Trắng xin thua. Xe f3 bị <b>♗e4 ghim</b> vào Vua h1, bị ♖f2 và ♗e4 đánh hai lần trong khi chỉ có ♖f8 đỡ được một. Đen doạ <b>41…♗xf3+ 42 ♖xf3 ♖xf3</b>: Trắng còn ba tốt trơ, Đen còn nguyên Xe. Chiếu lẻ cũng không cứu — <b>41 ♖f7+ ♔g8</b> hay <b>41 ♖g8+ ♔xg8</b>, hết chiếu là mất Xe."}]},"5":{"tiv":"Nghĩa vụ khó chịu","ctx":"Mar del Plata 1959, Fischer cầm quân Trắng chống phòng thủ Sicilian. Nước <b>5 c4</b> dựng thế khoá Maroczy: hai tốt c4 và e4 cùng canh ô d5, nên Đen gần như không bao giờ đẩy được …d5 để thở. Rossetto không thua vì một đòn nào, ông thua vì nhận hết nghĩa vụ này tới nghĩa vụ khác — phải giữ tốt a6, rồi phải chặn tốt thông, rồi phải trói Xe vào một ô duy nhất. Fischer đổi hết Hậu từ nước 16, đẩy tốt cánh Hậu, và cuối cùng dồn Đen vào thế không còn nước nào tử tế để đi.","end":"Bài học chính là cách <b>biến ưu thế không gian thành tốt thông</b>: giữ tốt c cho tới khi đủ quân đỡ, rồi b4–c5 phá cấu trúc, rồi d6 chạy. Bài học thứ hai là cách <b>trói quân bằng một tốt</b>: tốt c7 ở nước 32 không tự đi hết được, nhưng nó buộc Xe Đen đứng mãi ở c8 và Mã đứng mãi ở f8 — Trắng thừa quân ở mọi nơi khác trên bàn cờ. Cuối cùng, để ý cách Fischer chọn ô ăn lại ở nước 20: ăn bằng tốt e giữ được tốt c, và tốt c mới là quân thắng ván này.","notes":[{"at":8,"t":"<b>5 c4</b> — Trắng bỏ hẳn tốt d và đổi lấy khoá Maroczy: c4 cùng e4 khống chế ô d5. Đen còn tốt d7 và e6, nhưng muốn giải phóng thì phải đẩy …d5, mà ô đó có hai tốt canh. Cả ván sau đó xoay quanh việc Đen không bao giờ mở được trung tâm."},{"at":9,"t":"<b>5…♕c7</b> — Hậu ra c7 nhìn dọc cột c vào tốt c4. Nhưng c4 đang có <b>♗f1</b> đỡ, nên đây mới là lời nhắc chứ chưa phải đe doạ. Chuyện lớn hơn — ô d5 — vẫn chưa được giải quyết."},{"at":12,"t":"<b>7 ♗d3?</b> — Tượng ra d3 chắn ngay tầm nhìn của ♕d1 xuống cột d, và Mã d4 <b>từ chỗ có một quân đỡ thành không quân nào đỡ</b>. Đen chớp được, đi ♘c6 đánh vào đó, buộc Trắng phải ♗e3. Trên e2 thì Tượng đã không gây ra chuyện này: <b>7 ♗e2 ♘c6 8 ♗e3</b> và mọi thứ đâu vào đấy."},{"at":15,"t":"<b>8…♘xd4?</b> — Đen tự nguyện đổi Mã, và người được lợi là Trắng. Sau <b>9 ♗xd4</b> Tượng đứng ngay giữa bàn, quét cả đường chéo a1–h8 lẫn a7–g1 và ngắm thẳng Mã f6; Đen thì mất quân hoạt động nhất của mình. Trong thế khoá Maroczy, Đen cần giữ quân trên bàn để tìm phản công chứ không phải đổi bớt."},{"at":22,"t":"<b>12 ♘a4</b> — Mã rời trung tâm nhưng đi đúng chỗ: nó đánh vào Tượng c5 và nhắm ô b6. Đen buộc phải xử lý Tượng, và cách nào cũng dẫn tới việc Trắng chiếm thêm nhịp."},{"at":30,"t":"<b>16 ♕b6!</b> — Hậu vào b6 vừa mời đổi Hậu vừa <b>ăn tốt b7 đang trống trơn</b> (không quân Đen nào đỡ nó), mà bản thân ♕b6 lại có ♘a4 đỡ. Nên Đen không có lựa chọn: phải đổi. Đây là kiểu nước Fischer hay dùng — ép đối thủ vào tàn cuộc mà chỉ một bên có kế hoạch. Sau <b>17 ♘xb6</b> Mã còn đụng Tượng d7, lại thêm một nhịp nữa."},{"at":35,"t":"<b>18…♘d7!</b> — Nước phòng ngự tốt nhất trong thế cờ: Mã từ f6 về d7 đánh thẳng vào Mã b6 đang chọc vào trận địa. Rossetto đòi Trắng phải trả lời."},{"at":36,"t":"<b>19 ♘d5!</b> — Fischer không lùi mà nhảy vào giữa. Đếm cho kỹ: d5 bị <b>♗c6 và tốt e6</b> đánh — hai quân; nhưng có <b>♖d1, tốt c4 và tốt e4</b> đỡ — ba quân. Nên Đen ăn thế nào cũng không lời."},{"at":37,"t":"<b>19…♗xd5</b> — Đen nộp Tượng lấy Mã. Ăn bằng tốt cũng đổi hết được: <b>19…exd5 20 exd5 ♗xd5 21 cxd5</b>, quân vẫn đều. Nhưng để ý cái giá — trong đường đó <b>tốt c4 của Trắng biến mất</b>, mà con tốt c ấy chính là quân sẽ thắng ván này."},{"at":38,"t":"<b>20 exd5</b> — Chọn ô ăn lại là điểm mấu chốt cả ván. Ăn bằng tốt e thì tốt mới ở d5 <b>đánh ngay tốt e6</b>, và quan trọng hơn là <b>tốt c4 vẫn còn</b>. Tốt c đó chính là quân sẽ phá cấu trúc Đen mười nước sau. Ăn bằng tốt c thì Trắng chẳng còn gì để đẩy ở cánh Hậu."},{"at":39,"t":"<b>20…e5</b> — Đen đẩy qua mặt thay vì đổi. Đổi ngay <b>20…exd5 21 cxd5</b> thì tốt c của Trắng biến mất, và kế hoạch b4–c5 biến mất theo. Sau …e5 thì trung tâm đông cứng, tốt d6 dính chặt trước tốt d5, và Đen không còn nước đẩy nào ở giữa bàn."},{"at":40,"t":"<b>21 b4</b> — Bắt đầu công việc thật: Trắng có ba tốt a, b, c chọi hai tốt a, b của Đen ở cánh Hậu. Kế hoạch đơn giản là đẩy tới c5, mở cửa cho tốt d5 chạy."},{"at":43,"t":"<b>22…b6</b> — Đen lấy tốt b chặn c4–c5. Nhưng nước này <b>bỏ rơi tốt a6</b>: trước đó a6 còn tốt b7 đỡ, sau …b6 thì không quân nào đỡ nữa. Fischer chỉ vào đúng chỗ đó hai nước sau."},{"at":45,"t":"<b>23…f5?</b> — Đen đẩy tốt ở cánh Vua, nhưng chỗ sắp cháy nằm ở phía kia bàn cờ. Nước này không cản được b4–c5 và cũng không tạo ra đe doạ gì; nó chỉ làm các ô e6 và g6 yếu thêm."},{"at":46,"t":"<b>24 ♖a3!</b> — Xe xếp <b>ngay sau ♗a4</b> trên cột a. Đe doạ rất cụ thể: ♗xd7 (Tượng đi kèm ăn quân, tức là có nhịp) rồi ♖xa6, vì a6 hiện không có quân nào đỡ. Đen phải trả lời <b>24…♘b8</b> — Mã lùi hẳn về ô xuất phát để giữ tốt. Đó là nghĩa vụ khó chịu đầu tiên."},{"at":47,"t":"<b>24…♘b8</b> — Nhìn thì xấu, nhưng thử các cách khác: <b>24…♖a8 25 ♗xd7</b> — Xe rời d8 thì Mã d7 hết người đỡ, Trắng ăn không một quân. <b>24…♘c5 25 bxc5</b>, tốt b ăn luôn. Đen không còn nước tử tế nào."},{"at":48,"t":"<b>25 c5!</b> — Phá đúng lúc Mã Đen đang kẹt ở b8. Ăn kiểu nào cũng về chung một thế: <b>25…bxc5 26 bxc5 dxc5 27 ♖xc5</b> và <b>25…dxc5 26 bxc5 bxc5 27 ♖xc5</b> ra đúng một thế cờ giống hệt nhau. Ở thế đó tốt d6 của Đen đã biến mất, nên <b>d5 thành tốt thông thật</b> — Đen không còn tốt nào ở cột c hay cột d để chặn nó."},{"at":56,"t":"<b>29 d6!</b> — Tốt thông chạy, và nó <b>không ăn được</b>: <b>29…♖xd6 30 ♖xb8</b> lấy luôn Mã, vì Mã b8 chỉ được chính Xe d8 đó đỡ. Đen đành đưa Mã về d7 chặn đường."},{"at":59,"t":"<b>30…♘f8</b> — Mã rút khỏi d7, nơi nó đang bị ♗a4 và ♖c7 đánh hai lần. Về f8 thì nó vẫn canh được ô d7 và ô e6, nhưng từ giờ nó không còn đi đâu được nữa — đây là chỗ Mã sẽ đứng cho tới hết ván."},{"at":60,"t":"<b>31 ♖bb7</b> — Hai Xe cùng vào hàng 7. ♖c7 có cả tốt d6 lẫn ♖b7 đỡ, còn ♖f7 của Đen chỉ có mỗi Vua g7. Đen đổi cho xong: <b>31…♖xc7 32 dxc7</b>. Đếm quân thì <b>vẫn đều</b> — nhưng con tốt vừa lên c7 chỉ còn một ô nữa là phong hậu, và từ đây Xe Đen phải canh nó suốt phần còn lại của ván."},{"at":64,"t":"<b>33 ♗b3!</b> — Tượng lên đường chéo a2–g8, phủ một lúc <b>e6, f7 và g8</b>. Ô e6 là ô duy nhất Mã f8 còn có thể nhảy ra; lấy nốt nó đi thì Mã hết cửa. Bây giờ Xe Đen dính hàng 8, Mã dính f8, còn Trắng rảnh tay đi bất cứ đâu."},{"at":72,"t":"<b>37 hxg4</b> và Đen xin thua. Đếm quân thì <b>bằng nhau</b>, nhưng thử từng nước của Đen: <b>♖xc7 38 ♖xc7+</b> mất nguyên một Xe lấy một tốt; <b>…♘e6 38 ♗xe6</b> mất Mã; còn Xe c8 thì bị chính tốt c7 chặn cột, chỉ đi ngang được trong hàng 8 để canh ô phong. Đen còn mỗi Vua và hai tốt là đi lại được — thực chất là chơi thiếu hai quân."}]},"6":{"tiv":"Một sơ suất nhỏ","ctx":"Vẫn Mar del Plata 1959, lần này là khai cuộc Ruy Lopez đóng. Shocron chọn biến Chigorin: đưa Mã ra a5 đuổi Tượng rồi đẩy …c5 để giành đất cánh Hậu, đổi lại quân Đen hơi rời rạc. Fischer dàn quân theo bài Ruy Lopez cổ điển — ♘b1–d2–f1–e3 — rồi chuyển sang cánh Vua, nhưng đó chỉ là nửa đầu câu chuyện: khi Đen dồn hết quân về giữ Vua, Fischer <b>đổi hướng sang cánh Hậu</b>, mở cột a và cột b bằng tốt. Ván cờ kết thúc bằng một đòn thí chất khi Đen buông lỏng ô e6 đúng một nước.","end":"Điều đáng học nhất ở đây không phải đòn kết thúc mà là <b>cách đổi cánh</b>. Fischer dựng sức ép ở cột h thật, ép Đen kéo Mã về tận f8 để giữ nhà, rồi mới mở cột a và cột b — lúc ấy quân phòng thủ của Đen đã đứng sai chỗ và không quay lại kịp. Chi tiết kỹ thuật thứ hai: <b>chọn hướng ăn lại</b>. Ở nước 19, ăn bằng tốt h thay vì tốt g mở ra cột h, và cột h đó là thứ khiến Đen phải rút quân khỏi cánh Hậu. Cuối cùng, hãy nhớ mẫu Xe–Tượng phối hợp ở nước 40: một Tượng đâm vào vừa đánh Hậu vừa đỡ Xe của mình.","notes":[{"at":16,"t":"<b>9 h3</b> — Nước gần như bắt buộc trong Ruy Lopez đóng. Không có nó thì Đen chơi <b>…♗g4</b>, và con Tượng đó đứng đúng trên đường chéo g4–f3–e2–d1: ♘f3 bị dính giữa Tượng và ♕d1, Trắng khó đẩy d4 cho tử tế. Một nhịp bỏ ra để mua sự yên tâm cho cả trung cuộc."},{"at":17,"t":"<b>9…♘a5</b> — Biến Chigorin. Mã đuổi Tượng b3 để dọn đường cho …c5, chiếm đất cánh Hậu. Giá phải trả là Mã đứng ở rìa bàn cờ, và cả ván này nó sẽ mất rất nhiều nước để về lại chỗ có việc."},{"at":27,"t":"<b>14…g6</b> — Bắt buộc: cả ♘e3 và tốt e4 đều canh ô f5, mà quân duy nhất của Đen giữ ô đó là ♗d7 — nếu để Trắng cắm Mã vào f5 thì Đen ngạt thở. Nhưng đẩy g6 rồi thì các ô đen f6 và h6 quanh Vua yếu hẳn, và cột h sau này mở ra sẽ chĩa thẳng vào chỗ đó."},{"at":28,"t":"<b>15 dxe5</b> — Trắng chủ động gỡ căng thẳng ở trung tâm. Sau <b>15…dxe5</b> cột d mở toang (Đen chiếm ngay bằng …♖ad8), tốt e5 của Đen thành cố định, và Mã a5 vẫn đứng ngoài rìa: từ a5 nó chỉ còn b7, c6, c4, b3 — mà b3 thì có hai tốt Trắng canh."},{"at":30,"t":"<b>16 ♘h2</b> — Mã lùi về góc, nghe kỳ nhưng đó là con đường: <b>f3–h2–g4</b>. Ô f5 đã bị …g6 chặn nên Trắng đổi đích sang g4, và từ g4 Mã đánh đúng vào <b>f6 và h6</b> — hai ô đen mà nước …g6 vừa làm yếu."},{"at":36,"t":"<b>19 hxg4</b> — Chọn hướng ăn lại rất có ý. Ăn bằng tốt h thì <b>cột h mở ra cho Trắng</b>, và tốt mới ở g4 canh f5 với h5. Sáu nước sau Xe sẽ về h1 đúng cột này."},{"at":38,"t":"<b>20 g5!?</b> — Tốt lên g5 khoá cứng cánh Vua: nó lấy ô f6 và h6 của quân Đen, đồng thời chừa ô g4 cho Mã. Đổi lại tốt g5 sẽ không lùi được nữa, nên đây là một cam kết dài hạn."},{"at":39,"t":"<b>20…♘c4</b> — Chuyến về nhà bắt đầu. Ở c4 Mã có <b>tốt b5 và ♗e6 đỡ hai lần</b> trong khi chỉ ♘e3 đánh một lần, nên nó đứng được. Nhưng đây mới là chặng đầu của hành trình a5–c4–b6–d7–f8, và Đen sẽ trả bằng thời gian."},{"at":43,"t":"<b>22…♘b6!</b> — Shocron hiểu vấn đề: Mã đi tiếp về nhà để trực tiếp giữ Vua. Đây là cách phòng thủ đúng, nhưng cả chuyến mất bốn nước, và trong bốn nước đó Trắng được làm gì tuỳ ý ở phía bên kia."},{"at":45,"t":"<b>23…c4!</b> — Tốt lên c4 lấy hai ô <b>b3 và d3</b> của Tượng c2 và giành đất cánh Hậu. Mặt trái: tốt c4 bị tốt c3 chặn cứng phía trước và không còn tốt b hay d nào đẩy lên đỡ, nên từ giờ nó đứng nguyên một chỗ cho tới hết ván."},{"at":48,"t":"<b>25 ♖h1</b> — Sau khi Vua bước sang g2, Xe từ e1 về cột h. Tốt h7 bây giờ bị ♖h1 nhòm mà chỉ có Vua g8 đỡ. Sức ép là thật, và nó buộc Đen trả lời <b>25…♘f8</b> — quân phòng thủ cuối cùng vào chỗ, ở đầu kia bàn cờ."},{"at":50,"t":"<b>26 b4</b> — Bắt đầu phần thứ hai của kế hoạch. Tốt b4 chặn cứng tốt b5 và lấy ô c5, nên cấu trúc cánh Hậu của Đen đông lại: c4 đã dính trước c3, b5 nay dính trước b4. Còn Trắng thì bày sẵn <b>a2–a4</b> để mở cột."},{"at":58,"t":"<b>30 a4!</b> — Đây là nước đổi cánh thật sự. Tốt a4 đánh vào b5 (b5 chỉ có ♕a5 đỡ); Đen giữ được tốt nhưng không giữ được <b>cột a</b>. Và toàn bộ quân giữ nhà của Đen — Mã f8, Tượng e7 — đang ở đầu kia bàn cờ."},{"at":61,"t":"<b>31…♕xb5</b> — Đổi xong tốt, và bây giờ nhìn lại bàn cờ: <b>cột a lẫn cột b đều không còn một con tốt nào</b>. Đúng hai cột mà Xe Trắng đang chuẩn bị vào."},{"at":62,"t":"<b>32 ♖hb1</b> — Xe rời cột h quay về cánh Hậu. Sức ép ở cột h đã làm xong việc của nó: kéo quân Đen sang một bên. Bây giờ hai Xe Trắng chiếm cả hai cột trống, còn Đen chỉ có ♖a8 tranh được cột a."},{"at":64,"t":"<b>33 ♖b6!</b> — Xe đâm vào đánh Hậu và <b>không ăn được</b>, vì ♖b6 có ♗e3 đỡ: <b>33…♕xb6 34 ♖xa8 ♖xa8 35 ♗xb6</b> — Trắng đổi Xe lấy Hậu. Đen đành lùi Hậu về c7."},{"at":66,"t":"<b>34 ♖ba6</b> — Ép đổi một cặp Xe trên cột a. Sau <b>34…♖xa6 35 ♖xa6</b> quân vẫn đều, nhưng con Xe còn lại đứng ở a6 <b>cắt ngang hàng 6 và nhòm thẳng tốt g6</b>, còn Mã f8 của Đen thì vẫn chưa đi được đâu."},{"at":71,"t":"<b>36…♘e6</b> — Mã cuối cùng cũng rời f8. Nhưng nó dừng ở ô mà <b>♕g4 và ♖a6 cùng nhìn vào, trong khi chỉ có tốt f7 đỡ</b> — hai đánh một. Chưa mất ngay, nhưng từ giờ mọi nước của Đen đều phải nhớ tới ô e6."},{"at":75,"t":"<b>38…♕d8?</b> — Sơ suất nhỏ mà cả tiêu đề chương nói tới. Đen quên mất chuyện đang treo ở e6: Mã bị <b>♕g4 và ♖c6 đánh hai lần, chỉ tốt f7 đỡ một lần</b>. Nước chắc chắn là <b>38…♖b6 39 ♖xb6 ♕xb6</b> — đổi một cặp Xe, quân vẫn đều, và ♖c6 hết chỗ đứng. Sau ♕d8 thì Fischer ăn ngay."},{"at":76,"t":"<b>39 ♖xe6!</b> — Thí chất: Xe đổi lấy Mã. Ăn lại thì <b>39…fxe6 40 ♕xe6+</b> — tấm khiên f7 biến mất, Vua chỉ còn ba ô f8, g7, h8, mà ♗a4 thì đang phủ sẵn cả <b>d7 và e8</b>. Shocron không dám vào đó."},{"at":77,"t":"<b>39…♕c8!</b> — Không ăn mà đánh: từ c8 Hậu nhìn xuyên qua d7 vào <b>♖e6</b>. Bây giờ Xe e6 bị <b>tốt f7 và ♕c8 đánh hai lần, chỉ có ♕g4 đỡ một</b> — Đen tính lấy lại chất ngay nước sau."},{"at":78,"t":"<b>40 ♗d7!</b> và Đen xin thua. Một nước làm ba việc: <b>đánh ♕c8</b>, <b>bịt đường chéo c8–e6</b>, và <b>đỡ chính ♖e6</b>. Đen hết cách — <b>40…♕xd7 41 ♖xg6+ hxg6 42 ♕xd7</b>, Trắng lấy lại Hậu và hơn hẳn quân; <b>40…fxe6 41 ♗xc8 ♖xc8</b> thì cũng thiếu quân y như vậy."}]},"7":{"tiv":"Kiêu thì ngã","ctx":"Zurich 1959, Olafsson cầm Trắng chống phòng thủ Ấn Độ Vua. Trắng đóng trung tâm bằng <b>7 d5</b>, và từ đó hai bên chơi ở hai đầu bàn cờ khác nhau: Trắng nhập thành cánh Hậu rồi lấy đất cánh Vua bằng g4–h3–h4, Đen đẩy …a6, …c5, …b5 ở phía ngược lại. Olafsson đi rất mạnh trong hai chục nước đầu và Fischer thậm chí phải để Mã lang thang mất mấy nhịp. Nhưng khi Trắng dồn quân đi ăn tốt h6 để mở nốt Vua Đen, ông bỏ qua một nước Xe đi ngang rất giản dị, và cả thế công sập.","end":"Hai điều đáng mang đi. Thứ nhất: <b>Xe phòng ngự theo hàng ngang</b>. Nước 26…♖a7 không đẹp mắt gì nhưng nó là toàn bộ lời giải — Xe từ cột a với sang giữ g7 qua hàng 7, thứ mà cả hai người đều dễ bỏ sót vì ta quen nghĩ Xe giữ nhà theo cột. Thứ hai: <b>tốt đi xa quan trọng hơn đếm quân</b>. Từ nước 25 tới hết ván, hai bên luôn bằng quân, nhưng tốt f3 của Đen không bao giờ bị ăn và nó lần lượt đẩy Xe khỏi g1, khoá Mã vào f1, rồi cùng tốt e chạy song song tới đích. Khi có hai tốt liền nhau ở hàng 2 mà đối thủ chỉ còn Xe với Mã, đó là hết ván.","notes":[{"at":19,"t":"<b>10…♕e8</b> — Trước nước này Mã f6 gần như bị trói: Tượng h4 xuyên qua g5–f6–e7 tới Hậu d8, Mã mà nhúc nhích là mất Hậu. Thử <b>10…♘h5</b> mà xem: <b>11 ♗xd8</b>, Đen mất Hậu không lấy lại được. Đưa Hậu sang e8 vừa gỡ chuyện đó vừa đỡ sẵn cho đòn phá …f5, thứ mà mọi ván Ấn Độ Vua đều hướng tới."},{"at":20,"t":"<b>11 g4!?</b> — Trắng lấy đất và, quan trọng hơn, <b>chặn luôn …f5</b>: bây giờ ô f5 có cả tốt e4 lẫn tốt g4 canh, trong khi Đen mới chỉ có tốt g6 đỡ. Đen bị tước mất kế hoạch quen thuộc và phải tìm đường khác."},{"at":23,"t":"<b>12…♘g5?</b> — Mã ra chỗ trông thì hung hăng nhưng đó là ô Trắng đuổi được. Chú ý: lúc này Mã g5 đang bị chính Tượng h4 nhòm, chỉ có tốt h6 đỡ. Trắng chỉ cần dọn Tượng khỏi h4 rồi đẩy tốt h là Mã hết chỗ. Fischer sẽ mất mấy nhịp vì nước này — Mã đi h7–g5 rồi lại về h7 — và trong cờ đóng thì mấy nhịp ấy là cả một thế công."},{"at":24,"t":"<b>13 h3!</b> — Nhỏ mà chắc: tốt h3 đỡ thêm cho tốt g4. Để ý ô h4 đang bị chính Tượng Trắng chiếm, nên nước đẩy h3–h4 đuổi Mã chỉ chạy được sau khi Tượng lui về. Đúng sáu nước sau Trắng làm y như thế: <b>18 ♗f2</b> rồi <b>19 h4</b>."},{"at":26,"t":"<b>14 0-0-0</b> — Hai Vua nhập thành hai phía, nghĩa là ai đẩy tốt nhanh hơn thì thắng. Từ đây không còn chỗ cho nước hoà hoãn: Trắng đánh sang cánh Vua, Đen đánh sang cánh Hậu."},{"at":29,"t":"<b>15…♘a4</b> — Nước nhỏ mà có việc. Đen mời đổi Mã, và sau <b>16 ♘xa4 ♗xa4</b> thì Tượng đứng a4 <b>nhắm thẳng vào Hậu c2</b> qua ô b3 đang trống. Trắng buộc phải bịt bằng <b>17 b3</b> — nghĩa là chính Đen ép Trắng phải đẩy tốt ngay trước mặt Vua mình. Từ giờ hai ô đen b2 và c3 cạnh Vua Trắng không còn tốt nào canh nữa."},{"at":35,"t":"<b>18…c5!</b> — Fischer đóng nốt trung tâm theo ý mình. Tốt c5 lấy ô b4 và d4 của quân Trắng, và mở đường cho …b5 đánh vào chỗ Vua Trắng đang đứng. Nhớ lại nước 15…♘a4 đã ép Trắng chơi b3 — nên các ô đen b2 và c3 cạnh Vua Trắng nay trống trơn, đúng chỗ Tượng g7 nhìn tới."},{"at":36,"t":"<b>19 h4</b> — Bây giờ Tượng đã về f2, tốt h mới đi được, và Mã g5 hết đường. Ăn tốt cũng không xong: <b>19…♘xf3 20 ♘xf3</b>, Đen mất Mã chỉ được một tốt. Nhảy ra giữa cũng thế: <b>19…♘e6 20 dxe6 ♗xe6</b>, vẫn thiếu một quân. Mã đành lộn về h7 — ba nước đi cho một vòng tròn."},{"at":40,"t":"<b>21 ♘b1?</b> — Mã đi lùi về ô xuất phát để tính đường sang c3. Ý thì hiểu được, nhưng nó tốn hai nước ở đúng lúc Đen sắp phá, và nó bỏ hẳn cánh Vua. Đây là chỗ thế cờ đổi chủ."},{"at":41,"t":"<b>21…f5!</b> — Đòn phá của Ấn Độ Vua rốt cuộc cũng tới. Đếm cho kỹ: tốt f5 bị tốt e4 và g4 đánh, nhưng có tốt g6, Tượng d7 và Xe f8 đỡ — <b>ba đỡ hai</b>, nên Đen mở được cửa. Ván đi tiếp <b>22 gxf5 gxf5 23 exf5 ♗xf5</b>, quân vẫn bằng nhau nhưng mọi đường ngang dọc đều mở về phía Trắng."},{"at":47,"t":"<b>24…e4!</b> — Nước then chốt. Tốt e rời e5 và <b>mở toang đường chéo dài cho Tượng g7</b>: từ g7 nó nhìn thẳng qua d4–c3–b2 tới sát Vua Trắng ở c1, và hai ô b2, c3 ấy đúng là chỗ không còn tốt canh từ nước 17. Cùng lúc tốt e4 chọc vào giữa đội hình Trắng."},{"at":48,"t":"<b>25 ♖dg1</b> — Trắng dồn cả hai Xe vào cột g, và điều đó lập tức <b>trói Tượng g7</b>: Tượng đứng đúng giữa Xe g1 và Vua g8 nên không được rời cột. Nhớ kỹ chi tiết này — hai nước nữa nó là toàn bộ nội dung ván cờ."},{"at":49,"t":"<b>25…exf3?</b> — Vội. Đen tự gỡ căng thẳng, và Trắng đáng lẽ chỉ cần <b>26 ♗xf3</b> lấy lại tốt bằng Tượng e2 là quân bằng nhau và thế cờ còn đứng được. Fischer sẽ rất may vì đối thủ chọn cách khác."},{"at":50,"t":"<b>26 ♗xh6?</b> — Trắng bỏ tốt f3 để đi ăn tốt h6, tin rằng Tượng g7 sập thì Vua Đen trần trụi. Ý tưởng có cơ sở thật: Tượng g7 đang bị trói vào cột g nên <b>không ăn lại được ở h6</b>, và nếu Đen đi nước vu vơ thì <b>27 ♗xg7</b> là ăn không, vì <b>27…♔xg7 phạm luật</b> — Xe g1 đang canh ô g7. Nhìn thì rất thuyết phục — và đó chính là chỗ nguy hiểm."},{"at":51,"t":"<b>26…♖a7!</b> — Câu trả lời cả ván. Xe từ a8 xuống a7 rồi <b>với ngang hàng 7 sang giữ g7</b>. Đếm lại: g7 bị Xe g1 và Tượng h6 đánh, được Xe a7 và Vua g8 đỡ — vừa đủ, và quan trọng là <b>Xe ăn lại được ở g7 trong khi Vua thì không</b>. So với nước bất kỳ khác, chẳng hạn <b>26…♘f6 27 ♗xg7</b> và Đen không có gì ăn lại Tượng. Ván tiếp <b>27 ♗xg7 ♖xg7 28 ♖xg7+ ♔xg7</b>: đổi sạch, Trắng hết quân tấn công, còn tốt f3 vẫn nằm trong nhà Trắng."},{"at":56,"t":"<b>29 ♗d3</b> — Chỗ này Trắng còn một cơ hội cuối mà không lấy: <b>29 ♗xf3</b> ăn đứt con tốt nguy hiểm ấy, Tượng e2 vẫn đang nhòm nó và Đen không có quân nào đỡ. Olafsson chọn đưa Tượng sang d3 để đánh h7 và giữ đường tấn công. Từ nước này trở đi tốt f3 không bao giờ bị ăn nữa."},{"at":61,"t":"<b>31…♕e5</b> — Chặn chiếu bằng cách mời đổi Hậu, và Hậu e5 có tốt d6 đỡ nên Trắng không từ chối được. Đây là kỹ thuật đơn giản mà rất quý: khi mình có tốt mạnh còn Vua đối phương thì trống, hãy đổi hết quân nặng — tàn cuộc là nơi tốt đó nói chuyện."},{"at":69,"t":"<b>35…f2</b> và Xe Trắng bị đóng đinh vào hàng 1. Tốt f2 ăn chéo xuống e1 và g1 nên Xe g1 phải đi, mà đi đâu cũng phải tiếp tục canh ô f1: <b>36 ♖g2? f1♕</b> là xong ngay. Trắng chọn <b>36 ♖h1</b>, nơi Xe chỉ còn mỗi việc ngồi nhìn ô f1. Một tốt vừa vô hiệu hoá một Xe."},{"at":72,"t":"<b>37 ♔d1</b> — Vua đi cứu Xe, vì Xe đã không được rời hàng 1. Nhưng tốt Đen còn con thứ hai: <b>37…e3</b> đánh luôn Mã d2, và Mã hầu như chỉ có f1 — <b>38 ♘f3? ♖xf3</b> mất quân, còn <b>38 ♘b3 e2+</b> là tốt đã chiếu và sát ô phong. Nên Mã phải về f1 ngồi cạnh Xe, hai quân Trắng canh một ô."},{"at":77,"t":"<b>39…♘h5!</b> — Mã sang h5 lấy hai ô g3 và f4 của Vua Trắng, nên Vua không vòng lên chặn tốt e được nữa. Ăn tốt e3 cũng không xong: <b>40 ♘xe3 ♖xe3+ 41 ♔xe3 f1♕</b> — Đen lên Hậu, hơn hẳn."},{"at":79,"t":"<b>40…e2</b> và Trắng xin thua. Tốt e2 đánh Mã f1, mà Mã không ăn được nó (từ f1 Mã chỉ tới d2, e3, g3, h2) và cũng không đi đâu được — Mã nhúc nhích thì <b>41…f1♕+</b>. Còn <b>41 ♔xf2 e1♕+</b> cũng lên Hậu có chiếu. Đếm quân vẫn bằng nhau y như hai chục nước trước, nhưng hai tốt liền nhau ở hàng 2 đã quyết định xong."}]},"8":{"tiv":"Ăn chắc mặc bền","ctx":"Zurich 1959, Fischer 16 tuổi cầm Trắng gặp Paul Keres. Khai cuộc là <b>Ruy Lopez</b> biến Chigorin: Đen đẩy Mã ra a5 đuổi Tượng b3 rồi dựng tốt c5–b5 ở cánh Hậu, đổi lại Trắng được trung tâm d4+e4. Fischer đổi một Mã lấy tốt g7 để lột mái nhà Vua Đen, nhưng Keres phòng thủ rất chuẩn và giữ được hơn một tốt. Từ nước 36 trở đi là tàn cuộc Xe + Tượng cùng màu ô kéo dài hơn bốn mươi nước, và Fischer thắng ở đó — bằng kỹ thuật, không bằng đòn.","end":"Bài học nằm ở nửa sau ván cờ chứ không ở đòn phối hợp. Fischer bị hụt một tốt sau đợt tấn công, và thay vì cố tìm thêm đòn, ông đổi hết quân nặng rồi <b>đi ăn tốt ở cánh không có ai giữ</b>. Trong tàn cuộc Xe + Tượng cùng màu ô, hai thứ quyết định là Vua đi bộ vào giữa sớm hay muộn, và tốt của mình có bị treo ở ô cùng màu Tượng đối phương không. Keres thua vì đưa Tượng đi ăn tốt biên rồi bỏ mặc tốt thông d4, và vì đẩy tốt h ra chỗ Xe Trắng với tới, còn Fischer chỉ cần kiên nhẫn dồn hết tốt về một cánh.","notes":[{"at":17,"t":"<b>9…♘a5</b> — Mã ra rìa bàn cờ để đuổi Tượng b3, ý đồ chính của biến Chigorin. Đen chấp nhận đưa Mã ra chỗ xấu trong vài nước để đổi lấy quyền dựng tốt c5–b5 ở cánh Hậu."},{"at":24,"t":"<b>13 cxd4</b> — Trắng ăn lại bằng tốt c chứ không bằng Mã, giữ nguyên cặp tốt <b>d4 + e4</b> chiếm cả trung tâm. Cái giá phải trả: tốt d4 lúc này chỉ còn Mã f3 giữ, trong khi tốt e5 của Đen đã chĩa vào nó."},{"at":29,"t":"<b>15…♘c6</b> — Mã từ a5 quay về c6, chấm dứt chuyến đi rìa và nhắm luôn vào d4. Bây giờ d4 bị hai quân đánh (tốt e5 và Mã c6) mà chỉ có một Mã f3 giữ, nên Trắng phải lo tiếp viện."},{"at":32,"t":"<b>17 ♘f5?</b> — Mã nhảy vào ô tiền tiêu, nhìn thì oai nhưng đếm kỹ thì không doạ gì. Từ f5 nó đánh e7 và d6: <b>e7 đã có ba quân giữ</b> (Mã c6, Hậu c7, Xe e8) và <b>d6 có hai</b> (Hậu c7, Tượng e7). Một đánh ba, một đánh hai — Đen chỉ cần lùi Tượng một nước là Mã f5 hết việc, còn Trắng thì mất nhịp."},{"at":41,"t":"<b>21…♖xc1?</b> — Đen đổi đi chính quân chủ động nhất của mình, và tệ hơn là Tượng Trắng ở g5 được mời về <b>c1</b>, nơi nó nhìn thẳng lên đường chéo c1–h6. Đáng lẽ cứ ăn ở giữa trước: <b>21…exd4 22 ♖xc8 ♗xc8</b> — Xe vẫn đổi, nhưng lần này Tượng Đen về đúng <b>c8</b> và từ đó nó <b>giữ ô d7</b>. Cả đòn phối hợp của Trắng sau đây dựa vào việc ăn Mã d7 miễn phí; với Tượng ở c8 thì <b>23 ♘h6+ gxh6 24 ♕g4+ ♔h8 25 ♕xd7?? ♗xd7</b> chỉ là mất Hậu."},{"at":44,"t":"<b>23 ♘h6+!</b> — Trắng bỏ qua tốt d4 đang không ai giữ (cả Hậu d1 lẫn Mã f5 đều ăn được) để đổi Mã lấy tốt g7. Lý do rất cụ thể: Mã d7 của Đen <b>không có một quân nào giữ</b>, nên sau gxh6 thì ♕g4+ vừa chiếu Vua vừa ngắm d7 trên cùng một đường chéo. Từ chối cũng không xong: <b>23…♔h8 24 ♘xf7+</b>, Trắng chiếu và ăn thêm tốt."},{"at":48,"t":"<b>25 ♕xd7</b> — Hậu nhặt lại Mã. Kết quả cả loạt đổi quân: vật chất Đen vẫn hơn một tốt, nhưng Vua Đen ngồi trần với hai tốt h chồng nhau, còn Trắng có hai Tượng đang chờ mở đường."},{"at":49,"t":"<b>25…♗d5!</b> — Nước phòng thủ đúng chỗ. Trước đó tốt <b>f7 đang bị Hậu d7 ăn không</b>, chẳng ai đỡ. Tượng từ b7 sang d5 nối đường chéo d5–e6–<b>f7</b>, thế là f7 có người giữ; tiện thể nó chặn luôn tốt e4. Trong thế bị tấn công, tìm nước vừa đỡ vừa chặn bao giờ cũng hơn nước chỉ chạy."},{"at":53,"t":"<b>27…f5!</b> — Keres không lùi mà dựng lại tường: tốt f5 cùng Xe e5 và Tượng d5 khoá chặt tốt e4 của Trắng và che ô g6. Đây là cách phòng thủ đúng — trả lại một chút thế chủ động để giữ vật chất."},{"at":55,"t":"<b>28…♖e8</b> — Xe phải lùi, vì <b>28 ♗f4</b> vừa đánh nó. Tham tốt là hỏng: <b>28…♖xe4 29 ♗xe4 ♗xe4 30 ♕xe4</b> — Đen đưa Xe và Tượng lấy về một Tượng với một tốt, thiếu hẳn một chất."},{"at":62,"t":"<b>32 ♗xh6</b> — Chính con Tượng đã lùi về c1 ở nước 22 nay ăn tốt h6. Đen bắt lại được bằng Tượng f8, nhưng sau khi đổi hết Trắng gỡ lại đúng cái tốt đã mất, và bàn cờ trống dần đúng ý Trắng."},{"at":66,"t":"<b>34 ♕h4!</b> — Hậu sang h4 làm hai việc một lúc: nhòm tốt <b>h7</b> (chỉ có Vua h8 đỡ) và đứng chắn đường chéo d8–h4 để mời đổi Hậu. Đen không lảng được: <b>34…♕g7 35 ♕d8+</b> là chiếu ngay. Keres đành <b>34…♕f6</b>, và Trắng đổi luôn."},{"at":69,"t":"<b>35…♖xf6</b> — Đổi Hậu xong, còn lại tàn cuộc Xe + Tượng, hai Tượng <b>cùng màu ô trắng</b>. Đen hơn một tốt và có tốt thông d4, nhưng tốt Đen rải ở cả hai cánh nên khó giữ."},{"at":71,"t":"<b>36…♔g7!</b> — Việc đầu tiên trong tàn cuộc là đưa Vua ra khỏi góc. Vua đi bộ vào giữa vừa là quân đánh vừa là quân giữ; ai để Vua nằm im ở hàng cuối là người thua nhịp."},{"at":82,"t":"<b>42 ♖xd6</b> — Đen vừa cho không tốt d6 để đổi lấy hoạt động (Vua tiến ra e5, Tượng vào e6). Đây là chỗ đổi chiều: Trắng đã ăn xong a6 và d6, từ chỗ thiếu một tốt nay thành <b>hơn một tốt</b>."},{"at":94,"t":"<b>48 ♖f5?</b> — Bỏ mất một tốt cho không. Lúc này <b>48 ♖xh7!</b> ăn được: h7 bị Xe h5 và Tượng b1 cùng nhắm, chỉ có Xe c7 đỡ, nên <b>48…♖xh7 49 ♗xh7</b> là Trắng hơn hai tốt. Sau ♖f5 Đen kịp đưa Xe xuống c1 quấy rối và ván cờ còn kéo thêm ba chục nước."},{"at":105,"t":"<b>53…♗xa2?</b> — Nhìn thì là ăn không một tốt, thật ra chỉ là đổi: tốt <b>b5 lúc đó đã bị Tượng d3 nhắm mà chẳng có ai đỡ</b>, nên <b>54 ♗xb5</b> lấy lại ngay. Cái mất thật nằm chỗ khác — Tượng dạt ra tận a2, bỏ mặc tốt d4, và tốt d4 cũng đang không ai giữ. Bốn nước sau Vua Trắng bước vào ăn nó (57 ♔xd4)."},{"at":109,"t":"<b>55…h6?</b> — Đẩy tốt để đuổi Xe g5, nhưng đuổi vào đúng chỗ Xe muốn: <b>56 ♖h5</b> và bây giờ tốt h6 bị đánh mà Vua Đen ở tận d6 không sao với tới. Ba nước sau Trắng ăn nó có chiếu (58 ♖xh6+). Tốt biên trong tàn cuộc nên để yên ở hàng 7 chừng nào Vua chưa về kịp."},{"at":118,"t":"<b>60 ♗a6?</b> — Tượng đi lạc một nhịp. Việc cần làm là đưa Tượng lên đường chéo <b>c8–h3</b> để đỡ tốt h3, và từ b5 có sẵn <b>60 ♗d7</b> làm được ngay trong một nước. Đi qua a6 thì phải mất hai nước — đúng như Fischer sửa lại ở nước sau."},{"at":120,"t":"<b>61 ♗c8!</b> — Tượng lùi hẳn về c8 để đứng trên đường chéo c8–h3, tức là <b>giữ tốt h3</b> và cả ô g4. Xe Đen hết chỗ chọc; từ đây Trắng rảnh tay đổi hết."},{"at":128,"t":"<b>65 ♖xg6!</b> — Đổi nốt Xe. Còn lại Vua + Tượng + hai tốt f và h chống Vua + Tượng, hai Tượng cùng ô trắng. Hai tốt đi hai cột cách nhau, mà Tượng thì chỉ chặn được một đường."},{"at":160,"t":"<b>81 f6</b> — Hai tốt f6 và h6 đứng sát nhau, cả hai đều có Tượng g6 đỡ, Vua g5 kèm sát, Vua Đen bị dồn vào góc. Điểm chết nằm ở màu ô: <b>ô phong h8 là ô đen, còn Tượng Đen chỉ đi ô trắng</b> — nó không bao giờ chặn được tốt h. Chỉ Vua Đen giữ được h8, mà tốt f thì đuổi Vua đi: chẳng hạn <b>81…♔f8 82 h7</b> và tốt lên Hậu (82…♗d5 83 h8♕+). Đen xin thua."}]},"9":{"tiv":"Miếng đến miệng còn rơi","ctx":"Vẫn ở Zurich 1959, lần này Fischer cầm Đen chơi <b>Sicilian</b> biến Najdorf trước Walther. Trắng nhập thành cánh Hậu rồi lùa cả loạt tốt f và g sang cánh Vua, trong khi Vua Đen còn kẹt ở giữa bàn. Đợt tấn công lên tới đỉnh với ♘d5 và ♘c6+, và Trắng đã có thế thắng rõ với một tốt đứng ở f7 chỉ cách ô phong cấp một bước. Rồi một nước Xe đi sai chỗ ở nước 37 làm tan hết, và ván cờ rơi vào tàn cuộc Tượng khác màu ô — hòa.","end":"Hai điều đáng nhớ. Thứ nhất, cách Trắng phá thế: <b>f5–f6</b> nêm một tốt vào ngay cạnh Vua Đen, rồi ♘d5 và ♘c6+ đổi quân để dựng tốt c6 sát nách Vua — tấn công không phải là dồn quân bừa mà là mở đúng một cửa. Thứ hai, và quan trọng hơn cho người học: thế thắng vẫn phải <b>giữ cái đang trói đối phương</b>. Xe ở d8 đang khoá chặt Tượng f8 vào ô phong cấp; bỏ nó đi ăn một tốt biên là trả tự do cho toàn bộ quân Đen. Cuối cùng ô phong cấp b8 là <b>ô đen</b>, đúng màu Tượng Đen và không bao giờ là màu Tượng Trắng — Tượng khác màu ô cứu Fischer.","notes":[{"at":16,"t":"<b>9 0-0-0</b> — Hai bên nhập thành khác cánh, nghĩa là từ giờ ai đẩy tốt nhanh hơn thì người đó tấn công. Trắng đã có f4 và Tượng g5, đường lùa tốt g4–g5 rồi f5 nằm sẵn."},{"at":20,"t":"<b>11 ♗xf6</b> — Đổi Tượng lấy Mã. Nghe thì thiệt cặp Tượng, nhưng Mã f6 là quân duy nhất giữ ô e4 và cản bước tốt g. Bỏ nó đi thì loạt tốt của Trắng chạy thẳng."},{"at":24,"t":"<b>13 ♔b1</b> — Nước dọn nhà quen thuộc của thế nhập thành cánh Hậu: Vua bước khỏi cột c trước khi Xe Đen ra đó. Đúng một nước sau Đen mới đưa Xe về c8 — lúc ấy Vua đã không còn đứng trên cùng cột với nó nữa."},{"at":25,"t":"<b>13…♖c8?</b> — Xe ra cột c là nước tự nhiên, nhưng Vua Đen <b>vẫn còn ở e8</b> và trong hệ này thời gian là tất cả. Đen cần nhập thành hoặc đẩy …b4 ngay, chứ không phải xếp quân cho đẹp."},{"at":29,"t":"<b>15…♘b6?</b> — Mã chạy hẳn sang cánh Hậu đúng lúc bão sắp nổ ở cánh Vua. Sau nước này không còn quân Đen nào canh các ô e5/f6, và Trắng khai thác ngay."},{"at":30,"t":"<b>16 f5!</b> — Tốt đánh vào e6. Đen chỉ có tốt f7 giữ ô đó trong khi Trắng có tốt f5 và Mã d4 đánh vào, nên e6 phải chuyển động hoặc phải bị mở."},{"at":32,"t":"<b>17 f6!</b> — Nêm tốt vào g7. Đen bắt lại kiểu nào thì hàng tốt trước Vua cũng vỡ, và sau gxf6 gxf6 thì tốt f6 nằm lại như cái xương chắn ngang: Tượng e7 phải lùi, Vua Đen hết đường nhập thành."},{"at":33,"t":"<b>17…gxf6</b> — Ăn bằng Tượng cũng chẳng nhẹ hơn: <b>17…♗xf6 18 ♘d5</b> và Mã lại nhảy vào giữa với đòn đánh đôi quen thuộc. Keo nào Đen cũng phải sống với một Vua ở e8 và hàng tốt cánh Vua rách. Ván đi <b>18 gxf6 ♗f8</b> — Tượng lùi hẳn về ô xuất phát, còn Xe h8 thì mãi mới ra được."},{"at":36,"t":"<b>19 ♘d5!</b> — Mã vào ô yếu d5 và <b>đánh đôi</b> Hậu c7 lẫn Mã b6, nên Đen buộc phải ăn. Chú ý cái bẫy nhỏ ngay sau đó: <b>19…♘xd5 20 exd5 ♗xd5??</b> không được, vì <b>21 ♕xd5</b> — tốt d5 có Hậu f3 đứng sau đỡ. Nên tốt Trắng ở lại d5 và chĩa tiếp vào c6."},{"at":40,"t":"<b>21 ♘c6+!</b> — Thí Mã để đổi lấy một con tốt ở c6. Ăn bằng Hậu là hỏng hẳn: <b>21…♕xc6 22 dxc6+</b>, Trắng được Hậu chỉ mất Mã. Còn sau ♗xc6 dxc6 thì tốt Trắng đứng ngay cạnh Vua Đen, cắt Vua khỏi cánh Hậu và mở toang cột d cho hai Xe."},{"at":48,"t":"<b>25 ♗f5!</b> — Tượng sang f5 vừa giữ ô e6 cho Hậu vào, vừa <b>nhìn thẳng vào Xe c8</b>. Đen phải bỏ cột c, và Trắng ăn f7 — lúc đó tốt f7 chỉ có Hậu h5 nhắm mà chẳng có ai đỡ."},{"at":58,"t":"<b>30 f7</b> — Con tốt đi được bước cuối cùng và cắm ở f7. Từ giây phút này ô f8 thành cái đinh: Đen phải luôn có quân đứng đó chắn đường phong cấp, và cả Xe d8 lẫn Xe h8 phải ở lại canh. Một con tốt giữ chân ba quân."},{"at":62,"t":"<b>32 ♕xe5!</b> — Đổi Hậu lấy tốt rồi lấy Xe: sau dxe5 ♖xd8+ và ♖1d7 thì Hậu Đen bị đuổi tới chân tường và mất. Kết quả Trắng hơn quân với một tốt đứng ở f7."},{"at":70,"t":"<b>36 c3</b> — Đây là thế thắng sạch. Tốt f7 chỉ còn một bước tới ô phong cấp; Tượng f8 phải đứng chắn, mà Tượng f8 lại đang bị Xe d8 đánh và chỉ có Xe h8 giữ. Toàn bộ quân Đen bị trói vào một ô."},{"at":72,"t":"<b>37 ♖a8</b> — Và đây là nước làm tuột tất cả. Xe rời d8 đi ăn tốt a6, tức là <b>thả cái trói</b>: Tượng f8 tự do, còn Vua Đen lập tức chạy d6–e7 để nuốt luôn tốt f7. Chỉ cần giữ Xe trên cột d là xong, kể cả nước chờ như <b>37 ♖d7+ ♔b6 38 ♖d8</b> — thế trói vẫn y nguyên, f8 vẫn một đánh một giữ, và Trắng có thời gian đưa Vua lên."},{"at":74,"t":"<b>38 ♖xa6+</b> — Ăn thêm tốt, nhưng để ý hai nước chiếu này lại là hai nước <b>đưa đò cho Vua Đen</b>: 38 ♖xa6+ ♔e7 rồi 39 ♖e6+ ♔xf7. Xe chiếu mà chiếu vào chỗ Vua đang muốn đi thì đó không phải là tấn công."},{"at":78,"t":"<b>40 ♖xe5</b> — Trắng vẫn hơn hai tốt, nhưng chú ý màu Tượng: Tượng Trắng đi ô trắng (f5), Tượng Đen đi ô đen (f8). <b>Tượng khác màu ô</b> — hai quân này không bao giờ chạm nhau, và đó là phao cứu sinh của Đen."},{"at":93,"t":"<b>47…♖f1!</b> — Fischer ép đổi Xe. Với Tượng khác màu ô, càng ít quân thì bên yếu càng dễ hòa; giữ Xe lại mới là nguy hiểm vì Xe giúp bên hơn tốt mở mặt trận thứ hai."},{"at":96,"t":"<b>49 ♖d2</b> — Đen vừa chiếu bằng <b>48…♖f2+</b> và Trắng chỉ còn tám nước hợp lệ để gỡ chiếu. Bịt bằng Xe thì Đen đổi ngay (49…♖xd2+ 50 ♔xd2), mà đó chính là điều Đen muốn. Chiếu để ép đổi quân là cách xin hòa hiệu quả nhất khi mình đang thiếu tốt."},{"at":111,"t":"<b>56…♔a7</b> — Vua Đen về kịp góc a7 để chặn cứng cặp tốt a–b. Từ đây Trắng không còn đường vào: muốn tiến thì phải đẩy tốt lên ô đen, mà ô đen là địa phận của Tượng Đen."},{"at":119,"t":"<b>60…♗d2</b> — Tượng đứng trên đường chéo a5–e1, tức là <b>đánh thẳng vào tốt a5</b> đang không có ai đỡ. Trắng vì thế không được rảnh tay: nước sau phải đẩy <b>61 b6+</b> chứ không kịp làm gì khác. Trong tàn cuộc Tượng khác màu, một con Tượng đứng đúng đường chéo làm được việc của cả hai quân."},{"at":125,"t":"<b>63…♔c5</b> — Hòa. Trắng hơn hai tốt nhưng ô phong cấp b8 là <b>ô đen</b>: hễ tốt bước tới b7 thì <b>♗f4</b> đứng chặn ngay đường chéo b8–h2, mà Tượng Trắng đi ô trắng nên không bao giờ đuổi được Tượng Đen khỏi đường chéo ấy. Vua Đen chặn trước tốt, Tượng Đen canh ô phong — không có cách nào phá."}]},"10":{"tiv":"Vắt đến giọt cuối","ctx":"Zurich 1959, Fischer cầm Trắng gặp Unzicker, lại là <b>Ruy Lopez</b> biến Chigorin và mười hai nước đầu trùng khít với ván gặp Keres. Lần này Fischer không tìm đòn ở cánh Vua mà đổi ở e5 để cấu trúc tốt cứng lại, rồi đi ăn từng thứ nhỏ một: cặp Tượng, cột a, tốt b5. Đen hỏng ở nước 22 khi tự mở cửa nhà bằng …f6, và từ đó phần còn lại là kỹ thuật. Kết cục là tàn cuộc <b>Tượng chống Mã</b> với tốt thông ở cột c, Fischer thắng ở nước 65.","end":"Đây là ván để học cách <b>chuyển một lợi thế nhỏ thành lợi thế khác</b>. Đầu tiên là cặp Tượng, đổi lấy tốt b5. Rồi tốt b5 đổi lấy tốt thông c. Rồi tốt thông c dùng để <b>trói</b> con Mã Đen chứ không phải để phong cấp — và trong lúc Mã đứng canh ô c7 thì Vua Trắng đi bộ sang ăn sạch cánh Vua. Đó là nguyên tắc hai điểm yếu: một mặt trận thì đối phương giữ được, hai mặt trận cách xa nhau thì không. Cần nhớ thêm đường đi của Tượng ♗c2–d1–e2: không có đường thẳng thì đi vòng.","notes":[{"at":19,"t":"<b>10…c5</b> — Biến Chigorin: Đen đã đưa Mã ra a5 đuổi Tượng, giờ dựng tốt c5–b5 chiếm chỗ ở cánh Hậu. Đổi lại Đen để Trắng đẩy d4 và chiếm trung tâm."},{"at":26,"t":"<b>14 ♘e3</b> — Chặng cuối của chuyến đi ♘b1–d2–f1–e3. Từ e3 con Mã nhắm hai ô f5 và d5. Đe doạ có thật: nếu Đen cứ đi tiếp như thường, ví dụ <b>14…♖ad8</b>, thì <b>15 ♘f5</b> đứng vào giữa và đánh cùng lúc ♗e7 lẫn ô g7."},{"at":27,"t":"<b>14…g6</b> — Tốt g6 chặn hai ô f5 và h5 để Mã Trắng khỏi nhảy vào; sau nước này ô f5 có thêm tốt canh nên ♘f5 không còn. Cái giá là các <b>ô đen</b> f6 và h6 quanh Vua Đen yếu hẳn đi, và điểm yếu kiểu này không sửa lại được."},{"at":29,"t":"<b>15…dxe5</b> — Fischer chủ động đổi ở e5. Cấu trúc tốt đứng yên lại (Đen kẹt tốt e5), cột d mở ra cho Xe, và Trắng rảnh tay chuyển Mã f3 vòng qua h2 sang g4."},{"at":36,"t":"<b>19 hxg4</b> — Ăn lại bằng tốt h chứ không phải bằng tốt g. Lý do: giữ được khối tốt f2–g2 nguyên vẹn trước Vua, đồng thời tốt g4 lên hàng thứ tư và sẵn sàng đi tiếp một nước nữa."},{"at":38,"t":"<b>20 g5!?</b> — Tốt lên g5 giành hai ô đen f6 và h6, đúng hai ô mà …g6 vừa làm yếu. Dấu <b>!?</b> có lý do: ngay lúc này g5 <b>bị ♗e7 đánh mà không có quân nào đỡ</b>, và sau <b>20…♗xg5</b> Trắng không có một nước ăn lại nào — Fischer cho không một tốt để lấy chỗ. Unzicker không nhận, chọn <b>20…♘c4</b>, và hai nước sau chính Hậu Trắng lên g4 đỡ cho tốt ấy."},{"at":43,"t":"<b>22…f6?</b> — Đen chịu không nổi cái tốt g5 nên tự phá nó. Nhưng sau <b>23 gxf6</b> Đen chỉ ăn lại được bằng Tượng (<b>23…♗xf6</b>) — tốt g6 không với tới f6. Thế là mở cửa nhà mình ra cho Trắng hai lợi thế cùng lúc: <b>cặp Tượng</b>, và một tình thế mà ♗f6 thành quân duy nhất giữ ô đen quanh Vua Đen. Chính con Tượng ấy sẽ bị đổi ở nước 30."},{"at":46,"t":"<b>24 a4!</b> — Đổi hướng sang cánh Hậu. Mã c4 của Đen trông rất oai nhưng đếm ra thì nó chỉ có <b>đúng một quân đỡ: tốt b5</b>. Nếu <b>24…bxa4 25 ♗xa4 ♕d6</b> thì <b>26 b3</b>, Mã c4 bị tốt đánh mà không còn ai đỡ, phải bỏ ô. Đánh vào b5 là đánh vào chỗ tựa, không phải vào con Mã."},{"at":58,"t":"<b>30 ♗g5!</b> — Mời đổi đúng con Tượng đen của Đen. Từ chối cũng không xong: nếu <b>30…♕d6</b> thì <b>31 ♗xf6+ ♕xf6 32 ♕xf6+</b>, vẫn đổi mà còn kèm chiếu. Sau khi đổi thì còn lại <b>Tượng trắng chống Mã</b>, tốt rải ở cả hai cánh — hoàn cảnh Tượng thích nhất."},{"at":64,"t":"<b>33 ♗d1!</b> — Tượng không đi thẳng tới b5 được nên đi vòng: c2–d1–e2. Nhìn thì như lùi, thật ra là chuyển sang đường chéo duy nhất chạm được tốt b5."},{"at":66,"t":"<b>34 ♖a7</b> — Xe vào hàng 7, từ a7 nó nhìn suốt sang tận h7. Nhưng việc chính là ép Hậu Đen: lúc này <b>♕c6 là quân duy nhất đỡ tốt b5</b>. Hậu vừa phải canh b5, vừa phải trông f6 và cả hàng 7 — và ở nước sau nó buông b5."},{"at":68,"t":"<b>35 ♗e2!</b> — Bước cuối của chuyến đi vòng: Tượng chạm tới b5, mà sau <b>34…♕d6</b> thì b5 <b>không còn quân nào giữ</b>. Ví dụ <b>35…♖b8</b> thì <b>36 ♗xb5</b> ăn không. Đen chỉ còn cách đổi hết quân nặng và chịu mất tốt."},{"at":72,"t":"<b>37 ♗xb5</b> — Thu hoạch. Trắng hơn một tốt, có Tượng chống Mã, và tốt đa số ở cánh Hậu sẽ đẻ ra tốt thông. Phần còn lại của ván cờ chỉ là biến lợi thế này thành lợi thế khác."},{"at":88,"t":"<b>45 b4</b> — Đập vào c5 để tách tốt Đen ra. Sau khi đổi, tốt của Trắng ở cột b–c thành <b>tốt thông</b> và có Hậu lẫn Tượng đứng sau đỡ."},{"at":92,"t":"<b>47 ♕c5</b> — Mời đổi Hậu, và nước mời không từ chối bằng cách ăn được: <b>47…♕xb4</b> thì <b>48 ♕xb4</b> — tốt b4 đang được chính Hậu c5 đỡ, Đen mất Hậu không. Đen đành nhận đổi."},{"at":94,"t":"<b>48 bxc5</b> — Đổi Hậu xong: Tượng chống Mã, Trắng hơn một tốt và có tốt thông c5. Mã là quân chậm, nên tốt thông ở xa nó chính là thứ Mã sợ nhất."},{"at":96,"t":"<b>49 f4</b> — Tốt f đánh vào e5, mà e5 <b>chỉ có ♘g4 đỡ</b>. Con Mã bị dán vào việc giữ tốt, và ngay nước sau <b>50 ♔f3</b> Vua Trắng bước tới đánh chính nó — Mã phải bỏ e5 mà chạy về f6."},{"at":102,"t":"<b>52 ♗c4+</b> — Chiếu để đuổi Vua Đen lùi lại trước khi đẩy tốt. Đếm trên bàn cờ thì Đen chỉ có <b>đúng ba nước hợp lệ</b>: ♔e7, ♔d7 và ♘d5 — mà <b>52…♘d5 53 exd5+</b> là mất không con Mã. Vua phải lùi, và c5–c6 đi được."},{"at":104,"t":"<b>53 c6!</b> — Tốt đi tới c6 không phải để phong cấp mà để <b>trói</b>: Mã Đen buộc phải canh ô c7 và từ đó không nhúc nhích được. Trắng đổi một tốt thông lấy quyền chơi một mình ở cánh kia."},{"at":105,"t":"<b>53…♘e8</b> — Nước duy nhất. Mã chỉ có hai cách với tới ô c7 là e8 và d5, mà <b>53…♘d5 54 exd5</b> thì ô d5 không có ai đỡ, Trắng ăn không con Mã. Thế là Mã về e8 và ngồi im ở đó gần hết ván."},{"at":112,"t":"<b>57 ♔e3!</b> — Vua quay ngược về cánh Vua. Trong lúc Mã Đen bị dán vào ô c7/e8, Vua Trắng đi bộ sang ăn tốt h — đúng nguyên tắc hai điểm yếu cách xa nhau."},{"at":128,"t":"<b>65 ♔g5</b> — Đen xin thua. Mã g7 <b>nhảy đi đâu cũng mất</b>: bốn ô e8, e6, h5, f5 đều bị Tượng f7, Vua g5 hoặc tốt e4 canh, mà ngồi im thì Vua Trắng bước tới f6 bắt. Cộng thêm hai tốt e nối nhau, Vua Đen ở tận c6 không kịp về."}]},"11":{"tiv":"Giai điệu không nghe thấy","ctx":"Ván này chơi ở giải Ứng viên 1959, Fischer cầm Trắng trước Benko. Khai cuộc là Sicilian với ♗c4 — cây Tượng đứng trên đường chéo nhắm vào f7 và e6, kiểu chơi Fischer dùng suốt nhiều năm. Benko đánh ở cánh Hậu bằng …♘a5 và …b5–b4, còn Fischer trả lời ở trung tâm bằng một nước tốt e5 mở toang thế cờ. Cái hay của ván không nằm ở đòn đánh đẹp mà ở những nước <b>không xảy ra</b>: Fischer bỏ qua việc ăn lại quân, cứ dồn thêm quân về Vua Đen. Kết cục là đổi hết Hậu vào một thế mà Mã Đen kẹt ở b3 và Trắng bắt nó bằng một đòn đôi.","end":"Hai thứ đáng học. Thứ nhất: khi đối thủ đánh ở một cánh, câu trả lời mạnh nhất thường nằm ở <b>trung tâm</b> — nước 14 e5 không đỡ đòn …b4 mà mở đường tới Vua. Thứ hai: đếm quân giữ nhà chứ đừng đếm vật chất. Fischer để Đen ăn không một Tượng ở nước 17 vì cái Mã ăn quân đó đi lạc sang b3 và biến mất khỏi trận đánh trong mười nước — đổi một quân lấy việc bên kia thiếu một quân phòng ngự là đổi có lời.","notes":[{"at":11,"t":"<b>6…♕b6</b> — Hậu ra b6 đánh cùng lúc Mã d4 và tốt b2. Đếm ở d4: Đen nhắm hai lần (♕b6 và ♘c6), Trắng chỉ đỡ một lần (♕d1) — nên Trắng phải xử lý ngay."},{"at":12,"t":"<b>7 ♘de2</b> — Trong ba cách gỡ, Fischer chọn cách lùi. <b>7 ♘xc6 bxc6</b> thì Đen ăn lại bằng tốt b, cột b mở ra và tốt c6 lại đỡ luôn ô d5; <b>7 ♘b3</b> thì Mã chiếm mất chính ô lùi mà Tượng c4 cần (trong ván Tượng đi b3 ở nước 9). Còn ♘de2 giữ nguyên mọi thứ và dọn chỗ cho tốt f tiến."},{"at":18,"t":"<b>10 ♔h1</b> — Vua bước sang h1 để rời đường chéo a7–g1, chỗ Hậu Đen đang đứng. Đây là nước dọn nhà: từ giờ Đen không còn đe doạ nào kèm chiếu trên đường chéo đó, Trắng rảnh tay chơi f4 và e5."},{"at":21,"t":"<b>11…♕c5!</b> — Hậu sang c5 và từ một ô kiểm soát bốn chỗ: e5, d4, c3 và f2. Điểm quan trọng nhất là <b>e5</b> — ô này bây giờ Đen giữ hai lần (Hậu c5 và tốt d6) còn Trắng không giữ lần nào, nên nước e4–e5 tạm thời bị chặn."},{"at":23,"t":"<b>12…b5</b> — Ý đồ là …b4. Lúc này tốt e4 của Trắng <b>chỉ có ♘c3 đỡ</b>, nên đuổi được ♘c3 đi là e4 rơi. Fischer trả lời <b>13 ♘g3</b>, thêm một quân đỡ cho e4 và đưa Mã về phía Vua Đen."},{"at":25,"t":"<b>13…b4?</b> — tốt lên b4 đánh Mã c3. Nhìn thì hợp lý, nhưng Đen bỏ dở việc ở trung tâm đúng một nhịp. Con Mã c3 không phải thứ Fischer cần giữ."},{"at":26,"t":"<b>14 e5!</b> — tốt lên e5 đánh Mã f6 lần thứ hai và <b>mặc kệ Mã c3</b> đang bị tốt b4 nhắm. Nếu <b>14…bxc3 15 exf6 ♗xf6 16 ♗xf6 gxf6</b> thì Đen hơn một tốt thật, nhưng cấu trúc tốt quanh Vua vỡ đúng như trong ván — Fischer bán con Mã để lấy chỗ ấy."},{"at":29,"t":"<b>15…gxf6</b> — Đen buộc phải ăn bằng tốt g7. Trắng đổi Tượng lấy Mã chỉ để đạt một việc: <b>hàng tốt chắn Vua Đen bị dỡ</b>. Hai tốt f chồng lên nhau, trước mặt Vua không còn tốt g, và ô g7 chỉ còn mỗi Vua canh."},{"at":30,"t":"<b>16 ♘ce4</b> — Mã vào e4 đánh cùng lúc Hậu c5 và tốt f6. Nó vừa đuổi Hậu Đen đi vừa tăng sức ép lên chỗ vừa bị mở."},{"at":31,"t":"<b>16…♕d4</b> — Hậu chạy ra giữa, đánh ♘e4 (được ♘g3 đỡ) và cả tốt b2. Nhưng cái quan trọng nhất lại là chỗ đứng: từ d4 Hậu nằm trên <b>đường chéo a1–h8</b>, và trong mười nước tới nó là <b>quân duy nhất</b> của Đen với tới được ô g7."},{"at":32,"t":"<b>17 ♕h5!</b> — Hậu bay sang cánh Vua. Bây giờ Trắng có ba quân chĩa về đó (Hậu h5, Mã e4, Mã g3) và ♘xf6+ là nước chiếu có sẵn bất cứ lúc nào."},{"at":33,"t":"<b>17…♘xb3</b> — Đen ăn Tượng b3. Ăn được thật, nhưng nhìn kỹ vị trí con Mã: nó đứng ở b3, bị hai tốt a2 và c2 nhắm, không ai đỡ, và cách Vua Đen nửa bàn cờ."},{"at":34,"t":"<b>18 ♕h6!</b> — Fischer <b>không ăn lại</b> ở b3. Hậu ở h6 đánh f6 lần thứ hai (f6 bị ♘e4 và ♕h6 nhắm, chỉ có ♗e7 đỡ) và ngồi ngay cạnh Vua Đen: ô g7 lúc này Trắng đánh một lần, Đen chỉ có mỗi ♔g8 giữ. Đây là chỗ ván cờ được quyết: đổi một Tượng lấy hai nhịp tấn công."},{"at":35,"t":"<b>18…exf4</b> — Không phải chỉ để ăn tốt: tốt xuống f4 <b>đánh thẳng vào ♘g3</b>, buộc Trắng phải trả lời con Mã trước khi làm gì khác. Đen mua được một nhịp — nhưng Fischer có sẵn một nước vừa cứu Mã vừa doạ chiếu hết."},{"at":36,"t":"<b>19 ♘h5</b> — Mã vừa chạy khỏi tốt f4 vừa tạo ra đe doạ <b>♕g7 chiếu hết</b>: thử một nước chờ bất kỳ, ví dụ <b>19…a5</b>, thì <b>20 ♕g7#</b> — Vua không ăn được vì Mã h5 canh ô đó, còn f8 thì Xe Đen chiếm mất."},{"at":37,"t":"<b>19…f5</
