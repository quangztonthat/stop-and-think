b> — nước gỡ duy nhất, và nó đẹp: đẩy tốt f6 đi để <b>mở đường chéo a1–h8</b> cho Hậu d4 canh ô g7. Benko phòng ngự bằng chính con Hậu đang ở tít bên kia bàn cờ."},{"at":38,"t":"<b>20 ♖ad1!</b> — Xe cuối cùng vào trận, kèm theo việc đánh Hậu d4. Cái bẫy nằm ở chỗ Hậu <b>không được rời đường chéo dài</b>: <b>20…♕xe4 21 ♕g7#</b>, và ngay cả ăn luôn con Xe vừa vào — <b>20…♕xd1 21 ♕g7#</b> — cũng là chiếu hết. Hậu Đen ăn gì cũng chết."},{"at":40,"t":"<b>21 ♘ef6+</b> — Mã đâm vào f6 để <b>đuổi quân đang canh g7</b>. Đếm trên bàn cờ, Đen có đúng ba nước hợp lệ: <b>♔h8, ♗xf6, ♕xf6</b> — cả ba đều phải nhả thứ gì đó."},{"at":44,"t":"<b>23 ♕xf6</b> — Đổi Hậu xong mà thế công không tắt. Lý do: <b>♘b3 của Đen đang đứng trơ</b>, bị cả tốt a2 lẫn tốt c2 nhắm mà không ai đỡ. Nó phải chạy ngay — và chạy ở nửa bàn không có ai bênh."},{"at":46,"t":"<b>24 ♕g5+</b> — Chiếu, và Đen chỉ có <b>đúng một nước hợp lệ</b>: 24…♔h8. Fischer dùng nước chiếu ấy để đưa Hậu tới chỗ nhìn được cả f8 lẫn c5."},{"at":48,"t":"<b>25 ♕e7!</b> — <b>đòn đôi</b>. Hậu ở e7 đánh cùng lúc ♖f8 và ♘c5, cả hai đều không ai đỡ, mà ♕xf8 lại còn là chiếu hết. Chạy Mã cũng không cứu: <b>25…♘e4 26 ♕xf8#</b>."},{"at":52,"t":"<b>27 ♖xf1</b> và Đen xin thua. Trắng còn Hậu và Xe, Đen còn hai Xe; ngoài ra ba tốt f của Đen chồng lên nhau trên một cột và tốt f4, b4 đều không ai đỡ — Hậu Trắng sẽ nhặt dần."}]},"12":{"tiv":"Nhập thành vào chỗ nguy hiểm","ctx":"Giải Ứng viên 1959, Fischer cầm Đen trước Gligorich. Khai cuộc là Sicilian Najdorf với 6 ♗g5 — Trắng nhập thành cánh Hậu rồi đẩy g4, f4, f5 vào Vua Đen, còn Đen phải đánh trả ở cánh Hậu. Điểm lạ của ván là Fischer <b>ăn lại bằng tốt g</b> ở nước 11 rồi vẫn nhập thành cánh Vua ở nước 13 — tức là tự đưa Vua vào đúng chỗ Trắng đang nhắm. Đổi lại, Đen có cột g cho Xe và nước phá trung tâm …d5. Cả hai bên đều chơi hụt ở khoảng nước 24; sau khi đổi hết Hậu, ván kéo về một tàn cuộc Xe rất dài và hoà đúng ở nước cuối.","end":"Ba điều đáng nhớ. <b>Ăn lại về phía nào</b> là một quyết định chiến lược: 11…gxf6 làm hỏng nhà Vua nhưng mở cột g và giữ ô e5 cho Mã — Fischer đổi độ an toàn lấy quân chủ động. <b>Trong tàn cuộc Xe, Vua là một quân đánh</b>: 43…♔f7 và 34 ♔e5 của Trắng đều là nước đưa Vua ra giữa. Và cuối cùng là một luật sách vở nên thuộc lòng: với tốt biên b và Vua phòng ngự đứng chắn phía trước, chỉ có <b>đúng một ô</b> giữ được hoà — 57…♔b8, mọi nước Vua khác đều thua.","notes":[{"at":19,"t":"<b>10…b5</b> — Đen bắt đầu phản công. Tốt b5 chuẩn bị …b4 đuổi Mã c3, mà Mã c3 vốn đã nằm cùng cột c với Hậu Đen — đó là hướng Đen mở đường tới Vua Trắng ở c1."},{"at":21,"t":"<b>11…gxf6!?</b> — ăn lại bằng tốt g chứ không phải tốt e. Cái được: cột g mở cho Xe, và tốt f6 giữ ô <b>e5</b> để Mã nhảy vào đó. Cái mất: hàng tốt chắn Vua ở cánh Vua nát, mà Đen thì sắp nhập thành về phía ấy."},{"at":23,"t":"<b>12…♘e5</b> — Mã vào e5 và <b>đánh thẳng vào ♕f3</b>, nên Trắng không được chọn: Hậu phải đi. <b>13 ♕h3</b> nhìn như lùi ra rìa, thật ra là đứng vào cột h nhắm tốt h7 — đúng cái tốt sẽ phải che Vua Đen ngay sau đó."},{"at":25,"t":"<b>13…0-0!</b> — Fischer nhập thành ngay vào phía Trắng đang tấn công. Cơ sở để dám làm vậy: cột g đã mở sẵn cho Xe f8 sang g8, và Mã e5 đứng ngay sát Vua Trắng, kiểm soát d3 và c4."},{"at":26,"t":"<b>14 ♘ce2!</b> — Mã rời c3 <b>trước khi</b> bị …b4 đuổi, và đi về phía f4. Trắng không muốn mất nhịp ở cánh Hậu trong khi đang cần mọi nhịp cho cánh Vua."},{"at":27,"t":"<b>14…♔h8</b> — Vua bước sang h8 để <b>nhường ô g8 cho Xe</b>. Cột g là cột duy nhất Đen mở được (tốt g Đen đã ăn sang f6), và nó chĩa thẳng vào tốt g4 của Trắng — nên Đen dọn đường cho ♖f8–g8 trước khi làm gì khác."},{"at":28,"t":"<b>15 ♘f4</b> — Mã tới f4 dồn thêm sức ép lên e6: ô đó bây giờ bị ba quân Trắng nhắm (tốt f5, Mã f4, Mã d4) mà Đen chỉ đỡ được hai lần (tốt f7 và Tượng c8)."},{"at":31,"t":"<b>16…d5!</b> — phá trung tâm đúng lúc. Trắng đã dồn quân sang hai cánh nên tốt e4 <b>không còn quân nào đỡ</b>; mở trung tâm là cách kinh điển để trả lời một đòn tấn công ở cánh."},{"at":34,"t":"<b>18 ♘d5</b> — Mã nhảy vào ô trống giữa bàn, đánh cùng lúc Hậu c7 (đang không ai đỡ) và Tượng e7 (chỉ có chính Hậu c7 đỡ). Đen phải trả lời ngay."},{"at":35,"t":"<b>18…♕c5</b> — Nước gỡ khéo nhất: Hậu vừa chạy vừa <b>đánh ngược lại ♘d5</b> (con Mã đó không có ai đỡ), lại vẫn giữ được ♗e7. Trắng không còn cách nào ngoài <b>19 ♘xe7</b>, tức là tự đổi đi con Mã vừa nhảy vào."},{"at":38,"t":"<b>20 ♘f5</b> — Mã còn lại nhảy tới f5 và <b>đánh Hậu e7</b>, lúc này đang đứng trơ. Đen phải trả lời bằng ♕xe6, và thế là con tốt e6 nhức nhối của Trắng biến mất — nhưng Mã Trắng đã kịp đứng vào ô f5 sát Vua Đen."},{"at":41,"t":"<b>21…♗d7!</b> — quân cuối cùng của Đen ra trận, và ra đúng chỗ: từ d7 nó đỡ thêm cho tốt b5 và nối hai Xe. Trong một ván hai bên chạy đua, quân nào chưa vào trận là quân đang thiếu."},{"at":43,"t":"<b>22…♘xg4!</b> — Mã ăn tốt g4 và <b>đánh luôn Hậu h6</b>, mà Hậu h6 chỉ có ♘f5 đỡ. Nên sau <b>23 ♖xg4 ♕xf5</b> Đen ăn nốt con đỡ đó, và Xe g4 lại thành quân bị đánh."},{"at":46,"t":"<b>24 ♖xg8+?</b> — Xe g4 đang bị Hậu f5 và Xe g8 nhắm mà không ai đỡ, nên Trắng phải xử lý. Nhưng giải quyết bằng cách đổi một cặp Xe là giúp bên phòng ngự: bên đang tấn công cần quân, không cần đổi quân."},{"at":47,"t":"<b>24…♖xg8?</b> — ăn lại bằng Xe a8. Hệ quả cụ thể: tốt a6 vừa nãy còn được Xe a8 đỡ thì bây giờ đứng trơ, và Xe d6 của Trắng đang nhắm thẳng vào nó theo hàng 6."},{"at":66,"t":"<b>34 ♔e5!</b> — vào tàn cuộc thì Vua là một quân đánh. Vua Trắng đi thẳng ra giữa bàn, đứng ngay cạnh tốt thông e4 của Đen, trong khi Vua Đen vẫn kẹt ở góc h8."},{"at":73,"t":"<b>37…♗g4?</b> — Đen tự đổi đi <b>đúng con quân đang đỡ ô e2</b>. Chừng nào Tượng còn ở d1 thì tốt e3 đi tiếp có người bênh; sau <b>38 ♗xg4 ♖xg4 39 ♖c3</b> chỉ còn Xe trông cột e, và con tốt thông ấy phải bỏ."},{"at":81,"t":"<b>41…e1=♕!</b> — phong Hậu rồi trả lại ngay cho Xe. Tốt e2 đằng nào cũng không đi tiếp được (Xe e3 chắn trước, Xe g2 đỡ sau), nên Fischer đổi nó lấy một thứ dùng được: sau 42 ♖xe1 ♖xc2 Xe Đen vào hàng 2 và ăn tốt c2."},{"at":85,"t":"<b>43…♔f7!</b> — không vội ăn tốt h2 mà đưa Vua vào cuộc trước. Trong tàn cuộc Xe, Vua đứng ngoài rìa là thua nửa số quân."},{"at":103,"t":"<b>52…♖h8?</b> — Xe rời hàng 5 và bỏ rơi tốt b5: sau nước này b5 <b>không còn ai đỡ</b>, Vua Trắng ở b6 ăn không. Giữ tốt thì có <b>52…♖h5</b> — Xe vẫn canh dọc hàng 5, và lúc đó ♔xb5 thành nước không hợp lệ."},{"at":104,"t":"<b>53 ♔xb5?</b> — Trắng ăn tốt b5, nhưng Vua bước vào đúng cột mà Xe Đen đang nhắm. Đen chiếu liên tiếp …♖b8+ rồi …♖a8+, đẩy Vua Trắng ra xa rồi ép đổi Xe — mà đổi Xe ở đây là hoà."},{"at":113,"t":"<b>57…♔b8!</b> — nước duy nhất giữ được hoà, và điều này kiểm được đến cùng trên bàn cờ: <b>♔c7, ♔d7, ♔b7 và ♔d8 đều thua</b>, chỉ ♔b8 hoà. Ý nghĩa là <b>nhịp</b>: đứng ở b8 thì khi Trắng đi ♔b5, Đen mới trả lời ♔b7 và giành thế đối mặt; ra b7 hay c7 sớm một nhịp là chính Trắng giành được nó."}]},"13":{"tiv":"Một nước mới","ctx":"Vẫn ở giải Ứng viên 1959, lần này Fischer cầm Trắng gặp lại Gligorich. Khai cuộc là Sicilian với bộ khung quen thuộc của Fischer: ♗c4–b3, f3, ♗e3, ♕d2 rồi nhập thành cánh Hậu, sau đó đẩy g4–h4–g5 vào Vua Đen. Gligorich đánh vào bộ khung ấy bằng 12…♘c4, và Fischer trả lời bằng một nước ít ai chơi — 13 ♕e2, chịu mất Tượng đen để <b>giữ bằng được Tượng b3</b>. Phần còn lại là một cuộc chạy đua hai cánh: Đen mở cột c vào Vua Trắng, Trắng thí Xe ở h5 để mở cột h, và Trắng tới trước đúng một nhịp.","end":"Bài học lớn nhất là <b>chọn quân nào để đổi</b>. Nước 13 ♕e2 nhìn kỳ vì Trắng tự nguyện mất cặp Tượng, nhưng con Tượng b3 mới là quân đánh vào e6 và giữ mắt xích tấn công, còn Tượng e3 chỉ đứng đó. Điều thứ hai: trong thế nhập thành hai cánh khác nhau, <b>một nhịp là toàn bộ ván cờ</b> — nước 30 g6 mở cột h, còn mấy nước chiếu mà Đen có trong tay thì tắt chỉ sau vài nhịp. Và nhớ cách quân được đưa vào: thí Xe ở h5 không phải để ăn quân mà để bỏ tốt g6 — cái tốt che Vua Đen ở đúng cột mà Xe Trắng sắp đi vào.","notes":[{"at":14,"t":"<b>8 f3</b> — tốt f3 nhận việc đỡ tốt e4 để Mã và Tượng khỏi phải làm, đồng thời dọn chỗ cho ♗e3, ♕d2 và nhập thành cánh Hậu. Đếm trên bàn: trước nước này e4 chỉ có ♘c3 đỡ trước ♘f6, sau nước này có hai quân đỡ. Sau đó hai tốt g và h được rảnh tay xông lên."},{"at":15,"t":"<b>8…♘a5</b> — Mã rời trung tâm đi săn cây Tượng b3. Ngay lúc này b3 vẫn có ba quân đỡ (a2, c2, ♘d4) nên chưa mất gì, nhưng Đen giữ sẵn ý đổi: <b>9 ♗g5 ♘xb3 10 axb3</b> và quân duy nhất của Trắng nhắm vào e6–f7 biến mất. Cả ván sau đó xoay quanh đúng cây Tượng này."},{"at":19,"t":"<b>10…h6</b> — Đen hỏi cây Tượng g5, và nó lùi về e3. Nhưng tốt h6 vừa tạo ra một <b>cái móc</b>: sau này Trắng chỉ cần đẩy g4–g5 là mở được cột h, đúng như xảy ra ở nước 18."},{"at":23,"t":"<b>12…♘c4</b> — Mã nhảy vào c4 đánh một lúc ba thứ: Hậu d2, tốt b2 và Tượng e3. Kiểm trên bàn: e3 lúc này chỉ có mỗi Hậu d2 đỡ, nên Trắng phải quyết ngay."},{"at":24,"t":"<b>13 ♕e2!?</b> — nước lạ. Cách thường là <b>13 ♗xc4 ♖xc4</b>, nhưng thế thì Trắng mất cây <b>Tượng b3</b> — quân duy nhất còn nhắm dọc đường chéo a2–g8 (lúc này nó tì tới e6 và f7). Fischer chọn nhả Tượng e3 thay vào đó: sau <b>13…♘xe3 14 ♕xe3</b> Hậu ăn lại, hàng tốt không hỏng, và Tượng b3 vẫn còn."},{"at":25,"t":"<b>13…♘xe3</b> — Đen ăn Tượng vì không có gì hay hơn. Tham tốt bằng <b>13…♘xb2 14 ♔xb2</b> chỉ là cho không con Mã để lấy một tốt."},{"at":28,"t":"<b>15 g4</b> — hai Vua nhập thành hai phía nên không có gì phải giữ ý: bên nào đẩy tốt nhanh hơn thì bên đó thắng. Trắng bắt đầu trước."},{"at":31,"t":"<b>16…e6</b> — tốt e6 chặn đường chéo a2–g8, tức là <b>bịt mũi Tượng b3</b>: trước nước này Tượng b3 với tới e6 và f7, sau nước này nó đứng lại ngay ở e6. Đen cũng lấy luôn ô d5 khỏi tay Mã Trắng. Cái giá là ô d6 và các ô đen quanh Vua yếu đi."},{"at":32,"t":"<b>17 ♘de2!</b> — Mã lùi từ d4 về e2 để <b>đỡ thêm cho Mã c3</b>. Đếm đúng trên bàn: Hậu a5 và Xe c8 cùng nhắm vào c3 (hai quân đánh); trước nước này c3 chỉ có tốt b2 và Hậu e3 đỡ, sau nước này thành ba (b2, ♘e2, ♕e3)."},{"at":34,"t":"<b>18 g5</b> — mở cột h. Sau <b>18…hxg5 19 hxg5</b> cả cột h chỉ còn đúng một quân là Xe h1 của Trắng, nhìn thẳng vào Vua Đen, còn Mã f6 bị tốt g5 đuổi đi (♘e8, ♘h7 hay ♘h5 — toàn ô rìa)."},{"at":38,"t":"<b>20 f4</b> — lấy nốt ô f4 của Mã h5. Ăn ở đó không được: f4 có hai quân đỡ (♕e3 và ♘e2) trước một quân đánh, nên <b>20…♘xf4 21 ♘xf4</b> là Đen mất đứt con Mã. Kể từ đây Mã h5 gần như không còn việc gì làm."},{"at":40,"t":"<b>21 ♔b1</b> — Vua bước khỏi cột c, đúng cột mà hai Xe Đen đang chồng lên nhau. Đòn phá quen thuộc vẫn chưa chạy: <b>21…♖xc3 22 bxc3 ♕xc3 23 ♕xc3 ♖xc3</b> — Đen đổi Xe lấy Mã rồi ăn một tốt, tính ra vẫn thiệt, còn Vua Trắng dù trống trải thì không dính nước chiếu nào."},{"at":44,"t":"<b>23 ♕d3!</b> — Hậu lùi về d3 vẫn giữ được ô c3: c3 có b2, ♘e2 và Hậu d3 đỡ, trước hai quân Đen đánh (Xe c5 và Tượng g7). Hậu đồng thời nhắm xuống tốt d6. Đen không phá được cột c bằng <b>23…♖xc3 24 ♘xc3</b> — ăn bằng Mã, không phải bằng tốt, và Đen mất chất."},{"at":45,"t":"<b>23…♗xc3</b> — Đen đổi Tượng ô đen lấy Mã, nhưng mục đích thật không phải ăn quân mà là <b>gỡ ♘e2 ra khỏi việc giữ f4</b>. Ăn thẳng ngay thì không được: <b>23…♘xf4 24 ♘xf4</b> và con Mã đi đứt."},{"at":46,"t":"<b>24 ♘xc3</b> — ăn lại bằng Mã chứ không bằng tốt, và đó là một lựa chọn. <b>24 bxc3</b> giữ được tốt f4 (24…♘xf4 25 ♘xf4) nhưng mở toang cột b ngay trước Vua b1, chỉ còn mỗi Tượng b3 đứng chắn giữa Hậu b6 và Vua. Fischer thà mất tốt f4 còn hơn mở đường về nhà mình."},{"at":47,"t":"<b>24…♘xf4</b> — Đen ăn lại một tốt (kiểm trên bàn: f4 lúc này không còn quân nào đỡ), nhưng ở nước trước đã phải đổi Tượng g7 lấy Mã c3. Kể từ giờ <b>không còn quân nào của Đen giữ các ô đen quanh Vua</b> — đó mới là thứ Trắng cần."},{"at":49,"t":"<b>25…♘h5</b> — Mã buộc phải chạy: nó đang bị Hậu f3 đánh và không có quân nào đỡ. Nhưng mấy ô còn lại đều hỏng — <b>25…♘h3 26 ♕xh3</b>, <b>25…♘d3 26 cxd3</b>, <b>25…♘e2 26 ♘xe2</b> đều là mất luôn con Mã. Nên nó về h5, ngay cạnh Vua Đen, và đó chính là chỗ Fischer muốn."},{"at":50,"t":"<b>26 ♖xh5!</b> — thí Xe lấy Mã, và mục tiêu thật là <b>tốt g6</b>. Sau <b>26…gxh5 27 ♕xh5</b> Vua Đen chỉ còn đúng tốt f7 che thân, cột h mở, còn Trắng mới chỉ mất chất. Không nhận cũng không xong: <b>26…♔g7</b> thì Trắng ăn đứt con Mã."},{"at":53,"t":"<b>27…♗e8</b> — Tượng lùi về e8 để thêm một quân giữ f7; trước nước này f7 chỉ có mỗi Vua g8 trông chừng, mà Trắng đang chực đẩy g5–g6 đập vào đúng ô đó."},{"at":54,"t":"<b>28 ♕h6!</b> — Hậu chiếm ô đen ngay cạnh Vua Đen, và cùng Tượng b3 đánh tốt e6 hai lần trong khi Đen chỉ đỡ được một (tốt f7). Đen buộc phải bỏ phòng ngự để chạy đua."},{"at":57,"t":"<b>29…♖xc3</b> — Đen phá xong lớp tốt trước Vua Trắng: bây giờ …♕xb3+ và …♖xb3+ đều là nước chiếu, và đó đúng là hai nước chiếu duy nhất Đen có. Đây là kiểu ván nhập thành hai cánh — ai chậm một nhịp thì thua."},{"at":58,"t":"<b>30 g6!</b> — Fischer không đi đỡ mà đẩy tốt, vừa đánh f7 vừa <b>mở lại cột h</b> cho Xe. Đo trên bàn cờ: sau nước này Đen chỉ có hai nước chiếu, và cả hai đều tắt — <b>30…♕xb3+ 31 axb3 ♖xb3+ 32 ♔c1</b> rồi hết chiếu, Đen đã cho không cây Hậu. Không có chuỗi nào ép được chiếu hết, còn Trắng thì chỉ cần hai nước nữa là dựng xong ♕ + ♖ trên cột h."},{"at":62,"t":"<b>32 ♕h7+</b> và Đen xin thua. Vua chỉ có đúng một nước hợp lệ là <b>32…♔f8</b>, rồi <b>33 ♖f1+</b> là hết đường: Đen chỉ còn bốn nước chặn, và <b>33…♗f7 34 ♕xf7 chiếu hết</b>; <b>33…♕f6 34 ♖xf6+</b> hay <b>33…♕f2 34 ♖xf2+</b>, <b>33…♖f3 34 ♖xf3+</b> đều là mất luôn quân vừa chặn kèm nước chiếu."}]},"14":{"tiv":"Lắm thầy nhiều ma","ctx":"Giải Ứng viên 1959, Keres cầm Trắng gặp Fischer. Khai cuộc là Sicilian biến Najdorf với 6 ♗g5, hệ thống mà hai bên nhập thành hai cánh khác nhau rồi đua nhau đánh vào Vua đối phương. Ván này thực ra được quyết bởi một cuộc thanh toán vật chất khổng lồ ngay giữa khai cuộc: Trắng ăn được cả Xe a8, nhưng phải trả lại gần hết, và thế cờ còn lại là hai Xe cộng Mã đấu Hậu cộng Xe. Trắng đi hỏng vài nước ở tàn cuộc, Fischer dồn tốt cánh Vua rồi chiếu hết ở nước 53.","end":"Hai thứ đáng mang đi. Thứ nhất: trước khi lao vào một cuộc đổi chác dài, hãy nhìn xem quân mình sẽ đứng ở đâu khi khói tan — Tượng ăn Xe ở a8 là món hời trên giấy, nhưng nó đứng trong góc và Fischer chỉ cần một nước tốt d5 là nó hết việc. Thứ hai: Hậu đấu hai Xe thì bên có Hậu cần cột mở và tốt thông, còn bên có hai Xe cần giữ quân liên kết — mỗi nước chiếu suông như 24 ♖d8+ chỉ giúp Vua đối phương tìm được ô tốt hơn.","notes":[{"at":18,"t":"<b>10 ♗e2</b> — Nước bình tĩnh: triển khai xong rồi mới tính chuyện tấn công. Ở đúng thế cờ này (kiểm được: tới hết nước 9 hai ván trùng nhau từng ô), ván Smyslov–Fischer cùng giải Trắng chọn đẩy tốt g4 ngay. Hai Vua nhập thành hai cánh khác nhau nên ai chậm một nhịp thì bên đó ăn đòn trước."},{"at":22,"t":"<b>12 e5!?</b> — Tốt e5 đánh Mã f6, nhưng Mã đang có hai quân đỡ (♗e7 và tốt g7) nên đây không phải đòn ăn quân. Nó là nước mở đường: tốt vừa rời e4 thì đường chéo dài a8–h1 thông thẳng tới Hậu f3."},{"at":23,"t":"<b>12…♗b7</b> — Fischer không cứu Mã: Tượng ra b7 ngắm thẳng vào Hậu f3 dọc đường chéo vừa mở. Từ đây một chuỗi đổi quân gần như bắt buộc bắt đầu."},{"at":24,"t":"<b>13 exf6!?</b> — Trắng ăn Mã và chấp nhận mất Hậu ngay sau đó: <b>13…♗xf3 14 ♗xf3 ♗xf6 15 ♗xa8</b>. Đây là cuộc đổi chác được tính trước, không phải sơ suất — Trắng đang nhắm vào Xe a8."},{"at":25,"t":"<b>13…♗xf3</b> — Bắt buộc phải ăn Hậu trước. Nếu tiếc Tượng mà chơi <b>13…♗xf6</b> thì <b>14 ♕xb7</b> — Trắng ăn không cây Tượng và Đen chẳng được gì bù lại."},{"at":28,"t":"<b>15 ♗xa8</b> — Trắng ăn được cả Xe. Nhưng Tượng đứng tận góc a8 và con đường duy nhất về nhà là đường chéo dài — đúng chỗ Fischer có thể chặn."},{"at":29,"t":"<b>15…d5</b> — Tốt lên d5 bịt ngay đường chéo. Đếm trên bàn: Tượng a8 chỉ còn đúng ba nước — <b>♗b7</b>, <b>♗c6+</b> hoặc <b>♗xd5</b>, tức là ăn rồi bị bắt lại, hoặc bò về và mất nhịp. Trắng chọn ăn, và cuộc thanh toán tiếp tục."},{"at":31,"t":"<b>16…♗xd4!</b> — Thứ tự ăn rất quan trọng. Ăn ngược lại <b>16…exd5?? 17 ♘xd5</b> là hỏng: Mã d5 đâm hai ngạnh vào Hậu c7 (không quân nào đỡ) và Tượng f6 (chỉ mỗi tốt g7 đỡ). Nên Đen phải đổi trên d4 trước, rồi mới ăn lại ở d5."},{"at":34,"t":"<b>18 ♘xd5</b> — Khói tan, kiểm kê đúng trên bàn: Trắng có hai Xe, một Mã và 6 tốt (a2, b2, c2, f4, g2, h2); Đen có Hậu, một Xe và 5 tốt (a6, b5, f7, g7, h7). Điểm số gần bằng nhau. Khác biệt nằm ở chỗ Hậu Đen đi đâu cũng được, còn ba quân Trắng phải phối hợp với nhau mới có sức."},{"at":39,"t":"<b>20…h5!</b> — Tốt h đi hai bước không phải để tấn công mà để mở ô h6 cho Xe. Xe h8 là quân duy nhất của Đen chưa có việc; cả ba cột f, g, h đều còn tốt Đen chắn, nên nó phải ra bằng đường ngang."},{"at":41,"t":"<b>21…♖h6!</b> — Xe vào h6: vừa ra khỏi góc, vừa canh ngang hàng 6 — trong đó có ô <b>f6</b>. Bây giờ Hậu và Xe Đen cùng hoạt động, trong khi hai Xe Trắng vẫn đứng ở hàng cuối."},{"at":42,"t":"<b>22 f6?</b> — Trắng đẩy tốt vào đúng ô mà Xe h6 đang canh. Đếm: f6 bị đánh hai lần (tốt g7 và Xe h6), chỉ được đỡ một lần (♘d5), nên <b>22…gxf6</b> là mất trắng một tốt. Phá vỏ Vua đối phương chỉ đáng giá khi còn Hậu để khai thác — mà Hậu Trắng đã rời bàn từ nước 13."},{"at":46,"t":"<b>24 ♖d8+?</b> — Chiếu cho có. Vua Đen chỉ có đúng một nước hợp lệ là <b>24…♔g7</b>, nhưng đó lại đúng là ô Đen muốn: từ g7 Vua đỡ luôn ô g6, nơi Xe sắp về. Chiếu mà đẩy Vua đối phương tới ô tốt hơn thì đó là tặng nhịp."},{"at":53,"t":"<b>27…♖g6</b> — Sau hai nước chiếu <b>25…♕g1+ 26 ♔d2 ♕f2+</b>, Mã Trắng bị ép về e2 để chắn ngay trước Vua mình. Đen lùi Xe về g6, được Vua g7 và tốt f7 đỡ lưng, còn Trắng không có quân nào với tới đó. Bên có Hậu càng đổi bớt quân càng dễ chơi, nên Đen sẵn sàng đổi Xe."},{"at":61,"t":"<b>31…♕xh2?</b> — Ăn thêm tốt (h2 đúng là không có quân nào đỡ), nhưng Hậu đi lạc về góc. Vốn liếng thật của Đen là mấy tốt cánh Vua đang chờ đẩy; đổi lấy một tốt biên là đổi hớ về nhịp, và Trắng lập tức hoạt động hoá quân."},{"at":62,"t":"<b>32 ♖d4!</b> — Xe về giữa bàn và làm hai việc một lúc: đỡ tốt h4 (trước đó nó chưa có ai đỡ) và bịt kín hàng 4, không cho Vua Đen bước xuống hộ tống tốt. Nếu tham tiếp <b>32…♕xh4 33 ♖xh4</b> thì Đen mất Hậu không lấy gì."},{"at":70,"t":"<b>36 ♔b3?</b> — Vua bước vào cột b trong khi tốt b5 Đen còn nguyên. Trả lời <b>36…bxa4+</b> vừa ăn tốt vừa là nước chiếu, và cột a mở toang ngay trước mặt Vua Trắng."},{"at":77,"t":"<b>39…♕c1!</b> — Hậu xuống hàng cuối, vẫn tì vào cả hai tốt cuối cùng che Vua Trắng: b2 chỉ có Vua a3 đỡ, còn c3 chỉ có tốt b2 đỡ — hễ b2 phải ăn thì c3 rơi. Cùng lúc tốt a4 của Đen đang bị ba quân Trắng nhắm, nên Trắng ăn nó, và đó đúng là nhịp Fischer muốn tặng."},{"at":79,"t":"<b>40…♕e3</b> — Hậu về e3 nhắm hai thứ trên hai đường khác nhau: Mã c5 (đường chéo e3–d4–c5, và Mã này <b>không có quân nào đỡ</b>) và tốt c3 trên hàng ngang. Mã buộc phải chạy — và chỗ nó chạy tới quyết định ván cờ."},{"at":80,"t":"<b>41 ♘xa6?</b> — Mã chạy đi ăn tốt biên, tức là chạy ra xa hẳn cánh Vua. Ngay lập tức <b>41…f4</b> và tốt f bắt đầu chạy, không còn quân Trắng nào ở gần để chặn."},{"at":83,"t":"<b>42…♔f5!</b> — Vua đi hộ tống tốt chứ không đẩy tốt vội. Lý do đếm được ngay: tốt f4 đang bị Xe d4 đánh và mới có mỗi Hậu e3 đỡ; Vua f5 làm quân đỡ thứ hai, nên <b>43 ♖xf4+? ♕xf4</b> là Trắng mất Xe. Còn đẩy vội <b>42…f3?</b> thì <b>43 ♖f4+</b> ăn tốt kèm chiếu."},{"at":85,"t":"<b>43…♕e7!</b> — Hậu về e7 ăn tốt h4 (đúng là không ai giữ) và đứng lên đường chéo a3–f8 — cùng đường với Mã b4 và Vua a3 của Trắng. Tốt h rơi ngay nước sau."},{"at":105,"t":"<b>53…♕e5 chiếu hết</b> — Vua Trắng ở d5 bị Hậu e5 chiếu sát mặt, mà Hậu lại được Vua f5 đỡ lưng; Vua Trắng không còn một nước hợp lệ nào. Đáng nói là ở nước 53 Trắng có mười một nước, và chỉ đúng <b>53 ♖c4</b> là dính chiếu hết ngay — Xe rời cột d đúng lúc Vua cần nó ở đó. Ba tốt cánh Vua của Đen đã làm xong việc của chúng."}]},"15":{"tiv":"Một sai lầm tày trời","ctx":"Cũng ở giải Ứng viên 1959, Smyslov cầm Trắng gặp Fischer, và tới hết nước 9 thế cờ giống hệt ván Keres–Fischer: Sicilian Najdorf, 6 ♗g5 e6 7 f4 ♗e7 8 ♕f3 ♕c7 9 0-0-0. Chỗ rẽ là nước 10: Smyslov đẩy tốt g4 để lao vào cánh Vua ngay. Fischer đáp lại theo công thức kinh điển — đánh trả ở cánh Hậu bằng …b4 rồi phá trung tâm bằng …d5. Trắng mất tốt e4, tốt đó thành tốt thông của Đen và là nhân vật chính suốt phần còn lại. Chương sách dừng ở nước 54 và không ghi kết quả.","end":"Bài học chính là phản ứng đúng khi bị đánh ở cánh: mở trung tâm. Fischer không lo đỡ ở cánh Vua mà đẩy …b4 rồi …d5, và sau vài nước cuộc tấn công của Trắng hết đà trong khi Đen dư một tốt. Bài học thứ hai là cách xài tốt thông: mỗi nước của Đen đều quy về một việc — đẩy tốt e, đổi bớt quân, ép Trắng phải để lại người canh chừng. Chính vì tốt e mà Trắng phải dùng Hậu vừa phong đổi lấy một Tượng.","notes":[{"at":18,"t":"<b>10 g4</b> — Chỗ hai ván rẽ nhau: tới hết nước 9 thế cờ giống ván Keres–Fischer từng ô, nhưng Keres chơi ♗e2 còn Smyslov đẩy tốt g4 ngay. Ý là g5 đuổi Mã f6 rồi dồn quân sang cánh Vua. Vua hai bên ở hai cánh nên đây là cuộc đua ai nhanh hơn."},{"at":21,"t":"<b>11…♘xf6</b> — Ăn lại bằng Mã, dù biết nó sẽ bị <b>12 g5</b> đuổi về d7. Ăn bằng tốt thì hỏng hẳn: <b>11…gxf6</b> phá nát hàng tốt trước Vua trong khi Vua Đen còn chưa nhập thành. Ăn bằng Tượng thì cây Tượng ô đen lại phải chạy tiếp sau 12 g5, tức là mất nhịp bằng đúng quân giữ nhà. Mã về d7 không phải lùi suông — từ đó nó đi tiếp ra c5."},{"at":24,"t":"<b>13 ♗h3?</b> — Tượng ra h3 ngắm tốt e6 (đúng là đường chéo h3–g4–f5–e6 đang thông), nhưng nó đứng xa hẳn chỗ nguy hiểm. Vua Trắng ở c1 và Đen sắp tràn vào đúng chỗ đó; trong một cuộc đua thì đưa quân đi hướng ngược lại là mất nhịp."},{"at":25,"t":"<b>13…b4!</b> — Tốt lên b4 đuổi Mã c3, quân giữ nhà quan trọng nhất của Trắng ở cánh Hậu. Đếm trên bàn, Mã chỉ còn năm ô: <b>♘d5</b>, <b>♘cb5</b>, <b>♘a4</b>, <b>♘ce2</b>, <b>♘b1</b> — toàn ô rìa hoặc ô bị đổi ngay. Trắng chọn e2, và ô c5 để trống cho Mã Đen."},{"at":28,"t":"<b>15 ♔b1?</b> — Vua sang b1 tránh cột c. Nước phòng thân này ở thế khác thì hữu ích, nhưng ở đây Trắng không còn nhịp để tiêu; Đen dùng ngay lượt đó đưa Mã ra c5."},{"at":31,"t":"<b>16…d5!</b> — Phản đòn kinh điển: đối thủ đánh ở cánh thì mình phá ở trung tâm. Tốt d5 đâm vào e4, mà e4 chỉ có ♕f3 và ♘g3 đỡ. Đúng là tốt d5 chắn mất đường chéo của chính Tượng b7, nhưng đó là món đổi có tính: <b>17 exd5 ♗xd5</b> và Tượng lại đứng ngay giữa bàn, đường chéo b7–h1 thông trở lại."},{"at":32,"t":"<b>17 f5!?</b> — Trắng không giữ trung tâm mà đẩy tiếp, chấp nhận mở toang mọi thứ. Sau <b>17…dxe4</b> Trắng kém một tốt, và tốt e4 của Đen không còn tốt Trắng nào trên các cột d, e, f chặn đường — nó thành tốt thông."},{"at":37,"t":"<b>19…g6!</b> — Tốt g6 đuổi Mã f5 đúng lúc Trắng đang dồn quân về cánh Vua. Con Mã có bảy ô để đi nhưng Trắng chọn <b>20 ♘xe7</b>, tức là tự đổi bớt quân tấn công; đổi xong thì cuộc tấn công hết đà, còn Đen vẫn giữ nguyên tốt hơn."},{"at":39,"t":"<b>20…♕xe7</b> — Kiểm kê đúng trên bàn: Trắng còn 5 tốt (a2, b2, c2, g5, h2), Đen còn 6 (a6, b4, e4, f7, g6, h7), và tốt e4 là tốt thông. Vua Đen chưa nhập thành nhưng cũng chưa bị dọa gì cụ thể. Từ đây mọi kế hoạch của Đen đều xoay quanh tốt e."},{"at":44,"t":"<b>23 ♖f6</b> — Xe cắm sâu vào f6 và không ăn được: đếm trên bàn, nó bị Hậu e7 đánh một lần nhưng có ♕f4 và tốt g5 đỡ hai lần. Từ f6 nó quét cả hàng 6 — g6 và a6 — nên Đen không thể mặc kệ, và Fischer trả lời bằng cách đưa Xe vào giữa bàn."},{"at":49,"t":"<b>25…e3</b> — Tốt thông bước tiếp. Nó chia đôi thế cờ Trắng và buộc quân Trắng phải ở lại canh chừng thay vì đi làm việc khác — đó mới là giá trị thật của một tốt thông, không phải chuyện phong Hậu."},{"at":51,"t":"<b>26…♖d2</b> — Xe xuống hàng 2 và kiểm được ngay: <b>không một quân Trắng nào với tới ô d2</b> (Hậu f4 bị chính tốt e3 của Đen chắn đường chéo). Xe vừa đánh tốt c2 vừa làm quân đỡ thứ hai cho Mã d7 đang bị Tượng g4 nhắm."},{"at":52,"t":"<b>27 ♗xd7</b> — Trắng đành đổi Tượng lấy Mã. Mấy đòn nhìn hấp dẫn đều là cho không: <b>27 ♖xf7? ♖xf7</b> (f7 có Xe f8, Vua g8 và Hậu e7 đỡ) hay <b>27 ♖xg6+? hxg6</b> đều mất đứt cây Xe."},{"at":57,"t":"<b>29…♕c5!</b> — Đề nghị đổi Hậu, và Hậu ở c5 không bị quân Trắng nào đánh. Đen hơn tốt nên càng ít quân càng dễ; đổi Hậu cũng cắt luôn mọi hy vọng phản công quanh Vua Đen. Đây là cách chơi hơn tốt: đơn giản hoá."},{"at":58,"t":"<b>30 ♕c4</b> — Trắng đành đi tới chỗ đổi. Hậu Đen ở c5 không bị quân nào đánh, nên muốn tránh đổi thì Trắng phải bỏ mặc nó đứng giữa bàn. Sau <b>30…♕xc4 31 bxc4</b> Hậu rời bàn, Đen vẫn hơn một tốt và tốt thông e3 vẫn đứng đó."},{"at":61,"t":"<b>31…♖d4</b> — Xe nhảy vào d4, ô mà không quân Trắng nào với tới, và từ đó nó đánh cùng lúc hai tốt <b>c4</b> và <b>h4</b> — cả hai đều không có ai đỡ. Trắng cứu tốt c bằng 32 c5, nên Đen ăn tốt kia: <b>32…♖xh4</b>."},{"at":73,"t":"<b>37…♖e6!</b> — Lại đề nghị đổi, lần này là Xe — và kiểm trên bàn: Xe d6 của Trắng <b>không có quân nào giữ</b>, còn Xe e6 của Đen thì có Tượng c8 và tốt f7 đỡ. Trắng đang bám vào tốt thông c6; đổi bớt Xe là cách rẻ nhất để dập tốt đó."},{"at":83,"t":"<b>42…e2</b> — Tốt vào e2, chỉ còn một bước tới đích, và Xe f2 đứng ngay sau đỡ nó. Trắng phải để một quân đứng canh ô e1 vĩnh viễn."},{"at":85,"t":"<b>43…♗f5</b> — Tượng nhắm vào Mã d3 — đúng cái quân <b>duy nhất</b> còn canh ô phong e1 (Xe d4 muốn xuống d1 thì lại bị chính con Mã ấy chắn cột). Trắng không gỡ được cả hai việc nên phải chạy đua bằng tốt c."},{"at":87,"t":"<b>44…♖f3</b> — Fischer không phong vội. <b>44…e1♕? 45 ♘xe1</b> là đổi Hậu mới phong lấy một con Mã, mà tốt c7 của Trắng thì vẫn sống. Thay vào đó Xe sang f3 đánh Mã d3 lần thứ hai và cứ để Trắng phong — vì ô c8 chính là chỗ Tượng Đen quay về ăn."},{"at":89,"t":"<b>45…♗xc8</b> — Trắng phong Hậu rồi mất Hậu ngay: tốt c chỉ đổi được lấy một Tượng. Đếm lại: Trắng còn 3 tốt (a2, c2, g5), Đen còn 6 (a6, b4, e2, f7, g6, h7) — hơn ba tốt, và tốt e2 vẫn còn nguyên."},{"at":107,"t":"<b>54…♖e6</b> — Đây là nước cuối được in trong chương và sách không ghi kết quả, nên chỉ mô tả thế cờ: Đen còn Xe và ba tốt (a6, f7, g5) đấu Xe và một tốt a4 của Trắng. Xe e6 vừa đỡ tốt a6 vừa chặn ngang hàng 6, và kiểm được ngay trên bàn: Vua Trắng ở c5 chỉ còn bốn ô là <b>♔d5, ♔d4, ♔c4, ♔b4</b> — b6, c6, d6 đều bị cấm, nên nó bị đẩy ra xa hẳn cánh Vua."}]},"16":{"tiv":"Bốn Hậu","ctx":"Fischer cầm Trắng gặp Petrosian ở giải Ứng viên 1959, khai cuộc Caro-Kann. Đen đổi Tượng lấy Mã từ sớm rồi dựng bức tường tốt c5–d4–e5 khoá cứng trung tâm; hai bên nhập thành hai cánh khác nhau, nên ván cờ thành cuộc đánh nhau ở hai cánh. Fischer mở cánh Hậu bằng a3–b4, Petrosian giữ được thế và còn ăn tốt b4. Sang tàn cuộc, mỗi bên phong thêm một Hậu và có lúc bốn Hậu cùng đứng trên bàn. Biên bản trong chương dừng ở nước 48; kết quả được ghi là hòa.","end":"Ba điều đáng nhớ. Trung tâm khoá cứng thì không ai phá được ở giữa, nên ván cờ tự chuyển sang hai cánh — và bên nào mở được cột trước thì bên đó có việc làm; ở đây cột b bị chính tốt b4 của Trắng bịt, nên cột a mới là cột thật. Khi có nhiều Hậu trên bàn, mọi tính toán bắt đầu từ chỗ Vua nào ít bị chiếu hơn, chứ không phải ai hơn quân — điều đó lý giải vì sao Vua Đen dám đi bộ từ b6 lên c5 rồi b3. Và tàn cuộc Hậu thì đừng đếm tốt, hãy đếm số ô Vua mình còn đi được: ở nước cuối, Vua Trắng ở g3 không còn một ô nào.","notes":[{"at":5,"t":"<b>3…♗g4</b> — Tượng ra g4 trước khi bịt tốt e6. Nó ghim ♘f3 vào ♕d1 (đường chéo g4–f3–e2–d1, ô e2 trống): Mã f3 chưa bị ghim vào Vua nên vẫn đi được, nhưng đi thì Hậu Trắng lộ ra. Đây là lý do Trắng phải hỏi Tượng ngay bằng 4 h3."},{"at":7,"t":"<b>4…♗xf3</b> — Đen đổi Tượng lấy Mã ngay. Được: bớt một quân tấn công của Trắng và buộc Trắng dùng Hậu bắt lại từ rất sớm. Mất: Trắng có cặp Tượng, mà trong thế cờ sắp khoá lại thì Tượng dài hơi hơn Mã. Rút Tượng cũng chơi được: <b>4…♗h5 5 exd5 cxd5 6 ♗b5+ ♘c6 7 g4 ♗g6 8 ♘e5</b> — Trắng lấy nhịp bằng tốt và chiếm ô e5. Nhưng đừng tưởng bắt được Tượng: ở cuối biến này Tượng g6 vẫn còn năm ô để rút."},{"at":15,"t":"<b>8…d4</b> — Tốt lên d4 đuổi Mã c3 và khoá trung tâm. Lúc này ♘c3 bị đánh hai lần (Tượng b4 và tốt d4) và có sáu ô để chạy: d5, b5, a4, e2, d1, b1. Fischer chọn ô lùi xa nhất. Từ đây thế cờ thành trận địa: không bên nào phá được ở giữa, nên cả hai phải đi tìm việc ở hai cánh."},{"at":17,"t":"<b>9…♗xd2+</b> — Đổi nốt Tượng đen, Đen tự tay trao hẳn cặp Tượng cho Trắng. Cái giá Trắng phải trả nằm ở đường đi của con Mã: <b>♘b1–c3 (nước 2), ♘c3–b1 (nước 9), ♘b1xd2 (nước 10)</b> — ba nước để tới một ô cách chỗ xuất phát đúng một nhịp Mã."},{"at":21,"t":"<b>11…c5</b> — Bức tường tốt c5–d4–e5 dựng xong. Hãy đếm việc của Tượng g2: nó chỉ với tới được <b>bốn ô — f1, f3, h1, h3</b>, vì chính tốt e4 của Trắng bịt đường chéo dài. Đổi lại, bức tường cho Trắng một mục tiêu rất rõ: đánh vào chân tường bằng b4."},{"at":27,"t":"<b>14…0-0-0</b> — Đen nhập thành cánh Hậu, tức là đưa Vua tới đúng cánh mà tốt Trắng sắp tràn qua. Đổi lại, Vua đứng cạnh trung tâm đã khoá và Xe vào cột d ngay lập tức."},{"at":31,"t":"<b>16…cxb4</b> — Đen ăn trước. Nếu Trắng bắt lại ngay <b>17 axb4</b> thì vật chất cân bằng và cột a mở ra cho Xe a1. Fischer lại chèn 17 ♘c4? vào giữa, nên Đen được cầm tốt thừa thêm hai nước và kịp xếp lại quân."},{"at":32,"t":"<b>17 ♘c4?</b> — Mã ra c4 trông năng động nhưng chưa tạo được đe doạ cụ thể nào, trong khi ở d2 nó đang giữ ô e4. Lấy tốt lại ngay đơn giản hơn: <b>17 axb4 ♘xb4 18 ♖xa7</b> — <b>tốt a7 không có một quân Đen nào giữ</b>, nên vật chất trở lại cân bằng và Xe Trắng vào hàng 7 ngay cạnh Vua Đen."},{"at":33,"t":"<b>17…f6!</b> — Tốt f6 chống đỡ tốt e5, tức là giữ nguyên bức tường. Nếu Đen buông ra: <b>17…exf4 18 gxf4 ♘d6 19 ♘xd6+ ♖xd6 20 e5</b> — cặp tốt e5+f4 của Trắng tràn lên và tường tốt Đen biến mất. Chừng nào e5 còn đứng thì Mã c4 và Hậu Trắng không có ô nào để nhảy vào giữa bàn."},{"at":39,"t":"<b>20…♘b5!</b> — Mã từ c7 ra b5, đứng chặn ngay cột b trước mặt Vua mình và nhắm ô c3. Nói cho công bằng: <b>20…♘xb4</b> ăn tốt luôn cũng được, vì lúc này <b>tốt b4 không có quân Trắng nào giữ</b> mà lại bị Mã c6 và Hậu e7 nhắm. Petrosian chọn cách chặn cột. Trắng đổi 21 ♘xc6, và sau 21…bxc6 Vua Đen mất lớp tốt b7 — nhưng cột b lại bị chính tốt b4 của Trắng bịt, nên cột nguy hiểm thật sự là cột a."},{"at":47,"t":"<b>24…♕xb4</b> — Hậu ăn tốt b4 và <b>không có quân Trắng nào đánh tới ô b4</b>, nên đây là tốt ăn không. Đen dẫn lại một tốt. Cái giá là Hậu rời cánh Vua đúng lúc Trắng chuẩn bị 25 ♖f7+."},{"at":50,"t":"<b>26 ♕f2!</b> — Hậu về f2 đứng trên đường chéo f2–e3–d4–c5–b6, tức là ngắm thẳng Vua Đen ở b6. Hệ quả cụ thể: <b>tốt d4 của Đen bị ghim cứng</b> — nó không được nhúc nhích, vì đi là hở Vua ra cho Hậu f2. Từ đó tốt c2 mới lên c4 đánh Mã b5 được. Hậu f2 và Xe f7 cùng làm việc trên một cánh — đây là lúc Trắng có thế chủ động rõ nhất trong ván."},{"at":53,"t":"<b>27…♘c3?</b> — Mã nhảy vào c3 trông hung nhưng không dọa gì đủ nặng. Nước đúng là <b>27…♘d6!</b>: từ d6 con Mã cùng lúc <b>đánh Xe f7, đánh tốt c4 và đánh tốt e4</b>, mà bản thân nó không bị quân nào đánh — Trắng phải bỏ dở kế hoạch để cứu Xe."},{"at":58,"t":"<b>30 ♖xh7!</b> — Xe ăn tốt h7 ngay trước mũi Xe h8. Ý đồ đơn giản: dọn đường cho tốt h5 chạy và kéo quân Đen về giữ nhà, đổi vật chất lấy tốc độ cho tốt biên."},{"at":59,"t":"<b>30…♖df8!</b> — Petrosian không ăn Xe. Lý do đếm được: <b>30…♖xh7 31 ♕xd8+</b> — Hậu ăn Xe d8 và vẫn là nước <b>chiếu</b> (d8–c7–b6), Đen chỉ còn đúng bốn nước hợp lệ (♔b7, ♔a7, ♔a6, ♖c7) và mất hẳn một Xe. Nên Đen đưa Xe kia sang f8 đánh Xe f1: cả hai bên đều nhắm quân đối phương chứ không ai giữ, và loạt đổi sau đó gần như bắt buộc — kết quả là bàn cờ sạch quân nặng, chỉ còn Hậu và tốt biên."},{"at":69,"t":"<b>35…a1=♕</b> — Tốt a của Đen về đích. Cùng lúc tốt h Trắng đang ở h6 và cũng sắp tới nơi. Đây là cuộc chạy đua ở hai đầu bàn cờ, và cả hai đều tới đích."},{"at":71,"t":"<b>36…♕d6?</b> — Bỏ lỡ đòn có sẵn. <b>36…♘e2+</b> là nước chiếu mà <b>Tượng f1 không được phép ăn</b>: Hậu a1 đang ghim nó vào Vua g1 dọc hàng 1. Vua Trắng chỉ còn bốn ô, và Đen ăn đứt Tượng cùng hai tốt: <b>36…♘e2+ 37 ♔f2 ♘xg3 38 h8=♕ ♕xf1+ 39 ♔xg3 ♕xd3+</b>."},{"at":72,"t":"<b>37 h8=♕</b> — Bốn Hậu cùng trên bàn. Với ngần ấy hoả lực, nước chiếu có ở khắp nơi cho cả hai bên, nên không ai dám bỏ Vua mình đứng trống trong khi đi ăn quân."},{"at":75,"t":"<b>38…♔c5!</b> — Vua Đen tự bước ra giữa bàn, đi về phía có tốt d4 và Mã c3 che chắn. Khi trên bàn có bốn Hậu thì nấp trong góc cũng không an toàn hơn — Vua phải tự đi tìm chỗ ít bị chiếu nhất."},{"at":93,"t":"<b>47…♕xe4!</b> — Nhìn thì như cho không, vì tốt d3 đang giữ ô e4. Nhưng <b>48 dxe4 ♘xe4+!</b> — Mã ăn lại có chiếu Vua g3 và <b>đồng thời chĩa vào Hậu d2</b>, nên Trắng không được phép ăn. Sau nước này vật chất cân bằng trở lại, còn Vua Trắng thì trơ ra giữa bàn."},{"at":94,"t":"<b>48 ♕f2?</b> — Bỏ qua đúng cái nước phá được đòn ghim–chĩa của Đen: <b>48 ♕xc3+!</b>. Ăn Mã c3 trước rồi mới ăn Hậu: <b>48 ♕xc3+ ♔xc3 49 dxe4</b> (hoặc <b>48 ♕xc3+ dxc3 49 dxe4</b>) — hết Mã thì không còn ♘xe4+ nữa, và trên bàn Trắng còn Tượng cùng ba tốt chọi ba tốt trơ trọi của Đen."},{"at":95,"t":"<b>48…♕h1!</b> — Hậu vào góc h1, nấp sau Tượng f1 và đánh chính Tượng đó. Chi tiết đáng đếm hơn: <b>Vua Trắng ở g3 không còn một ô nào để đi</b> — cả 22 nước hợp lệ của Trắng đều là nước Hậu, Tượng hoặc tốt. Đây là nước cuối được in trong chương."}]},"17":{"tiv":"Trượt trong gang tấc","ctx":"Giải Ứng viên 1959, Fischer mới 16 tuổi, cầm Trắng gặp Tal. Trắng chơi Phòng thủ Sicilia với <b>6 ♗c4</b> — Tượng chĩa thẳng vào f7 để đánh nhanh chứ không xây thế lâu dài. Fischer đẩy f4–f5, đưa Mã vào f5 và có một thế tấn công rất thật vào Vua Đen còn đứng ở e8. Rồi ở nước 14 Trắng đổi mất đúng quân đang làm mọi việc, và ba nước sau bỏ quên con Mã đã trót đi ra a4. Tal ăn quân, đơn giản hoá về tàn cuộc Xe cộng Tượng và đẩy tốt thông thắng.","end":"Hai thứ đáng mang đi. Thứ nhất: quân đi ra rìa bàn cờ thì phải có đường về — Mã a4 ở nước 9 sống thêm đúng chín nước rồi rơi vì một nước Hậu đơn giản, và cả ván cờ lật theo. Thứ hai: đang tấn công thì đừng đổi quân mạnh nhất của mình chỉ để thu lại vật chất; Tượng d5 vừa đánh Xe a8 vừa giữ cho Mã f5 không bị ăn, đổi nó đi là sức ép tan hết trong một nước. Phần tàn cuộc là mẫu chuẩn: Xe đứng SAU tốt thông của mình, Vua đi bộ lên trước, tốt đẩy sau cùng.","notes":[{"at":13,"t":"<b>7…b5!</b> — Đen đẩy tốt b lấy không gian cánh Hậu và dọa ngay …b4 đuổi Mã c3. Tượng Trắng vừa phải lùi về b3 nên hai nhịp Tượng c4–b3 coi như trả không công; câu hỏi đặt ra cho Trắng là Mã c3 sẽ đi đâu."},{"at":15,"t":"<b>8…b4!</b> — Tốt tới b4 đuổi Mã c3, và đây là điểm cần đếm: <b>ô e4 lúc này chỉ có đúng một quân giữ, chính là ♘c3</b>. Đuổi được nó là ăn được tốt trung tâm. Fischer chọn <b>9 ♘a4</b> — chỗ xa Vua Đen nhất trong các chỗ có thể — và con Mã sẽ đứng nguyên ở đó tới lúc chết."},{"at":17,"t":"<b>9…♘xe4</b> — Tal cầm tốt luôn. Sau 9 ♘a4, <b>ô e4 không còn một quân Trắng nào giữ</b>: Mã c3 đã đi rồi, Hậu d1 bị Mã d4 chắn, Tượng b3 nhìn hướng khác. Fischer không lấy lại mà nhập thành, coi tốt e4 là giá của một thế tấn công."},{"at":19,"t":"<b>10…g6?</b> — Đen định đưa Tượng ra g7, nhưng nước này cho tốt f Trắng một mục tiêu. Vua Đen vẫn ở e8, Tượng b3 đã nằm sẵn trên đường chéo a2–g8, và cột f sắp mở ra đúng chỗ đó."},{"at":20,"t":"<b>11 f5!</b> — Đẩy ngay, không chuẩn bị gì thêm. Để yên thì fxe6 phá lớp tốt trước mặt Vua; ăn thì cột f mở cho Xe f1. Tal ăn bằng tốt g, giữ lớp tốt e6 lại — vì mở tốt e6 ra là mở luôn đường Tượng b3 xuống f7."},{"at":22,"t":"<b>12 ♘xf5!</b> — Mã lao vào f5 và rất khó ăn. Đếm f7: <b>ô f7 chỉ có mỗi Vua e8 canh</b>. Nên nếu <b>12…exf5 13 ♗xf7+</b>, Đen chỉ còn ba nước hợp lệ (♔xf7, ♔e7, ♔d7) và Vua bị lôi ra giữa bàn. Tal từ chối cả một quân, chơi 12…♖g8 — đủ hiểu ông đánh giá thế tấn công này thế nào."},{"at":24,"t":"<b>13 ♗d5!</b> — Tượng vào giữa bàn cờ và đánh hai chỗ một lúc: <b>♘e4 không có một quân Đen nào giữ</b>, còn Xe a8 nằm cuối cùng đường chéo d5–a8. Nó lại vẫn tì vào tốt e6, nên e6 vẫn không dám ăn Mã f5."},{"at":26,"t":"<b>14 ♗xe4?</b> — Trắng vội thu quân, và đổi mất đúng quân đang làm mọi việc. Sau 14…exf5 15 ♗xf5 vật chất về cân bằng, Tượng Trắng phải đứng chắn ngay giữa cột f của Xe mình, và Vua Đen dù chưa nhập thành thì cũng chẳng còn ai đe doạ."},{"at":32,"t":"<b>17 ♗f4?</b> — Nước làm mất Mã, vì nó không giải quyết chuyện con Mã a4 đang đứng trơ. Ba nước Mã đều hỏng: <b>17 ♘c3 bxc3</b> tốt b4 ăn không; <b>17 ♘c5 dxc5</b> cũng thế; <b>17 ♘b6 ♕c5+!</b> chiếu Vua g1 và chĩa luôn vào Mã b6. Nước giữ được Mã là <b>17 b3</b> — lấy tốt b che cho nó, và thế cờ còn cân bằng."},{"at":33,"t":"<b>17…♕c6!</b> — Một nước Hậu đánh hai đầu: đường chéo c6–a4 chạm vào <b>Mã a4 không có quân nào giữ</b>, đường chéo c6–g2 chạm vào <b>g2 chỉ có Vua g1 canh</b>. Trắng đỡ được một, không đỡ được cả hai — từ đây mọi nước của Trắng đều là nước của bên đã kém quân."},{"at":35,"t":"<b>18…♕xa4!</b> — Đen cứ ăn. Trắng phản công bằng 19 ♗xd6 đánh Xe e7, nhưng 19…♕c6 mời đổi Hậu rồi 20…♕b6+ và 21…♕xb8 lấy lại con Mã vừa mất. Kết cục: Đen hơn một Tượng, kém một tốt — quá đủ."},{"at":45,"t":"<b>23…♗e7</b> — Xe vào e1 chiếu, và Đen chỉ có <b>đúng ba nước hợp lệ</b>: ♔d8, ♗e7, ♕e5. Tal chắn bằng Tượng, chấp nhận để Trắng vào 24 ♖xf7 — vì ông đã tính được nước Vua ở hai nhịp sau."},{"at":49,"t":"<b>25…♔f8!</b> — Bị chiếu, Vua chỉ có ba ô, và hai ô kia thua ngay: <b>25…♔e8?? 26 ♕xg8#</b> chiếu hết; <b>25…♔g7? 26 ♕xd7</b> — Xe d7 vốn đã không ai giữ, mà ăn xong Hậu d7 lại đánh tiếp Tượng e7 <b>đang bị đánh hai lần (♕d7 và ♖e1) mà không có quân nào đỡ</b>. Chỉ f8 mới cứu: ở đó chính Vua đỡ Tượng e7, nên Trắng chỉ lấy lại được Xe."},{"at":50,"t":"<b>26 ♕xd7</b> — Chốt sổ vật chất sau cơn bão: Trắng còn <b>Hậu + Xe + 5 tốt</b>, Đen còn <b>Hậu + Xe + Tượng + 3 tốt</b>. Đen hơn một Tượng, kém hai tốt. Với Hậu còn trên bàn thì con số ấy chưa đủ để thắng ngay, nhưng nó là cái Tal sẽ mang về tàn cuộc."},{"at":54,"t":"<b>28 c3!</b> — Hết đường tấn công, Trắng quay sang chỗ duy nhất còn cứu được: đám tốt cánh Hậu của Đen. Đổi ở b4 xong thì Đen chỉ còn một tốt b, mà tốt b2 của Trắng lại đứng chắn ngay trước mặt nó."},{"at":63,"t":"<b>32…♕c6+</b> — Đây là hoá đơn của nước <b>32 g3?</b>. Khi tốt còn ở g2 thì chính nó bịt đường chéo c6–h1; tốt vừa rời đi là nước Hậu này thành nước CHIẾU. Trắng buộc phải chắn bằng 33 ♖e4, Đen đổi Hậu ngay và về đúng tàn cuộc mình muốn."},{"at":67,"t":"<b>34…♖b6!</b> — Xe đứng sau tốt b của mình. Đứng thế thì Xe không phải nhúc nhích nữa, và Đen rảnh tay dắt Vua đi bộ lên: f6–e5–d5."},{"at":78,"t":"<b>40 ♖c2?</b> — Xe rời c4, chỗ nó đang đánh tốt b4 và bắt Xe b6 phải ngồi giữ. Về c2 nó chỉ còn mỗi việc canh tốt b2, và Đen chơi ngay 40…♗e5 để dán nó vào đó."},{"at":87,"t":"<b>44…♗d4!</b> — Tượng chốt ở d4 nhìn thẳng vào b2. Trắng phải đỡ bằng 45 a3, Đen trả lời 45…b3 rồi ăn nốt tốt b2 ở nước 46 — từ lúc đó tốt b là tốt thông thật, không còn ai đứng trước mặt."},{"at":90,"t":"<b>46 ♖c8?</b> — Nước buông tốt b2. Ở thế đó <b>b2 chỉ có Xe c2 giữ, mà Tượng d4 đang nhắm thẳng vào nó</b>; Xe vừa rời hàng 2 là 46…♗xb2 ăn không. Giữ Xe lại trên hàng 2 (46 ♖d2 hay 46 ♖g2) thì Trắng còn cầm cự thêm được."},{"at":103,"t":"<b>52…b2!</b> và Trắng xin thua. Đếm thử các cách chặn ô b1: Xe b5 <b>không xuống được b1 vì chính Vua Trắng ở b4 đang bịt cột b</b>; Vua không vào b3 được (Xe c3 canh ô đó); còn nếu 53 ♔xc3 thì 53…b1=♕+ — Đen phong Hậu kèm chiếu, còn Hậu + Tượng + tốt chọi Xe + ba tốt."}]},"18":{"tiv":"Rượu cũ bình mới","ctx":"Mar del Plata 1960. Spassky mở bằng Gambit Vua — khai cuộc của thế kỷ 19, thí một tốt để lấy trung tâm và cột f. Fischer nhận tốt rồi giữ chặt bằng …g5 và …g4 theo đúng cách chơi kinh điển, và còn ăn thêm tốt e4 nữa. Cái giá là cánh Vua Đen không còn tốt nào che, và sau khi nhập thành thì chính chỗ đó thành mục tiêu. Spassky dồn Hậu cùng hai Xe vào cột e và cột f, đuổi Hậu Đen chạy vòng quanh; Fischer xin thua ở nước 29 trong khi trên bàn vẫn đang hơn một tốt.","end":"Bài học không nằm ở khai cuộc mà ở chỗ đếm nhầm cái gì quan trọng. Đen hơn tốt gần như suốt ván và vẫn thua, vì những con tốt bị mang đi đổi lấy vật chất chính là mái nhà của Vua. Chi tiết kỹ thuật đáng chép lại là nước 19…♗f8: một nước làm hai việc — đánh vào Tượng d6 và dọn cột g cho Xe g8 nhìn xuống Hậu g3 — trong khi Tượng d6 lại đang là quân duy nhất giữ chính Hậu đó. Cuối ván là hình ảnh ngược lại: Hậu Đen ở h4 bị đẩy đi đẩy lại, không có ô nào đứng yên được.","notes":[{"at":5,"t":"<b>3…g5</b> — Đen giữ con tốt vừa ăn. Chuỗi g5 đỡ f4 là cách chơi kinh điển chống Gambit Vua: còn tốt f4 thì cột f của Trắng chưa mở được. Cái giá phải trả là cánh Vua Đen hở ra ngay từ nước thứ ba."},{"at":6,"t":"<b>4 h4</b> — Trắng đâm thẳng vào chuỗi đó. Đen không giữ nổi g5 nên đẩy tiếp 4…g4 đuổi Mã f3, và từ đây tốt g Đen coi như đã rời hẳn khỏi nhà Vua."},{"at":16,"t":"<b>9 ♘c3?</b> — Mã ra c3 ngay dưới họng Mã e4. Sau 9…♘xc3 10 bxc3 Trắng có hai tốt chồng ở cột c, vẫn kém một tốt, và đổi lại chỉ được một cột b nửa mở — quá ít cho một ván gambit."},{"at":19,"t":"<b>10…c5</b> — Đen đánh ngay vào d4, thứ duy nhất đang giữ trung tâm cho Trắng. Đổi ở d4 xong thì tốt c3 đứng trơ ra, và về sau chính nó bị ăn nốt."},{"at":20,"t":"<b>11 ♗e2</b> — Tượng không ra c4 mà về e2, và lý do nằm trên một đường thẳng: <b>từ e2 nó nhìn qua f3 tới đúng tốt g4</b> — đầu chuỗi tốt thừa của Đen, lúc này chỉ có Tượng c8 giữ. Hai nước sau Trắng đổi đúng ở đó: 13 ♗xg4 rồi 14 ♗xc8."},{"at":23,"t":"<b>12…♘c6</b> — Fischer phát triển, nhưng trên bàn đang có một tốt cho không: <b>12…♕xh4</b>, vì <b>tốt h4 không có một quân Trắng nào giữ</b> và đường d8–h4 hoàn toàn trống. Đuổi Hậu cũng chẳng được gì: <b>12…♕xh4 13 ♗g5 ♕h5</b>. Ăn xong Đen hơn hẳn hai tốt."},{"at":29,"t":"<b>15…f5</b> — Đen chặn Hậu g4 bằng tốt f, giữ nguyên quân. Nhưng từ giờ Vua Đen chỉ còn hai tốt f5 và h7 làm mái nhà, mà tốt f5 lại đứng đúng trên cột của Xe f1."},{"at":33,"t":"<b>17…♔h8</b> — Vua bước sang h8 để dọn ô g8 cho Xe. Kế hoạch của Đen rõ ràng: đưa Xe lên g8 tì vào Hậu g3."},{"at":34,"t":"<b>18 ♔h1?</b> — Trắng cũng đi Vua, nhưng nước này không làm gì cả. Năm nước sau, khi bị 22…♕xh4+, Vua lại phải quay về g1 — hai nhịp mất trắng đúng lúc Đen đang xếp quân."},{"at":35,"t":"<b>18…♖g8</b> — Xe lên g8. Đếm cột g: giữa Xe g8 và Hậu g3 giờ <b>chỉ còn đúng một quân, và đó là Tượng g7 của chính Đen</b>. Nên nước tiếp theo của Đen chắc chắn phải là một nước Tượng."},{"at":37,"t":"<b>19…♗f8!</b> — Một nước hai việc, và cả hai đều đếm được. Tượng lùi f8 đánh Tượng d6 (Tượng d6 lúc này bị <b>♕d8 và ♗f8 nhắm cùng lúc</b>), đồng thời dọn ô g7 nên Xe g8 chĩa thẳng xuống Hậu g3 — mà <b>♕g3 chỉ có mỗi ♗d6 che</b>. Đổi ở f8 là hỏng ngay: <b>20 ♗xf8?? ♖xg3</b> và Đen ăn đứt Hậu."},{"at":41,"t":"<b>21…♖g7!</b> — Xe từ g8 lùi về g7 chắn chiếu trên đường chéo a1–h8. Chắn bằng Xe là hợp lý: nó vẫn nằm trên cột g và vẫn đỡ tốt h7 — nhưng cũng từ đây con Xe này bị dán chặt vào chỗ ấy."},{"at":42,"t":"<b>22 ♖xf5</b> — Xe ăn tốt f5, và <b>không quân Đen nào với tới ô f5</b> nên đây là tốt ăn không. Chỉ có điều ăn xong thì tốt h4 của chính Trắng hở ra: nó <b>không còn ai giữ</b> mà Hậu d8 lại nhìn thẳng vào."},{"at":43,"t":"<b>22…♕xh4+</b> — Đen ăn tốt h4 kèm chiếu và giữ được chênh lệch một tốt. Vấn đề là Hậu ra rìa bàn cờ một mình, xa hẳn phần còn lại của quân Đen — đây là quân sẽ bị săn suốt đoạn cuối."},{"at":45,"t":"<b>23…♕g4?</b> — Hậu tới g4 đánh tốt g2, nhưng g2 đã có Vua g1 đỡ nên đe doạ này rỗng. Trắng thêm quân giữ bằng <b>24 ♖f2</b> (g2 thành hai người canh), rồi <b>25 ♖e4</b> đánh thẳng vào Hậu ở g4. Hai nước ấy Trắng vừa xếp quân vừa được nhịp, còn Đen chỉ chạy."},{"at":47,"t":"<b>24…♗e7</b> — Tượng về e7 để dọn chỗ nghỉ cho Hậu: đứng ở e7 nó che cả <b>g5 lẫn h4</b>, đúng hai ô mà Hậu Đen sẽ phải nhảy qua lại trong phần còn lại của ván."},{"at":50,"t":"<b>26 ♕d4!</b> — Hậu vào d4 và <b>ghim Xe g7 vào Vua h8</b> trên đường chéo a1–h8. Xe g7 không nhúc nhích được nữa, nên nó vẫn mang tiếng là quân phòng thủ mà thực ra chỉ đứng đó."},{"at":51,"t":"<b>26…♖f8?</b> — Xe c8 đi sai địa chỉ. Hai nước sau nó vẫn phải về d8, mà d8 thì đã đi thẳng được ngay từ đây. Trong thế bị dồn, một nhịp là quá nhiều."},{"at":52,"t":"<b>27 ♖e5!</b> — Xe đâm vào Hậu g5. Hậu có <b>Tượng e7 và Xe g7</b> đỡ, nhưng đổi Hậu lấy Xe vẫn là món hời cho Trắng, nên Đen buộc phải tìm phản đòn chứ không được đứng yên."},{"at":53,"t":"<b>27…♖d8</b> — Cách chống đúng: Xe chĩa vào Hậu d4, nên ♖xg5 sẽ bị ♖xd4 trả lại ngay. Đen gỡ được nước này, nhưng đã mất hai nhịp cho chuyến đi c8–f8–d8."},{"at":55,"t":"<b>28…♕h4</b> — Hậu lại bị Xe e5 đánh và phải chạy tiếp. Nó có 14 nước, nhưng chỉ hai ô còn được Tượng e7 che tới là <b>f6 và h4</b>; Fischer chọn h4 — và ở đó nó vẫn không yên được một nước nào."},{"at":56,"t":"<b>29 ♖f4</b> và Đen xin thua. Trên bàn: Hậu h4 <b>bị ♖f4 đánh và chỉ có ♗e7 đỡ</b>, nên đổi ở h4 là Đen mất Hậu lấy Xe; ăn lại cũng không xong vì <b>29…♕xf4 30 ♕xf4</b> — Xe f4 có <b>Hậu e4 và Mã d3</b> cùng đỡ. Đáng chú ý: lúc bỏ cuộc Đen vẫn hơn một tốt — vấn đề không phải vật chất mà là Vua không còn ai bảo vệ."}]},"19":{"tiv":"Hành trình dài về nhà","ctx":"Reykjavik 1960, Fischer cầm Đen chơi Phòng thủ Grünfeld. Trắng chọn cách dựng chắc chắn với e3 rồi c4, nhưng dựng chậm: Hậu ra b3 xong lại về c2, Tượng đi tới ba lần mới yên chỗ. Fischer đổi ở c4 rồi phá trung tâm bằng …e5, đưa Mã vào g4 và dồn hết sức nặng vào ô f2 cùng đường chéo a7–g1. Một nước đẩy tốt e4 sai lúc mở toang đúng đường chéo ấy; Fischer ăn chất, đổi sạch quân nặng và Trắng xin thua khi Xe Đen vào hàng hai.","end":"Đây là bài mẫu về giá của nhịp trong khai cuộc. Trắng đi Hậu hai lần, Tượng ba lần mà không được gì; Đen dùng đúng số nhịp tiết kiệm được để phá trung tâm bằng …e5 rồi tràn vào. Chi tiết đáng nhớ nhất là nước 16 e4: nhìn thì tự nhiên vì nó chặn Tượng f5, nhưng đẩy một tốt là bỏ trống ô nó vừa đứng — e3 trống ra thì đường chéo a7–g1 chạy thẳng tới Vua, và ♕d4+ kèm ♘f2+ tới ngay sau đó. Trước khi đẩy tốt, hãy nhìn cái ô nó để lại.","notes":[{"at":4,"t":"<b>3 e3</b> — nước dựng chắc, nhưng nó khóa chính Tượng c1 vào sau hàng tốt. Hậu quả cụ thể tới ở nước 11: khi Trắng cần một quân giữ tốt e5, nước tự nhiên nhất là <b>♗f4</b> — và trên bàn cờ nó <b>không hợp lệ</b>, vì tốt e3 chắn đường. Con Tượng ấy phải chờ tới hết ván mới có việc."},{"at":10,"t":"<b>6 ♕b3</b> — Hậu ra sớm, nhắm vào d5 và b7. Ý này quen thuộc trong các thế Grünfeld, nhưng ở đây Trắng đã chơi e3 nên Tượng c1 còn kẹt sau hàng tốt, và Hậu đứng b3 rồi sẽ còn phải đi thêm lần nữa."},{"at":11,"t":"<b>6…e6</b> — Đen chọn cách chắc: giữ tốt d5 bằng tốt e. Cái giá là Tượng c8 bị bịt lại, và con tốt e sẽ phải đi hai lần mới lên được e5 — Fischer chấp nhận trả giá đó vì Trắng cũng đang chậm."},{"at":14,"t":"<b>8 ♕c2</b> — Hậu về c2, nhịp thứ hai cho cùng một quân. Đen dùng ngay lượt của mình để <b>8…dxc4 9 ♗xc4</b>, bắt Tượng phải đi thêm một lần nữa. Đếm sổ khai cuộc: tới đây Trắng đã tiêu ba nhịp cho Hậu và Tượng mà quân cánh Vua vẫn nguyên chỗ."},{"at":17,"t":"<b>9…e5!</b> — nước Đen chờ từ đầu, và nó đứng vững vì tính được. Nếu <b>10 ♘xe5 ♘xe5 11 dxe5</b> thì <b>11…♘g4</b>: tốt e5 lúc đó <b>không còn quân Trắng nào giữ</b>, mà Mã g4 và Tượng g7 cùng nhắm vào nó — Đen lấy lại tốt ngay."},{"at":18,"t":"<b>10 dxe5</b> — Trắng đổi bỏ. Giữ trung tâm bằng <b>10 d5</b> thì <b>10…♘a5</b> đánh thẳng vào Tượng c4, quân Trắng lại phải chạy thêm lần nữa. Đổi ở e5 là cách ít phiền nhất, nhưng nó mở toang trung tâm đúng lúc Trắng chưa nhập thành."},{"at":19,"t":"<b>10…♘g4</b> — Đen không vội ăn lại ở e5 mà nhảy Mã vào g4 trước, từ đó chạm cả f2 lẫn e5. Trắng phải lo nhập thành đã, và Đen thu tốt lại ở nước sau bằng <b>11…♘cxe5</b> — ăn muộn một nhịp nhưng ăn kèm lãi."},{"at":20,"t":"<b>11 0-0</b> — Trắng bỏ hẳn ý định giữ tốt e5, và thật ra không giữ được: <b>♗f4</b> bất hợp lệ vì tốt e3, còn <b>11 h3 ♘gxe5 12 ♘xe5 ♘xe5</b> thì vật chất cân bằng lại y hệt ván thật. Con tốt e5 chỉ sống thêm được đúng một nước."},{"at":25,"t":"<b>13…c6</b> — nước tốt nhỏ nhưng đúng việc: lấy mất ô d5 và b5 khỏi tay quân Trắng, đồng thời mở đường chéo cho Hậu d8. Thế Đen từ đây không còn lỗ nào để Trắng bám."},{"at":26,"t":"<b>14 f4</b> — Trắng đuổi Mã e5 và định lấy không gian. Nhưng hãy nhìn đường chéo a7–g1 sau nước này: a7 là tốt Đen, rồi b6, c5, d4 trống trơn, f2 vừa bỏ trống, g1 là Vua Trắng — <b>chỉ còn đúng một tốt e3 bịt giữa</b>. Hai nước nữa chính tốt e3 cũng đi."},{"at":27,"t":"<b>14…♘g4!</b> — Mã lùi về g4 chứ không chạy xa. Từ g4 nó nhìn đúng <b>f2 và e3</b> — hai ô Trắng vừa tự làm yếu."},{"at":29,"t":"<b>15…♗f5!</b> — Trắng vừa h3 đuổi Mã, Đen mặc kệ, vì con Mã g4 lúc này là <b>mồi độc</b>. Tượng f5 chạm thẳng Hậu c2 mà c2 không có quân nào giữ: <b>16 hxg4 ♗xc2</b> ăn Hậu, và <b>16 ♗xg4 ♗xc2</b> cũng vậy. Đen phát triển thêm một quân mà không mất gì."},{"at":30,"t":"<b>16 e4?</b> — Trắng lấy tốt chặn đường chéo b1–h7 để cứu Hậu. Nhưng đẩy tốt là bỏ trống ô sau lưng nó: e3 trống ra, và bây giờ ô <b>d4 không còn quân Trắng nào với tới</b>, trong khi Hậu d8 và Tượng g7 của Đen cùng nhắm vào đó."},{"at":31,"t":"<b>16…♕d4+</b> — Hậu vào ngay ô vừa mở, và Trắng chỉ còn <b>đúng ba nước hợp lệ</b>. Hai nước là hỏng ngay: <b>17 ♗e3 ♕xe3+</b> (Tượng e3 không ai giữ) và <b>17 ♖f2 ♘xf2</b> — ở đây <b>♔xf2 là bất hợp lệ</b> vì Hậu d4 đang ngắm chính ô f2, nên Trắng mất Xe không lấy lại được gì. Còn lại 17 ♔h1."},{"at":34,"t":"<b>18 ♖xf2</b> — Mã f2 không có quân Đen nào giữ, nhưng ba lựa chọn của Trắng đều xấu: 18 ♔h2 và 18 ♔g1 để Mã tiếp tục quần Vua, còn ăn Mã thì <b>18…♕xf2</b> — Đen đổi Mã lấy Xe, tức là được chất, và Hậu ngồi luôn ở f2 sát Vua Trắng."},{"at":37,"t":"<b>19…♗xc3!</b> — Đen bỏ Tượng g7 để đập cấu trúc tốt Trắng, và Trắng buộc phải ăn lại bằng tốt: <b>20 ♕xc3?? ♕xe2</b> mất luôn Tượng e2 (Hậu c2 đang là quân duy nhất giữ nó). Sau <b>20 bxc3</b>, Trắng có hai tốt chồng c2–c3 và cột e trống hẳn cho hai Xe Đen."},{"at":45,"t":"<b>23…♖fe8</b> — Xe thứ hai vào cột e. Vua Trắng bị đẩy ra tới g3, đứng giữa bàn cờ với một Hậu và hai Xe Đen vây quanh, mà Trắng thì không có nước phản công nào để đổi lấy."},{"at":46,"t":"<b>24 ♖b1?</b> — Xe ra cột b nhắm tốt b7. Nhớ kỹ chi tiết này: <b>Xe b1 không hề chạm tới Xe e1 của Đen</b>, vì Tượng c1 đứng chắn giữa hàng 1. Chính con Tượng c1 đang giữ cho hàng cuối của Trắng khỏi vỡ."},{"at":47,"t":"<b>24…gxf5</b> — Đen thu lại con tốt. Về nguyên tắc Trắng lấy được ngay: tốt f5 nằm đúng đường chéo của Tượng d3 và không có quân Đen nào che, nên <b>25 ♗xf5</b> là nước cân bằng vật chất trở lại."},{"at":48,"t":"<b>25 ♗d2?</b> — nước thua ván cờ. Tượng đi đánh Xe e1, nhưng nó <b>rời ô c1</b>, và hàng 1 lập tức thông từ b1 tới e1: <b>25…♖xb1 26 ♕xb1 ♕xb1 27 ♗xb1</b>, đổi sạch quân nặng đúng lúc Trắng đang kém chất."},{"at":53,"t":"<b>27…♖e2</b> và Trắng xin thua — Đen mất một Tượng là chắc chắn, kiểm được từng nước. Xe e2 bắt Tượng d2 không ai giữ; mọi nước Trắng đều để rơi một Tượng, trừ <b>28 ♗c1</b>. Nhưng khi đó <b>28…♖e1!</b>: Tượng c1 vừa bị đánh vừa là quân duy nhất chắn Xe khỏi Tượng b1 — nó nhúc nhích thì ♖xb1, nó đứng yên thì ♖xc1. Còn Xe chọi Tượng thì không có gì để chơi tiếp."}]},"20":{"tiv":"Va chạm lý thuyết","ctx":"Olympic Leipzig 1960, Fischer cầm Trắng gặp Max Euwe. Đen chơi phòng thủ Caro-Kann, Trắng chọn biến <b>Panov</b>: đổi ở d5 rồi đẩy c4 để có trung tâm rộng và triển khai quân nhanh, chấp nhận sau này tốt d4 bị cô lập. Đen đáp 6…♗g4 ghim Mã f3, nhưng để hở hai ô b7 và d5 cùng lúc — và Fischer đánh đúng vào đó bằng 8 ♕b3. Sau một loạt nước bắt buộc, Vua Đen phải bước ra e7, mất quyền nhập thành, hai Xe không nối được với nhau. Phần còn lại là kỹ thuật tàn cuộc: đổi hết Hậu và Xe, ăn tốt a7, rồi đẩy tốt thông a.","end":"Hai thứ đáng học ở ván này. Một là <b>trật tự trước khi ăn</b>: ở nước 21 Fischer không vồ ngay tốt a7 mà đi ♖b8 chiếm hàng 8 trước, để Xe Đen vĩnh viễn không sang được a8 hay b8 — ăn xong thì Tượng đứng yên ổn, không bị đánh từ phía sau. Hai là cách <b>một tốt thông biến thành thắng lợi</b>: Tượng chủ động lùi khỏi a7 để nhường đường cho chính tốt của mình, còn Xe thì dùng đòn xiên trên cột c để dọn nốt quân cản. Không có đòn phối hợp nào hoa mỹ — chỉ là một lợi thế nhỏ được giữ sạch từ đầu tới cuối.","notes":[{"at":6,"t":"<b>4 c4</b> — biến Panov. Trắng chấp nhận rồi đây tốt d4 sẽ đứng cô lập, đổi lại được trung tâm rộng, cột mở và quân ra nhanh hơn. Đây là kiểu chơi mà thời gian quý hơn cấu trúc tốt."},{"at":11,"t":"<b>6…♗g4!?</b> — Tượng ra g4 ghim Mã f3 vào Hậu d1. Nhưng Tượng rời cánh Hậu, mà ở đó Đen còn hai chỗ mỏng: tốt b7 chưa ai giữ và Mã d5 chỉ có Hậu d8 đỡ."},{"at":14,"t":"<b>8 ♕b3!</b> — một nước làm ba việc. Đếm trên bàn cờ: <b>b7</b> bị Hậu b3 đánh và <b>không có quân Đen nào giữ</b>; <b>d5</b> bị Hậu b3 cùng Mã c3 đánh, chỉ có mỗi Hậu d8 đỡ; và Hậu rời d1 nên Mã f3 <b>hết bị ghim</b>. Đen không che nổi cả hai chỗ."},{"at":16,"t":"<b>8…♗xf3 9 gxf3</b> — Đen đổi Tượng lấy Mã, phá nát tốt cánh Vua của Trắng. Cái giá là Trắng có <b>cặp Tượng</b>, có cột g mở, và trung tâm vẫn nguyên."},{"at":17,"t":"<b>9…e6</b> — Đen chống đỡ ở d5 và đành buông b7. Cách khác là <b>9…♘xc3 10 bxc3</b>, gỡ được sức ép lên d5 nhưng tốt b7 <b>vẫn treo</b> đúng như cũ, mà Trắng lại thêm cột b mở. Euwe chọn giữ Mã ở trung tâm và tính phản công."},{"at":19,"t":"<b>10…♘xd4!</b> — Đen đã phải bỏ b7, giờ phản công lại. Đây không phải mất tốt suông: Mã d4 dọa <b>…♘c2+</b>, và ô c2 <b>không có quân Trắng nào giữ</b>. Từ c2 con Mã chiếu Vua e1 đồng thời bắt Xe a1 — đòn đôi kinh điển."},{"at":20,"t":"<b>11 ♗b5+!</b> — nước gỡ cả gói. Đen chỉ có <b>đúng ba nước hợp lệ</b>, và hai nước hỏng ngay: <b>11…♕d7 12 ♗xd7+</b> (♔xd7 bất hợp lệ vì Hậu b7 ngắm ô d7, nên Đen mất Hậu trắng trợn), <b>11…♘c6 12 ♕xc6+</b> ăn đứt Mã kèm chiếu. Còn lại 11…♘xb5, và 12 ♕c6+ lấy lại đúng con Mã đó."},{"at":23,"t":"<b>12…♔e7</b> — thực tế là bắt buộc: Đen chỉ có hai nước, mà <b>12…♕d7 13 ♕xa8+</b> mất Xe. Vua bước ra e7, Đen mất quyền nhập thành và hai Xe không nối được. Vật chất sẽ cân bằng lại, nhưng cái thiệt này thì không lấy lại được."},{"at":25,"t":"<b>13…♘xc3 14 bxc3</b> — Đen đổi bớt quân cho nhẹ, nhưng để ý cái Trắng nhận được: tốt b2 chuyển sang c3, và <b>cột b mở hoàn toàn</b>. Trắng chỉ chờ có thế."},{"at":28,"t":"<b>15 ♖b1!</b> — Xe vào cột b vừa mở, chuẩn bị ♖b7 đánh một lúc cả Hậu d7 lẫn tốt a7. Trắng chưa vội đổi Hậu, cứ dồn quân trước đã."},{"at":29,"t":"<b>15…♖d8?</b> — Xe rời a8, và <b>tốt a7 từ đó không còn ai giữ</b>. Ngay nước sau <b>16 ♗e3</b> là Tượng đứng trên đường chéo e3–a7 ngắm thẳng vào nó. Cả phần còn lại của ván cờ xoay quanh một con tốt này."},{"at":33,"t":"<b>17…♖d7</b> — Xe phải quay về hàng 7 làm nhiệm vụ canh gác a7 (17…♖a8 cũng chỉ là lùi về góc, cùng một cảnh). Một quân bị trói vào việc giữ tốt là một quân bớt đi ở chỗ khác."},{"at":34,"t":"<b>18 ♔e2</b> — Trắng vẫn còn quyền nhập thành, nhưng trong tàn cuộc thì không cần: Vua đi bộ vào giữa nhanh hơn và còn nối hai Xe. Đây là lúc Vua đổi vai, từ quân phải trốn thành quân đi làm việc."},{"at":36,"t":"<b>19 ♖d1!</b> — đổi đúng con Xe đang giữ a7 (kiểm trên bàn cờ: a7 chỉ có Xe d7 đỡ, và bị Tượng e3 đánh). Đây là mẫu kỹ thuật rất thường gặp: muốn ăn một tốt được bảo vệ thì đừng đánh vào tốt, hãy đổi quân đang bảo vệ nó."},{"at":40,"t":"<b>21 ♖b8!</b> — chiếm hàng 8 TRƯỚC khi ăn. Lúc này Xe h8 của Đen bị chính Tượng f8 bịt kín, nhưng chỉ cần Đen đi ♗e7 hay ♗d6 là Xe thông sang a8/b8 quấy con Tượng vừa ăn tốt. Đứng sẵn ở b8, Trắng cắt vĩnh viễn khả năng đó."},{"at":42,"t":"<b>22 ♗xa7</b> — hơn một tốt sạch, và quan trọng hơn: tốt a2 của Trắng bây giờ là <b>tốt thông</b>. Đen đã hết quân để chặn nó ở cột a."},{"at":43,"t":"<b>22…g5</b> — Đen chơi ở cánh Vua vì cánh Hậu đã đông cứng. Nhìn kỹ sẽ thấy Đen bị trói thế nào: Xe h8 chỉ sống được nhờ Tượng f8 che nó khỏi Xe b8. Đi <b>22…♗d6</b> hay <b>22…♗e7</b> để cứu Xe thì <b>23 ♖xh8</b> — mất luôn cả Xe."},{"at":58,"t":"<b>30 ♗b8!</b> — trước nước này chính Tượng Trắng đang đứng ở a7, tức là chắn đường tốt của mình. Lùi về b8, Tượng vừa nhường ô vừa canh a7 từ xa để tốt đi tiếp an toàn."},{"at":60,"t":"<b>31 a6</b> — Đen vừa đi …♖c8 đánh Tượng b8, Trắng mặc kệ và đẩy tốt: Tượng b8 <b>đang được Xe b6 giữ</b>, nên <b>31…♖xb8 32 ♖xb8</b> chỉ là mất chất. Con tốt lên a6, còn đúng hai ô nữa là tới bàn phong."},{"at":66,"t":"<b>34 ♖c7+</b> — chiếu trên cột c, và ngay sau lưng Vua c4 là Xe c3. Đen có sáu nước; năm nước Vua đều dẫn tới ♖xc3+ đổi sạch Xe, và Euwe chọn <b>34…♔d3 35 ♖xc3+ ♔xc3</b>. Đổi hết quân nặng chính là điều Trắng muốn: còn lại Tượng chọi Tượng với một tốt thông ở a6."},{"at":70,"t":"<b>36 ♗e5</b> — Tượng d4 là quân <b>duy nhất</b> đang canh ô a7 (b8 là Tượng Trắng giữ nó). Trắng đánh vào đúng nó, và nếu đổi thì tốt chạy thẳng: <b>36…♗xe5 37 a7 ♗b8 38 axb8=♕</b>. Đen xin thua."}]},"21":{"tiv":"Đổi Hậu lấy Vua","ctx":"Olympic Leipzig 1960, Letelier (Chile) cầm Trắng gặp Fischer trong hệ <b>phòng thủ Ấn Độ mới</b>. Trắng chọn cách chơi thô nhất: đẩy e4-e5 đuổi Mã f6 về e8, rồi f4, dựng một bức tường tốt c4-d4-e5-f4. Fischer phá bằng 7…c5 và 13…dxe5 để mở đường chéo dài cho Tượng g7. Trắng không kịp nhập thành, Vua kẹt giữa bàn cờ, và Đen chồng Xe lên cột e. Ván kết bằng một đòn thí chất rồi <b>thí Hậu</b> ở nước 23 — chỉ 24 nước, Trắng xin thua.","end":"Mẫu đòn ở cuối rất đáng nhớ và rất đơn giản khi nhìn ra cơ chế: tốt f4 lúc đó <b>chỉ có mỗi Vua e3 giữ</b>. Bắt tốt bằng Hậu không phải để ăn tốt, mà để ép Vua tự bước lên f4 — nơi Tượng g7 đã ngắm sẵn từ mười nước trước. Trước đó Fischer phải trả hai giá: thí chất ở e3 để lôi Vua ra, và sớm hơn nữa là 14…e4 bỏ Tượng để phá quân giữ nhà. Bài học chung: khi Vua đối phương chưa nhập thành, hãy tính bằng <b>số quân đang giữ ô cạnh Vua</b>, chứ đừng tính bằng vật chất.","notes":[{"at":8,"t":"<b>5 e5</b> — đẩy tốt rất sớm để giành chỗ và đuổi Mã f6. Mã phải lùi về <b>e8</b>, ô bí nhất bàn cờ: từ đó nó chỉ với tới c7, d6, f6 — toàn ô quân nhà. Đếm trong biên bản thì thấy giá của nước này: con Mã ngồi ở e8 suốt từ nước 5 tới tận <b>nước 17…♘f6</b> mới quay lại được cuộc chơi."},{"at":10,"t":"<b>6 f4</b> — Trắng dựng bức tường c4-d4-e5-f4. Nhìn thì đồ sộ, nhưng trung tâm tốt càng lớn thì càng nhiều chân để đối phương đánh vào, và quân Trắng vẫn chưa ra."},{"at":12,"t":"<b>7 ♗e3</b> — Tượng ra giữ chân tường d4 (kiểm trên bàn cờ: d4 lúc này có Hậu d1 và Tượng e3 đỡ). Nhớ mặt con Tượng này: mười bốn nước nữa nó chính là quân Fischer thí chất để lôi Vua Trắng ra — <b>21…♖xe3</b>."},{"at":13,"t":"<b>7…c5!</b> — nước phá kinh điển của hệ Ấn Độ mới: không đánh vào đỉnh mà đánh vào <b>chân tường</b>, tức ô d4. Trắng buộc phải quyết ngay, mà quyết kiểu nào cấu trúc cũng lỏng ra."},{"at":15,"t":"<b>8…♘c6</b> — không vội ăn lại tốt ở c5. Mã ra c6 nhắm e5 và ô d4 mà Trắng vừa tự bỏ trống; con tốt kia chạy đâu được mà vội."},{"at":16,"t":"<b>9 cxd6</b> — Trắng trả lại tốt. Nhưng để ý cái Đen nhận được sau <b>9…exd6</b>: <b>cột e mở</b>. Đúng cột đó, mười nước nữa, hai Xe Đen sẽ dựng lên và ván cờ kết thúc ở đó."},{"at":19,"t":"<b>10…♗f5!</b> — Tượng ra đánh Mã e4, và Mã e4 <b>không có quân nào giữ</b>. Trắng phải xử lý con Mã trước khi làm bất cứ việc gì khác."},{"at":20,"t":"<b>11 ♘g3?</b> — nước này có đánh Tượng f5 nên nhìn như được nhịp, nhưng Mã về g3 là về chỗ không có việc: nó bịt luôn tốt g và sau này không kịp quay lại giữ Vua. Muốn cứng thì <b>11 ♘xd6 ♘xd6 12 exd6 ♕xd6</b> — Trắng ít nhất giữ được tốt, tuy bức tường trung tâm tan."},{"at":21,"t":"<b>11…♗e6</b> — Tượng lùi nhưng lùi có lãi: từ e6 nó ngắm thẳng <b>tốt c4</b>, mà c4 chỉ có Tượng f1 đỡ. Đen bị đuổi một nhịp thì trả lại đúng một nhịp."},{"at":23,"t":"<b>12…♕c7</b> — Hậu ra c7 dồn thêm vào e5. Đếm ở ô e5: Đen có <b>Mã c6, tốt d6 và Tượng g7</b> — ba quân; Trắng chỉ có Mã f3 và tốt f4 — hai. Trung tâm của Trắng bắt đầu không đứng nổi."},{"at":24,"t":"<b>13 ♕b1</b> — Hậu phải lùi tận b1 vì <b>tốt b2 lúc này không có một quân nào giữ</b>, mà tốt e5 mất đi thì Tượng g7 nhìn suốt đường chéo dài xuống tận đó. Một Hậu đứng ở b1 ở nước 13 tự nó đã nói lên thế cờ hỏng thế nào."},{"at":26,"t":"<b>14 f5</b> — tốt tiến lên đánh Tượng e6, vì ăn ở e5 không được: ô e5 Đen giữ ba quân mà Trắng chỉ đánh hai. Ý đồ mở cánh Vua thì rõ, nhưng Trắng vẫn chưa nhập thành, nên mọi đường mở ra đều mở về phía Vua của chính mình."},{"at":27,"t":"<b>14…e4!</b> — Fischer không cứu Tượng mà đánh vào <b>Mã f3</b>, con Mã <b>chỉ có tốt g2 giữ</b>. Nước này cũng mở luôn đường chéo dài cho Tượng g7. Cứu Mã cũng không xong: <b>15 ♘d4 ♗xd4 16 ♗xd4 ♘xd4 17 fxe6 fxe6</b>, Đen hơn tốt và Mã d4 chốt giữa bàn."},{"at":28,"t":"<b>15 fxe6</b> — Trắng lấy Tượng, nhưng phải trả Mã ngay: <b>15…exf3</b>. Ở đây có một lựa chọn đáng bàn cho Trắng ở nước sau — <b>16 exf7+ ♖xf7 17 gxf3</b>, đổi phắt con tốt e6 đằng nào cũng chết đi. Letelier giữ lại nó, và đó là con tốt Đen ăn không ở nước 19."},{"at":30,"t":"<b>16 gxf3</b> — Trắng ăn lại được, nhưng cái giá là tốt cánh Vua vỡ nát, cột g mở ngay cạnh Vua, và Vua thì vẫn ở e1."},{"at":31,"t":"<b>16…f5!</b> — nước chặn quan trọng: từ giờ tốt f3 của Trắng không thể lên f4-f5 để đỡ cho tốt e6. Con tốt e6 tuy đã tới hàng 6 nhưng <b>không có một quân Trắng nào giữ</b>, sớm muộn cũng bị Xe ăn."},{"at":37,"t":"<b>19…♖xe6</b> — thu hồi con tốt đó, vật chất trở lại cân bằng. Nhưng thế cờ thì không cân: Vua Trắng đứng ở f2, cột e mở thẳng về phía nó, và Đen sắp chồng cả hai Xe lên cột đó."},{"at":40,"t":"<b>21 ♗f3</b> — nước bắt buộc chứ không phải nước chọn. Trước đó Tượng e3 <b>chỉ có Vua f2 giữ</b>, vì Xe e1 bị chính Tượng e2 chắn, mà Đen vừa chồng xong hai Xe lên cột e. Đưa Tượng đi f3 là để thông đường cho Xe e1 về đỡ e3."},{"at":41,"t":"<b>21…♖xe3!</b> — thí chất: bỏ Xe lấy Tượng, dù e3 lúc này đã có hai quân giữ. Mục đích không phải vật chất mà là <b>kéo Vua Trắng lên e3</b>."},{"at":44,"t":"<b>23 ♔xe3</b> — Vua đã bị lôi lên hàng 3. Hãy nhìn kỹ tốt f4: nó <b>chỉ có đúng một quân giữ, là chính Vua đó</b>. Mã g3 không với tới f4."},{"at":45,"t":"<b>23…♕xf4+!</b> — thí Hậu, cơ chế gọn tới mức đếm được. Trắng có bốn nước: <b>24 ♔xf4 ♗h6#</b> — chiếu hết thật, kiểm được trên bàn cờ. Ba nước chạy còn lại thì mất Tượng f3 kèm chiếu: <b>24 ♔d3 ♘e5+</b> và <b>24 ♔e2 ♘d4+</b> đều là chiếu bằng Mã đồng thời bắt Tượng, và Trắng không có quân nào ăn lại được con Mã ở f3. Trắng xin thua."}]},"22":{"tiv":"Đánh giá sai","ctx":"Olympic Leipzig 1960, Szabo (Hungary) cầm Trắng, lại là <b>phòng thủ Ấn Độ mới</b>, lần này với ♗g5 và ♕d2. Fischer phá bằng 6…c5, Trắng đẩy d5 và ván chuyển sang cấu trúc Benoni. Bước ngoặt là cách Trắng ăn lại ở nước 11: dùng tốt e, tức là bỏ hẳn quyền kiểm soát ô e5 — và Mã Đen vào đó ngay. Nước 13 f4 đuổi Mã đi thật, nhưng phải trả bằng con Tượng d3 và bỏ trống ô e3; mười nước sau, Xe Đen nhảy đúng vào e3 để ăn quân. Đen hơn một tốt, đẩy tốt thông cánh Hậu, Trắng dừng ván ở nước 24.","end":"Ván này là bài học về việc <b>đổi quân xong thì cái gì còn lại</b>. Mỗi lần Trắng ăn lại hay đuổi quân đều có lý do trước mắt, nhưng cộng dồn thì mất cả ba thứ: ô e5 (sau 11 exd5), Tượng ô trắng (sau 13 f4 ♘xd3), và ô e3 cùng tốt f2 (cũng do f4). Chi tiết kỹ thuật đáng chép lại là nước 21…♖e3: Xe đâm vào Hậu, mà Hậu lại đang là quân <b>duy nhất</b> giữ Xe c2 — một quân bị giao hai việc thì chỉ cần đánh vào nó là mất một việc. Trước khi đẩy tốt hay đuổi quân, hãy hỏi ô nào sẽ vĩnh viễn không còn tốt canh nữa.","notes":[{"at":8,"t":"<b>5 ♗g5</b> — Tượng tì vào Mã f6. Kèm với ♕d2 sắp tới, ý đồ quen thuộc là ♗h6 đổi bỏ Tượng g7 — con quân giữ nhà quan trọng nhất của Đen trong hệ này."},{"at":10,"t":"<b>6 ♕d2</b> — Hậu đứng ngay sau Tượng g5, dọn đúng một việc: ♗h6. Nếu Đen đi chậm, ví dụ <b>6…♘bd7 7 ♗h6 ♗xh6 8 ♕xh6</b>, Đen mất con Tượng giữ nhà còn Hậu Trắng đã đứng sát Vua. Nên nước sau của Fischer bắt buộc phải là nước đánh trả ở trung tâm."},{"at":11,"t":"<b>6…c5!</b> — nước phá thường trực của hệ Ấn Độ mới, đánh vào ô d4. Trắng phải chọn ngay: đổi ở c5, giữ căng, hay đẩy d5. Chọn kiểu nào thì cấu trúc trung tâm cũng cố định lại và Đen có mục tiêu rõ ràng."},{"at":12,"t":"<b>7 d5</b> — Trắng đẩy qua, ván thành cấu trúc Benoni: Trắng có chỗ rộng ở trung tâm, Đen có đa số tốt cánh Hậu và cột e để chơi."},{"at":16,"t":"<b>9 ♘xd5</b> — ăn bằng Mã để giữ nguyên cả hai tốt c4 và e4. Nhưng Mã ở d5 là quân đứng chắn trước tốt nhà, và nó thành mục tiêu ngay: sau <b>9…♗e6</b> con Mã bị <b>Tượng e6 và Mã f6 đánh hai lần</b>, chỉ có hai tốt c4 và e4 đỡ. Không mất quân, nhưng Trắng phải bỏ nhịp đi xử lý nó."},{"at":17,"t":"<b>9…♗e6!</b> — mời đổi ngay con Mã đẹp nhất của Trắng ở d5. Đen sẵn sàng bỏ cặp Tượng để dọn quân mạnh của đối phương ra khỏi trung tâm. Trắng chọn giữ Mã một nhịp nữa, và ván đi đúng đường <b>10 ♘e2 ♗xd5</b> — đến đây Trắng phải quyết ăn lại bằng tốt nào."},{"at":20,"t":"<b>11 exd5</b> — đây là lựa chọn quyết định ván cờ. Ăn bằng tốt e thì Trắng có tốt d5 được c4 đỡ, nhưng <b>từ nay không còn tốt nào canh được ô e5</b>. Nếu <b>11 cxd5</b> thì c4 biến mất, và Mã Đen vào e5 chỉ còn đánh mỗi Tượng d3 thay vì đánh hai chỗ như trong ván."},{"at":22,"t":"<b>12 0-0</b> — Trắng nhập thành xong, nhưng ô e5 thì không bịt được nữa. Đếm tốt Trắng còn lại — a2, b2, c4, d5, f2, g2, h2 — <b>chỉ mỗi tốt f2 với tới được e5</b>, mà muốn thế thì phải đẩy f2-f4. Vậy <b>12…♘e5</b> đến ngay, và nước đuổi duy nhất cũng chính là nước hỏng ở lượt sau."},{"at":23,"t":"<b>12…♘e5</b> — Mã vào đúng cái lỗ vừa mở ra. Đứng ở e5 nó đánh cùng lúc Tượng d3 và tốt c4, mà <b>c4 lại chỉ có đúng Tượng d3 giữ</b> — nên Tượng không thể lẳng lặng né sang ô khác."},{"at":24,"t":"<b>13 f4?</b> — đuổi Mã bằng tốt nghe hợp lý, nhưng giá quá đắt. Né Tượng cũng không xong: <b>13 ♗c2 ♘xc4</b> là mất tốt trắng ngay. Nước tỉnh là <b>13 b3</b> — có <b>13…♘xd3 14 ♕xd3</b> thì Trắng vẫn mất cặp Tượng, nhưng tốt f còn nằm ở f2 và ô e3 vẫn có người canh. Sau f4 thì cả hai cái giá đó đều phải trả, và sẽ bị đòi ở nước 21."},{"at":30,"t":"<b>16 ♖ae1</b> — Xe rời a1 để lên cột e. Hậu quả lặng lẽ: cả <b>a2 lẫn b2 giờ không còn quân nào giữ</b>, mà Đen thì đang có Hậu và Tượng chĩa về hướng đó."},{"at":31,"t":"<b>16…♕b6!</b> — Hậu ra b6 đánh thẳng tốt b2, và b2 không ai giữ. Trắng phải xử lý ngay thay vì làm việc của mình ở cánh Vua."},{"at":33,"t":"<b>17…♗xf6</b> — sau khi đổi ở f6, Tượng Đen đứng trên đường chéo dài: bây giờ b2 bị <b>hai quân</b> nhắm (Hậu b6 và Tượng f6) và vẫn không ai giữ. Đó là lý do Trắng phải đi 19 b3."},{"at":34,"t":"<b>18 f5</b> — nước này có dọa thật, không phải đẩy suông: dọa <b>fxg6</b> phá hàng tốt trước Vua Đen và mở cột f cho Xe f1. Ví dụ Đen đi chậm <b>18…♖ad8 19 fxg6 fxg6</b> là Xe f1 nhìn thẳng xuống f-file. Đen phải trả lời ngay lượt này."},{"at":35,"t":"<b>18…g5</b> — chặn đúng cái dọa đó, và khoá luôn cánh Vua. Tốt f5 của Trắng từ đây <b>đứng chết</b>: e6 và g6 đều trống nên không ăn được gì, tiến lên f6 thì có Tượng chắn. Còn tốt g5 thì có h6 và Tượng f6 giữ."},{"at":37,"t":"<b>19…♕a5!</b> — Trắng vừa che b2 bằng b3, Hậu lập tức đổi mục tiêu. Từ a5 nó đánh <b>hai chỗ</b>: tốt a2 (không ai giữ) và Xe e1 trên đường chéo a5-e1."},{"at":38,"t":"<b>20 ♖c1?</b> — Trắng cứu Xe nhưng quên tốt. Nước giữ được cả hai là <b>20 ♖a1</b>: Xe vừa rời đường chéo a5-e1, vừa đỡ a2, mà bản thân nó vẫn an toàn vì tốt a2 chắn đường Hậu Đen. Sau ♖c1 thì tốt a2 rơi không lấy lại được."},{"at":40,"t":"<b>21 ♖c2</b> — Xe sang c2 đánh Hậu a2, con Hậu đang không ai đỡ, định ép nó lùi về. Nhưng để làm việc đó Xe phải đứng ở c2, mà <b>c2 chỉ có Hậu d3 giữ</b> — và Hậu d3 thì đang đứng ngay đầu cột e còn trống."},{"at":41,"t":"<b>21…♖e3!</b> — thay vì lùi Hậu, Đen đâm Xe vào. Trên bàn lúc này <b>Hậu d3 không có quân nào đỡ</b>, còn Xe c2 thì chỉ mình Hậu d3 giữ — một quân, hai việc. Trắng không có nước nào ăn được Xe e3 ngoài chính con Hậu. Ván đi <b>22 ♕xe3 ♕xc2</b>, đổi Xe lấy Xe; còn <b>22 ♖xa2 ♖xd3</b> thì đổi Hậu lấy Hậu — đằng nào Đen cũng giữ nguyên phần hơn một tốt. Và Hậu không được chạy bừa: <b>22 ♕d4 ♗xd4+</b> hay <b>22 ♕c3 ♗xc3</b> là mất Hậu vì Tượng f6 đứng trên đường chéo dài."},{"at":43,"t":"<b>22…♕xc2</b> — kết toán: Xe đổi Xe, Đen còn Hậu + Xe + Tượng và <b>bảy tốt so với sáu</b>, Hậu thì đứng sâu ở c2 ngay trong nhà Trắng."},{"at":47,"t":"<b>24…a4</b> — tốt a lên đánh b3; tốt b3 bây giờ bị <b>a4 và Hậu c2 đánh hai lần, chỉ có Hậu e3 đỡ một lần</b>. Mở ra thì cũng chẳng khá: <b>25 bxa4 ♕xc4</b> — tốt c4 lúc đó không còn ai giữ, Đen ăn thêm. Đen hơn một tốt, Hậu đã ở c2, Tượng f6 nằm trên đường chéo dài trống trong khi Mã e2 không có ô tiền tiêu nào. Trắng dừng ván ở đây."}]},"23":{"tiv":"Không giữ lại gì","ctx":"Ván đấu đội tuyển ở Olympiad Leipzig 1960. Khai cuộc là <b>Phòng thủ Pháp</b> biến Winawer: Trắng đẩy tốt lên e5 chiếm không gian, Đen đánh trả bằng …c5 và Tượng b4. Tal không đổi Tượng ở c3 như lối thường mà lùi …♗a5, và từ đó hai bên lao vào một cuộc ăn quân qua lại: Trắng gom Tượng ở cánh Hậu, Đen gom Mã và hai tốt che Vua Trắng. Từ nước 14 trở đi gần như không ai chịu bắt lại quân — mỗi lượt đều là một nước đánh mạnh hơn nước trước. Cuối cùng Đen chiếu mãi, ván hòa.","end":"Bài học thứ nhất là <b>đếm người đánh và người giữ</b> trước khi đi một nước phát triển: nước 14 ♗g5 nhìn tự nhiên, nhưng lúc đó e5 bị đánh hai lần giữ một lần, còn Tượng b5 thì không ai đỡ. Thứ hai là mẫu <b>mở đường</b> ở nước 14…♘xe5 — một quân rời ô không chỉ để ăn, mà để quân đứng sau nó nhìn thấy mục tiêu. Thứ ba, khi thế cờ vỡ thì hãy đi tìm chiếu mãi: Tal đưa Xe vào g2 đúng lúc Tượng f1 còn giữ ô đó, nhờ vậy Vua Trắng bị ép chỉ còn hai ô để chạy qua chạy lại.","notes":[{"at":9,"t":"<b>5…♗a5</b> — Lối thường là đổi luôn ở c3 để Trắng ôm tốt chồng. Tal giữ Tượng lại. Cái giá là Tượng đứng trên đường b4–f8, đúng chỗ tốt b của Trắng với tới được."},{"at":10,"t":"<b>6 b4!</b> — Tốt lên b4 đâm vào Tượng a5, và <b>b4 được tốt a3 giữ</b>. Nên ăn ngay bằng Tượng là hỏng: <b>6…♗xb4 7 axb4 cxb4</b> — Đen được hai tốt nhưng mất đứt con Tượng. Trắng chấp nhận rối trung tâm để bắt cho được quân."},{"at":11,"t":"<b>6…cxd4</b> — Tal không cứu Tượng mà đâm vào Mã c3: tốt d4 đánh c3, mà <b>c3 lúc này không có quân nào đỡ</b>. Thành ra hai bên cùng có một quân treo — Trắng sẽ lấy Tượng a5, Đen sẽ lấy Mã c3, và ván biến thành cuộc đua ai ăn nhanh hơn."},{"at":13,"t":"<b>7…♘e7</b> — Mã ra e7 <b>không giữ g7</b>: đếm lại thì g7 chỉ có Hậu g4 đánh và không quân Đen nào đỡ. Tal cố ý cho Hậu Trắng ăn g7 rồi h7: đổi lấy cột g mở cho Xe, và Hậu Trắng càng ăn càng lệch xa trận địa."},{"at":14,"t":"<b>8 bxa5</b> — Trắng thu Tượng. Nhưng Mã c3 đang treo, Vua Trắng còn ở giữa bàn, và tốt Đen sắp cắm lại vào c3 ngay trước mặt Vua đó."},{"at":18,"t":"<b>10 ♕xh7</b> — Tốt thứ hai. Nhìn cả bàn cờ lúc này: <b>Xe a1, Tượng c1, Vua e1, Tượng f1, Mã g1, Xe h1 — sáu quân Trắng vẫn nguyên ô xuất phát</b>. Đếm vật chất thì đúng bằng nhau về quân, Trắng hơn <b>một tốt</b> (bảy so với sáu). Cái giá là chưa triển khai được gì."},{"at":19,"t":"<b>10…♘bc6</b> — Đen ra nốt Mã, nhắm d4 và e5. Đổi hai tốt che Vua lấy Xe trên cột g mở cộng với việc quân ra nhanh hơn hẳn — đó là toàn bộ ý đồ của Tal."},{"at":20,"t":"<b>11 ♘f3</b> — nước phát triển đầu tiên của Trắng, và nó có việc ngay: <b>Mã f3 là quân duy nhất giữ tốt e5</b>. Từ đây trở đi, mọi chuyện ở ô e5 đều là chuyện đếm người đánh với người giữ."},{"at":21,"t":"<b>11…♕c7</b> — Hậu chồng vào cột c, và quan trọng hơn: e5 bây giờ bị <b>Mã c6 và Hậu c7 đánh hai lần, chỉ có Mã f3 giữ một lần</b>. Trên giấy tờ tốt e5 đã rơi — Trắng phải tìm cách khác để cứu."},{"at":22,"t":"<b>12 ♗b5!</b> — và đây là cách khác. Tượng b5 <b>ghim Mã c6 vào Vua e8</b> (b5-c6-d7-e8, ô d7 còn trống), nên Mã không được rời c6: thử ♘xe5 là nước không hợp lệ. Một nước phát triển vừa cứu tốt e5 vừa dọn đường nhập thành."},{"at":23,"t":"<b>12…♗d7</b> — Tượng chèn vào d7 gỡ ghim, đồng thời thêm một quân đỡ Mã c6. Bây giờ c6 có <b>b7, ♗d7 và ♘e7 đỡ ba lần</b> — Trắng không ăn được gì ở đó."},{"at":24,"t":"<b>13 0-0</b> — Vua Trắng về chỗ an toàn. Ghim đã gỡ nên e5 lại là hai đánh một, nhưng Trắng còn một nước đỡ: <b>13…♘xe5 14 ♗xd7+ ♕xd7 15 ♘xe5</b> là lấy lại tốt ngay. Cái đỡ đó chỉ còn dùng được chừng nào Tượng b5 vẫn đứng đấy."},{"at":25,"t":"<b>13…0-0-0</b> — Hai Vua chạy về hai phía. Xe d8 và Xe g8 của Đen đều có việc ngay, còn Hậu Trắng thì kẹt ở một góc bàn."},{"at":26,"t":"<b>14 ♗g5?</b> — Chỗ hỏng. Tốt e5 đang bị Mã c6 và Hậu c7 đánh <b>hai lần</b>, chỉ có Mã f3 giữ <b>một lần</b>; Tượng ra g5 không thêm người giữ. Nước bình thường là <b>14 ♗f4</b> hoặc <b>14 ♖e1</b> — cả hai đều thêm một người đỡ e5 và cân lại phép đếm. Cùng lúc, Tượng b5 đang đứng không ai đỡ."},{"at":27,"t":"<b>14…♘xe5!</b> — Ăn tốt và <b>mở đường cho Tượng d7</b> cùng một nước: Mã vừa rời c6 thì d7–c6–b5 thông, Tượng Đen ngắm thẳng Tượng b5 trống. Cứu Tượng cũng không xong: <b>15 ♗xd7+ ♖xd7 16 ♘xe5 ♕xe5</b> — Tượng g5 lúc đó bị <b>Hậu e5 và Xe g8 đánh hai lần, không ai đỡ</b>."},{"at":29,"t":"<b>15…♗xb5</b> — Đen thu Tượng. Để ý con Mã Trắng vừa ăn ở e5: nó <b>đang bị Hậu c7 đánh và không có quân nào đỡ</b>. Trắng không còn nhịp nào để rút nó về — chỉ còn cách lao tiếp."},{"at":30,"t":"<b>16 ♘xf7</b> — nên Mã lao tiếp: ăn tốt f7 và đâm vào Xe d8. Xe d8 có <b>Hậu c7, Vua c8 và Xe g8 đỡ ba lần</b> nên đây không phải ăn không — nó chỉ mạnh hơn việc bỏ ra một nhịp đi cứu quân."},{"at":31,"t":"<b>16…♗xf1!</b> — Tal cũng mặc Xe d8, ăn luôn Xe f1. Từ nước 14 tới đây không ai chịu lùi: mỗi lượt đều chọn nước ăn to hơn thay vì phòng ngự."},{"at":35,"t":"<b>18…♖xg2+!</b> — Xe lao vào sát Vua. Điểm mấu chốt: <b>Tượng Đen ở f1 đang giữ ô g2</b> nên Vua không ăn Xe được. Sau nước này Trắng chỉ còn <b>đúng hai nước hợp lệ</b> trên cả bàn cờ: ♔h1 và ♔xf1."},{"at":36,"t":"<b>19 ♔h1!</b> — Chọn đúng ô. Nếu <b>19 ♔xf1 ♖xh2</b> thì Xe vào cột h nhìn thẳng Hậu h7, mà <b>Xe h2 lại có Hậu c7 đỡ</b>: <b>20 ♕xh2 ♕xh2</b> là Trắng đổi Hậu lấy Xe, mất trắng một Hậu-đổi-Xe. Vua Trắng lúc đó cũng trơ ra giữa bàn."},{"at":37,"t":"<b>19…♕e5</b> — Hậu ra giữa bàn nhắm <b>Mã e6 đang không ai đỡ</b>, đồng thời chồng thêm người đánh h2. Nhưng h2 thì không ăn được: <b>20 ♖xf1 ♕xh2+ 21 ♕xh2 ♖xh2+ 22 ♔xh2</b> — h2 có cả Vua h1 lẫn Hậu h7 giữ, Đen mất sạch quân."},{"at":39,"t":"<b>20…♕xe6</b> — Đen ăn lại Mã và tạm hơn quân. Nhưng Xe g2 <b>đang bị Vua h1 ăn và không có ai đỡ</b> (Tượng f1 vừa bị dọn), nên số vật chất đó không giữ được — Đen phải chuyển sang tìm hòa."},{"at":41,"t":"<b>21…♕g4+</b> — Chiếu mãi, và nó <b>ép buộc tuyệt đối</b>: sau nước này Trắng chỉ có <b>đúng một nước hợp lệ</b> là ♔h1; rồi <b>22…♕f3+</b> lại chỉ còn ♔g1; rồi <b>23…♕g4+</b> lặp lại. Vua Trắng không có ô thứ ba nào, ván hòa."}]},"24":{"tiv":"Tự chuốc lấy rắc rối","ctx":"West Berlin 1960, lại là <b>Phòng thủ Pháp</b> biến Winawer, nhưng lần này Đen đổi Tượng ở c3 theo lối chính thống. Trắng nhận tốt chồng c2–c3 để lấy <b>cặp Tượng</b> và cột b nửa mở. Darga chơi …b6 định đưa Tượng c8 ra a6 đổi bỏ con Tượng xấu, Fischer chặn ngay bằng một nước chiếu và ép Tượng đó về d7. Đen ăn một tốt ở trung tâm trong khi Vua còn ở e8, cột e mở ra và tốt ấy phải trả lại. Đoạn cuối Trắng đẩy tốt a mở cột đánh vào Vua Đen đã nhập thành cánh Hậu; Đen buông cờ ở nước 30.","end":"Ba thứ mang đi được. Một, <b>ngăn đối thủ đổi con quân xấu của họ</b>: nước chiếu ở nước 9 không ăn gì cả, nó chỉ ép Tượng Đen về d7 — và con Tượng đó bí suốt ván cho tới lúc bị đổi trên e6. Hai, <b>một tốt có thể làm hai việc cách nhau mười bảy nước</b>: tốt a4 trước dọn ô a3 cho Tượng, sau mới đẩy a5 mở cột đánh Vua. Ba, đừng ăn tốt ở trung tâm khi Vua mình còn chưa nhập thành — cột e mở ra thì mở về phía Vua đang đứng đó.","notes":[{"at":9,"t":"<b>5…♗xc3+</b> — Cách chơi chính thống: đổi Tượng lấy Mã và để Trắng ôm tốt chồng c2–c3. Đen lấy cấu trúc, Trắng lấy cặp Tượng cùng cột b nửa mở."},{"at":12,"t":"<b>7 a4</b> — Tốt a làm hai việc, cách nhau rất xa. Trước mắt nó <b>dọn ô a3</b> cho Tượng c1 ra đường chéo a3–f8, đường chéo chĩa vào e7 và f8 — chỗ Vua Đen còn đứng. Về sau nó còn đẩy tiếp a5 để đập vào tốt b của Đen."},{"at":15,"t":"<b>8…b6</b> — kế hoạch đúng của Đen: dọn đường b7 để Tượng c8 ra a6 rồi đổi bỏ. Đó là con Tượng xấu kinh điển của Phòng thủ Pháp, bị chính tốt e6 và d5 của mình bịt kín. Nếu Trắng đi nước thường, ví dụ <b>9 ♗e2</b>, thì <b>9…♗a6</b> đến ngay và Đen nhẹ hẳn."},{"at":16,"t":"<b>9 ♗b5+!</b> — nên Fischer chiếu trước. Đen có tám cách gỡ chiếu, nhưng cách nào cũng khó chịu: <b>♔f8</b> hay <b>♔d8</b> là mất quyền nhập thành, <b>♕d7</b>/<b>♕c6</b> đẩy Hậu ra chỗ hở, <b>♘d7</b>/<b>♘c6</b> thì chặn quân mình. Darga chọn <b>9…♗d7</b> — thế là con Tượng định đi a6 lại phải đứng chắn ngay trước mặt Vua. Nước chiếu không ăn gì cả, nó chỉ giết một kế hoạch."},{"at":21,"t":"<b>11…c4</b> — Tốt đuổi Tượng d3 và chiếm không gian cánh Hậu, nhưng khoá luôn trung tâm. Trắng hết phải lo tốt d4, rảnh tay chọn hướng đánh."},{"at":24,"t":"<b>13 ♗a3!?</b> — Tượng ra đúng ô đã dọn sẵn từ nước 7, nhìn dọc a3–f8 vào Mã e7. Mã e7 có <b>Hậu c7 và Vua e8 đỡ hai lần</b> nên chưa mất gì, nhưng Vua Đen vẫn ở e8 — đường chéo này là đường chéo phải để ý."},{"at":26,"t":"<b>14 dxe5</b> — ăn lại bằng tốt d. Trắng biết trước là mất tốt này: e5 đang bị <b>Mã c6 và Hậu c7 đánh hai lần, chỉ có Mã f3 giữ một lần</b>. Đổi lại, cột d thoáng ra và cột e sắp mở — mà Vua Đen thì vẫn đứng ở e8."},{"at":27,"t":"<b>14…♘xe5</b> — Đen ăn tốt. Đây là chỗ tự chuốc rắc rối: <b>cột e vừa mở ra trong khi Vua Đen còn đứng e8</b>, Xe Trắng sẽ vào cột đó, và Tượng a3 đã chĩa sẵn vào f8."},{"at":28,"t":"<b>15 ♖e1</b> — Xe vào cột e dù đường còn bị chính Tượng e2 chắn (Xe e1 lúc này chỉ với tới đúng e2). Nó không dọa gì ngay, chỉ chờ cột thông — và năm nước sau Xe này đứng ở e6."},{"at":32,"t":"<b>17 f4</b> — Tốt f đuổi Mã e5 và giành luôn ô e5. Con Mã đó chỉ có Hậu c7 đỡ, mà tốt đánh vào thì đỡ bao nhiêu cũng vô nghĩa: Mã phải về c6. Ở giữa bàn Đen không còn ô tiền tiêu nào."},{"at":34,"t":"<b>18 ♗g4!</b> — Tượng chuyển sang đường chéo c8–h3 đánh tốt e6. Đếm thử: e6 bị Tượng g4 và Xe e1 đánh <b>hai lần</b>, chỉ có Tượng d7 giữ <b>một lần</b>. Tốt e6 không cứu được: ván đi <b>18…0-0-0 19 ♗xe6 ♗xe6 20 ♖xe6</b>, và con tốt Đen ăn ở nước 14 phải trả lại."},{"at":40,"t":"<b>21 f5</b> — Tốt lên f5 để <b>giữ chính Xe e6</b>. Trước nước này Xe e6 đứng sâu trong đất Đen mà <b>không có quân nào đỡ</b>; Đen chỉ cần đánh một nhát là Xe phải rút. Sau f5 thì nó có tốt che."},{"at":41,"t":"<b>21…♘d8!</b> — Nước phòng ngự đúng nhất: Mã lùi hẳn về d8 để đánh Xe e6 — bây giờ Xe bị đánh một, đỡ một, không đứng lại được nữa. Đen chống trả tốt ở đoạn này, không sập nhanh."},{"at":43,"t":"<b>22…♕f4</b> — Hậu ra đánh <b>hai chỗ cùng lúc, mà cả hai đều không ai đỡ</b>: Xe e3 và tốt f5. Trắng gỡ bằng <b>23 ♖f3</b> — Xe vừa thoát vừa đâm ngược lại Hậu; phải đến khi <b>23…♕e4</b> lùi ra thì Xe f3 mới thật sự che được f5."},{"at":46,"t":"<b>24 a5!</b> — Tốt a bây giờ mới làm việc thứ hai của nó: mở cột về phía Vua Đen đang ở c8. Đây là nước mở màn đợt tấn công thật."},{"at":47,"t":"<b>24…♘c6?</b> — Mã về giữ, nhưng sau <b>25 axb6 axb6</b> thì cột a mở toang và tốt b6 thành mục tiêu không tốt nào che nổi. Nước đúng là <b>24…b5</b>: tốt đi qua mặt, tốt a5 không còn gì để ăn, cột a đóng lại, và tốt a7 vẫn có Xe d7 đỡ."},{"at":50,"t":"<b>26 ♕b1!</b> — Hậu về b1 chồng lên cột b. Bây giờ tốt b6 <b>bị đánh mà không có quân nào giữ</b>."},{"at":51,"t":"<b>26…♔c7</b> — nên chính Vua phải xuống đỡ tốt b6; đếm hết quân Đen thì không con nào khác với tới ô đó. Đấy là dấu hiệu thế cờ đã hỏng: con quân đáng lẽ được che lại thành con quân đi che."},{"at":52,"t":"<b>27 ♗c1!</b> — Tượng làm xong việc ở a3 thì đi tiếp a3–c1–f4, sang đường chéo mới để chiếu. Quân hết việc ở chỗ cũ thì chuyển chỗ, không ngồi giữ tiếng."},{"at":53,"t":"<b>27…♕e1+</b> — Đen chiếu để giành nhịp, và Trắng chỉ có <b>đúng một nước hợp lệ</b>: ♖f1. Đen lấy lại được tốt c3, nhưng Tượng vẫn kịp tới f4 kèm nước chiếu, còn Hậu Đen thì đứng lạc ở c3, xa chỗ Vua đang cần người."},{"at":58,"t":"<b>30 ♕b5!</b> và Đen xin thua. Hậu, Mã, Xe nằm trên cùng đường chéo b5–c6–d7, mà <b>Xe d7 không có một quân nào giữ</b>: Mã c6 vừa nhấc lên là <b>♕xd7+</b>, thậm chí <b>30…♘d8 31 ♕xd7#</b> l
