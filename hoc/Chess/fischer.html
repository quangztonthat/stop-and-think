à hết cờ luôn. Mã đứng im thì cũng chẳng khá: tốt b6 chỉ còn Vua b7 đỡ, tốt d5 chỉ còn con Xe không được phép nhúc nhích đỡ, và Trắng còn ♖ab1 chồng thêm vào cột b. Không giữ nổi cả ba chỗ."}]},"25":{"tiv":"Khi thế kẹp Maróczy không kẹp nổi","ctx":"Giải vô địch Mỹ 1960–61. Trắng dựng <b>thế kẹp Maróczy</b> trong Phòng thủ Sicilian: hai tốt c4 và e4 cùng canh ô d5, thêm f3 chống lưng cho e4, ý là không cho Đen đẩy …d5 để thở. Fischer phá thẳng vào chỗ đó — thí một tốt để đẩy được …d5 đúng lúc Vua Trắng còn chưa nhập thành. Vài nước sau, một đòn phối hợp đánh cùng lúc vào Hậu và Xe Trắng cho Đen ăn chất. Phần còn lại là kỹ thuật: Đen đổi sạch quân nặng để vào một tàn cuộc chỉ còn tốt, nơi Vua Đen đã đứng sẵn giữa bàn.","end":"Hai điểm đáng nhớ. Một là cách phá <b>thế kẹp</b>: đừng chờ gom đủ quân mới đẩy …d5, mà thí tốt để đẩy đúng lúc đối thủ vừa rút Mã về và Vua còn ở giữa — thứ mua được là quân ra nhanh và một bàn cờ mở. Hai là mẫu <b>trả chất để vào tàn cuộc</b> ở nước 30: Đen đang hơn chất mà tự nguyện trả lại, vì cái đáng giá hơn là tàn cuộc tốt với Vua đứng trước Vua đối thủ bốn nhịp. Muốn làm được nước ấy thì phải biết đánh giá tàn cuộc trước khi đổi, chứ không phải đếm quân trên bàn.","notes":[{"at":8,"t":"<b>5 f3</b> — Tốt f3 chống lưng cho e4 để Trắng còn đẩy được c4 mà không sợ …♘xe4. Bộ khung c4 + e4 là thế kẹp Maróczy, và mục đích duy nhất của nó là bịt ô d5. Đẩy ngay <b>5 c4</b> thì <b>5…♘xe4</b>: lúc đó tốt e4 chẳng có quân nào giữ, Đen ăn không."},{"at":11,"t":"<b>6…e6</b> — Tốt e6 làm hai việc cùng lúc. Nó giữ ô d5 thêm một lần, nên d5 đang là hai tốt Trắng (c4, e4) chọi ♘f6 với tốt e6. Và nó dọn sẵn cho chính nước phá …d5 sau này: khi đổi ở d5, phải có tốt e6 ăn lại thì Đen mới có tốt ở trung tâm."},{"at":14,"t":"<b>8 ♗e3</b> — Trắng ráp xong bộ khung. Ô d5 lúc này có <b>ba quân Trắng canh</b> (♘c3, tốt c4, tốt e4) chọi <b>hai quân Đen</b> (♘f6, tốt e6). Trên giấy thì ô d5 bị bịt kín, và Đen chỉ còn cách ngồi chờ."},{"at":17,"t":"<b>9…d5!?</b> — Đâm thẳng vào ô mà cả thế trận Trắng dựng lên để canh. Đây là nước thí tốt: sau <b>10 cxd5 exd5 11 ♘xd5 ♘xd5 12 ♕xd5</b> Trắng ăn đứt một tốt, đổi lại bàn cờ mở toang trong khi Trắng chưa nhập thành."},{"at":23,"t":"<b>12…♕c7!</b> — Trắng hơn một tốt nhưng Vua còn ở e1, Xe a1 và Tượng f1 chưa đi nước nào. Hậu ra c7 xếp <b>sau lưng Mã c6</b> trên cột c: lúc này Mã che nên chưa đánh được gì, hễ Mã nhảy đi là cột c bật ra. Toàn bộ đòn sau đó dựa vào chi tiết này."},{"at":24,"t":"<b>13 ♕b5?</b> — Hậu sang b5 đánh tốt b7. Chỗ hỏng là ô b5 nằm trên đường chéo d7–c6–b5. Ngay lúc này chính Mã c6 của Đen còn đứng chắn nên <b>13…♗d7</b> chưa với tới Hậu — nhưng hễ Mã c6 nhảy đi thì đường chéo bật ra và Hậu bị đánh miễn phí. Đặt Hậu vào ô mà đối thủ mở ra được chỉ bằng một nước Mã thì luôn nguy."},{"at":26,"t":"<b>14 ♖c1</b> — Xe ra cột c chọi Hậu c7. Nhưng giữa hai quân đó chỉ còn <b>đúng hai con Mã</b>: ♘c2 của Trắng và ♘c6 của Đen. Mã Đen mà nhảy đi thì trên cột c chỉ còn con Mã Trắng làm bia — và nó đứng ngay ô mà Mã Đen nhảy tới đánh được."},{"at":27,"t":"<b>14…♘b4!</b> — Một nước ba việc. Mã rời c6 nên cột c thông, Hậu c7 nhìn thẳng Xe c1. Mã b4 đánh Mã c2, lúc này c2 bị đánh <b>hai lần</b> (♘b4 và ♕c7) mà chỉ có Xe c1 giữ <b>một lần</b>. Và Tượng d7 vừa được mở ra, đang đánh Hậu b5. Gỡ Hậu bằng <b>15 ♕xb4</b> thì <b>15…♗xb4+</b> — Tượng e7 ăn Hậu <b>có chiếu</b>, vì ô c3 đã trống từ nước 11 nên đường chéo b4–e1 thông suốt."},{"at":29,"t":"<b>15…♕xc1+!</b> — Đúng thứ tự. Nếu ăn Hậu trước bằng <b>15…♗xb5</b> thì <b>16 ♖xc7</b> — Xe c1 và Hậu c7 đang nhìn nhau trên cột c, Trắng ăn lại Hậu ngay và còn hơn quân. Nên phải thí Hậu lấy Xe <b>có chiếu</b> đã; Trắng chỉ còn <b>ba nước hợp lệ</b>: 16 ♗xc1, 16 ♔e2, 16 ♔f2 — hai nước chạy Vua thì mất trắng Xe. Sau 16 ♗xc1 Đen mới …♗xb5 thu Hậu về."},{"at":33,"t":"<b>17…♗h4+!</b> — Mã Trắng vừa nhảy vào d5 đánh Tượng e7 đang không ai đỡ. Thay vì lùi cho yên, Tượng chạy <b>có chiếu</b>, giành lại nhịp. Trắng chỉ có ba cách đỡ: <b>18 g3</b>, <b>18 ♔d1</b> hoặc <b>18 ♔d2</b> — hai nước Vua thì mất luôn quyền nhập thành."},{"at":37,"t":"<b>19…♗d8</b> — Đây mới là kết của chuỗi vừa rồi: 18 g3 đánh vào Tượng h4, Đen chen …♗xf1 đổi bỏ con Tượng kia trước, rồi bây giờ mới rút Tượng về d8 an toàn. Đen giữ được chất hơn; Trắng còn dư một tốt."},{"at":41,"t":"<b>21…f5!</b> — Tốt f đánh vào e4. Mà tốt e4 chính là <b>quân duy nhất giữ Mã d5</b>. Muốn đuổi một quân đang đứng ô đẹp thì đánh vào chân nó, đừng đánh vào nó."},{"at":43,"t":"<b>22 e5 ♖c5</b> — Trắng đẩy tốt lên tránh đổi, nhưng bây giờ Mã d5 <b>hết sạch người giữ</b>. Xe c5 đánh vào Mã và Mã phải bỏ ô d5 — tới đây thế kẹp Maróczy coi như không còn gì."},{"at":44,"t":"<b>23 ♘b4</b> — Trong các ô Mã chạy được thì b4 là ô duy nhất còn Tượng c3 chống lưng. Đen vặn tiếp bằng <b>23…♗a5</b>: Tượng vòng từ d8 sang a5 đánh Mã lần nữa, ép <b>24 a3 ♗xb4 25 axb4</b> — Trắng gỡ được Mã, nhưng con tốt a bị kéo lên b4 thành bia đứng, và ô d5 thì bỏ trống hẳn."},{"at":49,"t":"<b>25…♖d5</b> — Xe Đen ngồi lên đúng ô d5, cái ô mà cả khai cuộc của Trắng dựng ra để canh. Hai tốt c4 và e4 làm nhiệm vụ đó thì đã biến mất từ lâu."},{"at":57,"t":"<b>29…♖c4</b> — Hai Xe Đen vào đúng chỗ. Lúc này <b>Tượng c3 một mình gánh hai việc</b>: nó là người giữ duy nhất của tốt b4, và cũng là người giữ duy nhất của tốt e5. Xe c4 thì đánh cả tốt b4 lẫn chính con Tượng ấy."},{"at":58,"t":"<b>30 ♖e1?</b> — Xe về e1 nhìn có vẻ chắc. Nhưng nó đứng cùng cột e với Vua e3 và tốt e5; tốt e5 chỉ có Tượng c3 giữ; Tượng c3 lại chỉ có tốt b2 giữ. Ba thứ xâu vào một chuỗi, và Đen có Xe đang đứng ở c4."},{"at":59,"t":"<b>30…♖xc3+!</b> — Trả lại chất để gỡ đúng chuỗi đó. Sau <b>31 bxc3 ♖xe5+</b> con Xe vừa ăn tốt vừa chiếu <b>dọc cột e</b>, mà Xe e1 của Trắng thì đứng ngay sau lưng Vua trên cùng cột — một đòn xiên. Vua buộc phải né về ô còn giữ nổi e1: <b>32 ♔d2</b> (hoặc 32 ♔f2); đi <b>32 ♔f4</b> thì <b>32…♖xe1</b> mất trắng Xe. Đổi hết xong, Đen vào tàn cuộc <b>năm tốt chọi năm tốt</b> — và ngang quân đúng là thứ Đen muốn."},{"at":65,"t":"<b>33…♔d5</b> — Lý do của cả đòn vừa rồi. Mỗi bên năm tốt như nhau, nhưng Vua Đen đã ở d5 còn Vua Trắng mới rời e1, <b>cách d5 tới bốn nước</b>. Trong tàn cuộc chỉ còn tốt, Vua là quân mạnh nhất và đi trước là ăn."},{"at":67,"t":"<b>34…♔c4</b> — Vua tiến sát, đánh cùng lúc tốt b4 và tốt c3. Chưa ăn được ngay vì hai con tốt còn chống lưng nhau (c3 giữ b4, Vua d2 giữ c3) — nhưng Vua Trắng vì thế bị đóng đinh ở cánh Hậu, trong khi cánh Vua vẫn còn phải trông."},{"at":85,"t":"<b>43…♔e3</b> và Trắng buông cờ. Vua Đen kề ngay tốt f3, Vua Trắng ở b4 cách đó bốn ô. Ba tốt Trắng đều bị chặn đứng (f3 vướng f4, g4 vướng g5, h6 vướng h7) nên không có nước đối công nào. Chẳng hạn <b>44 ♔b5 ♔xf3 45 ♔c4 ♔xg4</b>: Đen ăn sạch rồi cho tốt chạy."}]},"26":{"tiv":"Thời gian sẽ trả lời","ctx":"Ván thứ hai trong trận đấu tay đôi giữa Fischer và Reshevsky ở New York 1961. Đen chọn Phòng thủ Sicilian kiểu Rồng gia tốc — đưa Tượng ra g7 thật sớm, chưa vội đi ...d6. Fischer dựng thế quen thuộc ♗e3, ♗e2, f4 rồi bung tốt g4–f5 ở cánh Vua. Đen phá lại ở trung tâm bằng ...d5, ăn được hai tốt, nhưng đổi lại là thời gian và một cánh Vua trống trải; Trắng nhập thành cánh Hậu và dồn cả hai Xe về cột g, cột h. Ván cờ kết thúc bằng một nhát Xe ăn Tượng g7 để lôi Vua Đen ra khỏi góc.","end":"Hai chi tiết đáng mang đi. Thứ nhất là cách xếp quân trước, mở sau: Xe lên g1 khi chính Tượng g2 của mình còn chắn đường, rồi đổi con Tượng đó đi để cột g thông ra đúng lúc. Thứ hai là chuyện một quân bị trói: con Hậu Đen phải ngồi lì ở g6 chỉ để giữ Tượng g4, nên nước nào rời g6 cũng là nước hỏng. Khi ép đối phương vào tình trạng đó, đừng vội ăn quân — hãy tăng thêm sức ép cho tới lúc họ không còn nước đi nào không mất gì.","notes":[{"at":7,"t":"<b>4…g6</b> — Đen chưa đi ...d6 mà đưa Tượng ra đường chéo dài ngay. Đây là kiểu Rồng gia tốc: Tượng g7 sẽ nhắm d4 và b2, đổi lại Đen chấp nhận để Trắng rảnh tay đẩy tốt ở cánh Vua."},{"at":14,"t":"<b>8 f4</b> — Bộ khung quen của Trắng đã xong: ♗e3, ♗e2, rồi tốt f lên f4. Tốt f4 lấy ô e5 và, quan trọng hơn, nó là quân mở đường cho cả đợt g4–f5 sắp tới. Đen vừa nhập thành xong thì cũng là lúc tốt Trắng bắt đầu chạy về phía đó."},{"at":17,"t":"<b>9…♗e6</b> — Tượng ra e6 để chuẩn bị …d5. Cùng với ♘f6, nó là quân thứ hai của Đen canh ô d5 — nhưng Trắng đang canh ô đó ba lần (♘c3, ♕d1, tốt e4). Và e6 là đúng ô mà tốt f của Trắng sắp đâm tới."},{"at":18,"t":"<b>10 g4!</b> — Trắng không chần chừ. Tốt g lên g4 dọa g5 đuổi Mã f6, đồng thời chuẩn bị f5 đánh vào Tượng vừa ra e6. Trung tâm đang đóng nên chuyện Vua Trắng còn ở giữa bàn chưa phải vấn đề."},{"at":21,"t":"<b>11…♗c8</b> — Sau 11 f5 con Tượng hết chỗ tốt: ăn <b>11…♗xf5 12 exf5</b> thì mất quân lấy tốt. Nó phải lùi hẳn về nhà, tức là Đen tiêu hai nhịp cho một con Tượng để rồi trở lại vạch xuất phát."},{"at":24,"t":"<b>13 ♗f3!</b> — Tốt d5 đang bị ba quân Đen nhắm (♘b4, ♘f6, ♕d8) mà chỉ có ♘c3 và ♕d1 giữ. Tượng ra f3 là người giữ thứ ba, và nó đứng luôn trên đường chéo dài hướng về Vua Đen."},{"at":28,"t":"<b>15 ♗g2!</b> — Tượng vừa bị tốt g4 đuổi. Fischer không ăn cũng không đi xa, chỉ lùi một ô: từ g2 con Tượng vẫn giữ d5 và vẫn nằm trên đường chéo dài. Đen hơn một tốt, nhưng quân Đen thì đang lộn xộn."},{"at":30,"t":"<b>16 ♕d3!</b> — Một nước ba việc. Hậu là người giữ thứ ba cho tốt d5 (cùng ♘c3 và ♗g2); Hậu đứng vào đường chéo b1–h7 nhắm tốt h7; và Hậu rời d1 để dọn ô cho Xe sau khi nhập thành cánh Hậu."},{"at":32,"t":"<b>17 0-0-0</b> — Vua sang cánh Hậu. Đây mới là điểm chốt của cả kế hoạch: nhập thành xong là hai Xe lập tức đứng ở cột d và cột h, đúng hai cột Trắng sắp cần dùng."},{"at":34,"t":"<b>18 h3!</b> — Tốt g4 của Đen không quân nào giữ. Trắng đâm tốt h vào để buộc nó chạy tiếp; nó lên g3 thì đứng chết ở đó, thành một mục tiêu cố định nằm ngay trên cột g."},{"at":36,"t":"<b>19 ♖hg1</b> — Xe lên g1 dù chính Tượng g2 của Trắng đang chắn trước mặt. Đây là xếp quân trước, mở sau: khi nào Tượng g2 rời đi thì Xe nhìn thẳng một mạch lên g3 rồi g7."},{"at":37,"t":"<b>19…♕d6!</b> — Hậu ra d6 làm người giữ thứ hai cho Mã d5 (cùng tốt e6), và đứng đối diện Hậu d3 trên cột d. Nhờ vậy Đen giữ được con Mã ở giữa bàn thêm một lúc nữa."},{"at":38,"t":"<b>20 ♗xd5</b> — Đổi Tượng lấy Mã đang chiếm trung tâm. Nhưng cái được lớn hơn là con Tượng biến khỏi g2 — cột g mở ra đúng như đã tính từ nước trước."},{"at":40,"t":"<b>21 ♘xd5?</b> — Ăn lại tốt bằng Mã. Ăn bằng Xe (<b>21 ♖xg3</b>) hợp lý hơn: Xe đứng ở g3 canh luôn tốt h3 của mình, và đòn <b>23…♗xh3</b> mà Đen chơi hai nước sau sẽ không tồn tại."},{"at":42,"t":"<b>22 ♗f4</b> — Tượng rời e3 sang f4, nhắm luôn con tốt g3 kẹt lại từ nước 18. Tốt ấy giờ bị <b>ba quân Trắng nhắm</b> (♕d3, ♗f4, ♖g1) mà <b>không ai giữ</b>, nên Đen buộc phải kéo Hậu ra g6 để chống lưng cho nó."},{"at":45,"t":"<b>23…♗xh3!</b> — Tốt h3 không ai giữ. Đây cũng là việc đầu tiên con Tượng c8 làm được kể từ nước 11: nó lấy lại một tốt và cuối cùng cũng bước vào cuộc chơi."},{"at":51,"t":"<b>26…♕e4?</b> — Hậu ra e4 là có lý do: từ đó nó nhìn xuống Xe h1 đang không ai giữ. Nhưng cái giá quá đắt. Hậu rời g6 thì Tượng g4 mất người giữ duy nhất, đang bị cả ♘e3 lẫn ♖g3 nhắm; và Hậu bỏ luôn cột g — đúng cột mà Trắng đã xếp Xe từ lâu. Ăn ngay <b>27 ♘xg4</b> lại hỏng vì <b>27…♕xh1+</b>."},{"at":52,"t":"<b>27 ♕h2!</b> — Nước duy nhất giải được cả hai chuyện. Hậu lùi về h2 <b>giữ Xe h1</b>, nên đòn …♕xh1 tắt ngấm; đồng thời Hậu và Xe xếp thành cặp trên cột h nhắm h7. Tượng g4 vẫn treo, và Đen thì hết thời gian."},{"at":54,"t":"<b>28 ♖xg7!</b> — Đen vừa phải chuyển Tượng sang e6 để cứu nó, và ngay khi ô g4 trống thì Xe g3 nhìn thẳng lên g7. Xe ăn Tượng không phải để lấy quân mà để lôi Vua ra khỏi góc."},{"at":58,"t":"<b>30 ♖g1+</b> — Đen buộc phải chắn bằng Hậu; đi <b>30…♔h8</b> thì <b>31 ♕g7</b> là chiếu hết. Chắn xong thì <b>31 ♖xg6+ fxg6</b> — Trắng ăn Hậu và ra khỏi đợt tấn công với phần hơn quân."},{"at":74,"t":"<b>38 ♕d8+</b> — Đen xin thua. Vua chỉ có bốn nước và không nước nào sống: <b>38…♔h7 39 ♕h8</b> chiếu hết, <b>38…♔f7 39 ♘h6</b> chiếu hết, còn chắn bằng <b>38…♖e8</b> hay <b>38…♖f8</b> thì Hậu ăn luôn Xe."}]},"27":{"tiv":"Toàn pháo hoa","ctx":"Ván thứ năm của trận đấu, lúc này đã chuyển sang Los Angeles. Fischer cầm Đen chọn Nửa-Tarrasch: đổi sớm ở d5 rồi ở d4 để Trắng phải nhận một tốt d cô lập, sau đó phong tỏa nó bằng Mã ở d5. Reshevsky chơi đúng bài của bên có tốt cô lập — Tượng c2 cùng Hậu d3 chĩa vào h7, Tượng ra g5, tốt h chạy lên h4 — nhưng Đen chặn đường chéo bằng ...g6 rồi phản đòn bằng ...f5. Từ nước 20 hai bên lao vào một loạt đòn ăn miếng trả miếng; Đen thoát ra với hai tốt hơn, Trắng lấy lại chất, và phần còn lại là một tàn cuộc Xe kết thúc bằng cuộc đua phong Hậu.","end":"Đoạn từ nước 20 đến nước 25 là một mẫu đáng học: khi quân mình bị đánh mà lùi thì hỏng, hãy tìm nước ĐÁNH TRẢ thay vì nước chạy. Mã f4 bị tốt e3 đuổi, Đen không lùi mà ăn g2, rồi mở chiếu bằng ...♘d4 để mượn thời gian đúng bằng số nhịp cần thiết. Bài học thứ hai nằm ở tàn cuộc: trong cuộc đua tốt, thứ quyết định không phải ai đi trước mà tốt của ai đi kèm chiếu. Tốt g của Đen phong lên cùng lúc với Xe a1 sẵn ở hàng cuối, nên một con Hậu đơn độc của Trắng không đỡ nổi.","notes":[{"at":7,"t":"<b>4…♘xd5</b> — Ăn lại bằng Mã chứ không bằng tốt. Đó là điểm phân biệt của Nửa-Tarrasch: Đen nhường trung tâm tốt, đổi lại lấy thế cờ thoáng và một mục tiêu rất rõ ràng — con tốt d của Trắng sắp bị cô lập."},{"at":18,"t":"<b>10 exd4</b> — Tốt d4 chính thức thành tốt cô lập: Trắng chỉ còn tốt ở a3, b2, d4, f2, g2, h2, tức là hai cột c và e đều trống, không có tốt nào chống lưng cho nó được nữa. Bù lại Trắng có cột e nửa mở, hai Tượng hướng về cánh Vua và ô e5 làm bàn đạp cho Mã. Cả ván cờ là cuộc giằng co giữa hai thứ đó và điểm yếu d4."},{"at":25,"t":"<b>13…g6</b> — Chặn đường chéo b1–h7 bằng một con tốt, vì Tượng c2 và Hậu d3 đang xếp thành cặp nhắm vào h7 (Hậu đứng trước, Tượng nấp sau). Cái giá là các ô đen quanh Vua yếu đi, và Trắng lập tức trả lời bằng h4."},{"at":31,"t":"<b>16…♘d5</b> — Mã quay về d5. Đây là ô phong tỏa kinh điển trước một tốt cô lập: Trắng đã hết cả tốt c lẫn tốt e nên <b>không con tốt nào đuổi được Mã</b>, mà tốt d4 thì không nhúc nhích đi đâu. Mã lại còn được tốt e6 và Hậu d8 chống lưng."},{"at":33,"t":"<b>17…f5!?</b> — Đuổi Mã e4, nhưng đồng thời làm yếu ô e6 và mở đường chéo a2–g8 về phía Vua mình. Fischer chọn phương án sắc: thà mở cờ ra đánh còn hơn ngồi chờ h4–h5 dội xuống."},{"at":36,"t":"<b>19 ♘xg5!</b> — Ăn lại bằng Mã, không bằng tốt h. Từ g5 con Mã nhắm e6 — đúng ô vừa yếu đi vì ...f5 — và nhắm cả h7. Ăn bằng tốt h thì Trắng mất luôn con tốt vốn là mũi nhọn tấn công."},{"at":40,"t":"<b>21 ♘b5!</b> — Trước đó <b>20 ♕e3</b> đánh Mã f4 đang không ai giữ, nên Đen chống bằng <b>20…♕xd4</b>: Hậu vừa ăn tốt cô lập vừa vươn sang ngang giữ Mã f4. Nay Mã nhảy vào b5 đánh Hậu d4 <b>lần thứ hai</b> — Hậu chỉ có ♘c6 đỡ một lần nên buộc phải đổi."},{"at":43,"t":"<b>22…♘xg2!</b> — Sau khi đổi Hậu, tốt f2 ăn lên e3 và lại đánh Mã f4. Đen không lùi mà ăn tốt g2, ô <b>chỉ có Vua g1 canh</b>. Đây là nước mở màn của một đòn phối hợp ba nhịp."},{"at":45,"t":"<b>23…♘d4 chiếu mở</b> — Con Mã còn lại nhảy vào d4, mở đường cho Tượng b7 chiếu Vua g2. Trong lúc Trắng bận đỡ chiếu, Mã d4 đang đánh cả Tượng c2 lẫn Mã b5 — mà Mã b5 thì <b>không quân nào giữ</b>."},{"at":46,"t":"<b>24 ♗e4!</b> — Cách chống hay nhất: chắn chiếu bằng đúng con Tượng đằng nào cũng sắp mất. Đen ăn <b>24…♗xe4+ 25 ♘xe4 ♘xb5</b>, kết toàn bộ đòn phối hợp với phần <b>hơn hai tốt</b>."},{"at":50,"t":"<b>26 ♘f6+</b> — Trắng lấy lại chất bằng đòn bắt đôi: Mã ở f6 đánh cùng lúc Vua g8 và Xe e8. Đen chỉ có bốn ô Vua và không ô nào cứu được Xe, nên <b>26…♔f7 27 ♘xe8 ♖xe8</b> — quân số cân bằng lại, chỉ còn hai tốt hơn của Đen là thật."},{"at":54,"t":"<b>28 a4!</b> — Hai Xe chọi Xe cộng Mã, Đen hơn hai tốt. Trắng không có gì để chờ nên cho tốt a chạy ngay: nó vừa đuổi Mã b5 vừa là con tốt thông duy nhất trên bàn. Cột mở và tốt thông là hai thứ duy nhất Trắng còn nắm."},{"at":57,"t":"<b>29…♔f6!</b> — Bị chiếu, Đen có bốn cách: 29…♔g8, 29…♔f8, 29…♖e7 và nước này. Chắn bằng <b>29…♖e7 30 ♖xe7+ ♔xe7</b> thì đổi mất cặp Xe, để lại Mã chọi Xe — thứ Đen không muốn khi đang hơn tốt. Còn hai nước lùi Vua thì Trắng vẫn <b>♖xa7</b> như thường. Fischer chọn nước đưa Vua tiến lên, vì trong tàn cuộc Vua là quân đánh nhau."},{"at":58,"t":"<b>30 ♖ec1!</b> — Xe thứ hai vào cột c chống lưng cho Xe c7, cột c lúc này hoàn toàn trống từ c1 tới c7. Trắng chấp nhận bỏ hết chuyện phòng thủ, đổi lấy hai Xe cùng làm việc trên một cột và con tốt a."},{"at":63,"t":"<b>32…♖d8!</b> — Xe rời cột e sang cột d, nơi nó vào được hàng ba. Sau <b>33…♖d3</b> con Xe đánh tốt e3 đang không ai giữ, vừa ăn vừa đứng chắn ngang — đó là cách Đen biến hai tốt hơn thành thứ đếm được."},{"at":70,"t":"<b>36 ♖f2?</b> — Xe đi chặn tốt f nhưng đậu đúng ô mà Mã e4 với tới, và f2 chỉ có Vua g2 giữ. <b>36…♘xf2 37 ♔xf2</b> lấy chất, còn lại là tàn cuộc Xe chọi Xe với Đen hơn một tốt — thứ tàn cuộc dễ chơi nhất cho bên hơn quân."},{"at":73,"t":"<b>37…♖e5!</b> — Xe đứng ngang hàng năm, vừa đánh tốt a5 đang không ai giữ vừa chặn nó lại. Mẫu quen của tàn cuộc Xe: đặt Xe ở chỗ nhìn được cả tốt thông của đối phương lẫn con đường tốt của mình sẽ đi."},{"at":77,"t":"<b>39…♖a3</b> — Xe xuống a3, tức là <b>đứng sau lưng con tốt thông của Trắng</b> trên chính cột a. Tốt a càng chạy thì càng xa người giữ, còn Xe thì cứ bám theo — quy tắc cũ của tàn cuộc Xe, và đây là lúc dùng nó."},{"at":94,"t":"<b>48 ♖xf4+</b> — Trắng bỏ Xe lấy tốt f để kịp tham gia cuộc đua; Đen chỉ có ba nước và <b>48…♔xf4</b> là nước ăn. Cả hai bên đều phong Hậu ở mấy nước sau, nhưng Đen còn nguyên Xe a1 nằm sẵn ở hàng cuối, còn Trắng thì không có gì ngoài con Hậu."},{"at":97,"t":"<b>49…g1=♕</b> — Đen phong trước. Trắng phong theo bằng <b>50 b8=♕+</b> có chiếu, nhưng đó là con tốt cuối cùng: sau đó Trắng còn một Hậu chọi Hậu cộng Xe của Đen. Trong một cuộc đua tốt, đi trước một nhịp là đủ để đổi cả cục diện."},{"at":113,"t":"<b>57…♔f5</b> và Trắng buông cờ. Đen có Hậu cộng Xe chọi một Hậu. Ăn <b>58 ♕xa1</b> vô ích vì Xe a1 được Hậu g1 chống lưng — Trắng bỏ Hậu lấy Xe rồi còn lại tay không. Con tốt a6 cũng không phải hy vọng: chính Xe a1 đang đứng dưới nó trên cột a, nên <b>58 a7 ♖xa7</b>."}]},"28":{"tiv":"Một ván hòa đầy lỗi","ctx":"Ván thứ 11 của trận đấu ở Los Angeles. Fischer cầm Đen chọn Phòng thủ Ấn Độ Vua: nhường trung tâm cho Trắng, rồi phản công bằng ...e5 và ...f5 ở cánh Vua trong khi Trắng đẩy tốt ở cánh Hậu. Đây là cuộc đua hai cánh cổ điển — mỗi bên tấn công ở một phía và ai tới trước thì thắng. Đen tới trước: một đòn phối hợp ở nước 27 lấy được chất. Nhưng Trắng ăn lại đủ tốt để giữ thế cân bằng, và ván cờ trôi thành hòa sau nhiều nước cả hai cùng bỏ lỡ ở tàn cuộc.","end":"Bài học nặng nhất nằm ở nước 28. Trước khi ăn lại bằng quân nào, hãy hỏi quân đó đang canh ô nào: con Xe e1 là người duy nhất giữ ô e2, ăn bằng nó là mở cửa cho đòn bắt đôi. Bài học thứ hai là ở tàn cuộc — hơn chất mà số tốt bằng nhau, lại còn để mất Tượng giữ ô đen, thì phần hơn đó thường không đủ để thắng. Và bài cuối: Vua đứng cùng cột với quân mình là lời mời cho đòn ghim, ở đây cả hai bên cùng không nhìn thấy ...♖f7 ở nước 53.","notes":[{"at":14,"t":"<b>8 d5</b> — Trắng khoá trung tâm. Từ giờ hai bên chơi ở hai nơi khác nhau: Trắng đẩy c4–c5 ở cánh Hậu, Đen đẩy ...f5 rồi ...g5 ở cánh Vua. Cấu trúc đóng nghĩa là nhịp rẻ hơn bình thường, ai chậm nửa nước cũng chưa chết ngay."},{"at":20,"t":"<b>11 exf5</b> — Trắng đổi ngay ở f5 thay vì để Đen đổi. Đen ăn lại bằng Mã e7, giữ nguyên cấu trúc tốt và mở cột f cho Xe f8 — cột đó sẽ là đường đi chính của quân Đen suốt trung cuộc."},{"at":23,"t":"<b>12…♘d4</b> — Ô tiền tiêu thật sự chứ không phải hình thức. Đếm trên bàn cờ: sau nước này <b>không một quân Trắng nào đánh được ô d4</b> — Mã c3 và Mã d3 đều không với tới, Hậu d1 bị chính Mã d3 chắn cột. Tốt c đã ở c4, tốt e vừa đổi mất, nên cũng không có tốt nào đuổi được. Mã sẽ đứng đó tới khi Đen tự muốn đổi."},{"at":26,"t":"<b>14 ♗g5?</b> — Tượng ra g5 đánh Hậu d8, nhưng nó chẳng có việc gì ở đó vì Mã f6 đã bỏ đi từ lâu. Đen chỉ cần ...♕e8 là Tượng phải lộn về d2 — hai nước để tới chỗ mà từ c1 chỉ cần một nước, trong khi Hậu Đen sang e8 lại đúng hướng nó muốn đi tiếp (e8–g6)."},{"at":31,"t":"<b>16…♘xe2+</b> — Đen tự tay đổi con Mã d4 quý giá lấy Tượng e2, kèm chiếu. Không phải vì bị ép: ô d4 vẫn không quân Trắng nào với tới. Lý do là con Tượng e2 chính là quân duy nhất của Trắng canh các ô sáng f3–g4–h5, mà Đen thì sắp đẩy ...g5–g4 vào đúng đó. Trắng ăn lại được bằng <b>17 ♖xe2</b> hoặc <b>17 ♕xe2</b>; chọn ♕xe2 để Xe ở lại e1 — và đúng con Xe e1 đó là nhân vật chính của thảm hoạ ở nước 28."},{"at":40,"t":"<b>21 bxa5?</b> — Trắng đổi ở a5 và tự mở cột b cho Xe a8 của Đen, trong khi con tốt a5 chưa đi đâu được và tốt b6 thì Đen ăn lại lúc nào cũng được. Đúng khoảnh khắc đó thì cánh Vua của Đen nổ."},{"at":41,"t":"<b>21…g4!</b> — Đánh vào tốt f3. Con tốt đó đang giữ cả ô e4 lẫn ô g4, nên Trắng buộc phải chọn: hoặc để cột g mở ra, hoặc để tốt Đen đi tiếp. Đây là nước mở màn cho toàn bộ đợt tấn công."},{"at":42,"t":"<b>22 ♘df2</b> — Trắng lùi Mã về đỡ f3 chứ không dám ăn. Nếu <b>22 fxg4</b> thì <b>22…♗xg4</b>: Tượng c8 vào trận không mất nhịp nào vì nó đánh ngay Hậu e2, còn hàng tốt chắn Vua Trắng thì chỉ còn g2 và h2. Đấy đúng là kiểu thế cờ Đen muốn."},{"at":45,"t":"<b>23…♘h5</b> — Mã đi vòng h5–f4. Nước này đi được là nhờ Hậu g6 đang giữ ô h5: <b>24 ♕xh5?? ♕xh5</b> và Trắng mất Hậu không lấy gì lại. Nên Trắng phải lùi <b>24 ♕e3</b>, về giữ ô e2 — lúc này e2 còn hai người canh là Xe e1 và Hậu e3."},{"at":50,"t":"<b>26 c5</b> — Cuối cùng Trắng cũng phá được ở cánh Hậu: tốt c5 đánh d6, chỗ đó Đen chỉ có tốt c7 và Hậu g6 giữ. Nhưng cuộc đua đã ngã ngũ về nhịp: Đen trả lời ...♘f4 và mọi chuyện xảy ra ở cánh Vua trước."},{"at":51,"t":"<b>26…♘f4</b> — Mã vào f4, chỗ nó nhìn cùng lúc hai ô e2 và g2 ngay cạnh Vua Trắng. Lúc này e2 còn Xe e1 và Hậu e3 canh, nên chưa có gì. Nhưng cả phần còn lại của ván cờ xoay quanh đúng ô e2 đó."},{"at":53,"t":"<b>27…♗xe4!</b> — Trắng vừa đưa Hậu từ e3 sang g3 để chặn cột g, và cái giá là ô e2 <b>chỉ còn đúng Xe e1 canh</b>. Đen đổi Tượng lấy Mã e4 để ép Trắng phải quyết định ăn lại bằng quân nào."},{"at":54,"t":"<b>28 ♖xe4?</b> — Ăn lại bằng Xe. Con Xe rời e1, và ô e2 mất người giữ duy nhất. Ăn bằng Mã thì không có gì xảy ra: <b>28 ♘xe4 ♘e2+ 29 ♖xe2</b> Đen mất không con Mã, còn <b>28 ♘xe4 ♕xe4?? 29 ♖xe4</b> thì mất luôn Hậu."},{"at":55,"t":"<b>28…♕xe4!</b> — Hậu ăn Xe. Trắng phải ăn lại bằng Mã, và ngay sau đó ...♘e2+ bắt đôi Vua g1 với Hậu g3 vì e2 giờ trống trơn. Đếm nước hợp lệ của Trắng sau <b>29…♘e2+</b>: đúng một, <b>30 ♔h1</b>."},{"at":59,"t":"<b>30…♘xg3+</b> — Ăn Hậu. Tính lại cả đòn: Đen đưa ra Tượng và Hậu, nhận về Xe, Mã và Hậu — hơn đúng một chất, số tốt vẫn bằng nhau (mỗi bên năm con)."},{"at":61,"t":"<b>31…♖a6!</b> — Xe lên hàng sáu để giữ tốt d6 theo hàng ngang, vì Trắng đang doạ c5xd6. Hơn chất mà mất tốt thì phần hơn tan ngay, nên giữ tốt lúc này quan trọng hơn tìm đòn."},{"at":75,"t":"<b>38…♖f4?</b> — Xe đánh Mã e4 đang không ai giữ, nhưng nó chỉ bảo vệ được Tượng f8 chừng nào còn đứng trên cột f. Sau 39 ♗c7 Đen phải rời cột f để ăn Mã và mất Tượng f8: đổi ngang quân, nhưng Đen mất con Tượng canh các ô đen quanh Vua và mất luôn tốt d6."},{"at":76,"t":"<b>39 ♗c7!</b> — Tượng sang c7 đánh tốt d6, và Đen không làm được cả hai việc một lúc. Vừa giữ d6 vừa ở lại cột f thì chỉ có <b>39…♖f6</b>, nhưng <b>40 ♘xf6+</b> ăn đứt Xe vì f6 không ai giữ. Đi chỗ khác để giữ d6, ví dụ <b>39…♖d3</b>, thì <b>40 ♖xf8</b>. Đen đành 39…♖xe4 40 ♖xf8 — đổi ngang Mã lấy Tượng, rồi tốt d6 vẫn rụng ở nước 42."},{"at":84,"t":"<b>43 ♖c6!</b> — Xe sang c6 giữ ngang hàng sáu rồi lùi về c2. Từ hàng hai nó chặn được cả hai Xe Đen, và với số tốt chỉ còn hai bên hai con, phần hơn chất của Đen không còn đủ để phá vỡ hàng phòng ngự."},{"at":102,"t":"<b>52 ♖xe3</b> — Đen đổi tốt e lấy tốt a, và bàn cờ trơ ra: Xe+Xe+tốt h chọi Xe+Tượng+tốt g. Đây mới là chỗ đáng nhớ — hơn chất mà mỗi bên chỉ còn một tốt thì gần như không có gì để thắng, vì Đen không có tốt nào để đẩy thành Hậu."},{"at":104,"t":"<b>53 ♔f3?</b> — Vua bước lên đứng cùng cột f với chính con Tượng f4 của mình. Trắng không được chắn bằng Xe (<b>53 ♖e2 ♖xe2</b> và Vua g2 không ăn lại được vì Xe a2 canh ô e2 — mất trắng một Xe), nhưng Vua đi đâu cũng được: <b>53 ♔h3</b> tránh hẳn cột f và không có gì xảy ra."},{"at":105,"t":"<b>53…♖b7?</b> — Đen không thấy <b>53…♖f7</b>: Xe xuống f7 ghim Tượng f4 vào Vua f3 và con Tượng <b>không còn một nước đi hợp lệ nào</b>. Nó vẫn được Vua f3 và tốt g3 giữ nên chưa mất ngay, nhưng cả Vua lẫn tốt Trắng bị trói vào việc canh nó. Bỏ lỡ chỗ đó xong thì thế cờ không còn gì để chơi."},{"at":112,"t":"<b>57 ♔g4</b> — Thế cờ cuối: Đen hơn chất, mỗi bên đúng một tốt (h6 và g3), Vua Trắng đứng ngay cạnh cả Tượng lẫn tốt của mình. Không có tốt thông, không có ô yếu để nhắm — hai Xe không có việc gì làm, và ván cờ dừng lại ở đây."}]},"29":{"tiv":"Gậy ông đập lưng ông","ctx":"Bled 1961, Fischer cầm Trắng gặp Geller. Khai cuộc là <b>Ruy Lopez</b>, biến Steinitz hoãn (4…d6) — Đen giữ tốt e5 bằng cách thủ chắc thay vì tranh trung tâm. Đen ra Tượng g4 ghim Mã f3, rồi đưa Hậu ra f6 quá sớm; Trắng lập tức lấy nhịp bằng h3 và g4, đẩy Tượng Đen ra rìa bàn cờ. Từ nước 9 Trắng mở trung tâm, đổi ở c6 để phá cấu trúc tốt Đen và đuổi Vua Đen ra f8, nơi nó ở lại tới hết ván. Đến nước 22 Đen đang <b>hơn hai tốt</b> mà vẫn phải xin thua.","end":"Bài học rõ nhất là <b>đếm tốt không thay được an toàn Vua</b>: Geller ăn tốt e4 rồi ăn thêm hai tốt cánh Vua, nhưng Vua kẹt ở f8 với Mã g8 và Xe h8 chưa bao giờ ra khỏi chỗ. Chi tiết kỹ thuật đáng nhớ là nước <b>21 ♗g3</b>: nó vừa chặn cột g để khỏi bị chiếu hết, vừa kiểm soát ô d6 — đúng ô mà hai nước sau Đen cần dùng để chắn nước chiếu ♕b4+. Một nước phòng thủ mà mở đường cho đòn kết thúc.","notes":[{"at":9,"t":"<b>5…♗g4</b> — Tượng ra g4 ghim Mã f3 vào Hậu d1. Mã chưa đi được vì Hậu đứng sau lưng nó trên đường chéo g4–d1, nên Đen tạm rảnh tay giữ tốt e5."},{"at":10,"t":"<b>6 h3!</b> — Hỏi thẳng con Tượng. Đổi luôn thì <b>6…♗xf3 7 ♕xf3</b>: Trắng có cặp Tượng, Hậu ra ô tốt, còn Đen thì hết quân gây phiền. Đen lùi ♗h5 — và con tốt h3 vừa đi sẽ là chỗ tựa cho nước g4 hai nước nữa."},{"at":13,"t":"<b>7…♕f6?</b> — Hậu ra quá sớm. Nó chặn mất ô f6 của Mã g8 và đứng vào chỗ dễ bị đuổi, trong khi Đen còn hai quân cánh Vua chưa triển khai."},{"at":14,"t":"<b>8 g4!</b> — Tốt g đuổi Tượng h5. Ăn tốt là hỏng: <b>8…♗xg4 9 hxg4</b> Đen mất Tượng lấy tốt, và cột h mở ra ngay trước mặt Xe Trắng. Tượng đành về g6 — nơi nó chẳng nhìn thấy gì. Trắng chấp nhận đẩy tốt trước Vua mình vì Đen không có quân nào đủ nhanh để khai thác."},{"at":16,"t":"<b>9 d4!</b> — Mở trung tâm đúng lúc Vua Đen chưa nhập thành. Đếm ở e5: Trắng đánh hai lần (tốt d4, Mã f3), Đen giữ ba lần (Mã c6, tốt d6, Hậu f6) — nên đây không phải nước ăn tốt mà là nước mở cột."},{"at":17,"t":"<b>9…♗xe4</b> — Đen ăn tốt e4: đúng là không một quân Trắng nào giữ ô đó. Nhưng Tượng đứng giữa bàn cờ một mình, và Trắng đuổi nó ngay để lấy lại nhịp."},{"at":18,"t":"<b>10 ♘bd2</b> — Mã ra đánh Tượng e4. Trắng không vội đòi tốt về; việc quan trọng hơn là đẩy Tượng Đen lùi lần thứ ba trong bốn nước."},{"at":20,"t":"<b>11 ♗xc6+</b> — Đổi Tượng lấy Mã để bắt Đen ăn lại bằng tốt b, tạo <b>tốt chồng</b> c7–c6. Đồng thời gỡ mất quân đang giữ tốt e5."},{"at":24,"t":"<b>13 ♘xe5!</b> — Đòi lại tốt ngay. Đen không ăn được: <b>13…♕xe5 14 ♖e1</b> ghim Hậu vào Vua e8, và Hậu chỉ còn đi được trên cột e — ô nào cũng bị Xe ăn. Ví dụ <b>14…♕e7 15 ♖xe7+ ♗xe7</b>: Đen trả Hậu lấy Xe. Chắn bằng <b>14…♗d6</b> hay <b>14…f6</b> cũng thế, <b>15 ♖xe5</b> rồi ăn lại — vẫn là Hậu đổi Xe."},{"at":25,"t":"<b>13…♗d6</b> — Đen không ăn mà đánh con Mã. Đúng ra thì Mã e5 lúc này bị hai quân đánh (Hậu f6 và Tượng d6) mà <b>không ai giữ</b>, nên Trắng phải xử lý ngay trong nước sau."},{"at":26,"t":"<b>14 ♘xg6!</b> — Đổi nốt Tượng g6, quân duy nhất còn đỡ được cánh Vua Đen. Đen ăn lại bằng Hậu, nghĩa là Hậu bị kéo ra khỏi cột e — đúng lúc Trắng cần cột đó."},{"at":29,"t":"<b>15…♔f8</b> — Chắn thì vẫn chắn được, nhưng chắn bằng quân nào cũng dở: <b>15…♕e6 16 ♖xe6+ fxe6</b> đổi Xe lấy Hậu, còn <b>15…♗e5 16 ♖xe5+</b> ăn không con Tượng vì e5 chẳng ai giữ. Chỉ còn ...♘e7 hoặc ...♗e7 là nhét quân vào chỗ chật. Geller chọn đi Vua — và Đen <b>mất quyền nhập thành</b>: Xe h8 với Mã g8 từ đây coi như đứng ngoài ván cờ."},{"at":31,"t":"<b>16…h5</b> — Đen bắt đầu phản công đúng chỗ Trắng đã đẩy tốt: g4 giờ bị Hậu g6 và tốt h5 đánh hai lần, được Hậu d1 và tốt h3 giữ hai lần. Cân bằng, nhưng cột h sắp mở và Xe h8 — quân duy nhất chưa động của Đen — sẽ có việc."},{"at":32,"t":"<b>17 ♘xd6</b> — Đổi Mã lấy Tượng d6, quân hoạt động nhất của Đen. Sau khi ăn lại bằng tốt c7, Tượng f4 của Trắng nhắm ngay vào d6."},{"at":33,"t":"<b>17…cxd6</b> — Nhìn kỹ cấu trúc vừa hiện ra: Đen còn a6, c6, d6 ở cánh Hậu và <b>không con nào có thể được tốt khác bảo vệ</b> — tốt b và tốt e đã biến mất từ lâu. Cột b thì mở toang. Cả ba con đó sẽ phải nhờ quân giữ suốt phần còn lại của ván."},{"at":35,"t":"<b>18…d5?</b> — Cứu tốt khỏi ♗f4 bằng cách đẩy lên, và đúng là sau <b>19 ♕b3</b> nó vẫn còn tốt c6 giữ. Nhưng nước này bỏ trống ô <b>d6</b>. Hãy nhớ ô đó: nước chiếu kết liễu ở cuối ván, <b>22 ♕b4+</b>, chạy đúng đường b4–c5–<b>d6</b>–e7–f8. Chừng nào còn tốt ở d6 thì nước chiếu ấy không tồn tại."},{"at":37,"t":"<b>19…hxg4</b> — Đen bỏ mặc cánh Hậu và mở cột h. Từ đây là chạy đua thật: Trắng ăn quân ở bên trái, Đen lùa tốt g4–h3 vào Vua Trắng ở bên phải."},{"at":38,"t":"<b>20 ♕b7!</b> — Hậu vào b7 đánh Xe a8, con Xe không một quân nào giữ. Đen không cứu mà lao tiếp."},{"at":39,"t":"<b>20…gxh3</b> — Bây giờ Đen thật sự <b>dọa ♕g2 chiếu hết</b>: tốt h3 giữ ô g2 cho Hậu, còn Vua Trắng không có ô chạy. Chạy thử trên bàn thì đúng là chiếu hết. Trắng phải xử lý ngay."},{"at":40,"t":"<b>21 ♗g3</b> — Tượng lùi về chắn cột g, dập tắt nước chiếu hết. Nó còn làm việc thứ hai: từ g3, Tượng kiểm soát ô <b>d6</b>. Điểm tinh tế là con Tượng này đang bị chính Hậu g6 ghim vào Vua g1 — nên ở nước 22 nó chỉ ăn được d6 khi Hậu Đen rời g6."},{"at":42,"t":"<b>22 ♕b4+</b> và Đen xin thua. Đúng bốn nước hợp lệ, thử hết trên bàn cờ: <b>22…♕d6 23 ♗xd6+ ♖xd6</b> — Hậu rời g6 nên Tượng hết bị ghim, Đen trả Hậu lấy Tượng. <b>22…♘e7 23 ♖xe7!</b> và không gì ăn lại được: ô e7 do Hậu b4 canh nên Vua f8 không lên, Xe d8 và Hậu g6 đều không với tới — Trắng ăn không con Mã. <b>22…c5 23 ♕xc5+</b> và Đen vẫn phải chắn tiếp. Còn <b>22…♖d6</b> thì thua nhanh nhất: <b>23 ♕b8+ ♖d8 24 ♕xd8#</b>. Đen hơn hai tốt nhưng không có nước nào giữ được quân."}]},"30":{"tiv":"Một màn trình diễn đầy chất thơ","ctx":"Bled 1961, Gligorich cầm Trắng, Fischer cầm Đen trong <b>Phòng thủ Ấn Độ mới cánh Vua</b>. Trắng khoá trung tâm bằng d5, Đen trả lời bằng kế hoạch quen thuộc của hệ này: dồn quân về cánh Vua rồi phá bằng …f5. Ván cờ nổ ra ở nước 17 khi Đen đẩy …c5 để giữ Mã d4 giữa bàn, và từ đó là một chuỗi thí quân hai chiều — Đen thí tốt d3 rồi thí Mã ở g3, Trắng đáp lại bằng cách bỏ luôn Xe f1 để ăn Tượng c8. Kết cục Đen hơn hẳn một Xe (đổi lại Trắng có ba tốt) nhưng Vua hở, và Trắng cứu được ván bằng chiếu lặp. <b>Hoà</b>.","end":"Hai chi tiết đáng học. Thứ nhất là <b>ô tiền tiêu d4</b>: Mã Đen đứng đó từ nước 13 và cả ván cờ xoay quanh việc Trắng phải trả giá gì để đuổi nó — cuối cùng phải bỏ cặp Tượng. Thứ hai là cách <b>một nước thí mở đường cho nước sau</b>: tốt d3 không nhằm ăn gì, nó chỉ dọn ô d4 cho Tượng g7 vào có chiếu, và chính nước chiếu đó kéo Vua Trắng lên g2 để đòn ♘xg3 thành hiện thực. Ngược lại, phía Trắng cho thấy khi đã bị thủng thì <b>đừng ăn</b> — 23 ♘xc8 bỏ qua con Mã ở g3 mới là nước cứu ván.","notes":[{"at":14,"t":"<b>8 d5</b> — Trắng khoá trung tâm. Từ đây bàn cờ chia đôi: Trắng có chỗ để bung ra ở cánh Hậu, Đen chơi ở cánh Vua. Mã c6 phải lùi vì tốt d5 đuổi nó."},{"at":19,"t":"<b>10…f5</b> — Nước phá đặc trưng của hệ này. Đen mở cột f cho Xe và lấy chỗ cho quân, chấp nhận Vua mình hở dần."},{"at":21,"t":"<b>11…♘xf5</b> — Ăn lại bằng Mã e7 chứ không bằng tốt g6. Lý do rất thực dụng: cấu trúc tốt Đen không đổi, cột f mở ra ngay trước Xe f8, và con Mã đứng f5 nhìn thẳng vào ô d4 — ô mà hai nước nữa nó sẽ chiếm."},{"at":25,"t":"<b>13…♘d4</b> — Mã vào giữa bàn cờ. Đếm trên bàn: ô d4 lúc này <b>chỉ có Hậu d1</b> với tới, không một quân nào khác. Trắng cũng không còn tốt nào đuổi được (tốt c đã ở c4, tốt e đã đổi), nên muốn gỡ thì phải đổi bằng quân."},{"at":27,"t":"<b>14…♘h5</b> — Con Mã thứ hai đi ra rìa, nhưng có địa chỉ rõ ràng: từ h5 nó canh g3 và f4. Nó đứng an toàn vì tốt g6 giữ và không quân Trắng nào với tới h5. Nhớ ô g3 — tám nước nữa chính con Mã này rơi xuống đó."},{"at":33,"t":"<b>17…c5!</b> — Tốt c lên giữ Mã d4 bằng tốt. Trắng vừa đưa Tượng về e3 để đánh con Mã đó; bây giờ nếu đổi thì Đen ăn lại được và vẫn còn quân chắc ở d4."},{"at":34,"t":"<b>18 ♗xd4</b> — Trắng chịu trả giá để gỡ con Mã: đổi Tượng ô đen lấy Mã. Đây là câu trả lời cho câu hỏi đặt ra từ nước 13 — muốn đuổi Mã d4 thì phải mất một Tượng, vì không có tốt nào làm được việc đó."},{"at":35,"t":"<b>18…exd4</b> — Đen ăn lại bằng tốt e chứ không bằng tốt c. Kết quả: Trắng chỉ còn Tượng ô sáng, Đen giữ <b>cặp Tượng</b>, và có tốt d4 cắm sâu. Cái giá là tốt d4 chắn mất đường chéo của chính Tượng g7."},{"at":37,"t":"<b>19…a6</b> — Đuổi Mã b5, con Mã lúc này bị tốt a6 và Hậu d7 đánh mà chỉ có tốt c4 giữ. Trắng không lùi mà lao vào: hai Mã cùng đi ăn ở cánh Hậu."},{"at":38,"t":"<b>20 ♘bxd6</b> — Trắng ăn tốt d6. Nhìn thì đơn giản là hơn một tốt, nhưng hai Mã Trắng lúc này đều ở xa Vua mình."},{"at":39,"t":"<b>20…d3!</b> — Thí thêm tốt, và lý do rất cụ thể: nó <b>dọn ô d4</b> cho Tượng g7. Sau <b>21 ♕xd3 ♗d4+</b>, ô f2 trống nên đó là chiếu thật, và Vua Trắng phải rời g1."},{"at":42,"t":"<b>22 ♔g2</b> — Bắt buộc phải chọn đúng. <b>22 ♔h1?? ♘xg3+ 23 hxg3 ♕h3#</b> — chiếu hết, vì Tượng d4 canh ô g1 qua đường d4–e3–f2–g1. Còn <b>22 ♕xd4?? cxd4</b> mất Hậu lấy Tượng, <b>22 ♕e3?? ♗xe3</b> cũng thế. Chỉ có ♔g2, ♘f2 hoặc ♖f2 là đứng được."},{"at":43,"t":"<b>22…♘xg3!</b> — Mã rơi xuống g3, và hai cách ăn lại bằng Vua với tốt đều thua ngay: <b>23 hxg3 ♕h3#</b> và <b>23 ♔xg3 ♕h3#</b>, chiếu hết cả hai. Chỉ còn <b>23 ♘xg3</b>, nhưng khi ấy Mã e4 rời chỗ và <b>23…♕xd6</b> lấy lại quân. Cùng lúc con Mã ở g3 đang đánh Xe f1, Tượng e2 và Mã e4."},{"at":44,"t":"<b>23 ♘xc8!</b> — Trắng không đụng vào con Mã mà ăn Tượng c8 ở đầu kia bàn cờ. Xe f1 coi như bỏ, đổi lại Trắng lấy quân ở chỗ khác và giữ được thế cân bằng vật chất."},{"at":46,"t":"<b>24 ♘b6!</b> — Mã từ c8 nhảy ra đánh Xe a8. Xe đó có Xe f8 giữ, nên đây là đòi đổi Xe lấy Mã chứ chưa phải ăn không. Nhưng đúng lúc đó Mã Đen ở f1 đang bị <b>ba quân</b> đánh (Xe a1, Tượng e2, Vua g2) mà không ai giữ. Đen không cứu được cả hai."},{"at":47,"t":"<b>24…♕c7!</b> — Không đỡ mà đánh trả: Hậu nhắm thẳng Mã b6, con Mã cũng không ai giữ. Hai bên lần lượt thu quân — <b>25 ♖xf1 ♕xb6</b> — và tính lại thì Đen hơn chất nhưng kém một tốt (năm chọi sáu)."},{"at":50,"t":"<b>26 b4!</b> — Thí tốt để kéo Hậu Đen khỏi cột b. Tốt b4 không ai giữ và bị hai quân đánh, nhưng sau khi Hậu ăn, Xe Trắng vào b1 có nhịp và Đen phải lùi Hậu lần nữa."},{"at":51,"t":"<b>26…♕xb4</b> — Đen ăn, và đây là chỗ để thấy cái giá của việc ăn: Hậu Đen bây giờ ở b4, cách Vua nhà cả bàn cờ, trong khi Vua đó đã không còn tốt f và sắp mất luôn tốt g."},{"at":54,"t":"<b>28 ♘xc5</b> — Thí Mã lấy tốt. Đen đang hơn quân nên nếu để thế cờ yên thì Trắng thua dần; nước này kéo Hậu Đen ra tận c5, xa hẳn Vua nhà."},{"at":56,"t":"<b>29 ♕xg6+</b> — Bây giờ mới thấy giá của việc Tượng Đen bỏ g7 từ nước 21: tốt g6 không ai giữ. Đếm nước trả lời của Đen: đúng <b>hai</b> — ♔h8 hoặc ♗g7."},{"at":61,"t":"<b>31…♖f4</b> — Đen gom quân về giữa bàn. Đếm cho chính xác: Đen có hai Xe, Tượng, Hậu và hai tốt; Trắng có một Xe, Tượng, Hậu và năm tốt — tức là Đen hơn hẳn một Xe, đổi lại Trắng có thêm ba tốt. Nhưng Vua g8 đứng trơ với hàng tốt đã đi hết, còn Hậu và Xe Trắng thì đã áp sát."},{"at":64,"t":"<b>33 ♕g6</b> — Trắng dọa ♕h7 chiếu hết, và đó là lời doạ rất nặng: trong hơn ba mươi nước hợp lệ của Đen, chỉ chín nước ngăn được — chạy <b>♔g8</b>, chèn quân vào g4/e4/f5, hoặc chiếu ngược. Đen hơn một Xe mà vẫn phải cho Vua đi đi lại lại, Hậu Trắng lặp e6–g6, ván <b>hoà</b>."}]},"31":{"tiv":"Bắt chước là lời khen chân thành nhất","ctx":"Bled 1961, Fischer cầm Trắng gặp Petrosian trong <b>Phòng thủ Caro-Kann</b>, biến 4…♘d7 — hệ chắc chắn, ít điểm yếu, đúng gu Petrosian. Trắng nhập thành cánh Hậu và chơi nhanh ở giữa bàn, Đen đổi Tượng lấy Mã f3 rồi bung tốt ở cánh Hậu để lấy chỗ. Hai bên đổi Hậu ở nước 22 và ván cờ thành <b>tàn cuộc Xe và quân nhẹ</b> với Trắng hơn một tốt thông ở cột c. Trắng thắng bằng một đòn <b>đòn xiên</b> của Tượng trên đường chéo dài ở nước 27, rồi dồn Vua Đen vào lưới chiếu hết ở nước 36.","end":"Đòn quyết định là chuyện <b>hai quân đứng cùng một đường chéo</b>: Xe c6 và Xe a8 cùng nằm trên a8–h1, nên khi Tượng vào e4 thì con trước chạy là con sau chết. Che bằng Xe không đủ — <b>27…♖cc8 28 ♗xa8 ♖xa8</b> vẫn mất chất; cách giữ thăng bằng duy nhất là ăn ngay con Tượng bằng <b>27…♘xe4</b>, và Petrosian đã bỏ lỡ. Bài học thứ hai là cái lưới cuối ván. Đen ăn lại đủ tốt để điểm quân trở về cân bằng, nhưng Trắng không đua ăn tốt: Trắng dùng Xe đẩy Vua Đen tới đúng ô nằm trên đường chéo của Tượng, rồi đưa Vua nhà lên bịt hai ô chạy — sau đó <b>bất kỳ nước nào của Xe cũng là chiếu mở, và là chiếu hết</b>.","notes":[{"at":7,"t":"<b>4…♘d7</b> — Petrosian chọn Mã d7 thay vì 4…♘f6, và lý do rất thực dụng. Sau <b>4…♘f6 5 ♘xf6+</b> Đen chỉ còn ăn lại bằng tốt: <b>5…gxf6</b> làm nát cánh Vua, còn <b>5…exf6</b> thì tự bịt Tượng c8. Có Mã d7 đứng sẵn, Đen đưa Mã kia lên f6 và ăn lại bằng quân."},{"at":10,"t":"<b>6 ♘xf6+</b> — Trắng đổi Mã ngay để Đen mất một nhịp phát triển, nhưng Đen đã chuẩn bị: <b>6…♘xf6</b> ăn lại bằng quân, cấu trúc tốt vẫn sạch. Đây đúng là thế cờ Petrosian muốn."},{"at":17,"t":"<b>9…♗g4!</b> — Tượng quay lại g4 ghim Mã f3 vào Hậu e2. Mã đứng im: <b>10 ♘e5 ♗xe2</b> là mất Hậu ngay. Trắng phải quyết — chịu ghim, hoặc đuổi bằng h3 và cho Đen đổi Tượng lấy Mã."},{"at":20,"t":"<b>11 h3</b> — Trắng hỏi thẳng con Tượng. Giữ Tượng thì <b>11…♗h5 12 g4 ♗g6</b>: Trắng chiếm chỗ ở cánh Vua và Tượng Đen bị đẩy ra rìa. Petrosian không thích cảnh đó nên đổi luôn."},{"at":21,"t":"<b>11…♗xf3</b> — Đen tự bỏ <b>cặp Tượng</b>. Đổi lại, Trắng phải ăn bằng Hậu và Mã bảo vệ trung tâm biến mất; Petrosian chọn thế cờ ít quân, ít nguy hiểm hơn là giữ Tượng cho đẹp."},{"at":23,"t":"<b>12…♘d5!</b> — Mã vào giữa bàn, được hai tốt c6 và e6 cùng Hậu d8 đỡ, nên hai quân Trắng nhòm vào d5 cũng không lấy được: <b>13 ♗xd5 cxd5</b> chỉ là đổi đều. Nó cũng mời đổi bộ Tượng ở e7: Trắng ăn thì Hậu Đen ăn lại và cấu trúc tốt vẫn nguyên vẹn."},{"at":29,"t":"<b>15…b5!</b> — Tốt b đuổi Tượng c4 và lấy chỗ ở cánh Hậu. Ăn không được: <b>16 ♗xb5 cxb5</b>, tốt c6 giữ ô b5 nên Trắng mất quân nhẹ. Đen chưa nhập thành nên phải giành nhịp bằng những nước có đe doạ như thế này."},{"at":35,"t":"<b>18…b4!</b> — Tốt đâm vào tốt c3, ép Trắng quyết ngay. Ăn thì <b>19 cxb4 axb4</b> và cột a mở toang ngay trước mặt Vua b1 — đúng chỗ Trắng không muốn."},{"at":36,"t":"<b>19 c4</b> — Trắng không ăn ở b4 mà đẩy tốt qua, <b>khoá cánh Hậu</b> lại. Vua b1 an toàn, tốt b4 của Đen kẹt cứng, còn tốt c4 giữ ô d5."},{"at":38,"t":"<b>20 ♕e5</b> — Hậu ra giữa hàng 5, vừa nhắm tốt a5 đang không ai giữ, vừa mời đổi Hậu: <b>20…♕xe5 21 dxe5</b> và tốt e5 lại đuổi Mã f6. Đen phải tìm cách khác."},{"at":39,"t":"<b>20…c5</b> — Đen chặn <b>hàng 5</b> bằng chính tốt c, cắt đường Hậu Trắng tới a5 và chấp nhận để tốt c bị đánh. Đổi lại, tốt d4 của Trắng bị c5 và Hậu d6 đánh hai lần mà chỉ còn Hậu e5 giữ."},{"at":41,"t":"<b>21…h6!</b> — Tốt h đuổi Hậu Trắng, và ăn không được: <b>22 ♕xh6 ♖xh6</b> mất Hậu lấy Xe. Trắng phải ngã ngũ ngay ở giữa bàn thay vì cứ đứng gây sức ép."},{"at":42,"t":"<b>22 ♕xc5</b> — Trắng chọn ăn tốt và đổi Hậu. Sau 22…♕xc5 23 dxc5, Trắng hơn một tốt; hai tốt c chồng nhau nhưng con c5 là <b>tốt thông</b> — không tốt Đen nào chặn được nó."},{"at":46,"t":"<b>24 c6</b> — Tốt lao lên c6, cắm ngay trước mặt quân Đen. Nó sẽ mất, nhưng nó kéo được một Xe Đen ra ô c6 — đúng ô sẽ thành mục tiêu ba nước sau."},{"at":50,"t":"<b>26 ♖e5</b> — Xe lên hàng 5 đánh ngang vào tốt a5, mà a5 không có quân nào giữ. Đen phải cử một Xe về, và Xe đó đi tới a8."},{"at":52,"t":"<b>27 ♗e4</b> — Tượng vào đường chéo a8–h1. Xe c6 bị đánh và không ai giữ, còn Xe a8 đứng ngay sau lưng nó: <b>đòn xiên</b>. Đây chưa phải đòn thắng ép buộc — Đen còn <b>27…♘xe4 28 ♖xe4</b>, đổi phăng con Tượng gây chuyện và giữ cân bằng quân — nhưng nó đặt ra một câu hỏi mà chỉ có một câu trả lời đúng."},{"at":53,"t":"<b>27…♖d6?</b> — Câu trả lời sai. Xe rời đường chéo và bỏ mặc Xe a8. Che bằng Xe cũng không cứu được: <b>27…♖cc8 28 ♗xa8 ♖xa8</b> vẫn là Xe đổi Tượng, Đen thiệt chất. Cách duy nhất giữ thăng bằng là ăn ngay con Tượng: <b>27…♘xe4 28 ♖xe4</b>, quân hai bên bằng nhau."},{"at":54,"t":"<b>28 ♗xa8</b> — Trắng thắng <b>chất</b> (Xe đổi Tượng). Nhưng đừng nghĩ ván cờ xong ở đây: Đen phản công <b>28…♖xd1+ 29 ♔c2 ♖f1 30 ♖xa5 ♖xf2+</b>, ăn lại tốt f2 rồi tốt h3, và tới nước 31 thì <b>điểm quân hai bên đã cân bằng trở lại</b>. Cái thắng thật sự nằm ở chỗ khác: Tượng Đen thì không còn, còn Tượng Trắng vẫn nhắm vào đường chéo dài."},{"at":64,"t":"<b>33 ♖b5!</b> — Xe rời cột a để chuẩn bị chuỗi ♖b8+ và ♖b7+. Mục đích không phải ăn tốt mà là <b>đẩy Vua Đen về ô c6</b> — ô nằm trên đúng đường chéo của Tượng a8."},{"at":65,"t":"<b>33…♖xh3</b> — Đen ăn tốt, nhưng Xe càng lúc càng xa Vua nhà. Ngay sau đó <b>34 ♖b8+</b> và Vua Đen chỉ còn đúng ba ô: c7, d7, e7."},{"at":69,"t":"<b>35…♔c6</b> — Vua bước vào ô chết, ô duy nhất trên đường chéo của Tượng a8. Hai ô kia còn cầm cự được: <b>35…♔c8 36 ♖xf7</b> — Xe b7 có Tượng a8 đỡ nên Trắng chỉ ăn tốt, chưa có lưới chiếu hết. Sau ♔c6 thì lưới đã giăng xong."},{"at":70,"t":"<b>36 ♔c4!</b> và Đen xin thua. Vua Trắng lên bịt b5 và d5, tốt c5 bịt b6 và d6, còn Tượng a8 nhắm qua Xe b7 vào Vua c6. Bây giờ <b>Xe b7 đi đâu cũng là chiếu mở và là chiếu hết</b> (♖a7, ♖e7, ♖xf7); Đen chỉ hoãn được một nhịp bằng 36…♖h4+, nhưng <b>37 gxh4</b> ăn luôn Xe."}]},"32":{"tiv":"Người thắng về tinh thần","ctx":"Giải Bled 1961. Đen đi Phòng thủ Sicilian kiểu Paulsen: ra …e6 và …♕c7 sớm, để dành …a6 với …b5 làm phản công ở cánh Hậu. Cái giá của cách xếp này là ô d6 và c7 hở, và Trắng chỉ chờ đúng nhịp để nhảy Mã vào b5. Đen chậm một nước ở nước 6 và Fischer chộp ngay. Cả phần còn lại xoay quanh một con tốt: tốt e của Trắng đi e5, ăn f6, ăn g7 rồi nằm lì ở g7, khoá chặt Xe g8 và Vua Đen. Đen đổi được Xe lấy Hậu để gỡ, nhưng hai tốt f6–g7 cùng hai Xe của Trắng là quá nhiều; Đen xin thua ở nước 47.","end":"Bài học thứ nhất là giá của <b>một nhịp</b> trong Sicilian: 6…♘f6 chỉ chậm hơn …a6 đúng một nước, mà Đen phải trả bằng cả chuỗi nước đi lùi ngay sau đó. Thứ hai là cách dùng một con tốt như một quân cờ — tốt e đi e5, ăn f6, ăn g7 rồi ngồi ở đó hơn mười nước; trong suốt thời gian ấy Đen thực chất chơi thiếu Xe g8 và không có Vua an toàn. Thứ ba, nước 19 0-0-0 cho thấy khi đang giữ thế chủ động thì một con tốt biên không đáng để giữ: đưa Vua vào chỗ kín và cho cả hai Xe vào việc đáng giá hơn nhiều.","notes":[{"at":10,"t":"<b>6 g3</b> — Trắng định đưa Tượng ra g2, nhìn dọc đường chéo dài. Nhưng kế hoạch chỉ là kế hoạch: ngay sau nước sai của Đen, Fischer bỏ luôn ý định fianchetto và đặt Tượng ở e2."},{"at":11,"t":"<b>6…♘f6?</b> — Mã ra f6 là nước tự nhiên nhưng ở đây nó vội. Đen chưa chơi …a6, nên ô b5 vẫn để trống cho Mã Trắng. Trong hệ này thứ tự thường là …a6 trước, phát triển sau."},{"at":12,"t":"<b>7 ♘db5!</b> — Mã từ d4 sang b5, đánh thẳng Hậu c7. Hậu phải chạy và không ô nào tử tế: <b>7…♕d6</b> thì <b>8 ♘xd6+</b> mất Hậu ngay (Mã b5 cũng phủ luôn ô d6), còn <b>7…♕e5 8 f4</b> lại đuổi tiếp."},{"at":13,"t":"<b>7…♕b8</b> — Hậu lùi về đúng ô xuất phát của Xe, chỗ duy nhất không bị đuổi thêm. Đen mất trắng ba nhịp cho một con Hậu chưa làm được gì, và Xe a8 vẫn chưa ra được."},{"at":14,"t":"<b>8 ♗f4</b> — Tượng ra f4 nằm trên đường chéo b8–h2, tức là lại đuổi đúng con Hậu vừa lùi về b8. Trắng phát triển quân mà nước nào cũng kèm một lời doạ, còn Đen thì chỉ đi lùi."},{"at":15,"t":"<b>8…♘e5</b> — Đen bịt đường chéo bằng Mã, và Mã này được chính Hậu b8 đỡ. Nhưng nó đứng trên ô mà Trắng muốn đổi: cả chuỗi <b>9 ♗e2 ♗c5 10 ♗xe5 ♕xe5 11 f4</b> là để kéo Hậu Đen ra e5 rồi đuổi tiếp."},{"at":16,"t":"<b>9 ♗e2!</b> — Tượng đứng khiêm tốn ở e2 chứ không ra g2. Từ e2 nó phủ hai ô g4 và h5 — đúng hai ô mà Mã f6 muốn nhảy tới — và dọn chỗ cho nước f2–f4 sắp tới."},{"at":18,"t":"<b>10 ♗xe5!</b> — Trắng bỏ cặp Tượng để kéo Hậu Đen ra đứng ở e5. Lý do rất cụ thể: từ e5, Hậu nằm ngay trước mũi tốt f2."},{"at":20,"t":"<b>11 f4</b> — Tốt lên f4 đuổi Hậu và cùng lúc dựng khối tốt e4–f4. Hậu Đen lại về b8, còn Trắng thì đã sẵn sàng đẩy e4–e5."},{"at":23,"t":"<b>12…a6</b> — Đen đuổi Mã b5. Nhưng ngay lúc này Mã f6 của Đen cũng đang bị tốt e5 đánh. Hai bên cùng có một quân bị treo, và bên nào ăn trước thì bên đó thắng nhịp."},{"at":24,"t":"<b>13 exf6!</b> — Trắng không cứu Mã mà ăn trước. Cả chuỗi đi hết một mạch: <b>13…axb5 14 fxg7 ♖g8</b> — Đen lấy lại Mã, còn con tốt f của Trắng thì đã đi tới g7 và không chịu dừng."},{"at":26,"t":"<b>14 fxg7</b> — Tốt tới g7. Xe h8 phải ra g8 chặn nó, Vua Đen mất hẳn quyền nhập thành, và con tốt này ngồi ở g7 tới tận nước 27 của Đen."},{"at":31,"t":"<b>16…♖a4</b> — Xe chạy ngang từ a8 sang a4 đánh Hậu d4. Đen cần làm gì đó gấp, nhưng nước này cho Trắng chọn được cách rút Hậu kèm chiếu."},{"at":34,"t":"<b>18 ♕xf6</b> — Chuỗi 17 ♘f6+ ♗xf6 18 ♕xf6 giải quyết gọn: Hậu vừa thoát khỏi Xe a4, vừa đứng ngay cạnh con tốt g7. Vua Đen kẹt ở e8 và Xe g8 vẫn không nhúc nhích được."},{"at":36,"t":"<b>19 0-0-0!</b> — Nhập thành dài, biết trước là mất tốt a2: Xe a1 vừa rời sang d1 thì a2 không còn ai giữ, và <b>19…♖xa2</b> đến ngay. Fischer đổi một tốt biên lấy hai thứ: Vua vào chỗ kín và cả hai Xe vào việc ngay."},{"at":43,"t":"<b>22…e5!</b> — Nước hay nhất của Đen trong ván. Tốt rời e6 và hàng 6 mở ra: Xe b6 nhìn thẳng sang Hậu f6, mà Hậu Trắng lúc này <b>không có một quân nào đỡ</b>. Ăn Xe không cứu được: <b>23 ♕xb6 ♕xb6</b>, Trắng mất Hậu."},{"at":44,"t":"<b>23 fxe5!</b> — Tốt f4 ăn e5, làm cùng lúc hai việc: đỡ cho Hậu f6 và dựng thêm một tốt thông. Sau <b>23…♖xf6 24 exf6</b>, về điểm quân Đen còn nhỉnh hơn một chút, nhưng Trắng có hai tốt liền nhau ở f6 và g7 và Đen thì không tài nào cựa được."},{"at":48,"t":"<b>25 ♗xh7</b> — Tượng ăn tốt h7 và đánh Xe g8, mà Xe g8 thì không được phép đi: <b>25…♖f8 26 g8=♕</b> phong Hậu ngay. Còn <b>25…♖xg7 26 fxg7</b> thì lại có một con tốt khác đứng ở g7 chờ phong."},{"at":55,"t":"<b>28 ♗xf7+ ♔d8</b> — Tượng chiếu để chiếm ô f7 rồi lùi về e6, chĩa vào tốt d7. Ăn Tượng không được: <b>28…♕xf7 29 ♖xf7 ♔xf7</b>, Đen mất Hậu chỉ lấy về Xe và Tượng."},{"at":60,"t":"<b>31 ♖f7</b> — Sau khi đổi hết ở d7, Xe sang f7 đánh Tượng d7 lần thứ hai (Xe d1 đã nhìn vào đó từ trước), mà Tượng chỉ có Vua d8 giữ. Đen đành lấy tốt: <b>31…♕xh2 32 ♖dxd7+</b> — ăn Tượng kèm chiếu."},{"at":88,"t":"<b>45 ♖dd6</b> — Hai Xe chồng lên hàng 6, che nhau và cắt ngang bàn cờ. Đây là cách đứng đúng khi chọi Hậu: hai Xe rời nhau thì bị Hậu bắt lẻ, hai Xe đỡ nhau thì Hậu không đụng được con nào."},{"at":92,"t":"<b>47 ♖a6</b> và Đen xin thua. Hai Xe a6 và d6 đỡ lẫn nhau nên Hậu không ăn được con nào: <b>47…♕xa6 48 ♖xa6</b> mất Hậu. Chiếu cũng chỉ có một nước duy nhất và nó tự sát: <b>47…♕xc2+ 48 ♔xc2</b>. Đen không còn tốt nào, Trắng còn ba, và con g5 cứ thế đi lên."}]},"33":{"tiv":"Bậc thầy cầm hòa","ctx":"Giải Bled 1961, Trắng đi Ruy Lopez và Đen chọn biến Mở với 5…♘xe4. Trong biến này Đen ăn tốt e4 rồi phải nuôi con Mã đó bằng tốt d5 — cả hệ thống đứng hay sập là ở chỗ ấy. Đen đi lệch ngay nước 7 (…exd4 thay vì …d5): cột e mở toang và Mã e4 bị ghim vào Vua e8. Fischer đổi hết vào một thế cờ mà Đen có bốn cụm tốt rời rạc, ăn được tốt e6, rồi phải chơi thêm hơn bốn mươi nước tàn cuộc Xe mới chuyển hoá xong. Đen xin thua ở nước 73.","end":"Hai bài học. Một: trong khai cuộc, ăn tốt trung tâm để mở cột cho đối phương (7…exd4) thường mất nhiều hơn được — cột e mở ra là Mã e4 bị ghim ngay và Đen không còn nước tự do nào. Hai: cấu trúc tốt quyết định kế hoạch. Sau 12…fxe6 Đen có bốn cụm tốt rời, Trắng có hai; mọi việc còn lại của Trắng chỉ là ăn cho được tốt e6 rồi đổi vào tàn cuộc Xe. Và tàn cuộc Xe hơn tốt không tự thắng: ở đây nó tốn thêm hơn ba mươi nước, một nước lỡ ở 41 ♖f2, và phải đi đường vòng qua cánh Vua mới xong.","notes":[{"at":13,"t":"<b>7…exd4?</b> — Đen ăn tốt d4 và trả trung tâm lại cho Trắng. Nước đúng của biến này là …d5, giữ chỗ đứng cho Mã e4. Cột e vừa sạch quân là Xe f1 của Trắng có việc ngay."},{"at":14,"t":"<b>8 ♖e1</b> — Xe vào cột e, và cột đó chạy thẳng tới Vua e8. Mã e4 lập tức bị ghim: nó chỉ sống được khi có quân che phía sau."},{"at":16,"t":"<b>9 ♘c3!</b> — Mã ra c3 đánh cả Mã e4 lẫn tốt d5. Vì bị ghim, Mã e4 <b>không có một nước đi hợp lệ nào</b> — chạy đâu cũng để lộ Vua e8 cho Xe e1. Đen phải chống bằng cách khác."},{"at":17,"t":"<b>9…♗e6</b> — Đen không cứu được Mã nên đi tiếp: Tượng ra e6 giữ tốt d5, chấp nhận cho Trắng dọn sạch. Trắng lấy lại quân đúng như tính: <b>10 ♘xe4 dxe4 11 ♖xe4</b>, và Xe đứng ngay giữa bàn."},{"at":23,"t":"<b>12…fxe6</b> — Sau loạt đổi quân, hãy nhìn cấu trúc tốt. Trắng có hai cụm liền mạch; Đen sau khi mất nốt tốt d4 sẽ có bốn cụm rời: a6–b5, c7, e6, g7–h7. Tốt e6 đứng trơ trên cột nửa mở, đúng chỗ Xe Trắng đang nhìn. Cả ván còn lại là chuyện con tốt đó."},{"at":24,"t":"<b>13 ♘xd4!</b> — Trắng lấy lại tốt, vật chất về ngang. Nhưng cấu trúc thì không ngang, và Vua Đen vẫn chưa nhập thành: <b>13…0-0 14 ♕g4</b> đến ngay lập tức."},{"at":26,"t":"<b>14 ♕g4</b> — Hậu ra g4 đánh một lúc hai điểm: tốt g7, và tốt e6 thì đã bị ba quân Trắng nhòm (♘d4, ♖e4, ♕g4). Đen không giữ nổi cả hai bằng quân nên phải đổi ở d4 rồi kéo Hậu về c8 chỉ để đỡ e6."},{"at":42,"t":"<b>22 ♖e1!</b> — Xe quay lại cột e. Chỗ yếu của Đen là e6 chứ không phải cột d, nên Xe phải đứng đúng cột đó. Đây là nước chuẩn bị cho toàn bộ đòn đổi quân sắp tới."},{"at":43,"t":"<b>22…c5</b> — Đen đuổi Tượng d4 để giành lấy chút chỗ thở, và Trắng lùi <b>23 ♗c3</b>. Đáng chú ý: chính con tốt c này về sau chạy xuống c4, c3 rồi c2, và nó là thứ duy nhất giữ Đen sống trong tàn cuộc."},{"at":48,"t":"<b>25 ♗f4!</b> — Tượng sang f4 lấy mất ba ô b8, c7, d6 của Xe Đen. Xe không quay về d6 đỡ tốt e6 được nữa, và đòn đến ngay: <b>25…c4 26 ♖xe6 ♖xe6 27 ♕xe6+ ♕xe6 28 ♖xe6</b>."},{"at":50,"t":"<b>26 ♖xe6!</b> — Xe ăn tốt e6 dù ô đó có hai quân giữ (Hậu d5 và Xe g6). Đây là phép đổi đã tính hết: quân đổi đi hai bên bằng nhau, chỉ có con tốt e6 là mất — và Xe Trắng đứng luôn ở hàng 6, sát tốt a6."},{"at":56,"t":"<b>29 ♖xa6</b> — Xe ăn nốt tốt a6, Trắng hơn hai tốt. Đen phản công ngay và gỡ lại một: <b>29…♖d1+ 30 ♔g2 ♗xb2 31 ♖b6 ♖a1 32 ♖xb5 ♖xa2</b> — sau chuỗi này Trắng chỉ còn hơn đúng một tốt."},{"at":65,"t":"<b>33…♖a4</b> — Xe sang a4 giữ tốt c4 theo hàng ngang, nhưng Tượng b2 thì hết chỗ dựa: <b>34 ♗e5!</b> đánh vào nó mà không ai đỡ, nên <b>34…♗xe5 35 ♖xe5</b> — đổi hết quân nhẹ, vào đúng tàn cuộc Xe mà Trắng muốn."},{"at":79,"t":"<b>40…c3!</b> — Tốt c chạy sâu xuống c3. Nó không tự phong được, nhưng nó buộc Trắng phải để mắt tới suốt phần còn lại, và Xe Đen sẽ đứng sau nó ở a3 để giữ: <b>41 ♖f2? ♖a3</b>."},{"at":80,"t":"<b>41 ♖f2?</b> — Nước lỡ. Ngay lúc đó tốt c3 <b>không có quân nào giữ</b> mà Vua Trắng thì đứng sát ở d4: <b>41 ♔xc3</b> ăn tốt luôn, và <b>41…♖xc2+ 42 ♔xc2</b> chỉ là cho không con Xe. Sau ♖f2 thì Đen kịp đưa Xe về a3 che tốt, và con tốt ấy sống tới cuối ván — cuối cùng còn xuống được tận c2."},{"at":87,"t":"<b>44…♔e4!</b> — Đen không lùi về giữ mà đi ngược lên. Vua e4 đánh tốt f4 (tốt g3 đang đỡ nên chưa ăn được ngay) và nhắm tiếp xuống e3 — ô đánh thẳng vào Xe f2: <b>45 fxg5 ♔e3 46 ♖g2</b>. Đây là cách chơi đúng của bên yếu hơn trong tàn cuộc Xe: lấy hoạt động bù cho vật chất."},{"at":90,"t":"<b>46 ♖g2</b> — Xe bị Vua e3 đuổi khỏi f2, lùi sang g2 và vẫn ở hàng 2 cạnh hai tốt. Từ đây bắt đầu một đoạn dài Trắng đi vòng: Vua phải bò về phía tốt c3 mà không bỏ rơi cánh Vua."},{"at":108,"t":"<b>55 ♔b3</b> — Đúng mười bốn nước sau cái nước lỡ 41 ♖f2, Vua Trắng mới đứng được cạnh tốt c3. Đen trả giá ở cánh kia: 55…♖xg3 rồi Trắng ăn tốt h5."},{"at":114,"t":"<b>58 ♖xh5</b> — Bây giờ mới rõ cán cân: Trắng ba tốt (c2 cùng cặp liền g5–h4), Đen đúng một tốt c3. Chênh lệch đó là thứ quyết định ván cờ."},{"at":119,"t":"<b>60…♖a1+</b> — Đen không còn gì ngoài chiếu đuổi. Nhưng Vua Trắng có cả bàn cờ để đi lên: 61 ♔b5 ♖b1+ 62 ♔c6, mỗi nước chiếu lại đẩy Vua Trắng tới gần chỗ nó muốn tới hơn."},{"at":136,"t":"<b>69 h5</b> — Trắng bỏ mặc tốt c2 và chạy đua, vì đã đếm xong: <b>69…♖xc2 70 h6 ♖h2 71 h7 c2 72 ♖c8</b> — Xe kịp về chặn cột c đúng một nhịp trước, còn tốt h7 thì không ai chặn."},{"at":144,"t":"<b>73 ♔g7</b> và Đen xin thua. Xe c8 chặn thẳng tốt c2, Vua g7 canh ô phong h8, nên tốt h7 lên Hậu là chuyện của nước sau. Đổi Xe cũng vô ích: <b>73…♖xh7+ 74 ♔xh7 c1=♕ 75 ♖xc1</b>."}]},"34":{"tiv":"Cặp tốt treo hết treo","ctx":"Giải liên khu vực Stockholm 1962. Trắng đi Gambit Hậu, Đen từ chối và chọn cách chơi …h6 rồi …b6. Sau loạt đổi ở d5, Đen bắt lại bằng tốt e và dồn hết vào một ý duy nhất: đẩy …c5 đánh vào tốt d4. Trắng đổi ở c5 tại nước 13, và Đen nhận đúng cặp tốt treo c5–d5 — kiểu cấu trúc mà sách vở vẫn xếp vào loại mục tiêu tấn công. Đen không để chúng thành mục tiêu: đẩy …c4 khoá lại, chơi cả hai cánh, rồi kết thúc bằng một đòn bắt đôi bằng Mã ở nước 24. Trắng xin thua sau nước 31 của Đen.","end":"Cặp tốt treo không phải là điểm yếu cố định — nó chỉ yếu khi nó phải đứng yên chịu đòn. Fischer đẩy 17…c4 để hai con tốt tựa vào nhau, đồng thời lấy mất hai ô b3 và d3 của quân Trắng; từ đó Đen chơi được ở cả hai cánh trong khi Trắng loay hoay với 19 ♖ab1. Mẫu đòn đáng nhớ là 24…♘xe3: con Mã đang bị hai quân Trắng nhắm vào lại chính là con ra đòn trước — ăn tốt rồi bắt đôi Tượng c4 với Xe d1. Khi hai quân đối phương cùng dồn vào một ô, hãy tìm xem quân bị nhắm có nước ăn nào ở giữa không.","notes":[{"at":11,"t":"<b>6…h6</b> — Tốt h đẩy lên hỏi Tượng g5. Trắng giữ Tượng bằng ♗h4, nhưng con tốt h6 này về sau chính là chỗ dựa cho nước …g5 đuổi Mã."},{"at":14,"t":"<b>8 cxd5</b> — Trắng đổi ở d5, mở ra một chuỗi đổi nữa: Tượng ăn e7, Mã ăn d5. Đen bắt lại bằng <b>tốt e</b>, nên sau đó Đen không còn tốt e — cột e nửa mở là của Đen, và tốt d5 thành chỗ tựa cho nước …c5."},{"at":21,"t":"<b>11…♗e6!</b> — Tượng ra e6 chứ không ra b7. Từ e6 nó đỡ tốt d5, nghĩa là Đen sắp đẩy được …c5 mà không sợ trung tâm sập."},{"at":23,"t":"<b>12…c5</b> — Nước phá then chốt, đánh vào tốt d4. Trắng có ba hướng: giữ căng, đẩy d5, hoặc đổi. Trắng chọn đổi, và đó là chỗ ván cờ đổi chiều."},{"at":24,"t":"<b>13 dxc5?</b> — Đổi ở c5 là nhả hết sức căng. Sau 13…bxc5, Đen có cặp tốt treo c5–d5 ở giữa và cột b mở cho Xe. Cặp tốt treo là con dao hai lưỡi, nhưng ở đây Đen có sẵn cột b để làm việc nên lưỡi sắc quay về phía Trắng."},{"at":27,"t":"<b>14…♕b7!</b> — Hậu làm hai việc trong một nước: đứng vào cột b vừa mở, và đỡ tốt d5 qua đường chéo b7–c6–d5. Đoạn này Đen không có nước nào thừa."},{"at":31,"t":"<b>16…a5</b> — Tốt a lên chặn b2–b4. Nếu Trắng đẩy được b4 thì cặp tốt treo bị đánh ngang sườn, nên Đen bịt trước."},{"at":33,"t":"<b>17…c4!</b> — Ý chính của cả ván. Tốt lên c4 thì cặp tốt <b>hết còn treo</b>: c4 có d5 đỡ, và nó lấy mất hai ô b3 và d3 của quân Trắng. Đổi lại Đen nhường ô d4, nhưng Trắng không có quân nào dùng được ô đó ngay."},{"at":36,"t":"<b>19 ♖ab1?</b> — Xe đi vào cột b. Nhưng cột b là của Đen: Xe b8 và Hậu b7 đã ngồi sẵn ở đó. Nước này không doạ được gì mà lại tự đứng vào chỗ bị đánh."},{"at":37,"t":"<b>19…♗f5!</b> — Tượng ra f5 nhìn suốt đường chéo xuống b1 và đuổi Xe về. Trắng phải chơi 20 ♖bd1, tức là Xe đi a1–b1–d1 và mất trắng hai nhịp."},{"at":41,"t":"<b>21…g5!</b> — Tốt g đẩy lên đuổi Mã f4, có tốt h6 đỡ lưng. Mã vẫn còn ô để lùi, nhưng ô nào cũng tệ, nên Trắng chọn cách ăn liều ở d5."},{"at":42,"t":"<b>22 ♘xd5</b> — Mã ăn tốt d5; sau 22…♘xd5 23 ♗xc4 Trắng đổi một Mã lấy hai tốt. Trên giấy tờ là thiếu một điểm, trên bàn cờ còn tệ hơn vì quân Trắng vẫn chưa phối hợp được với nhau."},{"at":45,"t":"<b>23…♗e6</b> — Tượng về e6 đỡ Mã d5 đang bị Tượng c4 đánh. Bây giờ hai quân Trắng — Tượng c4 và Xe d2 — cùng dồn vào một ô, và đó chính là chỗ Đen sắp lật bàn."},{"at":47,"t":"<b>24…♘xe3!</b> — Mã ăn tốt e3 rồi từ đó đánh <b>cùng lúc</b> Tượng c4 và Xe d1. Trắng phải xử con Mã trước, mà sau 25 ♕xe3 ♗xc4 thì Tượng c4 không ai đỡ."},{"at":49,"t":"<b>25…♗xc4</b> — Đen hơn hẳn một quân nhẹ, chỉ kém một tốt. Từ đây không còn vấn đề về ý tưởng nữa, chỉ còn việc đổi cho gọn."},{"at":61,"t":"<b>31…♗f5</b> và Trắng xin thua. Lý do đọc được ngay trên bàn: Đen hơn một quân nhẹ, Hậu c5 đang <b>ghim</b> Xe f2 vào Vua g1, tốt g4 vừa được Tượng f5 giữ, còn Vua Trắng thì chỉ đứng sau đúng một con tốt g2."}]},"35":{"tiv":"Đoạn ứng tấu rực rỡ","ctx":"Giải liên khu vực Stockholm 1962, Fischer cầm Trắng trước Julio Bolbochan. Đây là <b>Sicilian</b>, nhưng thay vì triển khai quân bình thường Fischer đẩy tốt cánh Vua ngay từ khai cuộc: h3 rồi g4. Ván này là một bài học về <b>ô yếu</b>: sau 8…e5 ô d5 của Đen trống vĩnh viễn, và Fischer lần lượt đổi bỏ từng quân còn canh ô đó trước khi đặt Mã vào. Phần kết là một đòn chiếu mở gọn gàng, dựng lên từ chính những nước đẩy tốt h4–h5 chậm rãi trước đó.","end":"Bài học chính là <b>cách khai thác một ô yếu</b>. Đặt quân vào ô trống chỉ là bước cuối; việc thật sự là dọn sạch những quân đối phương còn với tới ô đó — ở đây là Mã f6 (bị g5 đuổi), Tượng e6 (bị ♗h3 đổi) và Mã b6 (bị ♗xb6 đổi). Bài học thứ hai là <b>đòn chiếu mở cần được chuẩn bị từ xa</b>: nước hxg6 mở đường chéo a2–g8, ♕b3 chiếm đường chéo đó, và con Xe vốn đang đứng chắn ở d5 bỗng thành quân đi chiếu mở.","notes":[{"at":10,"t":"<b>6 h3</b> — nước tốt khiêm tốn này chuẩn bị g4. Nó lấy mất ô g4 của Tượng và Mã Đen, và báo trước rằng Trắng sẽ đẩy tốt ở cánh Vua chứ không triển khai quân theo lối thường."},{"at":15,"t":"<b>8…e5</b> — tốt tiến lên đuổi Hậu Trắng, được một nhịp. Cái giá thì lâu dài: tốt c của Đen đã bị đổi từ nước 3, nên <b>không còn tốt nào có thể canh ô d5 nữa</b>. Cùng lúc tốt d6 thành tốt lùi trên cột d đang mở."},{"at":18,"t":"<b>10 g5!</b> — đuổi Mã f6, quân đang canh cả d5 lẫn e4. Mã lùi về d7 thì ô d5 chỉ còn được quân canh, không còn được tốt canh — đúng thứ Trắng cần."},{"at":21,"t":"<b>11…♘c5?</b> — Mã nhảy ra đánh Hậu d3, được một nhịp nhưng đứng không bền. Hậu chỉ cần lùi về d2 là xong, còn con Mã này rồi sẽ đi tiếp d7 rồi b6 và bị đổi lấy một Tượng: ba nước đi để rồi biến mất."},{"at":24,"t":"<b>13 0-0-0</b> — Trắng nhập thành cánh Hậu, Đen nhập thành cánh Vua. <b>Nhập thành ngược cánh</b> nghĩa là mỗi bên có thể đẩy tốt vào Vua đối phương mà không làm hở Vua mình. Từ đây nhịp độ là ai nhanh hơn."},{"at":32,"t":"<b>17 ♗h3</b> — Tượng đi ra rìa để mời đổi quân với Tượng e6. Lý do rất hẹp: Tượng e6 là quân duy nhất của Đen còn canh d5. Đổi xong thì hàng phòng ngự ô d5 mất thêm một lớp."},{"at":36,"t":"<b>19 ♗xb6</b> — Đen vừa đưa Mã tới b6 (một ô nữa canh d5), Trắng đổi ngay. Đây là nước thứ ba trong cùng một kế hoạch: dọn hết quân canh d5 rồi mới vào."},{"at":38,"t":"<b>20 ♘d5</b> — Mã vào ô trống, lại kèm theo đánh Hậu b6 và Tượng e7 cùng lúc nên Đen không kịp làm gì khác. Từ đây tới hết ván, con Mã này không bao giờ bị đuổi đi."},{"at":40,"t":"<b>21 f4</b> — đánh vào tốt e5 để mở đường. Đen ăn thì Hậu Trắng lên f4, vừa nhìn xuống tốt lùi d6 vừa nhìn sang f7. Trắng đổi một tốt lấy các đường mở."},{"at":46,"t":"<b>24 ♖a3!</b> — Xe đi ngang. Trước hết nó đánh tốt a6 đang không ai giữ, buộc Hậu Đen phải về a7 ngồi im. Sau đó Xe sẽ sang c3 chiếm cột c mà Đen vừa bỏ trống."},{"at":49,"t":"<b>25…g6</b> — Đen phải đuổi Hậu f5 vì nó đang nhìn h7 (chỉ có Vua giữ) và f7. Nhưng đẩy tốt g6 thì các ô đen quanh Vua yếu hẳn, và nó cho tốt h của Trắng một mục tiêu để húc vào."},{"at":58,"t":"<b>30 ♖d5</b> — Xe đứng ngay trước mũi Hậu Đen. Ăn thì mất Hậu, vì d5 được cả Mã f4 lẫn Xe d1 giữ. Hậu Đen phải bỏ chạy, còn Xe Trắng thì chiếm luôn hàng 5."},{"at":66,"t":"<b>34 hxg6!</b> — mục đích không phải ăn tốt. Sau khi Đen bắt lại bằng f7, ô f7 trống ra và <b>đường chéo a2–g8 mở thẳng tới Vua Đen</b> — chỉ còn chính con Xe d5 của Trắng đứng chắn trên đó."},{"at":68,"t":"<b>35 ♕b3!</b> — Hậu vào đầu đường chéo vừa mở. Trắng cố ý bỏ Mã f4 không giữ; đổi lại, mọi nước đi của Xe d5 từ giờ đều là <b>chiếu mở</b>. Bolbochan ăn Mã."},{"at":70,"t":"<b>36 ♖e5+</b> — Xe rời d5, Hậu b3 chiếu. Và Xe không đi đâu tuỳ tiện: nó dừng ở e5 để cùng lúc <b>đánh vào Xe e8</b> của Đen. Chiếu mở nào ăn thêm quân thì mới là chiếu mở đáng tiền."},{"at":72,"t":"<b>37 ♖xe8+</b> và Đen xin thua. Vua buộc phải ăn lại (nước hợp lệ duy nhất), rồi ♕xb5+ vừa chiếu vừa lấy tốt, trong khi Xe c7 vẫn đứng nguyên hàng 7 và Vua Đen thì trần trụi giữa bàn cờ."}]},"36":{"tiv":"Gaston và Alphonse","ctx":"Vẫn ở giải liên khu vực Stockholm 1962, lần này Fischer cầm Trắng trước Korchnoi trong một ván <b>Ruy Lopez</b>. Điểm lạ của ván này là đoạn trung cuộc: hai bên thay nhau lùi quân một cách rất lễ phép — Tượng Trắng đi b5–a4–b3–c2–c1 rồi lại d3–f1, Mã Đen đi c6–a5–c4–a5–d7–b7. Không bên nào chịu đi trước, và mỗi lần lùi đều có lý do cụ thể. Fischer khoá trung tâm bằng 15 d5, biến tốt d6 của Đen thành một điểm yếu cố định, rồi bòn dần từng tốt cho tới khi con tốt d thông chạy được.","end":"Hai điều đáng nhớ. Thứ nhất: <b>lùi quân không phải là mất nhịp nếu nước lùi làm được một việc</b> — ♗c1 giữ tốt b2, ♗f1 vẫn nhìn tốt a6, ♘g4 vừa né vừa mời đổi. Thứ hai: <b>một điểm yếu cố định đáng giá hơn một đòn nhanh</b>. Nước 15 d5 khoá tốt d6 lại — nó không đi đâu được nữa — và đúng hai mươi bốn nước sau, Xe Trắng ăn chính con tốt đó rồi mở đường cho tốt d thông.","notes":[{"at":16,"t":"<b>9 d4</b> — nước phá trung tâm quen thuộc của Ruy Lopez. Trắng dựng xong c3 + d4, dồn sức ép lên tốt e5 của Đen và mở đường cho các quân hàng cuối."},{"at":21,"t":"<b>11…♘a5</b> — kế hoạch Chigorin: Mã ra rìa để đánh vào Tượng b3, quân nguy hiểm nhất của Trắng vì nó nhìn thẳng vào f7. Mã đứng a5 thì xấu, nhưng đổi lại Đen buộc Tượng phải dời chỗ."},{"at":24,"t":"<b>13 ♗c1</b> — Tượng lùi hẳn về ô xuất phát. Lý do rất cụ thể: Mã c4 vừa đánh tốt b2 đang không ai giữ và cả Tượng e3. Về c1 là giữ được b2 và thoát khỏi tầm Mã bằng một nước."},{"at":27,"t":"<b>14…♘a5</b> — tới lượt Đen lùi. Tốt b3 đuổi Mã, và Mã lại về đúng ô cũ. Hai bên đã đi bốn nước để trở về gần chỗ ban đầu — nhưng Trắng có thêm tốt b3, Đen có thêm tốt c5."},{"at":28,"t":"<b>15 d5!</b> — khoá trung tâm. Được ba thứ cùng lúc: chiếm không gian, cắt Mã a5 khỏi phần bàn cờ có việc làm, và quan trọng nhất là <b>đóng đinh tốt d6</b> — nó không tiến được nữa và nằm trên cột nửa mở của Trắng."},{"at":35,"t":"<b>18…♗xf3</b> — Đen chịu bỏ <b>cặp Tượng</b> để đổi lấy Mã f3. Sau khi Trắng ăn lại, Trắng còn hai Tượng trên một bàn cờ mà trung tâm đã đóng — chưa lợi ngay, nhưng khi các cột mở ra thì hai Tượng đó sẽ nói chuyện."},{"at":41,"t":"<b>21…♗c3!</b> — Tượng cắm sâu vào trại Trắng, đánh Xe e1 và chặn cột c. Mặt trái: nó đứng một mình trong đất địch và về sau chính chỗ đứng đó thành mục tiêu cho Xe và Tượng Trắng."},{"at":46,"t":"<b>24 ♘f5</b> — Mã tới ô tiền tiêu, đánh cùng lúc tốt d6 và tốt g7. Đen không có tốt nào đuổi được nó đi ngay."},{"at":50,"t":"<b>26 ♘h6+</b> — chiếu, và Đen chỉ có <b>đúng một nước hợp lệ</b>: ♔f8. Vua bước sang f8 thì mất quyền nhập thành lại và Xe a8 vẫn chưa ra được, còn con Mã thì ngồi lì trên h6."},{"at":52,"t":"<b>27 ♖c1!</b> — Xe xuống c1, xếp sau chính Tượng c2 của mình. Chưa đánh được gì ngay, nhưng khi Tượng dời đi thì cột c mở thẳng vào Tượng c3 của Đen. Nước sau Trắng chơi ♗d3: vừa nhắm tốt a6, vừa mở cột."},{"at":58,"t":"<b>30 ♗f1</b> — lại một nước lùi. Mã Đen vừa lên e5 đánh Tượng d3; Tượng về f1 thì <b>vẫn nhìn tốt a6</b> trên cùng đường chéo, tức là né mà không mất việc."},{"at":62,"t":"<b>32 ♖xc3</b> — kết thúc chuỗi đổi quân quanh ô c3. Trắng hơn một tốt sạch, và cột c thuộc về Trắng. Đây là lần đầu tiên cán cân vật chất lệch trong ván này."},{"at":76,"t":"<b>39 ♖xd6!</b> — Xe ăn đúng con tốt bị khoá từ nước 15, và đứng ngay trước mũi Mã e4. Nước ăn này không phải cho không: Xe e5 của Đen đang bị Hậu f4 nhắm, nên bắt Xe d6 là mở ra cả một chuỗi đổi quân."},{"at":77,"t":"<b>39…♕a1?</b> — Korchnoi không ăn mà đưa Hậu xuống a1 đánh Tượng f1. Vấn đề là ô a1 nằm trên cột a, ngay dưới con tốt a6 mà Xe Trắng sắp ăn."},{"at":78,"t":"<b>40 ♖xa6</b> — một nước làm hai việc: lấy tốt thứ hai và <b>đánh luôn vào Hậu a1</b>. Hậu Đen phải chạy, Trắng được nghỉ một nhịp để lo con tốt d."},{"at":86,"t":"<b>44 ♕a7+</b> và Đen xin thua. Đen thiếu hai tốt, Vua bị chiếu giữa bàn trống, còn tốt d6 thì chỉ cách ô phong một bước với Hậu đứng kèm ở hàng 7."}]},"37":{"tiv":"Chỉ là một ván hòa","ctx":"Giải Ứng viên Curaçao 1962, Keres cầm Trắng. Keres tránh mọi biến chính của <b>Sicilian</b> bằng 2 ♘e2 rồi g3 và ♗g2 — một thế trận chậm, chờ thời. Fischer trả lời bằng cách chiếm trung tâm ngay: 6…e5 rồi 11…d5. Ván cờ đi qua ba đoạn rõ rệt — một cuộc đấu tay đôi ở trung tâm, một tàn cuộc Hậu–Xe dài nơi Fischer ép mãi mà không phá nổi, và một pha chạy tốt phong Hậu của cả hai bên. Kết thúc bằng chiếu liên tục.","end":"Hai thứ đáng học. Thứ nhất là <b>đổi chỗ cho Tượng xấu</b>: Tượng g7 của Đen bị tốt e5 chặn đứng, và nước 24…♗h6 đưa nó sang đường chéo c1–h6, từ đó nó đi tiếp f4 rồi ăn luôn con tốt e5 đang chặn nó. Thứ hai là <b>trong tàn cuộc có tốt sắp phong, quân dùng để chặn quan trọng hơn quân dùng để ăn</b>: Tượng Trắng đi vòng ra f5 chỉ để canh ô d7, còn ở nước cuối nó lại lao ra h3 chắn chiếu — cả hai lần đều là việc phòng thủ, và chính chúng giữ được ván hòa.","notes":[{"at":11,"t":"<b>6…e5!</b> — Đen dựng tốt ở e5 để bịt luôn ý đồ d4 của Trắng. Hai ô d4 và f4 từ giờ do tốt Đen canh, nên quân Trắng không có chỗ đứng ở giữa bàn."},{"at":19,"t":"<b>10…exf4!</b> — Đen ăn về phía tốt g. Sau khi Trắng bắt lại bằng gxf4, <b>Trắng không còn tốt g</b>, mà Vua Trắng thì đang ngồi ở g1 với cột g trống hoác."},{"at":21,"t":"<b>11…d5!</b> — ngay lập tức đánh vào tốt e4. Đen không chờ Trắng ổn định lại thế cờ sau khi tốt g bay mất; đây là cách trừng phạt việc mở lối vào Vua mình."},{"at":27,"t":"<b>14…f6</b> — đục vào tốt e5. Con tốt đó là thứ duy nhất giữ cho Trắng có chút không gian ở trung tâm; đổi nó đi thì Tượng g7 của Đen sống lại."},{"at":35,"t":"<b>18…♘b3</b> — Mã từ rìa a5 nhảy vào b3, đánh cùng lúc Xe a1 và Tượng c1. Đen chấp nhận đổi con Mã đứng xấu nhất của mình lấy một Tượng."},{"at":43,"t":"<b>22…d4</b> — phá dây tốt c3–d3 của Trắng. Trắng ăn thì Đen ăn lại và có một tốt d4 tự do ở giữa bàn; không ăn thì tốt d4 đứng chèn ngay trước mặt các quân Trắng."},{"at":47,"t":"<b>24…♗h6!</b> — Tượng rời g7, nơi nó bị chính tốt e5 của Trắng chặn kín. Trên đường chéo mới, nó đi được tiếp tới f4 — và từ f4 thì nó đánh thẳng vào con tốt e5 đó. Đây là ý tưởng chính của cả đoạn giữa ván."},{"at":51,"t":"<b>26…♘d5?</b> — Mã đứng vào d5 nhìn có vẻ oai, nhưng nó đang chắn ngay trên đường chéo dài của Tượng g2. Nó ở đó được là nhờ Mã f3 của Trắng cũng đang đứng chắn — một chỗ dựa mà đối phương có thể bỏ đi bất cứ lúc nào."},{"at":52,"t":"<b>27 ♘h2!</b> — Mã lùi về, và Tượng g2 hiện ra. Bây giờ Mã d5 bị cả Tượng g2 lẫn Hậu e6 nhắm mà chỉ có một quân giữ. Đen phải dời Mã đi ngay."},{"at":61,"t":"<b>31…♗d4!</b> — Tượng vào giữa bàn, tự đặt mình dưới tầm Mã f3 nhưng đồng thời <b>đỡ cho Mã e3</b> đang bị Xe e1 và Hậu e6 nhắm. Trắng buộc phải chọn: hoặc chịu đựng con Mã e3, hoặc bỏ chất ra đổi."},{"at":67,"t":"<b>34…♕xh3+</b> — Đen lấy lại tốt. Sau chuỗi đổi quân từ nước 30, hai bên cân bằng vật chất: Trắng có Hậu + Tượng + Mã, Đen có Hậu + Xe. Từ đây là một tàn cuộc dài mà không bên nào phá nổi bên kia."},{"at":111,"t":"<b>56…♖h3+?</b> — Xe đi chiếu rồi vòng xuống ăn tốt a3. Được một tốt, nhưng Xe đi lạc sang hẳn cánh Hậu đúng lúc Trắng sắp cho tốt d chạy. Trong tàn cuộc, khoảng cách của quân tới con tốt thông đáng giá hơn một tốt lẻ."},{"at":118,"t":"<b>60 ♗f5!</b> — Tượng vòng c6–d7–f5. Từ f5 nó canh đúng ô d7, tức là ô mà con tốt Trắng cần đi qua. Tượng không đánh ai cả, nó chỉ dọn đường cho tốt."},{"at":129,"t":"<b>65…♖xd7!</b> — Fischer đưa Xe đổi lấy con tốt sắp phong. Sau khi Trắng ăn lại bằng Tượng, Đen có ♕f2+ rồi ♕xf1+ nhặt luôn con Mã — nên đây không phải là cho không, mà là một cuộc đổi tính đủ cả hai đầu."},{"at":142,"t":"<b>72 ♕e5!!</b> — Hậu Trắng chiếm cùng lúc đường chéo về h8 và đường chéo e5–h2, tức là cả nơi Vua Đen trốn lẫn nơi con tốt g2 sắp phong. Nước này giữ cho Trắng luôn có nước chiếu, và đó là toàn bộ vốn liếng còn lại của Keres."},{"at":152,"t":"<b>77 ♕f7+</b> — hai bên nhận hòa. Vua Đen chỉ còn hai ô h8 và h6, chuỗi chiếu ♕e7+ – ♕f8+ – ♕f7+ cứ thế lặp lại; cách duy nhất để thoát là chắn bằng Hậu, tức là đổi Hậu và mọi thứ tan hết."}]},"38":{"tiv":"Truyện trinh thám","ctx":"Ván này đánh ở giải Ứng viên Curaçao 1962. Khai cuộc là <b>Ruy Lopez</b> biến đóng: Trắng dựng ♗b5–a4–b3, c3, h3 rồi mới đẩy d4; Đen trả lời bằng ...a6, ...b5, ...♘a5 để dồn Tượng Trắng về c2 và phản công ở cánh Hậu. Không có nước hỏng nào lộ liễu — Fischer nhặt từng manh mối nhỏ: một ô d5 không ai canh, một tốt e5 mất hàng xóm, hai tốt cánh Hậu đứng rời nhau. Đến nước 27 Trắng hơn một tốt, rồi đổi sạch vào tàn cuộc Xe. Keres xin thua ở nước 41.","end":"Bài học chính là <b>cách tạo và dùng một ô yếu</b>. Ô d5 không tự nhiên mà có: nó xuất hiện vì Đen đẩy ...c5 rồi Trắng đổi ngay ở c5, để lại tốt e5 không còn tốt d bên cạnh. Sau đó Mã Trắng đi đường vòng ♘b1–d2–f1–e3–d5 mất bốn nhịp — đắt, nhưng đi tới nơi có việc. Điều đáng nhớ thứ hai: mỗi lần đổi quân Fischer đều đổi theo hướng làm cấu trúc tốt Đen xấu thêm, nên khi vào tàn cuộc thì lợi thế đã đủ để thắng mà không cần đòn phối hợp nào.","notes":[{"at":16,"t":"<b>9 h3</b> — Tốt h lên một ô trước khi Trắng đẩy d4. Nếu d4 ngay thì Đen có ...♗g4 đánh vào Mã f3 — mà Mã f3 lại đúng là một trong những quân đỡ tốt d4. Đây là nước dọn nhà điển hình của Ruy Lopez đóng."},{"at":21,"t":"<b>11...♘d7</b> — Keres lùi Mã về giữ c5 và e5 thay vì đổi ở d4. Trung tâm chắc hơn thật, nhưng Tượng c8 bị chính con Mã này nhốt lại, còn Mã a5 vẫn đứng ngoài rìa. Đen đang có hai quân không làm gì."},{"at":22,"t":"<b>12 dxc5!</b> — Đổi ngay ở c5, không chờ Đen chọn. Sau khi Đen ăn lại bằng tốt d, tốt <b>e5 của Đen không còn tốt d bên cạnh</b> — từ giờ nó chỉ được quân giữ, không được tốt giữ. Cả phần sau của ván xoay quanh đúng ô đó."},{"at":25,"t":"<b>13...♕c7?</b> — Hậu ra c7 không chạm vào vấn đề thật. Đếm trên bàn cờ lúc này: <b>không quân Đen nào nhìn vào ô d5</b>, chỉ mỗi tốt e4 của Trắng kiểm soát nó. Đen cần ...♘f6 hoặc ...♗b7 để tranh ô đó trước đã."},{"at":32,"t":"<b>17 ♘d5!</b> — Mã cắm vào ô đã bỏ trống từ nhiều nước trước, sau hành trình ♘b1–d2–f1–e3–d5. Đen ăn thì tốt e4 ăn lại; tốt e4 biến mất và ô e5 mở ra cho Mã f3."},{"at":36,"t":"<b>19 ♘xe5</b> — Ăn tốt sạch. Mã đứng vững vì <b>Hậu e2 đỡ nó trên cột e</b>. Còn nếu <b>19...♕xe5</b> thì <b>20 ♕xe5</b> và không quân Đen nào ăn lại được ở e5 — Đen mất Hậu chỉ để lấy một Mã."},{"at":37,"t":"<b>19...♖a7</b> — Nước thủ khéo. Xe trông như đứng không, nhưng khi Trắng đuổi Hậu bằng ♗f4 thì Tượng e7 sẽ mất người giữ; Xe a7 nhận trước phần việc đó dọc hàng 7."},{"at":40,"t":"<b>21 ♖ad1!</b> — Xe cuối cùng vào cột d, cột duy nhất mở. Nó vừa nhìn thẳng Xe d8 vừa đè lên Tượng d5, nên Đen không được để quân nào trên cột này thiếu người đỡ."},{"at":41,"t":"<b>21...g6</b> — Đen bịt đường chéo b1–h7 của Tượng c2. Đổi lại, hai ô đen <b>f6 và h6</b> quanh Vua không còn tốt nào canh. Fischer đổi hướng ngay lập tức."},{"at":44,"t":"<b>23 ♗h6</b> — Tượng chiếm đúng ô đen vừa yếu đi và lấy luôn ô f8 của Vua Đen. Từ đây Vua Đen không còn lối thoát nào ở cánh Vua."},{"at":46,"t":"<b>24 ♗b3!</b> — Tượng c2 hết việc trên đường chéo đã bị tốt g6 bịt, nên chuyển sang đường chéo a2–g8. Ở đó nó đè Mã c4 và chuẩn bị đổi ở c4, buộc tốt b5 ăn lại — tốt c4 mới sinh ra đó sẽ không ai giữ."},{"at":52,"t":"<b>27 ♕xc4!</b> — Trắng hơn một tốt. Quan trọng hơn con số: tốt a6 và tốt c5 của Đen giờ <b>cô lập</b>, mỗi tốt đứng một mình, và Hậu Trắng ở c4 nhắm được cả hai."},{"at":60,"t":"<b>31 ♕e4!</b> — Hậu vào giữa bàn, cùng lúc nhắm Tượng e6 và tốt g6. Đen phải giữ cả hai bằng cùng những quân đang bận, nên không tổ chức nổi phản công."},{"at":68,"t":"<b>35 ♘xe6</b> — Bắt đầu đổi sạch. Sau khi Hậu và Xe rời bàn, Trắng vào tàn cuộc Xe <b>hơn hai tốt</b>. Fischer không tìm chiếu hết; ông đổi về đúng cái tàn cuộc mà lợi thế nhỏ đủ để thắng."},{"at":78,"t":"<b>40 ♖b7!</b> — Đen vừa gỡ lại tốt f2, nhưng Xe Trắng vào hàng 7. Từ đó nó đè tốt h7 và cắt ngang Vua Đen, trong khi hai tốt a6 và c5 của Đen đứng rời, không tốt nào đỡ tốt nào."},{"at":80,"t":"<b>41 ♔g3</b> và Keres xin thua. Trắng hơn một tốt, Xe đứng hàng 7, Vua Đen phải ở lại giữ tốt h7 còn Xe Đen phải cùng lúc trông a6, c5 và g6. Một quân không làm được ba việc."}]},"39":{"tiv":"Cuộc đối đầu","ctx":"Olympiad Varna 1962: Botvinnik đang giữ ngôi vô địch thế giới cầm quân Trắng, Fischer 19 tuổi cầm quân Đen. Khai cuộc là <b>phòng thủ Grünfeld</b>, hệ thống Nga (5 ♕b3): Đen nhường trung tâm tốt cho Trắng rồi bắn vào nó bằng Tượng g7 và các nước ...c5/...♘c6. Fischer chơi rất sắc ở trung cuộc — một đòn thí Hậu tạm ở nước 17 để gỡ thế, rồi thắng một tốt và đổi vào tàn cuộc Xe. Nhưng tàn cuộc Xe hơn một tốt không tự thắng: Botvinnik phản công đúng lúc, Fischer đi hỏng một nước ở nước 51, và ván kết thúc <b>hòa</b> sau 68 nước.","end":"Hai bài học nằm ở hai đầu ván. Đầu tiên là <b>đòn thí Hậu tạm ở nước 17</b>: Hậu ăn tốt f4 không phải để ăn tốt, mà để lôi Tượng e3 ra khỏi việc đỡ Hậu c5 — cứ tìm xem quân đối phương đang <b>làm mấy việc một lúc</b> thì đòn phối hợp sẽ hiện ra. Thứ hai là tàn cuộc: Xe hơn một tốt thắng được, nhưng chỉ khi tốt của mình không tự đi vào tầm Xe đối phương. Nước 51...b5 đẩy tốt tới chỗ Xe Trắng với tới, và toàn bộ lợi thế bốc hơi. Thế cờ cuối là một <b>pháo đài</b> mẫu mực: Xe đứng chặn TRƯỚC tốt thông, tốt f6 giữ chân Vua Đen, và Đen hơn hai tốt vẫn không tiến được bước nào.","notes":[{"at":8,"t":"<b>5 ♕b3</b> — Hệ thống Nga. Hậu ra b3 vừa nhắm tốt b7 vừa đứng ngay sau tốt c4 trên đường chéo a2–g8, nên giữ tốt d5 trở nên rất khó chịu. Đen thường giải quyết bằng cách đổi luôn ...dxc4 rồi quay sang bắn vào trung tâm Trắng."},{"at":13,"t":"<b>7...♗g4</b> — Tượng ra đánh Mã f3, mà Mã f3 là một trong hai quân đỡ tốt d4. Đây là ý chính của Grünfeld: không giữ trung tâm, mà bắn vào trung tâm của đối phương."},{"at":15,"t":"<b>8...♘fd7</b> — Mã lùi để mở đường chéo dài cho Tượng g7. Bây giờ Tượng g7 nhìn thẳng tốt d4, Tượng g4 đánh Mã f3 (một trong hai quân đỡ tốt đó), và Mã sắp ra c6. Đen không giữ trung tâm, Đen bắn vào trung tâm."},{"at":21,"t":"<b>11 ♕c5 ♕d6!</b> — Botvinnik đưa Hậu sang c5 mời đổi và đè tốt e7; Fischer đổi lại theo điều kiện của mình. Hậu d6 cùng lúc làm ba việc: đối mặt Hậu c5, thêm một quân nữa nhắm tốt d4, và đỡ chính tốt e7 đang bị đe. Trắng phải tự chọn đổi Hậu hay lùi."},{"at":24,"t":"<b>13 gxf3</b> — Trắng ăn về phía trung tâm và mở cột g, nhưng phải trả giá: hai tốt f <b>chồng nhau</b>, tốt h3 thành tốt cô lập, và Vua vẫn còn ở e1 chưa nhập thành. Cấu trúc này sẽ theo Trắng tới hết ván."},{"at":29,"t":"<b>15...♕f6!</b> — Hậu vừa tránh Mã b5 vừa nhắm tốt f3. Đếm ở f3: Đen có Mã e5 và Hậu f6 tấn công, Trắng chỉ có Tượng e2 giữ. Trắng phải làm gì đó ngay."},{"at":33,"t":"<b>17...♕xf4!</b> — Không phải ăn tốt, mà là <b>kéo Tượng e3 ra khỏi chỗ của nó</b>. Tượng e3 đang là quân duy nhất đỡ Hậu c5, mà Hậu c5 đang bị Mã d7 nhắm. Trắng ăn Hậu thì Đen ăn lại Hậu ngay."},{"at":47,"t":"<b>24...♘e6!</b> — <b>Đòn đôi</b>: Mã cùng lúc đánh Tượng f4 (không ai giữ) và Mã c7. Trắng không cứu được cả hai; nước 24 ♗f3 trước đó đã bỏ rơi Tượng f4."},{"at":53,"t":"<b>27...e5!</b> — Tốt đẩy lên đánh Tượng f4. Sau khi đổi hết ở e5, Xe Đen ăn lại tốt d6 và Đen <b>hơn một tốt</b>. Đây là chỗ Fischer chuyển từ thế chủ động sang lợi thế vật chất."},{"at":83,"t":"<b>42...♖xe4</b> — Vào tàn cuộc Xe thuần: Đen bốn tốt, Trắng ba. Tốt dư nằm ở cánh Hậu, tách khỏi cánh kia — đúng dạng tàn cuộc mà bên hơn tốt có cơ hội thắng thật."},{"at":92,"t":"<b>47 ♖xh7!</b> — Botvinnik bỏ tốt a4 để lấy tốt h7. Đổi một tốt lấy một tốt, nhưng tốt h của Trắng sẽ chạy được và Xe Trắng vào được sau lưng Đen. Trong tàn cuộc Xe, quân hoạt động đáng giá hơn một tốt."},{"at":94,"t":"<b>48 h4+!</b> — Tốt lên có chiếu vì Vua Đen đứng g5. Trắng vừa được một nhịp vừa đẩy tốt h đi tiếp; Vua Đen bị dồn ra khỏi khu vực nó cần có mặt."},{"at":101,"t":"<b>51...b5?</b> — Nước hỏng. Tốt b rời b6 sang b5, nơi Xe Trắng với tới được sau khi cột g mở ra. Giữ tốt ở b6 và đưa Vua lên thì Đen còn giữ được hai tốt cánh Hậu đi cùng nhau."},{"at":102,"t":"<b>52 h5!</b> — Điểm chốt của cả tàn cuộc. Đen ăn thì tốt g6 biến mất và Xe Trắng có ♖g5+ ăn luôn tốt b5. Không ăn thì tốt h đi tiếp. Từ đây Đen chỉ còn hơn tốt trên giấy."},{"at":112,"t":"<b>57 ♖b8!</b> — Xe lên hàng 8 để khi tốt a của Đen bắt đầu chạy thì Xe sang a8, đứng <b>sau lưng tốt</b> trên cùng một cột. Đó là chỗ đứng đúng của Xe khi chặn tốt thông đối phương: tốt càng đi càng xa Vua của nó, còn Xe thì giữ nguyên sức ép."},{"at":134,"t":"<b>68 ♔g1</b> — <b>Hòa.</b> Đen hơn hai tốt mà không tiến được bước nào: Xe a6 đứng sau tốt a3 nên tốt vừa chạy là bị ăn; tốt f6 của Trắng giữ chân Vua Đen ngay tại f7; còn tốt h3 không qua được vì Vua Trắng canh ô h2. Một quân Xe của Đen không gánh nổi cả ba việc."}]},"40":{"tiv":"Biến Najdorf","ctx":"Olympiad Varna 1962, Fischer cầm Trắng gặp chính người mà biến khai cuộc này mang tên. Đây là <b>phòng thủ Sicilian</b>, biến Najdorf: Đen chơi ...a6 sớm để chuẩn bị ...b5 và ...e5, giành không gian ở cánh Hậu trước khi lo Vua. Fischer chọn 6 h3 rồi nhảy 7 ♘d5 ngay; Najdorf trả lời 7...♗b7 và cấu trúc tốt cánh Vua của ông vỡ ngay ở nước 8. Từ đó Vua Đen không nhập thành được, và Fischer thí một chất ở nước 14 để mở toang mọi đường tới ô e8. Đen xin thua sau <b>24 nước</b>.","end":"Ván này là bài học về <b>quyền nhập thành và cái giá của nó</b>. Fischer không thí chất để ăn lại vật chất — ông thí để mọi quân Trắng cùng nhắm vào một Vua đứng giữa bàn. Chi tiết kỹ thuật đáng nhớ nhất là hai nước chiếu 16 ♘g7+ và 17 ♘f5+: thế cờ trở về y như cũ, chỉ khác một điều — Đen đã <b>mất hẳn quyền nhập thành</b>, và Xe h8 vĩnh viễn đứng ngoài ván cờ. Một nước chiếu không ăn gì vẫn có thể lấy đi thứ không mua lại được.","notes":[{"at":10,"t":"<b>6 h3</b> — Tốt h lên một ô để chặn ...♗g4 và ...♘g4, giữ nguyên đội hình rồi mới tính. Trong biến Najdorf, Trắng có rất nhiều cách chơi; cách này chậm nhưng không cho Đen ghim quân nào."},{"at":11,"t":"<b>6...b5!?</b> — Najdorf đẩy tốt cánh Hậu ngay khi mới có một Mã ra khỏi hàng. Được không gian thật, nhưng tốt b rời b7 thì hết canh ô c6, và ô <b>d5</b> lúc này chỉ còn mỗi Mã f6 trông chừng."},{"at":12,"t":"<b>7 ♘d5!?</b> — Mã nhảy thẳng vào lỗ hổng vừa mở. Nó chưa thể ở lại lâu, nhưng đặt câu hỏi ngay: Đen ăn thì tốt e4 lên d5 và Trắng chiếm không gian giữa bàn; Đen không ăn thì Trắng đổi ở f6."},{"at":13,"t":"<b>7...♗b7?</b> — Tượng ra đường chéo dài đè tốt e4, nghe rất Najdorf, nhưng nó bỏ qua chuyện Mã d5 sẽ đổi ở f6 <b>trước</b>. Đen cần ...♘xd5 hoặc ...e6 ở đây."},{"at":15,"t":"<b>8...gxf6</b> — Ăn bằng tốt g. Cấu trúc tốt Đen vỡ thành ba cụm rời, hai tốt f chồng nhau, và cánh Vua không còn là chỗ để nhập thành. Từ đây Vua Đen sẽ ở lại giữa bàn suốt ván."},{"at":16,"t":"<b>9 c4!</b> — Đánh vào chân chuỗi tốt Đen. Nếu Đen ăn thì tốt b5 biến mất và <b>đường chéo a4–e8 mở toang</b> — bốn nước sau, Fischer dùng đúng đường chéo đó để chiếu."},{"at":22,"t":"<b>12 ♖e1!</b> — Xe vào cột e, nơi có Tượng e4 và Vua e8 xếp thẳng hàng. Chưa ghim được vì tốt e7 còn chắn giữa, nhưng Đe
