var KIT=[{"title":"Phần A — Quân cờ, nước đi, ký hiệu và cấu trúc tốt","intro":"Đây là bộ từ nền: tên quân, tên nước đi, ký hiệu trong sách cờ tiếng Anh và các từ về tốt, về ô và đường. Nắm phần này thì đọc được phần lớn một dòng chú giải mà không phải tra thêm.","groups":[{"name":"Quân cờ và cách gọi tên","items":[{"en":"King","vi":"Vua","note":"Ký hiệu K."},{"en":"Queen","vi":"Hậu","note":"Ký hiệu Q. Chú ý: \"queens\" có khi là động từ — \"the pawn queens\" nghĩa là con Tốt phong Hậu."},{"en":"Rook","vi":"Xe","note":"Ký hiệu R."},{"en":"Bishop","vi":"Tượng","note":"Ký hiệu B."},{"en":"Knight","vi":"Mã","note":"Ký hiệu N, không phải K. K đã dành cho King. Đây là chỗ vấp đầu tiên của gần như mọi người mới đọc."},{"en":"Pawn","vi":"Tốt","note":"Không có chữ cái riêng: nước Tốt chỉ ghi tên ô, ví dụ e4. Sách cũ có khi ghi P (PxP = Tốt ăn Tốt)."},{"en":"piece / pieces","vi":"quân","note":"Bẫy: trong sách cờ, \"pieces\" thường chỉ Mã Tượng Xe Hậu, KHÔNG tính Tốt. \"Black has more pieces out\" = Đen ra quân nhiều hơn, không nói gì về Tốt."},{"en":"minor piece","vi":"quân nhẹ","note":"Mã và Tượng."},{"en":"major piece / heavy piece","vi":"quân nặng","note":"Xe và Hậu."},{"en":"White / Black","vi":"Trắng / Đen","note":"Viết hoa vì chỉ NGƯỜI chơi bên đó, không chỉ màu ô. Màu ô nói riêng: \"light squares\" = ô trắng, \"dark squares\" = ô đen, và \"dark-squared Bishop\" là Tượng ô đen."}]},{"name":"Nước đi, ăn quân, phong cấp","items":[{"en":"move","vi":"nước đi","note":"\"on move 25\" = ở nước thứ 25. \"to move\" = tới lượt đi."},{"en":"capture / take / takes","vi":"ăn quân","note":"\"takes on d5\" = ăn ở d5."},{"en":"recapture","vi":"ăn lại","note":"Ăn lại quân vừa ăn của mình."},{"en":"exchange (động từ)","vi":"đổi quân","note":"\"exchange Queens\" = đổi Hậu. Nói thường thì dùng \"trade\" hoặc \"swap\", cùng nghĩa."},{"en":"the exchange","vi":"chất (Xe đổi Mã hoặc Tượng)","note":"BẪY NẶNG NHẤT. Có \"the\" ở trước thì là CHẤT, không phải đổi quân. \"win the exchange\" = ăn chất (được Xe, mất Mã/Tượng). \"sac the exchange\" = thí chất. \"up the exchange\" = hơn chất."},{"en":"sacrifice / sac","vi":"thí quân","note":"\"sac\" là dạng nói tắt, rất hay gặp trong chú giải Mỹ."},{"en":"castle / castling / castled","vi":"nhập thành","note":"\"castles short\" = nhập thành cánh Vua (0-0). \"castles long\" = nhập thành cánh Hậu (0-0-0)."},{"en":"check","vi":"chiếu","note":"Sách Anh cũ viết \"ch\" ngay sau nước đi thay cho dấu +."},{"en":"mate / checkmate / mates","vi":"chiếu hết","note":"\"mates in three\" = chiếu hết sau ba nước."},{"en":"promote / promotion / queen (v.)","vi":"phong cấp","note":"Tốt tới hàng cuối đổi thành quân khác. Viết e8=Q hoặc e8(Q)."},{"en":"en passant (e.p.)","vi":"bắt tốt qua đường","note":"Tốt đối phương vừa đi hai ô lướt qua ô bị mình kiểm soát thì được ăn như thể nó chỉ đi một ô. Chỉ được ăn NGAY nước sau, để lỡ là mất quyền."},{"en":"resign / resigns","vi":"xin thua","note":"\"Black resigns\" là dòng kết của rất nhiều ván."},{"en":"draw / drawn","vi":"hòa","note":"\"drawish\" = có mùi hòa, khó thắng."}]},{"name":"Ký hiệu đại số tiếng Anh","items":[{"en":"K Q R B N","vi":"Vua Hậu Xe Tượng Mã","note":"Nhớ N = Knight = Mã. Tốt không có chữ cái."},{"en":"Nf3, e4","vi":"chữ quân + ô đến","note":"Cách viết chuẩn: quân gì, đi tới ô nào. Nf3 = Mã tới f3. e4 = Tốt tới e4."},{"en":"x","vi":"ăn quân","note":"Nxe5 = Mã ăn ở e5. Sách Fischer thời đó có khi viết theo tên quân bị ăn: NxP, RxN, QxB."},{"en":"exd5","vi":"Tốt cột e ăn ở d5","note":"Nước Tốt ăn thì ghi chữ cột xuất phát trước dấu x."},{"en":"+ (hoặc \"ch\")","vi":"chiếu","note":"Sách cũ dùng \"ch\" viết liền sau nước: 15 Qb5 ch."},{"en":"# (hoặc \"mate\")","vi":"chiếu hết","note":"Sách cũ thường viết hẳn chữ \"mate\"."},{"en":"0-0","vi":"nhập thành cánh Vua","note":"Có sách viết O-O bằng chữ O."},{"en":"0-0-0","vi":"nhập thành cánh Hậu","note":"Ba đoạn vì Xe đi xa hơn."},{"en":"e.p.","vi":"bắt tốt qua đường","note":"Viết sau nước ăn, chỉ để nhắc, không bắt buộc."},{"en":"= (sau nước phong cấp)","vi":"phong thành","note":"BẪY: e8=Q nghĩa là Tốt phong Hậu. Nhưng dấu = ĐỨNG RIÊNG sau một biến lại nghĩa là \"thế cân bằng\". Cùng một ký tự, hai nghĩa, phân biệt bằng chỗ đứng."},{"en":"21…Rb7 (ba chấm)","vi":"nước của Đen","note":"Ba chấm nghĩa là bỏ qua nước Trắng, đây là nước Đen. \"21 h6\" là nước Trắng thứ 21; \"21…Rb7\" là nước Đen thứ 21."}]},{"name":"Dấu đánh giá nước đi và thế cờ","items":[{"en":"!","vi":"nước hay","note":"Khen một nước đúng và khó tìm."},{"en":"!!","vi":"nước rất hay","note":"Thường là thí quân bất ngờ."},{"en":"?","vi":"nước dở","note":"Sai lầm làm hỏng thế."},{"en":"??","vi":"đi hỏng nặng (blunder)","note":"Mất quân hoặc thua ngay."},{"en":"!?","vi":"nước đáng thử, thú vị","note":"Không chắc đúng nhưng gây khó cho đối thủ."},{"en":"?!","vi":"nước đáng ngờ (dubious)","note":"Nghi là dở nhưng chưa bác được hẳn."},{"en":"=","vi":"thế cân bằng","note":"Đứng riêng sau một biến. Khác hẳn dấu = trong e8=Q."},{"en":"±","vi":"Trắng hơn","note":"Trắng ưu thế rõ nhưng chưa thắng. Nhẹ hơn thì viết ⩲."},{"en":"∓","vi":"Đen hơn","note":"Đối xứng với ±. Nhẹ hơn thì viết ⩱."},{"en":"+−","vi":"Trắng thắng","note":"Ưu thế đủ để thắng, không còn là chuyện hơn kém. Ngược lại, −+ là Đen thắng."}]},{"name":"Cách đọc một dòng biến","items":[{"en":"On 21…Rb7 22 h6! wins","vi":"Nếu Đen đi 21…Xb7 thì 22 h6! thắng","note":"Cấu trúc hay gặp nhất. \"On\" + nước của bên kia = giả định họ đi thế. Rồi tới nước đáp của mình. Rồi một từ kết luận. Không có chữ \"if\" nào cả — đó là chỗ người Việt vấp."},{"en":"if 13…Nd7 14 Bf4 with advantage","vi":"nếu 13…Md7 thì 14 Tf4 với ưu thế","note":"Cùng khuôn với \"On\". \"with advantage\" gắn vào nước cuối, nghĩa là bên vừa đi nước đó được lợi."},{"en":"wins","vi":"thắng","note":"BẪY: chủ ngữ ngầm là BÊN VỪA ĐI nước ngay trước đó, không phải Trắng mặc định. \"22 h6! wins\" = nước h6 của Trắng thắng. \"21…Rb7 wins\" thì lại là Đen thắng."},{"en":"loses","vi":"thua, để thua","note":"\"22 Rd1? loses\" = đi Xd1 là thua. \"loses a pawn\" = mất một Tốt."},{"en":"with advantage / with the better game","vi":"với ưu thế / thế hơn","note":"Kết luận nhẹ hơn \"wins\": hơn thế chứ chưa thắng."},{"en":"followed by","vi":"rồi tiếp theo là","note":"\"…Bh6 followed by …Rf8\" = đi Th6 rồi tính đi Xf8. Nối hai nước cùng một kế hoạch."},{"en":"instead","vi":"thay vì thế, đáng lẽ","note":"\"Instead 18 Qc2 was better\" = đáng lẽ nên đi 18 Hc2. Báo hiệu đang nói về nước KHÔNG được đi trong ván."},{"en":"the text / the text move","vi":"nước thật sự đã đi trong ván","note":"BẪY LỚN. \"text\" ở đây không phải chữ nghĩa gì cả, mà là nước có in trong biên bản ván, đối lập với các biến chỉ nằm trong chú giải. \"The text is stronger\" = nước đi thật mạnh hơn (mạnh hơn cái biến vừa bàn)."},{"en":"line / variation","vi":"biến","note":"Một chuỗi nước giả định. \"main line\" = biến chính."},{"en":"etc.","vi":"vân vân","note":"Biến còn dài nhưng tác giả cho là kết cục đã rõ, khỏi ghi tiếp."},{"en":"transposes (into)","vi":"chuyển hóa sang","note":"Đi đường khác nhưng ra đúng thế của một biến/khai cuộc khác."},{"en":"is answered by / is met by","vi":"bị đáp lại bằng","note":"\"…Nd4 is met by Bxd4\" = Đen đi Md4 thì Trắng đáp Txd4."},{"en":"threatening / threatens","vi":"đe dọa","note":"\"threatening 23 Rxh7\" = đang dọa nước 23 Xxh7 ở nước sau."},{"en":"intending","vi":"với ý định","note":"Cho biết mục đích của nước vừa đi, thường viết gọn thành \"intending …f5\"."},{"en":"forced","vi":"buộc phải, ép buộc","note":"\"forced\" = không còn lựa chọn nào khác. \"a forced win\" = thắng ép, tính được tới cùng."},{"en":"holds","vi":"trụ được, giữ được","note":"BẪY: không phải \"cầm, nắm\". \"22 Kg2 holds\" = đi Vg2 là trụ được (thường là hòa được)."}]},{"name":"Tốt và cấu trúc tốt","items":[{"en":"pawn structure","vi":"cấu trúc tốt","note":"Hình thế các Tốt trên bàn — thứ quyết định kế hoạch dài hạn vì Tốt không lùi được."},{"en":"passed pawn","vi":"tốt thông","note":"Trên đường đi tới hàng cuối không còn Tốt đối phương chặn hay đứng cột bên cạnh. \"protected passed pawn\" = tốt thông được Tốt nhà bảo vệ."},{"en":"doubled pawns","vi":"tốt chồng","note":"Hai Tốt cùng một cột. Thường là yếu vì không tự bảo vệ nhau được, nhưng đổi lại mở ra một cột cho Xe."},{"en":"isolated pawn","vi":"tốt cô lập","note":"Không còn Tốt nhà nào ở hai cột kề. Không quân Tốt nào che được nó, phải dùng quân lớn giữ."},{"en":"backward pawn","vi":"tốt lùi","note":"Tụt sau các Tốt bên cạnh, không tiến lên được và đứng trên cột nửa mở nên bị Xe đối phương nhắm."},{"en":"hanging pawns","vi":"tốt treo","note":"Hai Tốt kề nhau (thường c và d) đứng trên cột nửa mở, không có Tốt nào đỡ. Mạnh khi tiến được, yếu khi bị chặn. BẪY: khác hẳn \"a hanging piece\" = một quân bị bỏ lửng, không ai bảo vệ."},{"en":"connected pawns","vi":"tốt liên kết","note":"Các Tốt cạnh nhau, che chở lẫn nhau khi tiến."},{"en":"pawn chain","vi":"chuỗi tốt","note":"Dây Tốt chống nhau theo đường chéo. Muốn phá thì đánh vào chân chuỗi, con dưới cùng."},{"en":"pawn majority","vi":"đa số tốt","note":"Hơn Tốt ở một cánh, ví dụ \"Q-side majority\" = hơn Tốt ở cánh Hậu. Đây là mầm của một tốt thông trong tàn cuộc."},{"en":"minority attack","vi":"tấn công thiểu số","note":"Ít Tốt đánh vào chỗ nhiều Tốt (thường b4-b5), không phải để ăn mà để ép đối phương đẻ ra tốt yếu."},{"en":"e-pawn, d-pawn","vi":"tốt cột e, tốt cột d","note":"Cách gọi Tốt theo cột nó đang đứng. Đọc là \"e-pawn\", đừng đọc thành tên ô."},{"en":"K-side pawns / Q-side pawns","vi":"các tốt cánh Vua / các tốt cánh Hậu","note":"Gọi cả cụm Tốt một bên bàn."},{"en":"blockade","vi":"phong tỏa","note":"Đặt một quân (thường Mã) ngay trước tốt thông của đối phương để nó không nhúc nhích được."},{"en":"weak pawn / weakness","vi":"tốt yếu / điểm yếu","note":"Tốt không được Tốt khác bảo vệ và bị nhắm tới. \"weakness\" cũng có thể chỉ một ô yếu chứ không riêng Tốt."}]},{"name":"Ô, cột, hàng, đường","items":[{"en":"square / squares","vi":"ô","note":"\"the e5 square\" = ô e5."},{"en":"file","vi":"cột","note":"BẪY: không phải \"tệp, hồ sơ\". Cột dọc a đến h. \"the e-file\" = cột e."},{"en":"rank","vi":"hàng","note":"BẪY: không phải \"thứ hạng\". Hàng ngang 1 đến 8. \"the seventh rank\" = hàng 7."},{"en":"diagonal","vi":"đường chéo","note":"\"the long diagonal\" = đường chéo dài (a1–h8 hoặc a8–h1)."},{"en":"open file","vi":"cột mở","note":"Cột không còn Tốt nào — đường cho Xe."},{"en":"half-open file","vi":"cột nửa mở","note":"Chỉ còn Tốt của một bên. Bên không còn Tốt đặt Xe lên đó để ép Tốt đối phương."},{"en":"back rank","vi":"hàng cuối","note":"Hàng 1 với Trắng, hàng 8 với Đen. \"back-rank mate\" = chiếu hết ở hàng cuối khi Vua bị chính hàng Tốt nhà bịt lối."},{"en":"seventh rank","vi":"hàng 7","note":"Hàng áp chót phía đối phương. Xe xuống được hàng 7 là rất mạnh vì ăn ngang cả dãy Tốt chưa đi; hai Xe cùng xuống gọi là \"pigs on the seventh\"."},{"en":"center","vi":"trung tâm","note":"Bốn ô d4 e4 d5 e5 và vùng quanh đó."},{"en":"K-side","vi":"cánh Vua","note":"Nửa bàn phía cột e đến h — nơi Vua đứng sau khi nhập thành ngắn."},{"en":"Q-side","vi":"cánh Hậu","note":"Nửa bàn phía cột a đến d."},{"en":"hole","vi":"lỗ hổng","note":"Một ô không còn Tốt nào của mình che được nữa. Đối phương đưa quân vào đó là đóng đô luôn, đuổi không được."},{"en":"outpost","vi":"ô tiền tiêu","note":"Ô sâu trong đất đối phương, có Tốt nhà đỡ và Tốt đối phương không đuổi được. Chỗ lý tưởng cho Mã. Khác \"hole\": hole là ô mình để hở, outpost là ô mình chiếm được."},{"en":"a-file, c-file, g-file, h-file","vi":"cột a, cột c, cột g, cột h","note":"Khuôn gọi tên cột chung: chữ cột + \"-file\"."}]}]},{"title":"Phần B — Thế trận, kế hoạch, đánh giá","intro":"Phần này gom những chữ mà người chú giải dùng để CHẤM một thế cờ và gọi tên đòn thế. Nắm được chúng là đọc được ý người viết, không chỉ đọc được nước đi.","groups":[{"name":"B1. Đánh giá thế cờ — người viết đang chấm điểm ai hơn ai","items":[{"en":"advantage","vi":"ưu thế, thế hơn","note":"\"White has the advantage\" = Trắng đang hơn thế, KHÔNG có nghĩa là Trắng thắng. Sách luôn ghim thêm mức độ: slight / clear / decisive."},{"en":"edge","vi":"nhỉnh hơn một chút","note":"Nhẹ hơn advantage. \"A slight edge\" chỉ là dễ chơi hơn chút, chưa phải cái gì cụ thể."},{"en":"slight advantage","vi":"ưu thế nhỏ","note":"Hơn chút, thường chỉ đủ để ép đối thủ chơi chính xác, chưa đủ thắng."},{"en":"clear advantage","vi":"ưu thế rõ","note":"Hơn hẳn, thắng được nếu chơi chuẩn — nhưng chưa có đường ép buộc."},{"en":"decisive advantage","vi":"ưu thế quyết định","note":"\"Decisive\" ở đây nghĩa là ĐỊNH ĐOẠT ván cờ, không phải \"dứt khoát\". Còn lại chỉ là kỹ thuật."},{"en":"equal / equality","vi":"cân bằng / thế cân bằng","note":"Cơ hội hai bên ngang nhau. KHÔNG đồng nghĩa với hòa — ván vẫn còn nguyên để chơi và để hỏng."},{"en":"equalize","vi":"san bằng, gỡ được thế trận","note":"Thường nói về Đen: xóa xong ưu thế đi trước của Trắng. Khác \"draw\" (hòa cờ)."},{"en":"winning / a won game","vi":"đang thắng / thế thắng","note":"Là một lời ĐÁNH GIÁ, không phải kết quả. \"A won game\" vẫn có thể bị đánh hỏng."},{"en":"lost / a lost position","vi":"thế thua","note":"\"A lost position\" = thế đã thua về đánh giá, ván chưa kết thúc. Tùy câu, \"lost\" cũng có nghĩa \"đã thua\" hoặc \"đánh mất\" (lost a pawn = mất một Tốt)."},{"en":"hopeless","vi":"vô vọng, hết cửa","note":"Thua không cứu được. Hay đi ngay trước chữ \"resigns\" (xin thua)."},{"en":"busted","vi":"hỏng bét, thua chắc","note":"Tiếng lóng, mạnh hơn \"worse\". Fischer dùng nhiều."},{"en":"drawn","vi":"hòa, thế hòa","note":"\"A drawn position\" = thế hòa dù còn đầy quân. Khác \"a draw\" (kết quả hòa của ván)."},{"en":"drawish","vi":"thiên về hòa, có mùi hòa","note":"Chưa hòa, nhưng bên hơn rất khó khai thác."},{"en":"tenable","vi":"còn giữ được, còn trụ được","note":"Thế xấu nhưng chưa thua — thủ đúng thì hòa."},{"en":"unclear","vi":"chưa rõ, không đánh giá được","note":"Đây là một lời chấm THẬT, không phải cách né tránh: thế rối tới mức không ai nói được bên nào hơn."},{"en":"double-edged","vi":"con dao hai lưỡi","note":"Cả hai bên cùng có cơ thắng lẫn cơ thua. Sai một nước là đổi chiều ngay."},{"en":"sharp / sharper / sharpest","vi":"sắc, gay gắt / sắc hơn / sắc nhất","note":"KHÔNG có nghĩa \"hay nhất\". Là thế nhiều nước ép buộc, phải tính cụ thể, đi trật là hỏng."},{"en":"solid","vi":"chắc, vững","note":"Ít điểm yếu, khó bị phá. Thường ngầm ý: chắc nhưng không sắc."},{"en":"passive","vi":"bị động","note":"Quân không có việc gì làm, chỉ đứng đỡ. Là một lời chê."},{"en":"active","vi":"chủ động, quân hoạt","note":"Quân có mục tiêu, có việc. Trong chú giải, quân hoạt thường quý hơn quân \"đứng đẹp\"."},{"en":"cramped","vi":"chật, bí","note":"Thiếu ô để xoay quân, quân giẫm chân nhau. Cách gỡ kinh điển: đổi bớt quân."},{"en":"loose","vi":"lỏng, không ai bảo vệ","note":"Quân đứng trơ. Quân lỏng là mồi của đòn đôi và chiếu mở — \"loose pieces drop off\"."}]},{"name":"B2. Khái niệm thế trận — cái người viết đang cân đo","items":[{"en":"initiative","vi":"thế chủ động, quyền chủ động","note":"KHÔNG phải \"sáng kiến\". Là việc mình liên tục ra đòn, đối thủ chỉ kịp chạy theo đỡ."},{"en":"pressure","vi":"sức ép","note":"Dồn quân vào một điểm hoặc một cột, chưa ăn được gì ngay nhưng buộc đối thủ phải trói quân để giữ."},{"en":"bind","vi":"thế kìm, gọng kìm","note":"Siết không gian tới mức đối thủ không tìm ra nước phá. Hay gặp: \"the Maroczy bind\"."},{"en":"counterplay","vi":"phản đòn, cơ hội phản công","note":"KHÔNG phải \"chơi lại\". Là việc bên đang bị ép tạo được đòn của riêng mình, thường ở cánh khác. \"No counterplay\" là câu chê nặng."},{"en":"tempo (số nhiều: tempi)","vi":"nhịp, nước tiên","note":"Một nước đi tính là một nhịp. \"Gain a tempo\" = ép đối thủ đi một nước vô ích nên mình lời một nhịp; \"lose a tempo\" = đi phí, hoặc quân phải đi hai lần mới tới chỗ cần."},{"en":"development","vi":"triển khai quân","note":"Đưa Mã, Tượng, Xe ra khỏi hàng đầu — không phải \"sự phát triển\" chung chung. \"A lead in development\" = triển khai nhanh hơn đối thủ."},{"en":"space","vi":"không gian","note":"Phần bàn cờ mình kiểm soát, thường do Tốt tiến lên. Hơn không gian thì quân dễ chuyển cánh."},{"en":"weakness","vi":"điểm yếu","note":"Ô hoặc Tốt không thể bảo vệ tử tế được nữa, thành mục tiêu lâu dài. Khác \"threat\" (đe dọa tức thời)."},{"en":"weak square","vi":"ô yếu","note":"Ô mà Tốt của mình vĩnh viễn không kiểm soát được nữa; quân địch đậu vào đó thì không đuổi ra được."},{"en":"hole","vi":"lỗ hổng","note":"Ô yếu nằm ngay trước dàn Tốt của mình, thường thành chỗ đậu cho Mã địch."},{"en":"outpost","vi":"tiền đồn","note":"Ô yếu trong sân địch mà lại được Tốt của mình che. Đặt Mã vào đó là một tài sản lâu dài."},{"en":"control","vi":"kiểm soát","note":"\"Control of the d-file\" = kiểm soát cột d, quân địch không dám vào."},{"en":"blockade","vi":"phong tỏa","note":"Đặt hẳn một quân (Mã là tốt nhất) ngồi chặn trước Tốt thông của địch để nó không nhúc nhích được."},{"en":"restraint","vi":"kìm hãm","note":"Chưa ăn, chưa đổi, chỉ không cho Tốt hay quân địch tiến. Bước một của bộ ba kinh điển: kìm — chặn — diệt."},{"en":"zugzwang","vi":"thế bí nước (buộc phải đi mà đi là hỏng)","note":"Chữ Đức, sách tiếng Anh giữ nguyên. Không phải bị chiếu — khổ là ở chỗ tới lượt mình mà mọi nước đều làm xấu thế đi."},{"en":"opposition","vi":"thế đối Vua","note":"KHÔNG phải \"phe đối lập\". Hai Vua đứng đối nhau cách một ô; bên KHÔNG phải đi là bên nắm đối Vua. Chủ yếu dùng ở tàn cuộc Vua–Tốt."},{"en":"fortress","vi":"pháo đài","note":"Thế thủ đóng kín: bên ít quân hơn vẫn hòa vì đối thủ dù hơn quân cũng không có đường vào."},{"en":"tension","vi":"thế căng (giữa các Tốt)","note":"Hai Tốt đối mặt nhau, chưa bên nào ăn. Giữ căng để buộc đối thủ phải quyết trước; \"release the tension\" = tự đổi trước, thường là nhượng bộ."},{"en":"break","vi":"nước phá","note":"Đẩy một Tốt để mở cột hoặc mở đường chéo. Ví dụ: \"the ...d5 break\"."},{"en":"penetrate / invasion","vi":"thọc vào / cuộc xâm nhập","note":"Đưa Xe (tàn cuộc thì cả Vua) vào hàng hoặc ô sâu trong sân địch."},{"en":"pawn structure","vi":"cấu trúc Tốt","note":"Hình dàn Tốt. Nó quyết định kế hoạch của cả hai bên, vì Tốt là quân không lùi được."},{"en":"closed / open position","vi":"thế đóng / thế mở","note":"Thế đóng (Tốt chốt vào nhau) thì Mã hơn Tượng; thế mở thì Tượng và Xe mạnh lên."}]},{"name":"B3. Đòn chiến thuật — tên gọi của các cú đòn","items":[{"en":"pin","vi":"ghim","note":"Quân bị ghim không đi được vì sau lưng nó là quân to hơn. Ghim vào Vua thì cấm đi hẳn (absolute pin); ghim vào Hậu thì đi vẫn được, chỉ là lỗ."},{"en":"fork","vi":"đòn đôi (chĩa đôi)","note":"Một quân đe dọa hai thứ cùng lúc, đỡ được cái này thì mất cái kia. Mã và Tốt làm đòn này hay nhất."},{"en":"skewer","vi":"đòn xiên","note":"Ngược với ghim: quân TO đứng trước bị đe, nó né đi thì mất quân đứng sau nó trên cùng đường."},{"en":"discovered check","vi":"chiếu mở","note":"Đi một quân để lộ đường chiếu của quân đứng sau nó. Sức mạnh nằm ở chỗ quân vừa đi được đi tự do — đối thủ đang bận đỡ chiếu."},{"en":"double check","vi":"chiếu đôi","note":"Hai quân cùng chiếu một lúc. Không đỡ được, không ăn được — chỉ còn cách chạy Vua. Đây là lý do chiếu đôi mạnh hơn chiếu mở thường."},{"en":"discovery","vi":"đòn mở","note":"Cùng cơ chế chiếu mở nhưng quân lộ ra chỉ đe dọa một quân, không chiếu Vua."},{"en":"deflection","vi":"đòn kéo quân đi","note":"Ép một quân đang làm nhiệm vụ giữ (giữ ô, giữ quân) phải rời khỏi chỗ đó."},{"en":"decoy","vi":"đòn dụ","note":"Dụ một quân (thường là Vua) VÀO một ô xấu để ăn đòn kế tiếp. Khác deflection: decoy dụ vào một ô, deflection kéo ra khỏi một việc."},{"en":"overload","vi":"quá tải","note":"Một quân bị giao hai việc cùng lúc. Ép nó làm việc này thì việc kia sập."},{"en":"X-ray","vi":"đòn xuyên (tia X)","note":"Quân tác động xuyên qua một quân khác đang đứng chắn giữa — bảo vệ hoặc tấn công \"qua\" quân đó."},{"en":"zwischenzug (in-between move)","vi":"nước xen giữa","note":"Đáng lẽ ăn lại ngay, nhưng chèn vào một nước đe dọa còn mạnh hơn (thường là chiếu) rồi mới ăn. Sách Anh giữ nguyên chữ Đức này."},{"en":"desperado","vi":"quân cảm tử","note":"Quân đằng nào cũng mất; đem nó đi ăn hoặc thí để vớt càng nhiều càng tốt trước khi chết."},{"en":"sacrifice (viết tắt: sac)","vi":"thí quân","note":"Cho không quân để lấy tấn công, nhịp, hoặc thế trận. Khác \"lose a piece\" (mất quân do sai sót) — thí là cố ý."},{"en":"unsound sacrifice","vi":"đòn thí không đứng vững","note":"Thí ẩu, tính không ra: đối thủ chơi đúng thì bên thí chỉ còn thiếu quân. Ngược lại là \"sound\"."},{"en":"combination","vi":"đòn phối hợp","note":"Chuỗi nước ÉP BUỘC, thường có thí, dẫn tới một cái lợi đo được. Đối thủ không có lựa chọn giữa chừng — đó là chỗ khác với \"kế hoạch\"."},{"en":"trap","vi":"cạm bẫy","note":"Nước trông như hớ để dụ đối thủ ăn. \"He fell for the trap\" = đối thủ mắc bẫy."},{"en":"threat","vi":"đe dọa","note":"Nước SẮP tới sẽ ăn quân hoặc chiếu hết nếu không đỡ. \"Threatening ...Nf3\" = đang dọa đi ...Mf3."},{"en":"counter-threat","vi":"đe dọa ngược","note":"Không đỡ đòn của đối thủ, mà dựng một đe dọa mạnh hơn để đối thủ phải quay về đỡ trước."},{"en":"perpetual check","vi":"chiếu vĩnh viễn (chiếu đời đời)","note":"Chiếu liên tục mà đối thủ không thoát được, ván hòa. Là phao cứu sinh của bên đang thua."},{"en":"back-rank mate","vi":"chiếu hết ở hàng cuối","note":"Vua bị chính ba Tốt nhà bịt lối chạy; Xe hoặc Hậu vào hàng cuối là hết. Nước phòng xa gọi là \"luft\" (mở lỗ thở cho Vua)."},{"en":"smothered mate","vi":"chiếu hết bị nghẹt","note":"Vua bị quân NHÀ vây kín bốn phía, Mã nhảy vào chiếu hết. Thường kết thúc bằng thí Hậu để ép quân nhà bịt nốt ô cuối."},{"en":"mating attack","vi":"đòn tấn công chiếu hết","note":"Cuộc tấn công nhắm thẳng vào Vua, không nhắm ăn quân."},{"en":"blow / shot","vi":"cú đòn","note":"Nước mạnh bất ngờ. \"A shot\" hay chỉ một đòn chiến thuật đẹp mà đối thủ không thấy."},{"en":"refutation / refuted","vi":"sự bác bỏ / bị bác bỏ","note":"Chỉ ra bằng biến cụ thể rằng nước hoặc kế hoạch đó sai. Không phải \"phản đối\" — phải có nước đi chứng minh."},{"en":"hanging (piece)","vi":"quân treo","note":"Quân không ai bảo vệ, ăn được ngay. Đừng lẫn với \"hanging pawns\" — đó là cặp Tốt c và d đứng cạnh nhau không có Tốt che, một khái niệm cấu trúc chứ không phải quân bỏ quên."},{"en":"gambit","vi":"gambit — thí Tốt khai cuộc","note":"Cho một Tốt (đôi khi hơn) ngay từ khai cuộc để đổi lấy triển khai nhanh và thế chủ động."}]},{"name":"B4. Giai đoạn ván cờ, đổi quân và bù đắp","items":[{"en":"opening","vi":"khai cuộc","note":"Giai đoạn triển khai quân, thường 10–15 nước đầu."},{"en":"middlegame","vi":"trung cuộc","note":"Cũng viết \"middle game\", \"mid-game\". Giai đoạn của kế hoạch và đòn phối hợp."},{"en":"ending / endgame","vi":"tàn cuộc","note":"Hai chữ này dùng thay nhau. \"A Rook ending\" = tàn cuộc Xe."},{"en":"transition","vi":"chuyển giai đoạn","note":"Bước từ trung cuộc sang tàn cuộc. Chỗ hay quyết định ván cờ: đổi đúng quân thì thắng, đổi sai thì hòa."},{"en":"transposition / transposes","vi":"chuyển hóa (về một biến khác)","note":"Đi thứ tự nước khác nhưng ra đúng thế cờ của một khai cuộc khác. \"Transposes into the Sicilian\" = chuyển thành thế Sicilian."},{"en":"simplify / simplification","vi":"đơn giản hóa","note":"Đổi bớt quân. Bên ĐANG HƠN đơn giản hóa để dễ thắng; bên đang chật hoặc đang bị tấn công đơn giản hóa để thoát."},{"en":"liquidate","vi":"thanh lý, đổi sạch","note":"Đổi hàng loạt để dứt điểm một tình huống — thường là đổi hết quân về một tàn cuộc đã biết chắc kết quả."},{"en":"exchange (v.) / trade","vi":"đổi quân","note":"\"Exchange Queens\" = đổi Hậu. Chú ý: động từ này KHÁC hẳn danh từ \"the exchange\" (chất) ở nhóm dưới."},{"en":"a pawn (an exchange) down / up","vi":"thiếu một Tốt (thiếu chất) / hơn một Tốt (hơn chất)","note":"\"Down\" là bên ít hơn, \"up\" là bên nhiều hơn. \"A piece down\" = thiếu hẳn một quân nhẹ, nặng hơn thiếu chất nhiều."},{"en":"material","vi":"lực lượng quân","note":"KHÔNG phải \"vật chất\". Là tổng quân trên bàn tính theo giá trị. \"Material advantage\" = hơn quân; \"material deficit\" = thiếu quân."},{"en":"compensation","vi":"sự bù đắp","note":"Cái mình nhận lại khi THIẾU quân: thế chủ động, triển khai nhanh hơn, Vua địch hở, cột mở, Tốt thông. \"Enough compensation\" = bù đủ, coi như cân bằng dù đang thiếu quân — không có nghĩa là được đền quân."},{"en":"technique","vi":"kỹ thuật (khâu quy đổi ưu thế)","note":"\"The rest is a matter of technique\" = phần còn lại chỉ là chuyển ưu thế thành thắng, không còn gì phải nghĩ."}]},{"name":"B5. Gọi tên quân theo cách người chú giải nói","items":[{"en":"the two Bishops / the Bishop pair","vi":"cặp Tượng","note":"Có đủ hai Tượng trong khi đối thủ chỉ còn một (hoặc có Mã). Là một ưu thế lâu dài, mạnh dần lên khi bàn cờ mở ra."},{"en":"bad Bishop","vi":"Tượng xấu","note":"Tượng bị chính dàn Tốt của mình chắn đường, vì Tốt đứng cùng màu ô với nó. Không phải \"nước đi tồi\"."},{"en":"good Knight (vs bad Bishop)","vi":"Mã tốt (so với Tượng xấu)","note":"Thế đóng, Mã có tiền đồn vững thì mạnh hơn hẳn một Tượng bị Tốt nhà bịt."},{"en":"minor pieces","vi":"quân nhẹ (Mã và Tượng)","note":"\"Minor\" ở đây là NHẸ, không phải \"phụ, không quan trọng\"."},{"en":"heavy pieces / major pieces","vi":"quân nặng (Xe và Hậu)","note":"\"A heavy-piece ending\" = tàn cuộc chỉ còn Xe, Hậu và Tốt."},{"en":"the exchange","vi":"chất (chênh lệch Xe với quân nhẹ)","note":"Đây là chỗ dễ nhầm nhất trong sách cờ tiếng Anh. \"Win the exchange\" = ĂN ĐƯỢC CHẤT, tức đổi quân nhẹ của mình lấy Xe của địch — KHÔNG phải \"đổi quân\". \"Exchange pieces\" mới là đổi quân. \"Sacrifice the exchange\" = thí chất (cho Xe, lấy về Mã hoặc Tượng)."},{"en":"opposite-colored Bishops","vi":"Tượng khác màu ô","note":"Mỗi bên còn một Tượng nhưng đi trên hai màu ô khác nhau, không bao giờ gặp nhau. Ở tàn cuộc thì rất dễ hòa dù hơn Tốt; ở trung cuộc còn Hậu Xe thì lại giúp bên TẤN CÔNG."}]}]},{"title":"Phần C — Lối nói trong chú giải cờ vua và thành ngữ trong tiêu đề chương","intro":"Sách cờ tiếng Anh không viết bằng thứ tiếng Anh của lớp học: nó có một bộ động từ riêng, một lối viết câu giả định rất gọn, và những tiêu đề chương mượn thành ngữ, câu Kinh Thánh hay điển tích văn học. Phần này gom lại ba thứ đó — nghĩa của chúng và cách chúng xuất hiện trong câu — để bạn đọc chú giải mà không phải đoán.","groups":[{"name":"C1. Động từ và cụm hay gặp trong chú giải","items":[{"en":"threatens","vi":"đe dọa (sẽ làm gì đó ở nước sau)","note":"“White threatens 15 Nd5, winning the exchange.” = Trắng dọa 15 ♘d5, thắng chất. Danh từ là <b>the threat</b> — “the threat is 15 Nd5”: đòn dọa là 15 ♘d5."},{"en":"prevents","vi":"ngăn, không cho xảy ra","note":"“13 a4 prevents ...b5.” = 13 a4 chặn không cho Đen đi ...b5. Dạng danh từ ít gặp hơn: <b>prevention</b>."},{"en":"forces","vi":"ép, buộc (đối thủ chỉ còn một cách)","note":"“16 Rxf6! forces mate in three.” = 16 ♖xf6! ép chiếu hết trong ba nước. Bị động: <b>White is forced to play 17 Kh1</b> = Trắng buộc phải đi 17 ♔h1."},{"en":"forcing","vi":"mang tính ép buộc (không cho đối thủ chọn)","note":"“A forcing line” = một biến ép buộc — chuỗi chiếu, ăn quân, dọa mạnh mà đối thủ chỉ có một cách trả lời."},{"en":"holds","vi":"giữ được, trụ được (thường là giữ hòa, hoặc giữ vững thế cờ)","note":"“The ending holds for Black.” = Tàn cuộc này Đen giữ được (hòa). “15 Qe2 holds everything.” = 15 ♕e2 giữ được mọi thứ. Đừng dịch máy móc thành “nắm giữ”."},{"en":"leads to","vi":"dẫn tới (một loại thế cờ, một kết cục)","note":"“17...Qxa2 leads to a lost ending.” = 17...♕xa2 dẫn tới một tàn cuộc thua. Cùng họ: <b>results in</b>, <b>ends in</b>."},{"en":"gives","vi":"cho, tạo ra (thường là đưa cái gì đó cho đối thủ)","note":"“This gives White a strong initiative.” = Nước này trao cho Trắng thế chủ động mạnh. Khác hẳn <b>gives up</b> = từ bỏ, nhường (“gives up the two Bishops” = chịu mất cặp Tượng)."},{"en":"meets","vi":"đối lại, đáp lại (một nước đi)","note":"“White meets 12...b5 with 13 a4.” = Trắng đáp lại 12...b5 bằng 13 a4. Công thức: <b>meet X with Y</b>."},{"en":"is met by","vi":"bị đáp lại bằng (dạng bị động của meet — rất hay gặp)","note":"“12...b5 is met by 13 a4!” = 12...b5 vấp phải 13 a4! Người Việt hay đọc nhầm chủ ngữ: chủ ngữ là NƯỚC ĐI bị đáp lại, không phải người đi."},{"en":"answers","vi":"trả lời, đáp lại","note":"“Black answers 14 Bg5 with ...h6.” = Đen đáp lại 14 ♗g5 bằng ...h6. Bị động: <b>is answered by</b>, nghĩa như <i>is met by</i>."},{"en":"refutes","vi":"bác bỏ, phá được (chứng minh nước kia sai)","note":"“18 Nd5! refutes the whole idea.” = 18 ♘d5! phá tan toàn bộ ý đồ đó. Danh từ <b>refutation</b> = đòn phá, cách bác bỏ."},{"en":"fails","vi":"không ăn thua, hỏng","note":"“13 Nd5 fails to 13...Bxd5.” = 13 ♘d5 hỏng vì 13...♗xd5. Chú ý <b>fails to</b> ở đây nghĩa là “thua trước nước…”, không phải “không làm được”."},{"en":"wins a piece","vi":"thắng một quân (Mã hoặc Tượng trở lên)","note":"“20 Bxh7+ wins a piece.” Trong tiếng Anh cờ, <b>piece</b> thường chỉ Mã/Tượng/Xe/Hậu, không tính Tốt."},{"en":"wins the exchange","vi":"thắng chất (đổi Mã hoặc Tượng lấy Xe của đối thủ)","note":"“21 Nc7 wins the exchange.” Ngược lại: <b>sacrifices the exchange</b> = thí chất; <b>the exchange down</b> = kém chất."},{"en":"drops a pawn","vi":"để mất tốt (do sơ suất, không phải thí)","note":"“15...Rb8? drops a pawn.” <b>Drop</b> gốc là “đánh rơi” — hàm ý mất không, khác với <b>sacrifices</b> (thí có tính toán)."},{"en":"loses a tempo","vi":"mất một nhịp (đi thừa một nước)","note":"“12 Bd3 loses a tempo, since the Bishop must move again.” Ngược lại: <b>gains a tempo</b> = ăn được một nhịp."},{"en":"allows","vi":"để cho, cho phép (đối thủ làm được điều tốt cho họ)","note":"“14 Bd3? allows 14...Nxe4.” = 14 ♗d3? để cho Đen đi 14...♘xe4. Trong chú giải, <b>allows</b> gần như luôn mang nghĩa xấu — nó là một lời chê."},{"en":"permits","vi":"cho phép (nghĩa như allows, giọng sách vở hơn)","note":"“This permits Black to free his game.” = Nước này cho phép Đen gỡ thế bí."},{"en":"obtains","vi":"giành được, có được","note":"“Black obtains good counterplay.” = Đen có phản công tốt. Gần nghĩa: <b>gets</b>, <b>achieves</b>."},{"en":"retains","vi":"giữ lại, vẫn còn (cái mình đang có)","note":"“White retains the two Bishops.” = Trắng vẫn giữ cặp Tượng. Đây là GIỮ, chưa từng mất."},{"en":"regains","vi":"lấy lại, gỡ lại (cái đã mất)","note":"“23 Rxa7 regains the pawn.” = 23 ♖xa7 gỡ lại quân tốt. Phân biệt với <i>retains</i>: <b>regain</b> = mất rồi mới lấy lại."},{"en":"keeps","vi":"giữ","note":"“This keeps the initiative.” = Nước này giữ thế chủ động. <b>keeps out</b> = giữ không cho vào: “14 f3 keeps the Knight out of e4.”"},{"en":"releases","vi":"buông ra, giải tỏa (sức ép, thế căng)","note":"“12 dxe5 releases the tension in the center.” = 12 dxe5 giải tỏa thế căng ở trung tâm. <b>Tension</b> = thế căng giữa các tốt chưa đổi nhau; buông sớm thường bị chê."},{"en":"sidesteps","vi":"né sang bên, tránh khéo","note":"“11 Kh1 sidesteps the pin.” = 11 ♔h1 né được đòn ghim. Gốc: bước sang một bên để tránh cú đánh."},{"en":"breaks through","vi":"chọc thủng, phá vỡ (hàng phòng ngự)","note":"“White breaks through on the K-side.” = Trắng chọc thủng cánh Vua. Danh từ <b>breakthrough</b> = đòn chọc thủng."},{"en":"break","vi":"đòn phá (đẩy tốt để mở thế) — danh từ","note":"“Black prepares the ...d5 break.” = Đen chuẩn bị đòn phá ...d5. Ở nghĩa này <b>break</b> không phải “làm gãy” mà là nước đẩy tốt mở toang cấu trúc."},{"en":"seizes","vi":"chiếm lấy, giành lấy (nhanh và dứt khoát)","note":"“Black seizes the open file.” = Đen chiếm ngay cột mở. Mạnh hơn <i>takes</i> — hàm ý ra tay trước, không cho đối thủ kịp."},{"en":"blunts","vi":"làm cùn, làm mất sức","note":"“13...e5 blunts the Bishop on b2.” = 13...e5 làm cùn con Tượng ở b2. Gốc: <b>blunt</b> = cùn, trái nghĩa với <b>sharp</b> = sắc."},{"en":"stems","vi":"chặn đứng (một đợt tấn công, một dòng chảy)","note":"“17 f4 stems the attack.” = 17 f4 chặn đứng đợt tấn công. Gốc: đắp chặn dòng nước."},{"en":"revives","vi":"làm sống lại, hồi sinh","note":"“26 h4! revives the attack.” = 26 h4! làm sống lại đòn tấn công tưởng đã tắt."},{"en":"exploits","vi":"khai thác (điểm yếu của đối thủ)","note":"“White exploits the weak dark squares.” = Trắng khai thác các ô đen yếu."},{"en":"penetrates","vi":"thâm nhập, lọt vào (trận địa đối phương)","note":"“The Rook penetrates to the seventh rank.” = Xe lọt xuống hàng bảy. Danh từ: <b>penetration</b>."},{"en":"consolidates","vi":"củng cố (sau khi ăn được quân thì ổn định lại)","note":"“White consolidates and wins.” = Trắng củng cố rồi thắng. Đây là việc phải làm sau khi hơn quân: gỡ ghim, đưa Vua an toàn, đổi bớt quân."},{"en":"equalizes","vi":"cân bằng được thế trận","note":"“Black equalizes comfortably.” Danh từ <b>equality</b> = thế cân bằng."},{"en":"transposes","vi":"chuyển hóa sang (một biến hoặc khai cuộc khác)","note":"“The game transposes into a Najdorf.” = Ván cờ chuyển hóa thành một Najdorf. Danh từ <b>transposition</b> = sự chuyển hóa thứ tự nước đi."},{"en":"proves","vi":"tỏ ra là, hóa ra là","note":"“12 Ne2 proves too slow.” = 12 ♘e2 hóa ra quá chậm. Không phải “chứng minh” theo nghĩa toán học."},{"en":"overlooks","vi":"bỏ sót, không nhìn thấy","note":"“Black overlooked 19 Qh5!” = Đen không nhìn thấy 19 ♕h5! Danh từ <b>an oversight</b> = một sơ suất (KHÔNG phải “sự giám sát”)."},{"en":"misses","vi":"bỏ lỡ (cơ hội), không thấy","note":"“White misses a win with 24 Rd7.” = Trắng bỏ lỡ đường thắng bằng 24 ♖d7."},{"en":"offers","vi":"chào, đề nghị (thí quân, hoặc hòa)","note":"“White offers a pawn for the initiative.” = Trắng chào một tốt để lấy thế chủ động. “Black offered a draw.” = Đen đề nghị hòa."},{"en":"declines","vi":"từ chối (nước thí, lời đề nghị hòa)","note":"“Black declines the gambit.” Ngược lại: <b>accepts</b> = nhận. Tên khai cuộc <i>Queen's Gambit Declined</i> chính là chữ này."},{"en":"hangs","vi":"bị treo (không ai bảo vệ, ăn được ngay)","note":"“The Knight on b5 hangs.” = Con Mã ở b5 đang treo. Tính từ <b>hanging</b>: “a hanging piece” = quân bị treo."},{"en":"throws away","vi":"vứt đi, làm mất trắng (lợi thế)","note":"“28...Qb6? throws away the win.” = 28...♕b6? vứt đi đường thắng."}]},{"name":"C2. Câu điều kiện, giả định và các lối nói dẫn biến","items":[{"en":"If 13...Nd7 14 Bf4 wins","vi":"Nếu 13...♘d7 thì 14 ♗f4 thắng","note":"Câu điều kiện rút gọn hết mức: không có <i>then</i>, không có dấu phẩy. Cứ đọc là “nếu … thì …”. Chủ ngữ của <i>wins</i> là chính nước 14 ♗f4, không phải người chơi."},{"en":"wins / draws / loses đứng một mình cuối biến","vi":"thắng / hòa / thua","note":"“…14 Bf4 wins.” Sau một chuỗi nước, một chữ duy nhất khép lại để chấm điểm cả biến. Hiểu là “tới đây là thắng rồi”, không cần đi tiếp."},{"en":"Better was 13 Bf4","vi":"Hay hơn là 13 ♗f4 (lẽ ra nên đi thế)","note":"Đảo ngữ: đúng thứ tự thường là “13 Bf4 was better”. Đưa <i>Better</i> lên đầu là lối viết quen của sách cờ. Gặp cả <b>Stronger was…</b>, <b>Safer was…</b>, <b>Necessary was…</b>."},{"en":"Instead of 15 Rd1, White should play 15 a4","vi":"Thay vì 15 ♖d1, Trắng nên đi 15 a4","note":"<b>Instead of X</b> = thay cho X. Đứng riêng một mình, <b>Instead,</b> ở đầu câu nghĩa là “đáng lẽ phải như sau”: “Instead, 15 a4 was correct.”"},{"en":"Had Black played 13...Nd7…","vi":"Nếu Đen đã đi 13...♘d7 thì…","note":"Đây là “If Black had played…” bị đảo ngữ, bỏ chữ <i>If</i>. Rất hay gặp và rất hay làm người Việt đọc hụt, vì câu mở đầu bằng <b>Had</b> trông như câu hỏi. Cứ thấy <b>Had + chủ ngữ + V3</b> ở đầu câu thì dịch là “Nếu … đã …”."},{"en":"White should have played 14 a4","vi":"Trắng lẽ ra phải đi 14 a4","note":"<b>should have + V3</b> = lẽ ra đã phải (nhưng đã không). Luôn hàm ý trách móc. Phủ định: <b>should not have taken</b> = lẽ ra không nên ăn."},{"en":"would have been","vi":"hẳn đã là (nhưng thực tế thì không)","note":"“14...Qb6 would have been stronger.” = 14...♕b6 hẳn đã mạnh hơn. Đây là vế kết của câu giả định về quá khứ, thường đi cùng một câu <i>Had…</i> hoặc <i>If…had…</i> đứng trước."},{"en":"would have won / would win","vi":"hẳn đã thắng / sẽ thắng","note":"“Had he played 22 Rd7, White would have won.” Nếu chỉ nói về một biến chưa xảy ra ở thì hiện tại thì dùng <b>would win</b>: “22 Rd7 would win.”"},{"en":"could have / might have","vi":"có thể đã (nhẹ hơn should have)","note":"<b>could have drawn</b> = đáng ra có thể hòa (khả năng có, nhưng không nhất thiết bắt buộc). <b>might have</b> còn dè dặt hơn nữa."},{"en":"The text move","vi":"nước đi thực tế trong ván (nước in trong biên bản)","note":"Đây là chỗ người Việt vấp nhiều nhất. <b>Text</b> ở đây KHÔNG phải “tin nhắn” hay “văn bản” — nó là biên bản ván cờ đang in trên trang sách. <b>The text move</b> = nước mà kỳ thủ đã thực sự đi, để đối lại với các nước chỉ có trong phần phân tích."},{"en":"The text","vi":"nước thực đi (nói tắt của the text move)","note":"“The text is better than 14 Rd1.” = Nước thực đi hay hơn 14 ♖d1. Còn gặp <b>the game continuation</b> cũng nghĩa như vậy."},{"en":"the alternative","vi":"phương án còn lại, nước thay thế","note":"“The alternative was 14 Bf4.” = Phương án còn lại là 14 ♗f4. Số nhiều <b>alternatives</b> = các lựa chọn khác."},{"en":"with the idea of","vi":"với ý đồ…, nhằm để…","note":"“12 a4, with the idea of a5.” = 12 a4, ý đồ là a5. Cùng nghĩa: <b>with the intention of</b>, <b>intending</b>. Sau <i>of</i> phải là danh từ hoặc V-ing."},{"en":"with the point that…","vi":"điểm mấu chốt là…","note":"“15 Nd5!, with the point that 15...exd5 16 exd5 traps the Bishop.” = 15 ♘d5!, mấu chốt là 15...exd5 16 exd5 nhốt được Tượng. <b>The point</b> = ý ẩn của nước đi."},{"en":"in view of","vi":"do, xét thấy","note":"“Black resigned in view of 30 Qh8+.” = Đen xin thua vì đã thấy 30 ♕h8+. Nghĩa là “đứng trước sự thật là…”, không phải “theo quan điểm của”."},{"en":"on account of","vi":"bởi vì, do","note":"“13 Nd5 fails on account of 13...Bxd5.” = 13 ♘d5 hỏng vì 13...♗xd5. Đồng nghĩa với <b>because of</b>, giọng sách vở hơn."},{"en":"in reply to","vi":"để đáp lại","note":"“In reply to 12...b5, White has 13 a4.” = Đáp lại 12...b5, Trắng có 13 a4."},{"en":"and not 14 Rd1 because…","vi":"chứ không phải 14 ♖d1, vì…","note":"Công thức chỉnh lại một nước dễ nhầm: nêu nước đúng trước, rồi <b>and not</b> + nước sai + lý do."},{"en":"Not 14 Rd1?","vi":"Không được đi 14 ♖d1","note":"Một chữ <b>Not</b> mở đầu là lời cấm gọn nhất: nước này thua hoặc hỏng, phần sau sẽ chỉ ra vì sao."},{"en":"There is nothing better","vi":"không còn gì hay hơn","note":"Ý là nước vừa đi tuy dở nhưng vẫn là cách tốt nhất còn lại. Gần nghĩa: <b>forced</b> = bị ép, không có lựa chọn."},{"en":"Black must not play 15...Nxe4","vi":"Đen không được phép đi 15...♘xe4","note":"Phân biệt kỹ: <b>must not</b> = cấm, đi là hỏng. <b>need not</b> = không cần thiết phải (đi cũng được, nhưng không bắt buộc). Hai cái này trái hẳn nhau."},{"en":"with compensation","vi":"có đền bù (kém quân nhưng đổi lấy thứ khác)","note":"“White is a pawn down but with compensation.” = Trắng kém một tốt nhưng có đền bù (thế chủ động, cột mở, Vua đối phương hở). Còn gặp <b>with sufficient compensation</b> = đền bù đủ."},{"en":"unclear","vi":"chưa rõ, không phán được","note":"Tác giả cố tình không chấm điểm thế cờ. Thấy chữ này thì đừng cố suy ra ai hơn — chính người viết cũng không kết luận."},{"en":"respectively","vi":"theo thứ tự lần lượt","note":"“14 Rd1 and 14 Bf4 answer 13...Nd7 and 13...Nc6 respectively.” = 14 ♖d1 và 14 ♗f4 lần lượt đáp lại 13...♘d7 và 13...♘c6. Phải ghép cặp theo đúng thứ tự đã liệt kê."}]},{"name":"C3. Thành ngữ và điển cố trong tiêu đề chương","items":[{"en":"Slaying the dragon","vi":"Giết rồng","note":"Mô-típ cổ trong truyện phương Tây: người hùng hạ con rồng canh kho báu (nổi tiếng nhất là Thánh George giết rồng). Nghĩa bóng: hạ gục một đối thủ đáng sợ, hoặc dẹp bỏ nỗi sợ lớn nhất của mình. Trong sách cờ còn là chơi chữ, vì <i>Dragon</i> là tên một biến của Phòng thủ Sicilian."},{"en":"Bear hug","vi":"Cái ôm gấu — ôm ghì thật chặt","note":"Gấu ôm con mồi thì siết chứ không vuốt ve. Nghĩa bóng: kẹp chặt, ép cứng đến ngạt thở. Trong kinh doanh, <i>bear hug</i> còn là lời chào mua doanh nghiệp cao đến mức khó từ chối."},{"en":"Tact and tactics","vi":"Sự khéo léo và chiến thuật","note":"Chơi chữ dựa trên hai từ nhìn giống nhau mà nghĩa khác hẳn. <b>Tact</b> = sự tế nhị, biết cư xử cho người khác khỏi mất lòng. <b>Tactics</b> = chiến thuật, các đòn ngắn hạn. Cả hai cùng gốc Latin <i>tangere</i> (chạm), nhưng ngày nay không liên quan nhau về nghĩa."},{"en":"Pride goeth","vi":"Kiêu ngạo thì rồi sẽ…","note":"Trích cụt câu Kinh Thánh (Châm Ngôn 16:18, bản King James): “Pride goeth before destruction, and an haughty spirit before a fall” — Kiêu ngạo đi trước sự sụp đổ. Người Anh hay nói gọn “Pride goes before a fall”. <b>Goeth</b> là dạng cổ của <i>goes</i>; bỏ lửng nửa câu là cách nhắc khéo “rồi sẽ ngã đau cho xem”."},{"en":"Meat and potatoes","vi":"Thịt với khoai — phần cốt lõi, món ăn chắc bụng","note":"Bữa ăn bình dân Mỹ: thịt và khoai tây, không hoa mỹ nhưng no và chắc. Nghĩa bóng: phần căn bản, thực chất, không màu mè. <b>A meat-and-potatoes man</b> = người thích cái giản dị, thiết thực."},{"en":"Betwixt the cup and the lip","vi":"Giữa cái ly và bờ môi","note":"Rút từ tục ngữ Anh cổ “There's many a slip 'twixt the cup and the lip” — từ ly rượu tới miệng vẫn còn chỗ để sẩy tay. Nghĩa: chưa tới đích thì chưa chắc gì cả, sắp xong vẫn có thể hỏng. <b>Betwixt</b> là dạng cổ của <i>between</i>."},{"en":"Milking the cow","vi":"Vắt sữa bò","note":"<b>To milk</b> = vắt sữa; nghĩa bóng là khai thác một nguồn lợi đến cạn kiệt, vắt cho bằng hết. Thường mang giọng hơi giễu: cứ moi mãi một thứ."},{"en":"Unheard melodies","vi":"Những giai điệu không nghe thấy","note":"Trích thơ John Keats, bài “Ode on a Grecian Urn” (1819): “Heard melodies are sweet, but those unheard / Are sweeter” — Khúc nhạc nghe được thì ngọt, khúc không nghe được còn ngọt hơn. Ý: cái chỉ có trong tưởng tượng, cái đã không xảy ra, lại đẹp hơn cái có thật."},{"en":"Castling into it","vi":"Nhập thành ngay vào chỗ chết","note":"Cụm quen trong tiếng Anh cờ vua. <b>To be in it</b> (tiếng lóng) = đang gặp rắc rối to; <i>castle into it</i> nghĩa là tự tay đưa Vua vào đúng chỗ đối phương đang chờ. Nhập thành vốn để giấu Vua, ở đây lại thành nộp Vua."},{"en":"Too many cooks","vi":"Quá nhiều đầu bếp","note":"Nói tắt tục ngữ “Too many cooks spoil the broth” — lắm đầu bếp thì hỏng nồi canh. Nghĩa: nhiều người cùng nhúng tay vào một việc thì việc hỏng. Người Việt hay ví “lắm thầy thối ma”."},{"en":"A whopper","vi":"Một thứ to khủng khiếp","note":"Tiếng lóng: cái gì đó lớn quá cỡ. <b>Whopper</b> còn có nghĩa thứ hai rất hay dùng là “một lời nói dối tày trời”. Ngữ cảnh quyết định là to hay là dối."},{"en":"A very near miss","vi":"Suýt nữa thì trúng","note":"Bẫy dịch: <b>near miss</b> dịch từng chữ là “gần trượt”, nhưng nghĩa thật là <i>suýt trúng</i>, <i>suýt xảy ra</i>. Gốc từ ngôn ngữ hàng không và quân sự: hai máy bay suýt đâm nhau, quả đạn nổ sát bên."},{"en":"Old wine in a new bottle","vi":"Rượu cũ trong bình mới","note":"Đảo ngược một hình ảnh trong Kinh Thánh (Matthew 9:17: không ai đổ rượu mới vào bình da cũ). Câu đã thành thành ngữ thông dụng: cùng một thứ cũ rích, chỉ thay lớp vỏ ngoài cho ra vẻ mới. Người Việt nói “bình mới rượu cũ”."},{"en":"A long voyage home","vi":"Chuyến trở về nhà dài dằng dặc","note":"Gợi tới hành trình hồi hương mười năm của Odysseus trong sử thi Hy Lạp. Cũng là tên một vở kịch ngắn của Eugene O'Neill (1917). Nghĩa: đường về đúng chỗ mình phải tới thì dài và vòng vèo hơn tưởng."},{"en":"No holds barred","vi":"Không cấm đòn nào","note":"Gốc từ đấu vật: <b>hold</b> = miếng khóa, <b>barred</b> = bị cấm. Trận “no holds barred” là trận không có luật cấm miếng nào. Nghĩa bóng: đánh hết mình, không giữ kẽ, không kiêng nể gì."},{"en":"When the Maroczy didn’t bind","vi":"Khi thế bó Maroczy không bó được","note":"Chơi chữ trên thuật ngữ cờ <i>Maroczy Bind</i> (thế bó Maroczy, cấu trúc tốt c4 + e4 khóa chặt ô d5), đặt theo tên kỳ thủ Hungary Géza Maróczy. <b>Bind</b> vừa là danh từ “thế bó”, vừa là động từ “trói lại” — câu tiêu đề dùng nó như động từ."},{"en":"Sheer pyrotechnics","vi":"Thuần túy là pháo hoa","note":"<b>Pyrotechnics</b> gốc Hy Lạp <i>pyr</i> (lửa) + <i>tekhne</i> (kỹ thuật) = nghệ thuật làm pháo hoa; nghĩa bóng là màn phô diễn rực rỡ, chói mắt. <b>Sheer</b> = thuần túy, đúng là, không lẫn gì khác."},{"en":"A peccable draw","vi":"Một ván hòa đầy tì vết","note":"<b>Peccable</b> = có thể phạm lỗi, không hoàn hảo — từ hiếm, gốc Latin <i>peccare</i> (phạm tội). Người Anh gần như chỉ dùng dạng phủ định <b>impeccable</b> = hoàn hảo, không chê vào đâu được. Bỏ chữ <i>im-</i> đi là một cách đùa chữ."},{"en":"Hoist with his own petard","vi":"Bị chính quả bom của mình thổi bay lên","note":"Trích Shakespeare, kịch <i>Hamlet</i> (hồi 3, cảnh 4). <b>Petard</b> là quả bom nhỏ thời xưa dùng phá cổng thành; <b>hoist</b> = bị hất tung lên. Kẻ đặt bom bị chính quả bom của mình hất bay. Nghĩa: gậy ông đập lưng ông."},{"en":"The sincerest form of flattery","vi":"Hình thức tâng bốc chân thành nhất","note":"Nói tắt câu “Imitation is the sincerest form of flattery” — bắt chước là cách khen ngợi thật lòng nhất, thường được gán cho nhà văn Anh Charles Caleb Colton (đầu thế kỷ 19). Ý: ai đó sao chép cách làm của bạn tức là họ đang thừa nhận bạn giỏi."},{"en":"The moral victor","vi":"Người thắng về mặt tinh thần","note":"Từ thành ngữ <b>moral victory</b>: thua về kết quả nhưng thắng về lẽ phải, về sự nể trọng, về cách chơi. <b>Moral</b> ở đây không phải “đạo đức” theo nghĩa hẹp mà là “thuộc về tinh thần, về danh dự”."},{"en":"The drawing master","vi":"Bậc thầy cầm hòa","note":"Chơi chữ. Trong tiếng Anh thường, <b>a drawing master</b> là thầy dạy vẽ (<i>drawing</i> = bức vẽ). Trong cờ, <b>draw</b> = ván hòa, nên cụm này thành “bậc thầy về chuyện cầm hòa”."},{"en":"Hanging pawns unhung","vi":"Tốt treo mà không bị treo cổ","note":"Chơi chữ trên hai nghĩa của <b>hang</b>. <i>Hanging pawns</i> là thuật ngữ cờ: cặp tốt liền nhau đứng trên hai cột mở, không có tốt nào che chở. Còn <i>to hang</i> cũng là “treo cổ”, nên <b>unhung</b> = chưa bị đem treo cổ, tức là thoát nạn."},{"en":"A brilliant cadenza","vi":"Một khúc cadenza rực rỡ","note":"<b>Cadenza</b> là từ tiếng Ý trong âm nhạc: đoạn độc tấu ngẫu hứng, phô hết kỹ thuật của người chơi, thường đặt gần cuối một chương concerto trong khi dàn nhạc im lặng. Nghĩa bóng: màn solo tài hoa, hoa mỹ, ai cũng phải nhìn."},{"en":"Gaston and Alphonse","vi":"Gaston với Alphonse","note":"Hai nhân vật trong bộ tranh vui Mỹ “Alphonse and Gaston” của Frederick Burr Opper (1901): hai ông người Pháp lịch sự quá đà, cứ nhường nhau mãi ở cửa — “After you, my dear Alphonse.” Thành ngữ chỉ cảnh hai bên khách sáo, ai cũng chờ người kia đi trước nên chẳng ai đi cả."},{"en":"The Indian sign?","vi":"Bùa yểm?","note":"Thành ngữ Mỹ cũ: <b>to have the Indian sign on someone</b> = nắm thóp ai đó, khắc chế được người ta như thể đã yểm bùa. Gốc từ niềm tin dân gian thế kỷ 19 rằng người da đỏ có thể đặt một dấu phù chú lên kẻ khác. Dùng khi một người cứ gặp một đối thủ nhất định là thua, không giải thích nổi tại sao."},{"en":"Tour de force","vi":"Kỳ công, màn trổ tài","note":"Cụm tiếng Pháp mượn nguyên vào tiếng Anh, nghĩa đen là “cú ra đòn bằng sức”. Nghĩa dùng: một tác phẩm hay màn trình diễn thể hiện tài nghệ ở mức khiến người ta phải sững lại. Đọc gần như tiếng Pháp: /tuơ đơ pho:s/."},{"en":"Peekaboo strategy","vi":"Chiến lược ú òa","note":"<b>Peekaboo</b> là trò chơi với trẻ nhỏ: người lớn lấy tay che mặt rồi bỏ ra, kêu “ú òa”. Nghĩa bóng: cứ thò ra rồi lại thụt vào, ló mặt rồi biến mất, làm đối phương không đoán được."},{"en":"Najdorf’s night off from the Najdorf","vi":"Đêm Najdorf nghỉ chơi biến Najdorf","note":"<b>A night off</b> = một tối được nghỉ, không phải làm việc thường ngày. Câu chơi chữ trên hai nghĩa của cùng một cái tên: Najdorf là kỳ thủ Miguel Najdorf, và Najdorf cũng là tên biến khai cuộc đặt theo tên ông."},{"en":"Change of pace","vi":"Đổi nhịp","note":"<b>Pace</b> = nhịp độ, tốc độ. Gốc từ thể thao (bóng chày: quả ném <i>change-up</i> chậm hẳn lại để đánh lừa người đập). Nghĩa: đổi cách làm cho khác đi, thường là chậm lại, để đối phương hụt nhịp hoặc để đỡ đơn điệu."},{"en":"The erring Bishop","vi":"Con Tượng đi lạc","note":"<b>To err</b> = phạm sai lầm, đi trệch đường (gốc Latin <i>errare</i>, cùng gốc với <i>error</i>). Ai học tiếng Anh cũng gặp câu “To err is human” — sai lầm là chuyện con người, câu của nhà thơ Alexander Pope. <b>Erring</b> = đang lầm lạc."},{"en":"Playing by ear","vi":"Chơi theo tai","note":"Gốc từ âm nhạc: chơi nhạc bằng tai, không cần bản nhạc trước mặt. Nghĩa bóng, thường ở dạng <b>play it by ear</b>: không có kế hoạch sẵn, tới đâu tính tới đó, tùy cơ ứng biến."},{"en":"The missing link","vi":"Mắt xích còn thiếu","note":"Gốc từ tranh luận về tiến hóa thế kỷ 19: hóa thạch giả định nối giữa vượn và người mà người ta mãi chưa tìm ra. Nghĩa dùng hằng ngày: mảnh ghép còn thiếu, thiếu nó thì cả chuỗi lập luận không nối liền được."},{"en":"Shock treatment","vi":"Liệu pháp sốc","note":"Gốc y học: cách chữa bệnh tâm thần bằng sốc điện. Nghĩa bóng: biện pháp mạnh, gây choáng, dùng khi cách nhẹ nhàng đã vô hiệu. Đồng nghĩa: <b>shock therapy</b>."},{"en":"Ghosts","vi":"Ma","note":"Trong tiếng Anh cờ vua có cụm quen thuộc <b>seeing ghosts</b> = nhìn đâu cũng thấy đòn của đối thủ, sợ những đe dọa thật ra không tồn tại. Nghĩa rộng hơn: sợ bóng sợ gió, tự dọa mình."},{"en":"Romp","vi":"Cuộc dạo chơi — thắng nhẹ như không","note":"<b>To romp</b> gốc là chạy nhảy nô đùa vô tư. Trong thể thao, <b>a romp</b> = một chiến thắng quá dễ, và <b>to romp home</b> = về đích ung dung, không phải gắng sức."}]}]}];
var KITN=279;
var NOTICE="<b>Cách đọc trang này.</b> Biên bản 60 ván, tên giải, tên khai cuộc và tiêu đề chương lấy từ <i>My 60 Memorable Games</i> (Bobby Fischer, 1969). Sơ đồ <b>dựng lại từ chính nước đi</b> — cả 4.724 nước đã chạy qua bộ luật cờ, 100% hợp lệ, và các sơ đồ đã đối chiếu khớp với bản in. Bình luận tiếng Việt là <b>phân tích riêng của trang này</b>, viết từ thế cờ và kiểm từng khẳng định trên bàn cờ — không phải bản dịch chú giải của Fischer.";
var FOOT="CHESS COACH · FISCHER 60 — build v1 · 2026-09-06<br>60 ván · 4.724 nước đi (đã kiểm hợp lệ) · 252 sơ đồ dựng từ FEN";
</script>
<script>
var PN={'K':'K','Q':'Q','R':'R','B':'B','N':'N','P':'P'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fig(s){return String(s).replace(/[\u2654-\u2659\u265A-\u265F]/g,'<i class="fg">$&</i>')}
function fenBoard(fen,hl){
  var rows=fen.split(' ')[0].split('/'),h='';
  for(var r=0;r<8;r++){
    var f=0;
    for(var i=0;i<rows[r].length;i++){
      var ch=rows[r][i];
      if(ch>='1'&&ch<='8'){var n=+ch;for(var k=0;k<n;k++){h+=sq(r,f,'');f++}}
      else{var w=ch===ch.toUpperCase();h+=sq(r,f,'<svg class="pc"><use href="#pc-'+(w?'w':'b')+PN[ch.toUpperCase()]+'"></use></svg>');f++}
    }
  }
  return '<div class="board">'+h+'</div>';
  function sq(r,f,inner){
    var dark=((r+f)%2)===1;
    var name='abcdefgh'[f]+(8-r);
    var on=hl&&hl.indexOf(name)>=0?' hl':'';
    var co=(f===0?'<span class="cr">'+(8-r)+'</span>':'')+(r===7?'<span class="cf">'+'abcdefgh'[f]+'</span>':'');
    return '<div class="sq '+(dark?'d':'l')+on+'">'+co+inner+'</div>';
  }
}
var STARTFEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

var FILTER='all',Q='',CUR=null,PLY=-1;
var HIDEC=false; try{HIDEC=localStorage.getItem('fischer:hidec')==='1'}catch(e){}
function res3(r){return r==='½-½'?'drw':(r==='1-0'?'w1':'b1')}
function fischerSide(g){return /fischer/i.test(g.w)?'w':'b'}
function outcome(g){
  if(!g.res) return 'unk';
  if(g.res==='½-½') return 'drw';
  var fs=fischerSide(g);
  return (g.res==='1-0')===(fs==='w')?'win':'los';
}
function renderIndex(){
  var list=document.getElementById('glist'),h='',n=0;
  GAMES.forEach(function(g){
    var oc=outcome(g),fs=fischerSide(g);
    if(FILTER==='w'&&fs!=='w')return; if(FILTER==='b'&&fs!=='b')return;
    if((FILTER==='win'||FILTER==='drw'||FILTER==='los')&&oc!==FILTER)return;
    var hay=(g.w+' '+g.b+' '+g.ev+' '+g.op+' '+g.ti+' '+(CM[g.n]&&CM[g.n].ctx||'')).toLowerCase();
    if(Q&&hay.indexOf(Q)<0)return;
    n++;
    var cls=oc==='win'?'win':(oc==='los'?'los':(oc==='drw'?'drw':''));
    h+='<button class="grow '+cls+'" data-g="'+g.n+'">'
      +'<span class="g-n">'+g.n+'</span>'
      +'<span class="g-p">'+nm(g.w)+' – '+nm(g.b)+'</span>'
      +'<span class="g-e">'+esc(cap(g.ev))+'</span>'
      +'<span class="g-o">'+esc(cap(g.op))+'</span>'
      +'<span class="g-r '+cls+'">'+(g.res||'—')+'</span>'
      +'<span class="g-t">'+esc(g.ti)+'</span></button>';
  });
  list.innerHTML=h;
  document.getElementById('cnt').textContent=n+'/'+GAMES.length+' ván';
  list.querySelectorAll('.grow').forEach(function(b){b.addEventListener('click',function(){openGame(+b.dataset.g)})});
}
function nm(s){return /fischer/i.test(s)?'<span class="fs">'+esc(s)+'</span>':esc(s)}
function cap(s){return s.replace(/([A-ZÀ-Ỹ])([A-ZÀ-Ỹ']+)/g,function(m,a,b){return a+b.toLowerCase()})}

function openGame(n){
  CUR=GAMES.find(function(g){return g.n===n});PLY=CUR.mv.length-1;
  document.getElementById('idx').classList.add('off');
  document.getElementById('notice').style.display='none';
  var gv=document.getElementById('gv');gv.classList.add('on');
  gv.innerHTML=gameHTML(CUR);
  bindGame();
  location.hash='#g'+n;
  window.scrollTo(0,0);
}
function closeGame(){
  document.getElementById('gv').classList.remove('on');
  document.getElementById('idx').classList.remove('off');
  document.getElementById('notice').style.display='';
  CUR=null;location.hash='';window.scrollTo(0,0);
}
function gameHTML(g){
  var oc=outcome(g),cls=oc==='win'?'win':(oc==='los'?'los':(oc==='drw'?'drw':''));
  var c=CM[g.n]||{};
  var h='<div class="gv-nav">'
   +'<button class="btn ghost" id="back">← Danh sách 60 ván</button>'
   +'<button class="btn ghost" id="prevg"'+(g.n<=1?' disabled':'')+'>‹ '+(g.n<=1?'Ván trước':'Ván '+(g.n-1))+'</button>'
   +'<button class="btn ghost" id="nextg"'+(g.n>=60?' disabled':'')+'>'+(g.n>=60?'Ván sau':'Ván '+(g.n+1))+' ›</button>'
   +'<button class="btn ghost" id="togc" style="margin-left:auto">'+(HIDEC?'Hiện bình luận':'Ẩn bình luận')+'</button></div>';
  h+='<div class="ghead"><div class="gbadge">'+g.n+'</div><div class="ghead-main">'
   +'<div class="gname">'+nm(g.w)+' – '+nm(g.b)+'</div>'
   +'<div class="gtitle">'+esc(g.ti)+(c.tiv?' · '+esc(c.tiv):'')+'</div>'
   +'<div class="facts">'
   +'<span class="fact">'+esc(cap(g.ev))+'</span>'
   +'<span class="fact">'+esc(cap(g.op))+'</span>'
   +(g.c?'<span class="fact">Đối thủ: '+esc(g.c)+'</span>':'')
   +'<span class="fact">'+g.mv.length+' nước</span>'
   +'<span class="fact '+cls+'">'+(g.res?g.res+' · '+({win:'Fischer thắng',los:'Fischer thua',drw:'Hòa'})[oc]:'sách không ghi kết quả')+'</span>'
   +'</div></div></div>';
  h+='<div class="cols"><div class="flow'+(HIDEC?' nocm':'')+'">';
  var dvv=DICH[g.n]||{};
  if(dvv.intro) h+='<div class="dich"><span class="lab">Lời dẫn trong sách — bản dịch của anh</span>'+fig(esc(dvv.intro))+'</div>';
  if(c.ctx) h+='<div class="ctx"><span class="lab">Bối cảnh</span>'+fig(c.ctx)+'</div>';
  h+=bodyHTML(g,c);
  if(c.end) h+='<div class="end"><span class="lab">Chốt lại</span>'+fig(c.end)+'</div>';
  h+='</div><div class="bwrap"><div class="bcard">'
   +'<div class="bnames"><span>▲ '+esc(g.b)+' (Đen)</span></div>'
   +'<div id="bd"></div>'
   +'<div class="bnames" style="margin:6px 0 0"><span>▼ '+esc(g.w)+' (Trắng)</span></div>'
   +'<div class="bbar"><button class="btn ghost" id="bfirst">⏮</button><button class="btn ghost" id="bprev">‹</button>'
   +'<button class="btn ghost" id="bnext">›</button><button class="btn ghost" id="blast">⏭</button>'
   +'<span class="bpos" id="bpos"></span></div>'
   +'<div class="bhint">Bấm vào bất kỳ nước đi nào bên trái để nhảy tới thế cờ đó.</div>'
   +'</div></div></div>';
  return h;
}
function bodyHTML(g,c){
  var notes={},dias={},dnotes={};
  var dv=DICH[g.n]||{};
  (dv.notes||[]).forEach(function(x){(dnotes[x.at]=dnotes[x.at]||[]).push(x.t)});
  (c.notes||[]).forEach(function(x){(notes[x.at]=notes[x.at]||[]).push(x.t)});
  (g.an||[]).forEach(function(x){if(x.k==='d')(dias[x.at]=dias[x.at]||[]).push(1)});
  var h='',open=false,i=0;
  if(dnotes[-1]) h+=dnotes[-1].map(function(t){return '<div class="dich"><span class="lab">Chú giải trong sách — bản dịch của anh</span>'+fig(esc(t))+'</div>'}).join('');
  if(notes[-1]) h+=notes[-1].map(function(t){return '<div class="note">'+fig(t)+'</div>'}).join('');
  while(i<g.mv.length){
    // collect a run of moves that has no break
    var chunk=[];
    while(i<g.mv.length){
      chunk.push(i);
      if(notes[i]||dias[i]||dnotes[i]){i++;break}
      i++;
    }
    h+=mvTable(g,chunk);
    var last=chunk[chunk.length-1];
    if(dias[last]) h+=diaHTML(g,last);
    if(dnotes[last]) h+=dnotes[last].map(function(t){return '<div class="dich"><span class="lab">Chú giải trong sách — bản dịch của anh</span>'+fig(esc(t))+'</div>'}).join('');
    if(notes[last]) h+=notes[last].map(function(t){return '<div class="note">'+fig(t)+'</div>'}).join('');
  }
  return h;
}
function mvTable(g,idxs){
  // group by move number, two columns
  var rows=[],map={};
  idxs.forEach(function(i){
    var m=g.mv[i];
    if(!map[m.n]){map[m.n]={n:m.n,w:null,b:null};rows.push(map[m.n])}
    map[m.n][m.s]=i;
  });
  var h='<div class="mvt">';
  rows.forEach(function(r){
    h+='<span class="mn">'+r.n+'</span>';
    h+=cellHTML(g,r.w);
    h+=cellHTML(g,r.b);
  });
  return h+'</div>';
}
function cellHTML(g,i){
  if(i===null||i===undefined) return '<span class="mv el">…</span>';
  return '<button class="mv" data-i="'+i+'">'+fig(esc(g.mv[i].t))+'</button>';
}
function diaHTML(g,i){
  var m=g.mv[i];
  var lbl=m.n+(m.s==='w'?' ':'…')+m.t;
  return '<div class="dia"><div style="width:min(300px,100%);flex-shrink:0">'+fenBoard(m.f,null)+'</div>'
   +'<div class="cap">Sơ đồ trong sách — thế cờ sau <b>'+fig(esc(lbl))+'</b><br><span style="font-size:12px;color:var(--text-dim)">Trắng ở phía dưới. Dựng lại từ biên bản nước đi.</span></div></div>';
}
function setPly(i){
  PLY=i;
  var fen=i<0?STARTFEN:CUR.mv[i].f;
  document.getElementById('bd').innerHTML=fenBoard(fen,null);
  var lbl=i<0?'thế xuất phát':(CUR.mv[i].n+(CUR.mv[i].s==='w'?' ':'…')+CUR.mv[i].t);
  document.getElementById('bpos').innerHTML=(i+1)+'/'+CUR.mv.length+' · '+fig(esc(lbl));
  document.querySelectorAll('.mv').forEach(function(b){b.classList.toggle('cur',+b.dataset.i===i)});
}
function bindGame(){
  document.getElementById('back').addEventListener('click',closeGame);
  document.getElementById('togc').addEventListener('click',function(){
    HIDEC=!HIDEC; try{localStorage.setItem('fischer:hidec',HIDEC?'1':'0')}catch(e){}
    document.querySelector('.flow').classList.toggle('nocm',HIDEC);
    this.textContent=HIDEC?'Hiện bình luận':'Ẩn bình luận';
  });
  var p=document.getElementById('prevg'),n=document.getElementById('nextg');
  if(!p.disabled)p.addEventListener('click',function(){openGame(CUR.n-1)});
  if(!n.disabled)n.addEventListener('click',function(){openGame(CUR.n+1)});
  document.querySelectorAll('.mv[data-i]').forEach(function(b){b.addEventListener('click',function(){setPly(+b.dataset.i)})});
  document.getElementById('bfirst').addEventListener('click',function(){setPly(-1)});
  document.getElementById('blast').addEventListener('click',function(){setPly(CUR.mv.length-1)});
  document.getElementById('bprev').addEventListener('click',function(){setPly(Math.max(-1,PLY-1))});
  document.getElementById('bnext').addEventListener('click',function(){setPly(Math.min(CUR.mv.length-1,PLY+1))});
  setPly(CUR.mv.length-1);
}

function kitHTML(){
  var h='<div class="gv-nav"><button class="btn ghost" id="kitBack">← Danh sách 60 ván</button></div>';
  h+='<div class="kit-head"><h2>Sổ tay đọc chú giải cờ vua tiếng Anh</h2>'
   +'<p>Để tự đọc được chú giải trong sách gốc: đây là từ vựng, ký hiệu và lối nói mà sách cờ tiếng Anh dùng, '
   +'giải nghĩa sang tiếng Việt. '+KITN+' mục, chọn từ chính những từ xuất hiện nhiều nhất trong cuốn sách này.</p></div>';
  h+='<div class="toolbar"><input class="search" id="kq" type="search" placeholder="Tìm từ tiếng Anh hoặc nghĩa tiếng Việt…"><span class="count" id="kcnt"></span></div>';
  h+='<div id="kitBody"></div>';
  return h;
}
function renderKit(q){
  q=(q||'').trim().toLowerCase();
  var h='',n=0;
  KIT.forEach(function(p){
    var pb='';
    p.groups.forEach(function(g){
      var items=g.items.filter(function(it){
        if(!q) return true;
        return (it.en+' '+it.vi+' '+(it.note||'')).toLowerCase().indexOf(q)>=0;
      });
      if(!items.length) return;
      n+=items.length;
      pb+='<div class="kit-grp"><h4>'+esc(g.name)+'</h4><div class="kit-list">'
        +items.map(function(it){
          return '<div class="kit-it"><span class="en">'+fig(esc(it.en))+'</span><span class="vi">'+fig(esc(it.vi))+'</span>'
               +'<span class="nt">'+(it.note?fig(esc(it.note)):'')+'</span></div>';
        }).join('')+'</div></div>';
    });
    if(pb) h+='<div class="kit-part"><h3>'+esc(p.title)+'</h3><div class="pi">'+esc(p.intro||'')+'</div>'+pb+'</div>';
  });
  document.getElementById('kitBody').innerHTML=h||'<div class="note">Không tìm thấy mục nào.</div>';
  document.getElementById('kcnt').textContent=n+' mục';
}
function openKit(){
  document.getElementById('idx').classList.add('off');
  document.getElementById('gv').classList.remove('on');
  document.getElementById('notice').style.display='none';
  var k=document.getElementById('kit'); k.classList.add('on'); k.innerHTML=kitHTML();
  renderKit('');
  document.getElementById('kitBack').addEventListener('click',closeKit);
  document.getElementById('kq').addEventListener('input',function(){renderKit(this.value)});
  location.hash='#sotay'; window.scrollTo(0,0);
}
function closeKit(){
  document.getElementById('kit').classList.remove('on');
  document.getElementById('idx').classList.remove('off');
  document.getElementById('notice').style.display='';
  location.hash=''; window.scrollTo(0,0);
}
document.getElementById('kitBtn').addEventListener('click',openKit);

document.getElementById('q').addEventListener('input',function(){Q=this.value.trim().toLowerCase();renderIndex()});
document.querySelectorAll('.chip').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');FILTER=b.dataset.f;renderIndex();
})});
document.addEventListener('keydown',function(e){
  if(!CUR)return;
  if(e.key==='ArrowLeft'){setPly(Math.max(-1,PLY-1))}
  else if(e.key==='ArrowRight'){setPly(Math.min(CUR.mv.length-1,PLY+1))}
  else if(e.key==='Escape'){closeGame()}
});
document.getElementById('notice').innerHTML=NOTICE;
document.getElementById('foot').innerHTML=FOOT;
renderIndex();
(function(){var m=/^#g(\d+)$/.exec(location.hash||'');if(m){openGame(+m[1])}else if(location.hash==='#sotay'){openKit()}})();
</script>
<style id="hoc-mobile">@media (max-width:640px){.cols{gap:18px}.bwrap{position:static}}</style>
</body>
