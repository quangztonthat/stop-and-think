n sớm muộn cũng phải động tới tốt đó."},{"at":23,"t":"<b>12...e5</b> — Đen đuổi Mã d4 và chiếm chỗ ở giữa. Cái giá: tốt e7 rời đi nên Vua e8 phơi ra trên cột e, và ô <b>f5</b> từ nay không tốt nào canh (tốt g đã mất từ nước 8)."},{"at":24,"t":"<b>13 ♕a4+!</b> — Chiếu trên đường chéo mà nước 9 c4 đã dọn sẵn. Đen phải chắn ở d7, và quân chắn ở đó <b>bị ghim ngay</b> vào Vua e8: nó không nhúc nhích được nữa."},{"at":26,"t":"<b>14 ♖xe4!</b> — Thí chất. Trắng đổi Xe lấy Tượng để dọn quân hoạt động duy nhất của Đen, và khi tốt d5 ăn lại thì ô d5 trống: Tượng c4 nhìn thẳng f7 và g8, còn Mã d4 có ô f5 để nhảy vào."},{"at":28,"t":"<b>15 ♘f5!</b> — Mã vào ô không tốt nào đuổi được, dọa cả ♘d6+ lẫn ♘g7+. Đen đã hết tốt g và tốt e để kiểm soát f5, nên con Mã này đứng đó vĩnh viễn."},{"at":33,"t":"<b>16 ♘g7+ ♔e7 17 ♘f5+ ♔e8</b> — Nhìn thì như đi lại chỗ cũ, nhưng có một thứ đã đổi hẳn: <b>Đen mất quyền nhập thành cả hai bên</b>. Xe h8 từ giờ đứng ngoài ván cờ, và Trắng chơi như đang hơn một Xe."},{"at":36,"t":"<b>19 fxe3</b> — Đổi xong Tượng, thứ biến mất là Tượng c5 của Đen — quân duy nhất canh ô d6. Cột d bỏ trống và Xe Trắng sắp vào đó."},{"at":40,"t":"<b>21 ♖d6!</b> — Xe cắm vào đúng ô mà Tượng c5 từng giữ. Ăn nó không được: <b>21...♕xd6 22 ♘xd6+</b> vừa chiếu vừa lấy Hậu, Đen chỉ đổi được một Xe."},{"at":44,"t":"<b>23 ♗xf7+</b> — Vua không ăn lại được. Hậu b3 đứng ngay sau Tượng trên cùng đường chéo a2–g8, nên khi Tượng c4 rời chỗ, ô f7 vẫn bị Hậu kiểm soát — <b>23...♔xf7 là nước cấm</b>. Vua phải chạy sang d8."},{"at":46,"t":"<b>24 ♗e6</b> và Najdorf xin thua. Mã d7 bị Xe d6 ghim vào Vua d8, giờ thêm Tượng e6 đánh vào nó; mà ăn xong thì Vua cũng không lấy lại được vì ô d7 do Xe d6 kiểm soát. Đen đang hơn chất nhưng không có nước nào gỡ ra."}]},"41":{"tiv":"Một bức tiểu hoạ rực rỡ","ctx":"Olympiad Varna 1962, Fischer cầm Trắng gặp Robatsch của Áo. Đen chọn <b>Trung tâm phản công</b>: đổi ngay tốt d5 lấy e4 rồi rút Hậu về nhà, chấp nhận chậm nhịp để lấy thế chắc. Fischer dựng đúng bộ khung quen thuộc chống thế fianchetto — ♗f4, ♕d2, ♗h6 để đổi con Tượng g7, nhập thành cánh Hậu rồi đẩy tốt h và g. Robatsch nhập thành ngắn ngay vào chỗ cơn bão sắp tới và không bao giờ kịp phản công. Ván cờ kết thúc ở nước 20.","end":"Bài học nằm ở <b>trình tự</b>, không ở đòn cuối. Muốn tấn công một Vua có Tượng fianchetto thì trước hết phải bỏ con Tượng đó đi: ♗f4 → ♕d2 → ♗h6 là ba nước làm đúng một việc. Sau đó tốt h và g mở cột, còn quân nặng chỉ việc đi vào cột vừa mở. Chi tiết đáng nhớ thứ hai: đếm quân giữ ô. Cả ván g7 luôn được giữ đúng bằng số quân tấn công — tới khi Đen tự nhấc Mã khỏi g7 thì cán cân đổ ngay lập tức.","notes":[{"at":5,"t":"<b>3…♕d8</b> — Hậu về đúng ô xuất phát. Đen đã tiêu ba nước (d5, ♕xd5, ♕d8) chỉ để đổi một cặp tốt, trong khi Trắng phát triển được một Mã. Thế cờ vẫn lành, nhưng Đen đang nợ một hai nhịp."},{"at":7,"t":"<b>4…g6!?</b> — Robatsch đi hệ của chính mình: dựng tường tốt thấp, đưa Tượng ra g7 nhìn đường chéo dài. Chắc chắn nhưng chậm, và con Tượng g7 sẽ thành mục tiêu số một."},{"at":8,"t":"<b>5 ♗f4!</b> — Tượng ra ngoài trước khi tốt e3 kịp nhốt nó. Quan trọng hơn: từ f4 nó tới thẳng <b>h6</b> trong một nước, đúng ô đối mặt với Tượng g7."},{"at":10,"t":"<b>6 ♕d2!</b> — Hậu đứng sau Tượng trên đường chéo c1–h6. Nếu sau này Đen ăn ♗h6 thì Hậu bắt lại và đáp ngay xuống cạnh Vua Đen. Hai nước 5 và 6 phục vụ cùng một ý."},{"at":12,"t":"<b>7 0-0-0</b> — nhập thành khác cánh. Từ giờ tốt h và g của Trắng được tự do chạy mà không làm hở nhà Vua mình."},{"at":14,"t":"<b>8 ♗h6</b> — mời đổi. Tượng h6 được Hậu d2 đỡ, và chỉ có Tượng g7 tấn công nó. Đen không thích ăn (Hậu Trắng xuống h6), mà để yên thì sớm muộn cũng bị ♗xg7."},{"at":15,"t":"<b>8…0-0?</b> — Vua đi vào đúng chỗ Trắng sắp đập. Sau nước này Trắng có một mục tiêu cố định và mọi nước tốt h, g đều có địa chỉ."},{"at":18,"t":"<b>10 h5!</b> — mở cửa. Đen ăn gxh5 thì mái tốt cánh Vua thủng một lỗ và tốt h5 còn lại bị Xe h1 nhắm ngay; không ăn thì hxg6 cũng mở cột."},{"at":20,"t":"<b>11 ♗d3</b> — Tượng lên đường chéo b1–h7, tức là <b>ngắm h7</b>. Trắng bắt đầu gom quân về một điểm thay vì đi lung tung."},{"at":22,"t":"<b>12 ♘ge2</b> — Mã đi e2 chứ không f3. Lý do rất thực dụng: ô c3 đang bị Hậu a5 nhòm, và từ e2 con Mã là người giữ c3 thứ ba, sau tốt b2 và Hậu d2."},{"at":24,"t":"<b>13 g4!</b> — bây giờ tốt h5 của Đen bị đánh hai lần (tốt g4 và Xe h1) mà chỉ có Mã f6 với Hậu a5 đỡ. Dù Đen xử lý thế nào thì cột g cũng mở ra cho hai Xe Trắng."},{"at":29,"t":"<b>15…♔h8</b> — Vua bước khỏi cột g, nhưng đứng vào đúng đường chéo của Tượng h6. Bây giờ ♗xg7 là nước <b>chiếu</b>, và Đen chỉ còn hai cách trả lời."},{"at":32,"t":"<b>17 ♕h6</b> — Hậu chiếm luôn ô Tượng vừa rời. Ô g7 hiện bị Xe g1 và Hậu h6 đánh hai lần, mà chỉ có Vua h8 giữ — nên Đen buộc phải đưa Xe về g8."},{"at":36,"t":"<b>19 ♖hg1</b> — hai Xe chồng lên cột g. Đếm lại: g7 bị đánh hai, được giữ hai. Cân bằng, nhưng Đen đã hết nước có ích còn Trắng thì chưa."},{"at":37,"t":"<b>19…♘f5</b> — Mã đánh vào Hậu h6 để giành nhịp, nhưng nó <b>rời khỏi g7</b>. Cán cân giữ ô vỡ ngay tại đây."},{"at":38,"t":"<b>20 ♗xf5</b> và Đen xin thua. Nếu 20…♗xf5 thì 21 ♖xg8+! và Vua <b>không bắt lại được</b> vì Xe g1 đang canh ô g8: 21…♘xg8 22 ♕g7 chiếu hết, còn 21…♕xg8 22 ♖xg8+ ♔xg8 23 ♕g5+ rồi ăn Tượng f5, Trắng hơn hẳn một Xe."}]},"42":{"tiv":"Đánh theo cảm giác","ctx":"Cũng ở Olympiad Varna 1962, lần này Fischer cầm Đen trước Unzicker của Tây Đức. Khai cuộc là <b>Sicilian</b> biến Najdorf với 6 ♗e2 — hệ trầm, Trắng không lao vào tấn công mà chơi thế. Fischer đáp …e5 rồi đưa Tượng qua e6–c4, tức là chấp nhận ô yếu d5 để đổi lấy quyền hoạt động trên các ô trắng và cột a. Unzicker lấy không gian bằng f4–f5 nhưng rồi tự bỏ cặp Tượng ở nước 15, và từ đó Đen chỉ làm một việc: dồn quân vào cột a rồi khoét các ô đen quanh Vua Trắng. Trắng đầu hàng ở nước 26.","end":"Ván này gần như không có đòn phối hợp nào, mà là một chuỗi nước nhỏ đúng hướng. Ba thứ đáng học: <b>một</b>, đổi quân có mục đích — …♗c4 và …♗b5 đều nhằm mở cột a và lấy ô của Mã Trắng; <b>hai</b>, tốt b5 sau khi bắt lại làm việc như một quân, nó cấm cửa a4 và c4; <b>ba</b>, để ý ô f2 khi Vua đã rời g1 — chính nước ♖fe1 vô hại đã bỏ rơi nó, và mười nước sau Đen thu hoạch.","notes":[{"at":11,"t":"<b>6…e5</b> — nước đặc trưng của Najdorf. Đuổi Mã d4, chiếm không gian và lấy ô d4/f4 cho quân mình, đổi lại chấp nhận ô yếu d5 và tốt d6 lùi. Fischer luôn sẵn sàng trả cái giá đó."},{"at":18,"t":"<b>10 f5</b> — Trắng lấy không gian và đuổi Tượng e6, nhưng tốt f từ đây không còn đánh vào e5 nữa. Trung tâm bị đóng lại, và Đen được rảnh tay xử lý cánh Hậu."},{"at":19,"t":"<b>10…♗c4</b> — Tượng không lùi mà nhảy vào c4, đánh thẳng vào Tượng e2. Trắng phải quyết ngay: đổi thì Đen thoải mái, không đổi thì con Tượng này cắm ở giữa đội hình."},{"at":24,"t":"<b>13 a5</b> — Trắng khoá ô b6 để Mã Đen không có chỗ. Được cái chặt, nhưng tốt a5 tự nó cũng thành một mục tiêu đứng yên."},{"at":25,"t":"<b>13…b5</b> — Fischer đẩy tốt lên đúng ô Trắng vừa canh, mời bắt qua đường. Ý đồ không phải giữ tốt mà là <b>xoá tốt a của Trắng</b>."},{"at":27,"t":"<b>14…♘xb6</b> — mục tiêu đạt được: Trắng không còn tốt nào trên cột a, nên cột a từ giờ là của Xe Đen. Mã b6 lại nhắm sẵn c4 và a4."},{"at":28,"t":"<b>15 ♗xb6?</b> — Trắng đổi Tượng đen lấy Mã để chặn Mã kia. Cái giá quá đắt: Đen bắt lại <b>có chiếu</b> nên được không nhịp, giữ luôn cặp Tượng, và các ô đen quanh Vua Trắng từ đây không còn ai canh."},{"at":31,"t":"<b>16…♗b5!</b> — mời đổi nốt cặp Tượng trắng. Nếu Trắng ăn thì Đen bắt lại bằng tốt a6, vừa mở cột a vừa dựng một tốt b5 rất khó chịu."},{"at":33,"t":"<b>17…axb5</b> — nhìn thì như tự làm hỏng cấu trúc, thật ra đây là nước cải thiện thế cờ: Xe a8 vào cột a mở, còn tốt b5 <b>cấm cả a4 lẫn c4</b> — đúng hai ô mà Mã b3 và Mã c3 cần."},{"at":37,"t":"<b>19…♖a4!</b> — Xe ra hàng 4, đánh vào tốt e4 và sẵn sàng trượt ngang sang b4 hoặc c4. Suốt phần còn lại của ván, Trắng không bao giờ đuổi được con Xe này đi."},{"at":42,"t":"<b>22 ♖fe1</b> — nước tưởng như vô hại, nhưng Vua đã rời g1 từ nước 16 nên Xe f1 là <b>người cuối cùng giữ ô f2</b>. Rời nó đi là f2 trống hoàn toàn."},{"at":43,"t":"<b>22…h6!</b> — nước nhỏ, hai việc: cho Vua lỗ thở và chuẩn bị …♗g5, vì tốt h6 sẽ đỡ cho Tượng khi nó ra đó."},{"at":46,"t":"<b>24 g3?</b> — Trắng nới thêm hàng tốt trước Vua. Vấn đề gốc vẫn nguyên: từ nước 22, ô <b>f2</b> không còn quân nào giữ, và Đen sắp trỏ Hậu vào đúng đó."},{"at":47,"t":"<b>24…♕a7!</b> — Hậu đi ngang sang đường chéo dài và nhắm thẳng vào f2. Ô đó không có một quân Trắng nào đỡ."},{"at":49,"t":"<b>25…♖a2</b> — Xe vào hàng 2, đánh tốt b2 đang trơ trọi. Chú ý mắt xích: b2 <b>là quân duy nhất giữ c3</b>, mà bản thân b2 lại không ai đỡ. Xe c8 đã chờ sẵn trên cột c."},{"at":51,"t":"<b>26…♖xc3!</b> và Trắng xin thua. Ăn kiểu nào cũng mất tốt và hở Vua: 27 bxc3 ♖xa1 28 ♖xa1 ♕xa1+ 29 ♔g2 ♕xb2+, hoặc 27 ♖xa2 ♕xa2 28 bxc3 ♕b1+ 29 ♔g2 ♕xe1 — cả hai đều ra tàn cuộc Hậu, Đen hơn tốt và còn Tượng đấu Mã."}]},"43":{"tiv":"Mắt xích còn thiếu","ctx":"Giải vô địch Mỹ 1962–63, Fischer cầm Trắng gặp Reshevsky. Lại là <b>Sicilian</b>, nhưng Fischer chơi 6 h3 rồi 7 g4 — lấy không gian cánh Vua trước, chưa vội quyết Vua sẽ đứng đâu. Hậu bị đổi sớm ở nước 19 và ván cờ biến thành một tàn cuộc hai Xe dài dằng dặc. Toàn bộ phần còn lại xoay quanh hai con đường mà Fischer tự mở cho Xe: <b>cột h</b> (mở ở nước 14 khi bắt lại bằng tốt h) và <b>cột a</b> (mở ở nước 17 khi bắt lại bằng tốt a). Reshevsky chống đỡ hơn ba mươi nước rồi vẫn thua vì một tốt thông ở cột e.","end":"Điều đáng học nhất là <b>chọn tốt nào bắt lại</b>. Hai lần Fischer bắt hướng vào trung tâm — hxg4 và axb3 — và cả hai lần cái được không phải là cấu trúc đẹp (tốt b bị chồng) mà là một cột mở cho Xe. Ba mươi nước sau, đúng hai cột đó là nơi ván cờ được quyết. Thứ hai: đừng cố định tốt trên cột mà Xe đối phương với tới được — nước 25…b5 làm tốt a6 vĩnh viễn không còn tốt nào đỡ, và Fischer nhớ điều đó tới tận nước 31. Thứ ba, ở tàn cuộc, thí Tượng để <b>kéo Xe địch ra khỏi cột phong cấp</b> là mẫu rất hay dùng.","notes":[{"at":15,"t":"<b>8…♘h5!</b> — Mã ra biên nhìn xấu nhưng có địa chỉ rõ ràng: ô <b>f4</b>. Trắng đã đẩy h3 và g4 nên không còn tốt nào canh f4 được nữa."},{"at":24,"t":"<b>13 ♗g4</b> — mời đổi Tượng ô trắng. Nhìn thì Trắng bỏ con Tượng đang hoạt động, nhưng cái hay nằm ở nước bắt lại."},{"at":26,"t":"<b>14 hxg4</b> — bắt lại bằng tốt h chứ không phải Xe. Trắng mất tốt h nhưng <b>cột h mở ra cho Xe h1</b>. Cột này sẽ quyết định ván cờ ở nước 38."},{"at":27,"t":"<b>14…♕c8!</b> — Hậu bước sang đường chéo c8–h3 và đánh ngay vào tốt g4. Đen không để Trắng yên tâm với cặp tốt g."},{"at":29,"t":"<b>15…♘d4!</b> — Mã vào giữa, đánh cùng lúc Mã b3 và tốt c2. Trắng phải xử lý ngay."},{"at":32,"t":"<b>17 axb3</b> — lại bắt hướng vào trung tâm. Trắng nhận hai tốt b chồng nhau, đổi lại <b>cột a mở ra cho Xe a1</b> — Trắng không còn tốt a nào. Vậy là hai Xe có hai con đường: một ở cột h, một ở cột a."},{"at":34,"t":"<b>18 ♖a5!</b> — Xe đi vào hàng 5. Điểm mấu chốt không phải là nó doạ gì, mà là nó <b>canh ô d5</b> — chuẩn bị cho nước sau."},{"at":35,"t":"<b>18…f6?</b> — Đen cố phá cái nêm g5, nhưng tự mở nhà mình. Sau khi đổi Hậu, tốt g5 ăn f6 rồi tốt g còn lại lại tiến lên g5 lần nữa, và hàng tốt g6–h7 thành mục tiêu đứng yên trên cột h."},{"at":36,"t":"<b>19 ♕d5!</b> — Hậu đánh thẳng vào Hậu Đen và <b>được Xe a5 đỡ</b>. Đen buộc phải đổi, và Xe bắt lại đáp xuống d5, từ đó nhìn cả e5 lẫn d6."},{"at":49,"t":"<b>25…b5!?</b> — Đen chặn không cho tốt b Trắng đi tiếp. Cái giá là tốt a6 thành tốt lùi trên một cột mở và <b>không còn tốt nào có thể đỡ nó nữa</b>."},{"at":58,"t":"<b>30 ♖h4!</b> — hai Xe xếp chồng trên cột h, ép vào tốt h7. Lúc này h7 vẫn đủ người giữ (Xe h8 và Xe c7), nên Đen chưa mất gì — nhưng phải phản ứng, và Reshevsky chọn phá ở trung tâm bằng 30…d5."},{"at":60,"t":"<b>31 ♖a1!</b> — Fischer đổi mục tiêu. Cột a trống trơn và tốt a6 <b>không có ai giữ</b>. Đây chính là hoá đơn của nước 25…b5."},{"at":74,"t":"<b>38 ♖xh7</b> — tốt h rơi. Cột mở từ nước 14 mất hai mươi bốn nước mới sinh lời, nhưng nó sinh lời thật: giờ Trắng hơn tốt và Đen không còn tốt nào ở cánh Vua ngoài g6."},{"at":81,"t":"<b>41…e4+</b> — Reshevsky trả lại một tốt để mở đường. Sau 42 fxe4 ♖d8+ Xe và Tượng Đen đều sống lại, và Fischer phải mất thêm mười mấy nước nữa mới xong."},{"at":100,"t":"<b>51 ♗f6!</b> — thí Tượng để dọn đường. Sau 51…♗xf6 52 gxf6 ♖xf6 con Xe Đen bị kéo sang cột f, tức là <b>rời khỏi cột e</b> — cột mà tốt thông của Trắng cần."},{"at":106,"t":"<b>54 ♖e1</b> và Đen xin thua. Xe Trắng chiếm cột e nên Xe Đen không thể đứng chặn trước tốt; tốt e6 chỉ còn hai bước, Vua d5 kèm ngay bên cạnh, trong khi Vua Đen ở tận h4."}]},"44":{"tiv":"Liệu pháp sốc","ctx":"Một ván chơi vui ở New York 1963, Fischer gặp Reuben Fine. Trắng chọn <b>Gambit Evans</b>: thí tốt b4 để đuổi Tượng c5 mất nhịp, rồi c3 và d4 dựng trung tâm tốt lớn. Đen ăn tới hai tốt nhưng gần như không đưa quân nào ra khỏi nhà, còn Fischer nhập thành sớm và cho quân vào việc hết. Từ nước 10 trở đi Trắng đi một mạch toàn những nước đánh hai thứ cùng lúc. Đen xin thua ở nước 17 trong khi vẫn đang hơn hai tốt.","end":"Bài học rõ nhất: hơn hai tốt không cứu được thế cờ nếu quân còn nằm ở hàng cuối. Chuỗi nước quyết định đều cùng một họ — <b>10 ♘d5</b> đánh hai quân một lúc, <b>11 exd5</b> ăn lại mà vẫn đuổi thêm một quân nữa, <b>14 h4</b> kéo quân giữ nhà ra khỏi chỗ. Nước cuối đáng học thuộc: <b>17 ♕g3</b> đặt Hậu ngay cạnh Hậu đối phương, ăn vào là bị chiếu hết bằng một nước Tượng.","notes":[{"at":6,"t":"<b>4 b4!?</b> — Gambit Evans. Trắng cho không một tốt để Tượng c5 phải bắt và mất nhịp; đổi lại Trắng được chơi c3 rồi d4 và dựng trung tâm to. Đây là lối đổi vật chất lấy thời gian."},{"at":9,"t":"<b>5…♗a5</b> — Tượng lùi về a5, giữ đường chéo a5–e1. Chỗ đứng này về sau thành vấn đề: Tượng nằm ngoài rìa và tới cuối ván vẫn ở nguyên a5, không giúp gì cho Vua."},{"at":12,"t":"<b>7 0-0</b> — Trắng không vội bắt lại tốt c3 mà nhập thành trước. Đen đang hơn hai tốt, nhưng Trắng đã nối Xe còn quân cánh Hậu của Đen chưa động đậy."},{"at":14,"t":"<b>8 ♕b3</b> — Hậu ra b3 đỡ cho Tượng c4 và tì vào đường chéo a2–g8 ngay sau lưng Tượng. Đích ngắm là ô f7, chỗ mỏng nhất khi Vua Đen chưa nhập thành."},{"at":15,"t":"<b>8…♕e7</b> — Hậu ra thêm một người giữ f7. Cần thiết, nhưng Hậu đứng e7 sẽ trở thành mục tiêu cho một nước Mã."},{"at":16,"t":"<b>9 ♘xc3</b> — Trắng lấy lại một tốt. Đếm quân đã ra trận: Trắng có hai Mã, Tượng c4, Hậu b3 và Xe đã nối; Đen mới có Mã c6 với Tượng a5. Đó chính là thứ Trắng mua bằng hai tốt."},{"at":17,"t":"<b>9…♘f6?</b> — Nước phát triển tự nhiên nhưng đặt Mã vào đúng tầm với của một cú nhảy: Mã f6 và Hậu e7 nay cùng nằm trong tầm ô d5."},{"at":18,"t":"<b>10 ♘d5!</b> — Mã vào d5 đánh Hậu e7 và Mã f6 cùng lúc, lại còn dọa ♘xc7+ chiếu Vua kiêm bắt Xe a8. Đen không có nước nào đỡ hết ba thứ."},{"at":20,"t":"<b>11 exd5</b> — Bắt lại bằng tốt, và tốt d5 đuổi luôn Mã c6. Thêm một nhịp nữa cho Trắng."},{"at":23,"t":"<b>12…♕xe5</b> — Sau loạt đổi quân, Hậu Đen phải đứng chơ vơ giữa bàn ở e5. Vua vẫn ở e8, Tượng c8 và Xe a8 vẫn chưa nhúc nhích."},{"at":24,"t":"<b>13 ♗b2!</b> — Tượng ra đường chéo dài đánh thẳng Hậu e5. Lùi về f6 thì ♗xf6 mất Hậu, nên Hậu phải bỏ ô e5 — mà đi đâu thì tốt g7 cũng mất người giữ."},{"at":25,"t":"<b>13…♕g5</b> — Cách chống đỡ tốt nhất: Hậu vừa nhòm tốt g2 vừa còn với tới g7. Nhưng bây giờ g7 chỉ còn đúng một quân giữ, và đó là Hậu."},{"at":26,"t":"<b>14 h4!</b> — Kéo quân phòng thủ ra khỏi chỗ. Tốt h đâm vào Hậu: ăn thì g7 mất người canh, không ăn thì tốt h tiếp tục đuổi Hậu."},{"at":28,"t":"<b>15 ♗xg7</b> — Tượng ăn tốt g7 và đánh luôn Xe h8. Đen phải trả lời ngay lập tức."},{"at":30,"t":"<b>16 ♖fe1+</b> — Xe vào cột e chiếu. Đen chỉ còn bốn nước hợp lệ: đưa Vua sang d8, bắt Xe bằng Tượng a5 (Trắng ăn lại vẫn chiếu), hoặc đưa Hậu ra chắn ở e7/e4 rồi mất Hậu."},{"at":32,"t":"<b>17 ♕g3!</b> — Hậu đứng g3 vừa đánh Hậu h4 vừa đỡ cho Tượng g7. Ăn Hậu thì <b>18 ♗f6 chiếu hết</b> ngay; không ăn thì mất Hậu (17…♕e7 18 ♖xe7). Đen hơn hai tốt mà đành xin thua."}]},"45":{"tiv":"Những bóng ma","ctx":"Giải vô địch bang New York 1963. Đen chọn <b>Phòng thủ Hai Mã</b> và nhánh sắc nhất — 4 ♘g5 d5 5 exd5 ♘a5 — chịu thiệt một tốt để lấy quân ra nhanh. Fischer trả lời bằng 9 ♘h3!?, đưa Mã ra rìa để khỏi bị tốt e đuổi. Đen đổi Tượng lấy con Mã đó, làm vỡ tốt cánh Vua Trắng và ăn lại tốt ở h3, nhưng từ đó cứ phải đi lùi để né những đòn thật ra chưa hề có. Vật chất vẫn ngang nhau tới nước 26; rồi Đen đi ăn thêm một tốt ở b2 và mất cả ván.","end":"Hai điều đáng mang đi. Một: đi ăn tốt bằng Hậu thì phải đếm trước xem Hậu sẽ bị đuổi mấy nhịp — ở đây Đen ăn một tốt rồi trả lại bằng mấy nước lùi liên tiếp, còn Trắng phát triển quân miễn phí trong lúc đuổi. Hai: một quân được giữ bởi Hậu chưa chắc đã được giữ thật, nếu Hậu ấy đứng ngay sau nó trên cùng một đường chéo với Tượng đối phương — đó là toàn bộ nội dung của đòn kết thúc ở nước 28.","notes":[{"at":6,"t":"<b>4 ♘g5</b> — Mã nhảy vào g5 nhắm thẳng f7. Nước thô nhưng ép Đen phải quyết ngay ở khai cuộc, không có chỗ để đi thong thả."},{"at":9,"t":"<b>5…♘a5</b> — Đen không cứu tốt d5 mà đuổi Tượng c4, chấp nhận thiệt một tốt để lấy quân ra và mở cột b. Đây là ý chính của cả biến."},{"at":16,"t":"<b>9 ♘h3!?</b> — Mã lùi ra rìa, lý do rất cụ thể: về f3 thì …e4 đuổi ngay. Ở h3 không tốt nào chạm tới nó — nhưng nó nằm gọn trong tầm Tượng c8."},{"at":21,"t":"<b>11…♗xh3</b> — Đen đổi Tượng lấy con Mã rìa. Được: tốt cánh Vua Trắng vỡ. Mất: <b>cặp Tượng</b>, và cột g mở ra thì Vua Đen ở g8 cũng đứng trên đó chứ không riêng gì Vua Trắng."},{"at":24,"t":"<b>13 ♗f3</b> — Tượng ra đường chéo dài đánh tốt c6, đồng thời để ngỏ tốt h3. Trắng không tiếc tốt đó."},{"at":25,"t":"<b>13…♕xh3</b> — Đen ăn lại tốt, vật chất về ngang. Nhưng Hậu ở h3 không dọa được gì cả, và Trắng sắp đuổi nó bằng chính những nước phát triển quân."},{"at":28,"t":"<b>15 ♗g2</b> — Tượng quay lại đánh Hậu h3. Đây là cái giá thật của chuyến đi ăn tốt: Trắng vừa đuổi Hậu vừa đưa quân về chỗ tốt."},{"at":32,"t":"<b>17 ♘e4</b> — Mã vào ô tiền tiêu e4, đánh cùng lúc Mã f6 và Tượng c5 đang không có ai giữ."},{"at":36,"t":"<b>19 ♔h1</b> — Vua bước sang h1 để rời cột g. Vua ở g1 với Tượng g2 đứng chắn phía trước thì bất cứ quân Đen nào vào cột g cũng tạo ra một cái ghim; đi trước một nước là hết chuyện."},{"at":38,"t":"<b>20 ♕c3!</b> — Hậu vào đường chéo dài. Nó đánh tốt e5, xếp thẳng hàng với Hậu f6 và tốt g7 phía sau, đồng thời đầu kia của đường chéo là Mã a5 đang lạc lõng."},{"at":40,"t":"<b>21 f4</b> — Tốt f đánh thêm vào e5, ép Đen phải quyết ở trung tâm trong khi quân Đen đang tản mát hai cánh."},{"at":48,"t":"<b>25 ♗f4</b> — Tượng đánh Xe e5, buộc Xe phải chạy khỏi trung tâm."},{"at":50,"t":"<b>26 ♗e4</b> — Tượng đánh Mã f5. Mã có Hậu g6 giữ, nhưng Hậu lại đứng ngay sau Mã trên chính đường chéo của Tượng này — cái giữ đó chỉ có trên giấy."},{"at":51,"t":"<b>26…♖xb2?</b> — Tốt b2 đúng là không ai giữ và ăn được thật. Cái mất là Xe rời hẳn cánh Vua đúng lúc Trắng sắp nổ ở đó."},{"at":52,"t":"<b>27 ♗e5!</b> — Tượng bước ra khỏi cột f. Bây giờ Xe f1 mới nhìn thẳng xuống f5, mà Tượng ở e5 vẫn giữ nguyên sức ép lên g7."},{"at":54,"t":"<b>28 ♖xf5</b> — Ăn Mã. Bắt lại bằng Hậu thì ♗xf5 mất Hậu; bắt lại bằng Xe (28…♖xe5) thì 29 ♖xe5 và Đen mất đứt một Xe không lấy lại được. Đen xin thua."}]},"46":{"tiv":"Dạo chơi","ctx":"Giải vô địch Mỹ 1963-64. Đen chơi <b>Pirc-Robatsch</b>: nhường trung tâm cho Trắng rồi tính phá sau bằng …e5 hoặc …c5. Trắng chọn cách hung hăng nhất, 4 f4 với bộ ba tốt e4–d4–f4. Đen đi 6…♗g4 rồi đổi Tượng lấy Mã f3, cho Trắng <b>cặp Tượng</b> và một trung tâm rất rộng. Fischer mở toang cánh Vua bằng 11 f5, dồn Hậu, hai Tượng và Xe về đó, và kết thúc bằng một nước Xe đứng ngay giữa thế trận mà Đen không dám ăn.","end":"Nước 18 và 19 đi liền nhau mới là bài học thật. <b>18 ♗xd4</b> nhìn như một nước đổi quân bình thường, nhưng việc nó làm là <b>dọn ô e5</b> để tốt e của Trắng đi lên được; chừng nào tốt e5 của Đen còn đứng đó thì Tượng d3 mãi mãi bị chính tốt e4 của Trắng chắn đường. Đến <b>19 ♖f6</b> thì Xe không cần ai bảo vệ: quân duy nhất ăn được nó là Tượng g7, mà Tượng g7 đi khỏi chỗ thì Vua Đen chết ở h7. Đó là cách nghĩ đúng về thí quân — không phải đếm quân, mà đếm xem ai còn giữ ô nào.","notes":[{"at":6,"t":"<b>4 f4</b> — Tấn công Áo. Trắng dựng bộ tốt e4–d4–f4 và tính đẩy f5 hoặc e5 để bóp nghẹt Đen. Cái giá là ô e4 và các ô quanh Vua Trắng hở ra nếu Đen phản công kịp."},{"at":11,"t":"<b>6…♗g4?</b> — Tượng ra tì vào Mã f3, sau lưng Mã là Hậu d1. Nhưng cái ghim này không có gì đỡ phía sau, nên Trắng chỉ cần h3 là Đen phải đổi Tượng lấy Mã."},{"at":14,"t":"<b>8 ♕xf3</b> — Bắt lại bằng Hậu. Trắng có <b>cặp Tượng</b> cộng trung tâm e4–d4–f4; Đen thì vừa cho đi con Tượng ô trắng, đúng con giữ các ô sáng quanh Vua mình. Chỗ này quyết định luôn tính chất ván cờ."},{"at":17,"t":"<b>9…e5</b> — Đen phá trung tâm theo đúng tinh thần Pirc. Nhưng mở cờ ra thì phần lợi thuộc về bên có nhiều quân hướng về đó hơn, và bên đó là Trắng."},{"at":20,"t":"<b>11 f5!</b> — Tốt f đâm lên. Ăn thì cột g mở ngay trước Vua Đen, không ăn thì tốt f5 tiếp tục bò lên bóp nghẹt. Trắng chưa nhập thành nhưng Đen không có quân nào bắt tội được chuyện đó."},{"at":22,"t":"<b>12 ♕xf5</b> — Bắt lại bằng Hậu để giữ nguyên tốt e4. Vua Đen giờ chỉ còn hai tốt f7 và h7 che, và Hậu Trắng đã đứng sát cánh Vua ấy."},{"at":23,"t":"<b>12…♘d4</b> — Nước hay nhất của Đen trong ván: Mã vào ô tiền tiêu d4, đánh Hậu f5 và tốt c2 cùng lúc, buộc Trắng phải lùi."},{"at":24,"t":"<b>13 ♕f2</b> — Hậu lùi về f2, đỡ cho Tượng e3 và vẫn ở cột f. Trắng chưa đổi ở d4 vội — con Mã đó rồi sẽ tự thành mục tiêu vào lúc có lợi hơn."},{"at":28,"t":"<b>15 ♕g3</b> — Hậu vào cột g và <b>ghim</b> Tượng g7 vào Vua g8. Tượng g7 là quân giữ nhà quan trọng nhất của Đen, nay tạm thời không nhúc nhích được."},{"at":29,"t":"<b>15…♔h8</b> — Vua tránh sang h8 để gỡ ghim. Nhưng ở h8 thì tốt h7 trở thành mục tiêu của mọi thứ đi trên đường chéo b1–h7 — nơi Tượng d3 đang đứng sẵn."},{"at":32,"t":"<b>17 ♕h5</b> — Hậu sang h5. Lúc này h7 mới chỉ có mình Hậu chạm tới và Vua canh, vì đường của Tượng d3 vẫn đang bị chính tốt e4 của Trắng bịt."},{"at":33,"t":"<b>17…♕e8?</b> — Hậu về e8 giữ thêm f7. Đen lo đúng chỗ f7 nhưng bỏ qua chuyện quan trọng hơn: tốt e5 của chính mình là thứ duy nhất đang giữ cho đường chéo d3–h7 còn bị chắn."},{"at":34,"t":"<b>18 ♗xd4!</b> — Đổi bỏ con Mã mạnh nhất của Đen, và quan trọng hơn nhiều: sau <b>18…exd4</b> thì ô e5 trống, tốt e của Trắng đi lên được. Đây là nước dọn đường chứ không phải nước ăn quân."},{"at":36,"t":"<b>19 ♖f6!</b> — Xe đứng vào ô mà chỉ Tượng g7 với tới được. Ăn thì 20 e5 mở đường chéo d3–h7 và Trắng chiếu hết ngay ở h7; không ăn thì Xe ngồi đó chặn Tượng và dọa sang h6."},{"at":38,"t":"<b>20 e5</b> — Một nước làm ba việc: đỡ cho Xe f6, đánh Mã d6, và mở đường Tượng d3 tới h7. Từ giây phút này ♕xh7 là chiếu hết thật, nên Đen buộc phải đi …h6."},{"at":40,"t":"<b>21 ♘e2!</b> — Mã c3 đang bị tốt d4 đánh; thay vì đỡ, nó sang e2 để đi tiếp tới f4. Đen không giữ nổi tốt h6: <b>♖xh6</b> ♗xh6 rồi ♕xh6 là dọa chiếu hết ở h7, còn nếu Đen ăn Xe bằng …♗xf6 thì exf6 rồi ♕xh6 cũng đúng thế đó. Đen xin thua."}]},"47":{"tiv":"Như bị yểm bùa?","ctx":"Ván này chơi ở giải vô địch Mỹ 1963-64. Khai cuộc là <b>Ruy Lopez</b>, biến Chigorin: Đen đuổi Tượng Trắng bằng …♘a5, ép nó về c2, rồi dựng tốt c5–d6 giữ trung tâm. Đến nước 13 Trắng đổi ở c5 và Đen ăn lại bằng tốt d — mở cột d nhưng để lại một <b>lỗ hổng ở d5</b> không tốt nào che được nữa. Toàn bộ phần sau là Fischer đưa Mã vào lỗ đó, đổi lấy Tượng ô đen của Đen để giữ <b>cặp Tượng</b>, rồi thắng một tốt lẻ ở tàn cuộc và kết bằng một đòn đôi của Hậu.","end":"Ba thứ đáng học ở ván này. Thứ nhất là cách <b>tạo và chiếm ô yếu</b>: Trắng không tạo ra d5 — Đen tự tạo ra khi ăn lại bằng tốt d — nhưng Trắng nhớ nó suốt sáu nước và đi Mã theo đường f1–e3–d5. Thứ hai là <b>nhốt quân ở rìa</b>: g3 chặn f4, h4 lấy nốt g5, và con Mã h5 của Đen mất bốn nước mới quay lại được cuộc chơi. Thứ ba là <b>không ăn theo phản xạ</b>: ở nước 28 có ba quân ăn được Mã ở f4, nhưng ăn cái nào cũng mở cột g về phía Vua mình, nên nước đúng là bước Vua sang h2.","notes":[{"at":19,"t":"<b>10…c5</b> — Đây là sơ đồ Chigorin: Đen đẩy Mã ra a5 để ép Tượng Trắng về c2, rồi lấy tốt c5 và d6 làm chỗ dựa ở trung tâm. Ý đồ là chờ Trắng đẩy d4 rồi đổi ở đó, mở cột c cho Hậu và Xe."},{"at":25,"t":"<b>13…dxc5</b> — Ăn lại bằng tốt d thì mở được cột d cho Xe, nhưng cái giá là ô <b>d5 thành lỗ hổng vĩnh viễn</b>: Đen không còn tốt c hay tốt e nào che ô đó. Cả kế hoạch tiếp theo của Trắng chỉ gói trong một câu — đưa Mã tới d5."},{"at":27,"t":"<b>14…♖d8</b> — Xe vào cột d vừa mở, đúng nguyên tắc. Nhưng ô d5 giờ chỉ được canh bằng quân chứ không bằng tốt, mà quân thì có thể bị đổi đi."},{"at":29,"t":"<b>15…♘h5</b> — Mã ra rìa để nhảy vào f4. Nếu vào được f4 thì nó đứng sát Vua Trắng và rất khó đuổi, nên Trắng phải xử lý ngay."},{"at":30,"t":"<b>16 g3!</b> — Chặn f4 bằng tốt. Đổi lại các ô đen quanh Vua Trắng mỏng đi một chút, nhưng Mã h5 lập tức hết việc làm."},{"at":32,"t":"<b>17 h4!</b> — Lấy nốt ô g5. Mã h5 bị nhốt hẳn ở rìa — bốn nước sau nó phải bò về g7. Chú ý tốt h chưa đẩy tiếp được, vì chính Mã Đen đang đứng chắn ở h5."},{"at":36,"t":"<b>19 ♘d5!</b> — Mã vào lỗ hổng, đánh cùng lúc Hậu c7 và Tượng e7. Đen ăn được bằng Tượng e6, nhưng khi đó tốt e4 ăn lại và tốt d5 mới lập tức đánh Mã c6 — nên Đen tránh."},{"at":39,"t":"<b>20…♕xe7</b> — Trắng đã đổi Mã lấy Tượng ô đen. Bây giờ Trắng có <b>hai Tượng</b>, Đen có một Tượng và hai Mã. Bàn cờ còn nhiều đường chéo thoáng, nên đây là lợi thế nhỏ nhưng bền."},{"at":44,"t":"<b>23 ♕f3!</b> — Hậu nhắm vào f6. Tốt f6 bị Mã g4 và Hậu f3 đánh hai lần mà chỉ có Hậu e7 giữ, nên Trắng dọa ♘xf6+ ăn tốt kèm chiếu."},{"at":46,"t":"<b>24 ♕xg4</b> — Đen phải đưa Tượng e6 ra đổi lấy Mã g4 để gỡ dọa. Kết quả là hai Tượng chọi hai Mã, và Hậu Trắng đứng g4 nhìn thẳng xuống cột g."},{"at":48,"t":"<b>25 h5?</b> — Trông như đòn tấn công, và ngay lúc này Đen chưa ăn được thật: tốt g6 đang bị <b>ghim</b> vào Vua g8 bởi Hậu g4. Nhưng cái ghim đó chỉ tồn tại một nước."},{"at":49,"t":"<b>25…♔h8!</b> — Vua bước sang h8 để gỡ ghim cho tốt g6. Sau nước này Đen chơi được …g5, đóng cứng cánh Vua, và tốt h5 của Trắng thành một tốt đứng chết trên ô cố định."},{"at":54,"t":"<b>28 ♔h2!</b> — Mã vừa chiếu ở f4 và có tới ba quân Trắng ăn được nó, nhưng ăn cái nào cũng để tốt g5 ăn lại và <b>mở cột g</b> ngay trước Vua Trắng (ăn bằng Hậu thì mất luôn Hậu). Fischer chỉ bước Vua sang h2 và giữ thế cờ đóng."},{"at":57,"t":"<b>29…cxd3?</b> — Tốt c ăn lại, tạo một tốt lẻ ở d3 nằm sâu trong đất Trắng. Nhưng tốt đó không có tốt nào đỡ và đứng đúng trên cột mà hai Xe Trắng sắp chiếm. Từ đây ván cờ chỉ còn là việc Trắng đi ăn nó."},{"at":66,"t":"<b>34 ♖xd3</b> — Ăn tốt. Xe d3 bị Hậu d6 đánh nhưng phía sau nó là Xe d1. Đồng thời Xe d7 của Đen đang bị Hậu g4 nhắm qua đường chéo g4–d7, và quân duy nhất giữ nó là Hậu d6."},{"at":68,"t":"<b>35 ♕xd7!</b> — Đen vừa ăn Xe bằng Hậu, tức là bỏ rơi Xe d7. Hậu Trắng ăn Xe xong <b>đánh luôn Xe e8</b>, trong khi Hậu Đen ở d3 đang bị Xe d1 nhắm và không có ai đỡ. Đen mất Hậu."}]},"48":{"tiv":"Giải thưởng ván đẹp","ctx":"Byrne cầm Trắng dựng một thế rất chắc chống <b>phòng thủ Gruenfeld</b>: g3, ♗g2, e3, ♘ge2 — ít răng nhưng khó vỡ. Fischer phá bằng …e5 ở nước 12, chấp nhận tốt d5 cô lập để đổi lấy quân hoạt động. Đến nước 14 Trắng đưa <b>nhầm Xe</b> vào cột d, để ô f2 chỉ còn Vua canh, và Fischer lập tức thí Mã ở đó. Chuỗi tiếp theo là ba nước ăn quân liên tiếp của Mã Đen rồi một nước thí tốt để mở đường chéo dài. Byrne xin thua ở nước 21 khi trên bàn cờ vẫn <b>hơn một quân nhẹ</b>, vì không tránh được chiếu hết.","end":"Bài học rõ nhất là câu hỏi <b>“đưa Xe nào?”</b>. ♖ad1 và ♖fd1 nhìn giống hệt nhau, nhưng một nước giữ f2 và một nước bỏ f2 — và đó là toàn bộ ván cờ. Bài học thứ hai: <b>quân bị đánh không nhất thiết phải chạy</b>. Mã d3 bị đánh hai lần, và câu trả lời không phải lùi mà là ăn tiếp vào f2. Bài học thứ ba là giá của đường chéo dài trong các hệ có Tượng g7: Fischer bỏ Mã lấy Tượng g2 rồi bỏ luôn tốt d để dọn sạch a8–h1, và cuối cùng thắng bằng đúng hai đường chéo đó.","notes":[{"at":12,"t":"<b>7 e3</b> — Trắng chọn thế chắc: g3, ♗g2, e3, rồi ♘ge2. Nhược điểm là Tượng g2 đang bị chính tốt d5 của Đen chặn, nên nó chưa nói được câu nào."},{"at":19,"t":"<b>10…♗a6</b> — Tượng ra rìa, nhưng đường chéo a6–f1 đang trống và nó nhắm ngay vào Mã e2. Quan trọng hơn nhiều: bốn nước nữa, chính Tượng này là quân đỡ cho Mã Đen ở d3."},{"at":21,"t":"<b>11…♖e8</b> — Xe vào cột e trong khi tốt e7 vẫn còn đó. Đây là xếp quân cho một cột <b>sắp</b> mở, chuẩn bị cho nước phá …e5."},{"at":23,"t":"<b>12…e5!</b> — Nước phá trung tâm. Tốt e5 được Mã c6 và Xe e8 đỡ hai lần, tốt d4 của Trắng chỉ đánh một lần. Đen sẵn sàng nhận tốt d5 cô lập, đổi lại mọi quân đều có việc."},{"at":25,"t":"<b>13…♘xe5</b> — Ăn lại bằng Mã. Đen mang tốt d5 cô lập, nhưng hãy nhìn ô <b>d3</b> ngay trước tốt đó trong trại Trắng: Trắng không còn tốt c hay tốt e nào canh nó."},{"at":26,"t":"<b>14 ♖fd1?</b> — Đưa Xe vào cột d là đúng ý, nhưng chọn nhầm Xe. Xe rời f1 khiến ô <b>f2 chỉ còn Vua g1 giữ</b>. Nếu chơi ♖ad1 thì Xe f1 vẫn đỡ f2 và toàn bộ đòn phối hợp dưới đây không tồn tại."},{"at":27,"t":"<b>14…♘d3!</b> — Mã nhảy vào ô yếu, đánh Xe d1 và tốt f2 cùng lúc. Không ăn được nó: Mã d3 chỉ bị Hậu d2 đánh, mà nó có Tượng a6 đỡ — ♕xd3 thì ♗xd3 mất Hậu."},{"at":28,"t":"<b>15 ♕c2</b> — Hậu sang c2 để cùng Xe d1 đánh Mã d3 hai lần, trong khi Đen chỉ có một quân đỡ. Về hình thức thì Mã phải chạy."},{"at":29,"t":"<b>15…♘xf2!</b> — Mã không chạy mà ăn tốt f2 — đúng ô mà nước ♖fd1 vừa bỏ trống người canh. Vì chỉ có Vua giữ f2, chính Vua phải đi ăn."},{"at":31,"t":"<b>16…♘g4+</b> — Mã thứ hai vào trận kèm chiếu. Vua Trắng chỉ có bốn ô để đi, và ba trong số đó đẩy Vua ra giữa bàn cờ."},{"at":33,"t":"<b>17…♘xe3</b> — Ăn tốt thứ hai. Điểm đáng chú ý: lúc này <b>không quân Trắng nào đánh được Mã e3</b>, trong khi nó đánh cả Xe d1 lẫn Tượng g2. Đen đã lấy lại hai tốt và vẫn còn đòn."},{"at":35,"t":"<b>18…♘xg2!</b> — Trắng vừa đi ♕d2 (vừa đánh Mã e3 vừa đỡ Xe d1), Fischer đổi Mã lấy Tượng g2. Mục đích không phải vật chất mà là bóc lớp che của Vua Trắng và dọn <b>đường chéo a8–h1</b>."},{"at":37,"t":"<b>19…d4!</b> — Thí tốt để thông hẳn đường chéo dài tới Vua g2, đồng thời đánh Mã c3. Đen không mua vật chất, Đen mua hai đường chéo cho hai Tượng."},{"at":39,"t":"<b>20…♗b7+</b> — Chiếu trên đường chéo vừa mở. Trắng có tám cách đỡ; Byrne đưa Vua về f1."},{"at":41,"t":"<b>21…♕d7!</b> — Hậu vào để sang h3. Byrne xin thua tại đây dù đang hơn một quân nhẹ, và lý do rất cụ thể: 22 ♕f2 ♕h3+ 23 ♔g1 rồi <b>23…♖e1+!</b> 24 ♖xe1 ♗xd4 25 ♕xd4 ♕g2 là chiếu hết. Xe thí ở e1 chỉ để kéo Xe Trắng ra khỏi hàng 1, mở chỗ cho Tượng g7 vào d4."}]},"49":{"tiv":"Một cái bẫy nhiều lớp","ctx":"Steinmeyer chọn <b>phòng thủ Caro-Kann</b> biến cổ điển với 4…♗f5 — đưa Tượng ô trắng ra ngoài dây tốt trước khi chơi …e6. Fischer đổi Tượng ở d3, nhập thành cánh Hậu, và Đen cũng nhập thành cùng cánh, nên không bên nào có mũi tấn công bằng tốt. Đen tiêu vài nhịp vào …♕f4+ và …♘c5 rồi đưa hai Mã ra e4. Nước 16 ♘e5 của Trắng vừa là nước tấn công vừa là <b>miếng mồi</b>: nó mở cột f, làm tốt f2 trông như ăn được. Đen ăn, và nước 17 ♖df1 khép bẫy lại — biên bản trong sách dừng ở đúng chỗ đó.","end":"Ý chính: <b>mở một cột là mở cho cả hai bên</b>. Nước ♘e5 lấy Mã ra khỏi f3 để Hậu Đen với tới f2 — nhưng cũng để Xe Trắng với tới f2, và phía sau f2 là chính con Hậu đó. Bài học thực dụng: trước khi ăn một tốt biên hay tốt f2/f7, hãy <b>đếm số quân đánh và số quân đỡ ô đó sau khi ăn</b>, rồi hỏi thêm quân mình sẽ đứng đó có đường lui nào không. Và mẫu phòng ngự đáng nhớ: khi bị đòn đôi, đừng chỉ nghĩ tới việc chạy — một nước vừa thoát đòn đôi vừa tạo mối đe doạ lớn hơn sẽ giải quyết luôn vấn đề.","notes":[{"at":7,"t":"<b>4…♗f5</b> — Biến cổ điển của Caro-Kann. Đen đưa Tượng ô trắng ra ngoài trước rồi mới chơi …e6; đó là điểm khác chính so với phòng thủ Pháp, nơi Tượng này thường bị chôn sau dây tốt."},{"at":9,"t":"<b>5…♗g6</b> — Tượng lùi về g6 sau khi bị Mã đuổi. Đây là chỗ đứng bình thường, nhưng nó mời một kế hoạch quen thuộc của Trắng: đẩy h4–h5 hỏi thăm."},{"at":12,"t":"<b>7 h4</b> — Đúng kế hoạch đó, đồng thời chiếm chút không gian ở cánh Vua. Đen phải trả lời …h6 để khi h5 lên thì Tượng còn ô h7 mà lùi."},{"at":15,"t":"<b>8…♗xd3</b> — Đen đổi luôn con Tượng vừa tốn mấy nhịp để đưa ra. Đó là giao kèo của cả hệ khai cuộc này: chịu kém không gian, đổi lại cấu trúc tốt không có điểm yếu nào."},{"at":20,"t":"<b>11 0-0-0</b> — Trắng nhập thành cánh Hậu, quân đã ra gần hết, và tốt h4 đã đứng sẵn như một mũi ở cánh Vua."},{"at":23,"t":"<b>12…0-0-0</b> — Đen nhập thành cùng cánh với Trắng. Hai Vua đứng cạnh nhau nghĩa là không bên nào đẩy được tốt tấn công mà không tự mở nhà mình, nên trận đánh dồn về <b>giữa bàn cờ</b>."},{"at":24,"t":"<b>13 ♗c3!</b> — Tượng lên đường chéo dài, đỡ tốt d4 và chuẩn bị đẩy d5. Nhưng nó cũng bỏ trống d2, tức là mở đường chéo c1–h6 về phía Vua Trắng — và Đen chộp ngay."},{"at":25,"t":"<b>13…♕f4+?</b> — Chiếu được, nhưng chiếu này không lấy được gì. Trắng đi ♔b1 — một nước Trắng vốn muốn đi (Vua ra khỏi cột c và khỏi đường chéo). Còn Hậu Đen thì mắc kẹt ở f4, xa hẳn Vua của mình ở c8."},{"at":27,"t":"<b>14…♘c5?</b> — Mã đánh Hậu d3 để giành nhịp, nhưng Hậu chỉ bước sang c2 là vừa an toàn vừa đứng tốt hơn (nhìn theo đường chéo b1–h7). Đen mất thời gian, rồi Mã lại phải đi tiếp lần nữa."},{"at":29,"t":"<b>15…♘ce4</b> — Hai Mã cùng vào e4, trông rất oai: bị Hậu c2 và Mã g3 đánh hai lần, nhưng có Hậu f4 và Mã f6 đỡ hai lần nên đứng được. Chú ý lúc này Đen <b>chưa</b> ăn được f2: Mã f3 của Trắng đang chắn cột f nên Hậu f4 không đỡ tới đó."},{"at":30,"t":"<b>16 ♘e5!</b> — Mã rời f3, nhìn ra c6 và f7. Nhưng việc thứ hai nó làm mới quan trọng: <b>mở cột f</b>. Bây giờ Hậu f4 đỡ được f2, mà f2 chỉ có Hậu c2 giữ — Trắng vừa treo một miếng mồi."},{"at":31,"t":"<b>16…♘xf2</b> — Đen ăn, và trông rất được: Mã ở f2 <b>đánh đôi hai Xe</b> ở d1 và h1."},{"at":32,"t":"<b>17 ♖df1!</b> — Một nước làm bốn việc: Xe thoát đòn đôi, đỡ luôn Xe h1, đánh Mã f2, và xếp thẳng hàng với <b>Hậu f4 đang đứng ngay sau con Mã đó</b>. Mã không nhúc nhích được — đi đâu thì Hậu f4 rơi vào Xe f1; đứng yên thì f2 bị Xe f1 và Hậu c2 đánh hai lần mà chỉ có một quân đỡ."}]},"50":{"tiv":"Màn trổ tài","ctx":"Ván này đánh trong chuyến lưu diễn khắp nước Mỹ của Fischer năm 1964, khi anh đi hết thành phố này tới thành phố khác chơi cờ biểu diễn. Trắng chọn <b>Ván cờ Evans</b>: cho không một Tốt ở cánh Hậu ngay nước 4 để đổi lấy nhịp, rồi dựng c3–d4 và mở hết đường cho quân. Đen trả Tốt lại khá sớm nhưng phạm một lỗi khai cuộc nhỏ ở nước 6, và sau đó phải bỏ quyền nhập thành. Phần còn lại là chuyện Trắng dồn quân vào một Vua kẹt giữa bàn: hai lần thí Mã, một lần thí Xe, và kết bằng việc ăn được Hậu.","end":"Bài học chính không phải mấy nước thí quân mà là <b>thứ tự</b>. Fischer chỉ thí khi Vua Đen đã ở lại e8, khi cột d và cột e đã có Xe, và khi Hậu đã lọt vào c7. Chi tiết thứ hai đáng nhớ là nước <b>15 ♗b5+</b>: một nước chiếu tưởng như vô hại, nhưng nó ép Tốt c7 lên c6, và ô c7 vừa bỏ trống ấy chính là cửa ngõ cho Hậu Trắng ba nước sau. Khi Vua đối phương chưa nhập thành, hãy tìm cách moi các Tốt che chắn nó đi trước, chuyện tấn công tính sau.","notes":[{"at":6,"t":"<b>4 b4!?</b> — Đây là Ván cờ Evans. Trắng cho không một Tốt ở cánh Hậu; đổi lại, sau khi Đen ăn thì Trắng có c3 rồi d4 kèm nhịp, dựng ngay một trung tâm rộng và mở đường cho cả hai Tượng."},{"at":11,"t":"<b>6…d6?</b> — Đen muốn chống đỡ ở e5, nhưng nước này mở ra một loạt đổi quân có lợi cho Trắng. Sau 7 dxe5 ♘xe5 8 ♘xe5 dxe5, Tốt e5 đứng trơ không quân nào giữ, còn Hậu Đen vẫn kẹt ở d8."},{"at":16,"t":"<b>9 ♕h5!</b> — Hậu đánh hai chỗ cùng lúc. Tốt e5 không có ai đỡ, còn ô f7 thì cả Hậu lẫn Tượng c4 cùng ngắm trong khi chỉ có Vua canh. Đen không giữ được cả hai."},{"at":17,"t":"<b>9…g6</b> — Chặn đường chéo h5–f7, nhưng các ô đen quanh Vua Đen (f6, h6) từ đây trống trơn và Vua vẫn chưa nhập thành. Trắng ăn lại Tốt e5, tức là Tốt thí ở nước 4 đã được hoàn vốn — Trắng chơi không mất gì."},{"at":20,"t":"<b>11 ♗a3!</b> — Tượng ra đường chéo a3–f8, đánh Tượng e7 lần thứ hai và ngắm sẵn ô f8. Trắng vừa triển khai quân vừa đe doạ, trong khi Đen chưa có quân nào ở cánh Hậu ra trận."},{"at":21,"t":"<b>11…♖f8</b> — Đen tự bỏ quyền nhập thành, đưa Xe h8 sang giữ f7 lần thứ hai. Vua ở lại e8, và toàn bộ phần còn lại của ván cờ xoay quanh đúng chuyện đó."},{"at":28,"t":"<b>15 ♗b5+!</b> — Chiếu để ép Đen chắn bằng …c6. Tốt rời khỏi c7, và ô c7 vừa bỏ trống ấy chính là chỗ Hậu Trắng sẽ nhảy vào ba nước sau. Đây là kiểu nước dọn đường, không phải nước ăn quân."},{"at":30,"t":"<b>16 ♘c4!</b> — Mã từ a3 sang c4, nhắm ô d6. Bây giờ d6 có Hậu g3 và Mã c4 cùng ngắm, phía Đen chỉ còn Hậu đỡ."},{"at":32,"t":"<b>17 ♖ad1!</b> — Trắng không thèm cứu Tượng b5 mà đưa Xe vào cột d. Ô d6 nay có ba quân Trắng đánh, và cột d chĩa thẳng vào d7, d8 — hai ô ngay cạnh Vua Đen."},{"at":34,"t":"<b>18 ♕c7</b> — Đen vừa ăn Tượng ở b5 và hơn hẳn một quân, nhưng Tốt c6 rời chỗ đã mở toang hàng 7. Hậu vào c7 bắt Tốt b7, giữ ô d6 cho Mã và cắt đứt liên lạc giữa hai cánh của Đen."},{"at":36,"t":"<b>19 ♘d6+</b> — Mã vào đúng ô đã chuẩn bị. Đen chỉ có hai nước hợp lệ: đưa Vua sang e7, hoặc lấy Hậu đổi Mã. Cả hai đều tệ."},{"at":38,"t":"<b>20 ♘f5+!</b> — Thí Mã lần thứ hai. Nếu Đen ăn bằng Tốt g thì Trắng chơi exf5, và Tốt f5 lập tức đánh vào Hậu e6 — Trắng đổi một quân lấy việc bóc nốt hàng Tốt che Vua."},{"at":42,"t":"<b>22 ♖xd7+!</b> — Xe ăn Tượng d7 dù đang bị vây: Vua không lấy lại được vì Hậu c7 đỡ Xe. Đen phải ăn bằng Hậu, tức là Hậu buộc rời e6 — đúng cái Trắng cần."},{"at":44,"t":"<b>23 f6+!</b> — Tốt tiến lên chiếu, mở đường vào Vua e7. Đen ăn bằng Mã, và Mã rời g4 nghĩa là lớp che cuối cùng cũng biến mất; cột e giờ mở toang cho Xe f1."},{"at":48,"t":"<b>25 ♖xe4+</b> — Xe ăn con Mã vừa nhảy vào chắn và tiếp tục chiếu. Vua Đen chạy sang f6, Trắng ăn nốt Hậu ở d7: Trắng còn Hậu và Xe chống lại hai Xe."},{"at":52,"t":"<b>27 ♕g4</b> — Đen xin thua. Vua f6 không còn một ô nào để đi: Xe e4 giữ cả cột e, Hậu g4 giữ f5, g5, g6, g7. Cộng thêm việc Trắng hơn hẳn Hậu đổi Xe, không còn gì để chống."}]},"51":{"tiv":"Ép nghẹt","ctx":"Giải Havana 1965. Fischer không được cấp thị thực sang Cuba nên ngồi ở New York và truyền nước đi qua đường điện báo, đối thủ là cựu vô địch thế giới Smyslov. Trắng chơi <b>Ruy Lopez</b> theo cách chậm rãi nhất: d3, c3, ♘bd2–f1–g3, không tranh gì gấp. Smyslov gỡ thế bằng …d5 rồi đổi Tượng và đổi cả Hậu, tưởng là đã yên. Nhưng cấu trúc Tốt để lại cho Đen một điểm yếu cố định ở b5, và Fischer dành hơn hai chục nước chỉ để cải thiện từng quân một cho tới khi Đen không còn chỗ nào để đặt quân nữa.","end":"Đây là mẫu tàn cuộc đáng học nhất: <b>không có đòn nào cả cho tới nước 41</b>. Trình tự Fischer làm rất rõ ràng — trước hết cố định điểm yếu (26 b4 khoá Tốt b5 lại), rồi chiếm cột mở bằng Xe, rồi đưa Vua ra trung tâm khi hết Hậu, rồi mới chuyển hai quân đang thất nghiệp (Mã f3 và Tượng e3) tới chỗ có việc, và chỉ khi mọi quân đã đứng đúng chỗ mới nổ nước phá c4. Khi đối phương có một Tốt yếu, đừng vội xông vào ăn nó — hãy dùng nó để trói quân đối phương rồi mở mặt trận thứ hai.","notes":[{"at":8,"t":"<b>5 d3</b> — Bỏ qua mọi biến chính của Ruy Lopez. Trắng giữ Tốt e4 bằng d3, chuẩn bị c3 và ♘bd2–f1–g3. Không gay gắt, nhưng cũng không cho Đen mục tiêu nào để phản công."},{"at":17,"t":"<b>9…d5</b> — Smyslov phá trung tâm đúng lúc Trắng chưa nhập thành. Đây là cách gỡ thế đúng: khi bên kia chơi chậm, phải mở cờ ra trước khi họ xếp xong quân."},{"at":21,"t":"<b>11…♗e6!</b> — Đen chủ động mời đổi Tượng ô trắng. Tượng b3 là quân khó chịu nhất của Trắng vì nó ngắm f7 và ô d5; đổi được nó đi thì Đen bớt hẳn lo cánh Vua."},{"at":23,"t":"<b>12…fxe6</b> — Ăn lại bằng Tốt f. Đen chịu đôi Tốt chồng e6–e5 để lấy cột f mở và một khối Tốt trung tâm chắc. Cả phần còn lại của ván cờ là cuộc tranh cãi xem cấu trúc này tốt hay xấu."},{"at":29,"t":"<b>15…♕d3!</b> — Đen ép đổi Hậu ngay giữa bàn. Hết Hậu thì Đen không sợ bị tấn công nữa, nhưng đổi lại ván cờ biến thành một tàn cuộc dài — và đó lại là nơi Fischer ép từng nước một."},{"at":34,"t":"<b>18 ♖a6!</b> — Sau khi đổi hết Tốt a, Xe chiếm cột mở và dừng ở hàng 6, đánh vào Mã c6. Nó không doạ ăn gì ngay, nhưng từ đây Đen phải tính tới nó ở mọi nước."},{"at":36,"t":"<b>19 ♔h1</b> — Nước lặng, không doạ gì cả. Fischer chưa có đòn nào nên chỉnh Vua trước và chờ Đen tự bộc lộ. Đây là nhịp của cả ván: cải thiện dần, không vội."},{"at":49,"t":"<b>25…♘d7?</b> — Cả hai Mã Đen giờ dồn về sau hàng Tốt cánh Hậu, không con nào có ô tiền tiêu. Trong khi đó cột a đã thuộc về Xe Trắng."},{"at":50,"t":"<b>26 b4!</b> — Nước quan trọng nhất của cả ván. Tốt b4 khoá Tốt b5 của Đen lại một chỗ để nó thành bia cố định, đồng thời lấy mất ô c5 của quân Đen."},{"at":60,"t":"<b>31 ♖a5!</b> — Xe lùi một ô để đánh thẳng vào Tốt b5. Đen buộc phải chơi …c6 để giữ, và chính Tốt c6 đó lại chặn nốt đường đi của quân mình."},{"at":64,"t":"<b>33 ♔f1</b> — Vua Trắng đi bộ g1–h1–h2–g2–f1. Hết Hậu rồi thì Vua là một quân mạnh; Fischer đưa nó về trung tâm trước, chuyện đẩy Tốt để sau."},{"at":66,"t":"<b>34 ♘e1!</b> — Mã ở f3 chẳng làm gì, nên nó đi vòng về e1 để ra d3 — từ đó nó giữ cùng lúc b4, c5, e5 và f4."},{"at":70,"t":"<b>36 c4!</b> — Đòn phá, và chỉ bung ra khi mọi quân đã sẵn. Tốt c4 đánh vào b5; Đen ăn thì Mã d2 lấy lại rồi đứng luôn ở c4, mở thêm ô b6 cho Trắng đi vào."},{"at":76,"t":"<b>39 ♗c1!</b> — Tượng e3 hết việc nên đổi chỗ: c1 rồi b2, ra đường chéo dài nhòm Tốt e5. Cùng một kiểu chuyển quân như con Mã ở nước 34 — quân nào đứng không thì đưa đi chỗ khác."},{"at":80,"t":"<b>41 ♘b6!</b> — Mã nhảy vào b6 đánh Mã d7 đang không ai đỡ. Đen buộc phải đổi, và sau đó Xe Trắng vào b6, đánh tiếp Mã b5 cũng không ai đỡ."},{"at":85,"t":"<b>43…c3</b> — Đen xin thua ở đây. Trắng có 44 ♘d7+, đòn đôi vào Vua f6 và Tượng b8; cộng với Xe b6 đang bắt Mã b5, Đen không cách nào giữ đủ quân."}]},"52":{"tiv":"Chiến lược ú oà","ctx":"Giải vô địch Mỹ 1965–66, đối thủ là Rossolimo. Đen chơi <b>Phòng thủ Pháp</b> và chọn biến đưa Tượng ra b4 để đổi lấy Mã c3, chấp nhận cho Trắng cặp Tốt chồng ở cột c để đổi lấy quyền chủ động. Sau một loạt đổi quân sớm, Vua Trắng phải tự tay ăn lại ở d2 và đứng luôn giữa bàn — nghe thì liều, nhưng thế cờ khoá kín nên không sao. Điều làm ván này đáng nhớ là cách Fischer chuyển quân: con Mã lùi hẳn về ô xuất phát rồi đi đường khác, con Tượng ra chiếu rồi lập tức quay về chỗ cũ. Quân biến mất rồi hiện lại ở nơi có việc, và cuối cùng dồn hết vào Vua Đen.","end":"Hai mẫu đáng nhớ. Thứ nhất là <b>chuyển quân đi vòng</b>: Mã f3 lùi về g1 rồi ra h3–f4, ở đó nó đánh e6 và d5 — những ô mà từ f3 nó không bao giờ với tới. Cứ thấy một quân đứng không thì hãy hỏi nó nên ở đâu, kể cả khi đường tới đó là đi lùi. Thứ hai là <b>nước chiếu chỉ để đổi chỗ Vua đối phương</b>: 17 ♗b5+ không ăn gì, không doạ gì, chỉ ép Vua Đen sang f8; xong việc Tượng về ngay d3. Vua đứng sai một ô là cả cỗ máy phòng ngự lệch theo.","notes":[{"at":7,"t":"<b>4…♗b4</b> — Đen ghim Mã c3 để đánh vào Tốt e4. Ý đồ là đổi Tượng lấy Mã, để lại cho Trắng cặp Tốt chồng ở cột c — một điểm yếu lâu dài đổi lấy việc Trắng có cặp Tượng."},{"at":12,"t":"<b>7 bxc3</b> — Trắng ăn lại bằng Tốt b và chấp nhận Tốt chồng c2–c3. Bù lại, Tốt c3 đỡ ô d4 rất chắc, và cột b mở ra cho Xe a1."},{"at":14,"t":"<b>8 ♕g4</b> — Hậu ra đánh thẳng Tốt g7, lúc này không quân nào giữ vì Tượng ô đen của Đen đã bị đổi ở nước 6. Hậu cũng ngắm luôn Mã e4. Đen phải chơi …g6, tự làm yếu các ô đen quanh Vua."},{"at":18,"t":"<b>10 ♔xd2</b> — Chỉ có Vua ăn lại được ở d2, không còn quân nào khác. Nghe lạ nhưng thế cờ đã khoá ở trung tâm nên Vua đứng đó an toàn, và Trắng giữ được Hậu ở chỗ đang có việc."},{"at":25,"t":"<b>13…f5!</b> — Nước hay nhất của Đen trong ván. Tốt f5 bịt kín cánh Vua trước khi Trắng kịp mở, làm h4–h5 mất tác dụng và chặn luôn đường chéo của Tượng d3."},{"at":26,"t":"<b>14 g4</b> — Trắng không chờ thêm nước nào, đập ngay vào f5. Cột g và cột h có mở ra được hay không sẽ quyết định cả ván cờ."},{"at":29,"t":"<b>15…♘e7?</b> — Mã rời c6, bỏ luôn sức ép lên Tốt d4, mà đứng ở e7 cũng chẳng giữ được gì. Ngay sau đó Trắng đổi ở f5 rồi chiếu ở b5."},{"at":32,"t":"<b>17 ♗b5+!</b> — Chiếu để moi Vua Đen ra. Đen còn cách chắn bằng …♘c6, …♗d7 hoặc …♕d7, nhưng chọn đi Vua sang f8 — mất quyền nhập thành và nhốt luôn Xe h8."},{"at":34,"t":"<b>18 ♗d3</b> — Tượng lập tức quay về chỗ cũ. Nó ra chỉ để ép Vua Đen đứng vào ô xấu; xong việc thì trở lại đường chéo b1–h7 để nhòm f5."},{"at":36,"t":"<b>19 ♘g1!</b> — Mã lùi hẳn về ô xuất phát. Ở f3 nó chắn đường Xe h1 mà chẳng đánh được gì; từ g1 nó sẽ đi h3 rồi f4, chỗ thật sự có việc."},{"at":42,"t":"<b>22 h5!</b> — Cạy vào g6. Nếu Đen ăn thì cột g mở toang ngay trước mặt Xe g1; nếu không thì Trắng đổi ở g6 và có một Tốt cắm sát Vua Đen mà Đen không ăn nổi vì Xe g1 đang giữ nó."},{"at":48,"t":"<b>25 ♖ad1!</b> — Trắng bỏ mặc Tốt d4. Đen ăn có chiếu thật, nhưng Trắng chỉ cần bước Vua sang f1 rồi dồn quân tiếp — một Tốt đổi lấy mấy nhịp tấn công."},{"at":56,"t":"<b>29 ♘f4</b> — Con Mã đi f3–g1–h3–f4 đã tới đích. Từ f4 nó đánh Tượng e6, Tốt d5 và cả ô g6; ở f3 nó không với tới ô nào trong số đó."},{"at":58,"t":"<b>30 ♘xe6+!</b> — Ăn Tượng kèm chiếu. Đen phải lấy lại bằng Xe, mà Xe rời e8 thì Tốt f5 mất người giữ — đúng thứ Trắng nhắm."},{"at":60,"t":"<b>31 ♗xf5</b> — Tượng ăn Tốt và cùng lúc đánh cả Xe e6 lẫn Mã g4, không con nào có quân đỡ. Đây là chỗ thế cờ Đen sập."},{"at":62,"t":"<b>32 ♔g1</b> — Đen xin thua. Mấy nước chiếu còn lại chỉ đổi quân vô ích, còn Mã g4 thì bị Xe g3, Hậu h4 và Tượng f5 cùng đánh mà chỉ có Hậu c4 đỡ; Xe e6 cũng đang treo. Đen mất quân là chắc."}]},"53":{"tiv":"Ma thuật bên Đen","ctx":"Santa Monica 1966, Fischer cầm quân Đen trước Portisch. Khai cuộc là <b>Ấn Độ Nimzo</b>: Đen đưa Tượng ra b4 ghim Mã c3, sẵn sàng đổi Tượng lấy Mã để Trắng dính tốt chồng ở cột c. Fischer thêm vào đó ý …b6 và …♗a6 nhắm thẳng con tốt c4 — cả ván xoay quanh con tốt đó. Đến nước 11 Đen bỏ hẳn Xe a8 làm mồi; Portisch ăn, Hậu bị vây ở góc và phải đổi lấy hai Xe. Từ đó Fischer dùng Hậu và Mã ép dần cho tới khi Trắng xin thua ở nước 35.","end":"Ba thứ đáng mang đi. Một là <b>mục tiêu phải có địa chỉ</b>: Đen đổi Tượng lấy Mã c3 không phải để đổi cho vui mà để cố định tốt c4, rồi dồn Tượng a6 và tốt d5 vào đúng chỗ đó — mười nước sau Fischer thu về đúng con tốt ấy. Hai là <b>mẫu bẫy Hậu ở góc</b>: trước khi thí Xe a8, phải đếm cho hết a7, b7, b8, c8, d8 xem quân mình có phủ đủ chưa; ở đây ♕d7 lo hai ô và ♘c6 lo ba ô còn lại. Ba là Hậu đấu hai Xe: Hậu thắng khi tốt đối phương nằm rời nhau và Xe không có cột mở nào để làm việc.","notes":[{"at":7,"t":"<b>4…b6!</b> — Trắng vừa chơi e3, tự khoá Tượng f1 lại sau tốt. Đen đẩy tốt b để mở đường cho Tượng ra a6, nơi nó ngắm thẳng vào ô c4."},{"at":9,"t":"<b>5…♗a6</b> — Tượng đánh vào tốt c4, mà lúc này c4 <b>không có ai đỡ</b>: Mã vừa lên e2 chắn mất đường của Tượng f1. Đây là điểm đau mà Trắng sẽ phải sống chung suốt ván."},{"at":11,"t":"<b>6…♗xc3+!</b> — Đổi Tượng lấy Mã để phá cấu trúc. Sau bxc3 Trắng có <b>tốt chồng ở cột c</b>, và con tốt c4 phía trước trở thành mục tiêu đứng yên cho Tượng a6."},{"at":13,"t":"<b>7…d5</b> — Người tấn công thứ hai. Bây giờ c4 bị đánh hai lần (Tượng a6 và tốt d5) mà chỉ được đỡ một lần."},{"at":16,"t":"<b>9 e4!?</b> — Portisch không gỡ dần mà mở toang trung tâm để giành thế chủ động trước khi Đen kịp siết. Được nhịp, nhưng đổi lại Hậu Trắng sẽ phải ra đứng giữa bàn cờ."},{"at":17,"t":"<b>9…dxe4!</b> — Đen ăn ngay. Sau khi hai đôi Mã đổi hết ở e4, Hậu Trắng lên e4: nhìn thì oai, nhưng đó đúng là ô mà quân Đen sắp đuổi."},{"at":21,"t":"<b>11…♕d7!!</b> — Đen <b>bỏ mặc Xe a8</b> cho Hậu Trắng ăn. Hậu về d7 không phải để giữ Xe mà để bịt d8 và c8, đồng thời đỡ ô c6 cho nước …♘c6 sắp tới. Đây là lời mời có tính toán, không phải sơ suất."},{"at":25,"t":"<b>13…f5</b> — Tốt f đuổi Hậu và nhắc lại lời mời: hoặc Trắng lùi Hậu về, hoặc cầm Xe a8 lên."},{"at":26,"t":"<b>14 ♕xa8?</b> — Trắng nhận lời. Hậu vẫn còn chỗ lùi an toàn (e3, e2, f3) nên đây là một lựa chọn chứ không phải nước bắt buộc."},{"at":27,"t":"<b>14…♘c6</b> — Đếm các ô Hậu a8 có thể đi: a7 và b8 do Mã c6 giữ, b7 do Tượng a6 giữ, c8 và d8 do Hậu d7 cùng Xe e8 giữ, còn ♕xc6 thì Hậu d7 ăn lại. Chỉ còn một đường duy nhất là ăn nốt Xe e8 rồi bị bắt lại — Đen đổi <b>hai Xe lấy Hậu</b>."},{"at":33,"t":"<b>17…♗xc4</b> — Món nợ từ khai cuộc được thu về: con tốt c4 rơi. Sau khi đổi hết ở c4, Đen còn Hậu và Mã đối lại hai Xe với Tượng, nhưng tốt c3 và d4 của Trắng đứng lẻ, còn hai Xe thì chưa có cột nào để làm việc."},{"at":41,"t":"<b>21…h6!</b> — Chặn ♗g5 và dọn chỗ cho …g5. Đen lấy không gian ở cánh Vua và mở lối cho Vua đi ra f7 — vào tàn cuộc thì Vua là một quân đánh."},{"at":53,"t":"<b>27…♕d5!</b> — Hậu vào giữa bàn làm hai việc một lúc: đỡ Mã c4 đang bị Xe e4 nhắm, và quay lại đánh chính con Xe đó. Trắng phải lo cho quân mình thay vì tấn công."},{"at":55,"t":"<b>28…♘e3!</b> — Mã lao vào ô bị ba quân Trắng đánh (Xe e1, Xe e4, tốt f2) mà chỉ có tốt f4 đỡ. Điểm mấu chốt nằm ở chuỗi tiếp theo: sau 29 ♖1xe3 fxe3, Xe e4 lại bị Hậu d5 đánh và tốt e3 chỉ còn hai bước tới hàng cuối, nên 30 ♖xe3 gần như bắt buộc. Đen đổi một Mã cộng một tốt lấy trọn một Xe."},{"at":59,"t":"<b>30…♕xa2</b> — Nhặt thêm tốt biên. Bây giờ là Hậu cùng năm tốt đấu Xe, Tượng cùng bốn tốt; tốt Trắng nằm rời từng con một, đúng loại thế cờ Hậu ăn dần mà không cần đòn."},{"at":69,"t":"<b>35…♔c6</b> — Vua Đen đi bộ sang cánh Hậu nấp sau tốt c5 và Hậu của mình. Trắng chỉ còn hai nước chiếu lẻ (♖c8+ và ♖xa6+), không có chuỗi chiếu nào nối được, còn Xe a8 và Tượng g7 thì không có mục tiêu. Portisch xin thua."}]},"54":{"tiv":"Hôm Najdorf nghỉ chơi biến Najdorf","ctx":"Cũng ở Santa Monica 1966, lần này Fischer cầm Trắng. Najdorf bỏ chính biến mang tên mình mà chơi 2…♘c6, tức là tự bước ra khỏi vùng thuộc bài của ông. Fischer đẩy Mã lên b5 rồi dùng Tượng chọc f4–g5 để đổi con Mã f6 — mục tiêu là cắm quân vào ô <b>d5</b>. Kế hoạch đó hỏng ở nước 12 vì Trắng đổi nhầm quân và Đen bịt được d5 bằng một con tốt. Fischer chuyển hướng sang c4–c5 ở cánh Hậu, đổi Hậu để lấy một tốt thông ở d6, rồi ăn dần trong tàn cuộc Xe cho tới khi Đen mất quân vì một đòn ghim ở nước 47.","end":"Bài học đầu là về <b>ô yếu</b>: một ô chỉ yếu thật khi không còn con tốt nào với tới nó. Trắng đổi Tượng ở e6 và vô tình cho Đen kéo một con tốt về đúng ô đó — từ giây phút ấy d5 hết là lỗ hổng. Bài học thứ hai là <b>kế hoạch hỏng thì đổi kế hoạch</b>: Fischer không cố đấm vào d5 nữa mà quay sang c4–c5, nơi Đen đã tự làm yếu bằng …b5 và …b4. Bài học thứ ba là mẫu tàn cuộc rẻ nhất: khi Vua và một quân của đối phương đứng cùng một cột, hãy tìm cách đặt Xe vào cột đó — nước cuối của ván là đúng như vậy.","notes":[{"at":3,"t":"<b>2…♘c6</b> — Najdorf không chơi biến của chính mình (…d6 rồi …a6) mà đưa Mã ra c6. Không có gì sai về mặt cờ, chỉ là ông rời khỏi thứ mình thuộc nhất khi ngồi trước người chuẩn bị khai cuộc kỹ nhất giải."},{"at":10,"t":"<b>6 ♗f4!?</b> — Tượng ra f4 dồn thêm sức ép lên d6: tốt đó đang bị Hậu d1, Tượng f4 và Mã b5 nhắm, chỉ được Hậu d8 với Tượng f8 đỡ. Đen gần như buộc phải đẩy …e5, và tốt e5 khoá luôn đường về của chính nó — ô d5 thành lỗ trống lâu dài."},{"at":14,"t":"<b>8 ♗g5!?</b> — Tượng quay lại ghim Mã f6. Ý đồ nói thẳng ra là: đổi con Mã đang canh d5 rồi cắm quân vào đó."},{"at":15,"t":"<b>8…♗e6?</b> — Đen giao việc canh d5 cho Tượng và để mặc Trắng đổi ở f6. Sau 9 ♘1c3 a6 10 ♗xf6 gxf6, cánh Vua Đen vỡ thành <b>tốt chồng ở cột f</b>, còn d5 chỉ còn đúng một quân trông coi."},{"at":19,"t":"<b>10…gxf6</b> — Phải ăn bằng tốt g: ăn bằng Hậu thì ♘xd6+ vừa chiếu vừa lấy tốt. Kết quả là Đen mang tốt chồng f6/f7, cột g mở về phía Vua mình, và ô <b>d5 chỉ được Tượng e6 canh</b> — không tốt nào với tới ô đó."},{"at":22,"t":"<b>12 ♗c4?</b> — Trắng muốn đổi nốt người canh d5. Nhưng đổi ở e6 thì Đen ăn lại bằng <b>tốt f</b>: d5 từ chỗ được một quân trông coi thành được một tốt trông coi, mà tốt thì không đổi đi đâu được. Cả kế hoạch chiếm d5 tan ở nước này."},{"at":25,"t":"<b>13…fxe6</b> — Đúng như vậy. Đen giờ có ba đảo tốt xấu xí, nhưng ô d5 bị bịt vĩnh viễn và không quân Trắng nào vào được nữa. Trắng phải nghĩ ra việc khác để làm."},{"at":29,"t":"<b>15…♕d7?</b> — Hậu ra d7 chắn mất cột d của chính Xe a8 và không giải quyết vấn đề nào. Chỗ Đen cần lo là chuỗi tốt a6/b5 ở cánh Hậu, nơi Trắng sắp đánh vào."},{"at":30,"t":"<b>16 c4</b> — Đổi hướng. Không vào được d5 thì đánh vào a6–b5. Tốt c4 vừa chạm vào b5 vừa mở đường cho Xe a1 sau này."},{"at":41,"t":"<b>21…♖g8?</b> — Xe ra cột g dọa …♖xg2+, nhưng lời dọa đó chưa có gì đỡ lưng và Vua Đen thì vẫn kẹt ở giữa bàn. Đen mất nhịp đúng lúc Trắng đang cần thời gian để cạy cánh Hậu."},{"at":42,"t":"<b>22 a3!</b> — Đâm vào chân tốt b4. Đen ăn thì cột a mở ngay cho Xe a1, mà tốt a6 phía cuối cột thì chỉ có Xe a8 đỡ."},{"at":48,"t":"<b>25 ♕e2!</b> — Một nước gỡ hai chỗ. Hậu c6 của Đen đang đánh cả tốt c4 lẫn tốt e4; Hậu về e2 đỡ c4 theo đường chéo và đỡ e4 theo cột e cùng một lúc."},{"at":50,"t":"<b>26 c5!</b> — Đẩy tốt vào, chấp nhận cho ăn. Đen chọn ăn e4 và phải đổi Hậu; sau cxd6 Trắng có một <b>tốt thông ở hàng 6</b> nằm ngay trước mặt Vua Đen. Đây là nước biến ưu thế thế trận thành thứ đếm được."},{"at":54,"t":"<b>28 cxd6</b> — Kết quả của chuỗi vừa rồi: Đen ôm <b>ba tốt chồng trên cột e</b> (e4, e5, e6) không đi đâu được, còn tốt d6 của Trắng chia đôi thế cờ và trói hai Xe Đen vào việc canh ô d8."},{"at":74,"t":"<b>38 ♘b6+</b> — Thí Mã để kéo Xe b8 rời hàng 8. Sau ♖xb6 thì ♖c8 đuổi Xe a8 và con tốt d7 chỉ còn một bước là phong Hậu; Trắng thu về đủ vốn cộng lãi, ra tàn cuộc hơn chất."},{"at":92,"t":"<b>47 ♖e1!</b> — Xe vào cột e và <b>ghim Tượng e5 vào Vua e6</b>. Con Tượng không còn một nước đi hợp lệ nào; Đen mất quân trắng trợn và dừng ván ở đây."}]},"55":{"tiv":"Cái giá của sự bất cẩn","ctx":"Olympic Havana 1966, Fischer cầm Trắng trong phòng thủ Sicilian. Trắng dựng thế quen thuộc với ♗c4–♗b3 chĩa vào f7, rồi đẩy f4–f5 để cạy con tốt e6. Đen đi bắt quân bằng …♘c5 và …♘fxe4 trong khi Vua còn đứng giữa bàn và cả cánh Vua chưa triển khai; Fischer bỏ qua cả hai con Mã mà đẩy tốt tới e6, biến một con tốt thành mũi khoan. Sau nước chiếu vô ích 10…♕h4+, Đen mất quyền nhập thành và không bao giờ gỡ lại được nhịp. Ván dừng ở nước 22, khi Đen không còn cách nào giữ quân.","end":"Điều đáng nhớ nhất không phải một đòn cụ thể mà là <b>thứ tự việc</b>: khi Vua còn ở giữa bàn thì đừng đi bắt quân. Đen ăn được một tốt và dọa được một Tượng, nhưng trả bằng quyền nhập thành và bằng cả cánh Vua đứng im. Thứ hai là sức mạnh của <b>một con tốt cắm vào e6/f7</b>: nó không ăn gì cả, nó chỉ chiếm ô và cắt liên lạc, và chính nó ép Vua Đen chạy sang d8. Thứ ba là mẫu kết rất đáng học: dồn nhiều quân vào cùng một ô (ở đây là e6), rồi tìm nước làm mất người bảo vệ ô đó — nước 21 ♕e4 vừa đánh đôi hai chỗ khác vừa thêm một tay vào e6.","notes":[{"at":10,"t":"<b>6 ♗c4</b> — Tượng chĩa thẳng vào f7, cách chơi Fischer ưa dùng trong Sicilian. Đen đáp …e6 để chặn đường chéo lại."},{"at":12,"t":"<b>7 ♗b3</b> — Lùi trước khi bị đuổi bằng …b5 hay …d5. Tượng ở b3 vẫn nhìn về e6 và f7, và nó sẽ là quân quan trọng nhất trong đòn sắp tới."},{"at":14,"t":"<b>8 f4!</b> — Tốt f lên chuẩn bị f5, tức là cạy vào con tốt e6 vừa dựng lên. Đơn giản: mở đường chéo cho Tượng b3 và mở cột f cho Xe."},{"at":15,"t":"<b>8…♘c5!?</b> — Mã ra c5 đánh Tượng b3. Nhưng đây là đi bắt quân trong khi Vua còn ở giữa bàn, Tượng f8 và hai Xe chưa động đậy."},{"at":16,"t":"<b>9 f5!</b> — Trắng lờ luôn con Tượng bị đánh mà đẩy tốt. Bây giờ ô e6 bị ba thứ nhắm cùng lúc: tốt f5, Tượng b3 và Mã d4."},{"at":17,"t":"<b>9…♘fxe4!?</b> — Đen ăn tốt trung tâm, tính rằng ♘xe4 thì …♘xb3 gỡ lại được. Nhưng Trắng không định ăn Mã."},{"at":18,"t":"<b>10 fxe6!</b> — Điểm mấu chốt của cả ván. Trắng không đi bắt quân mà đẩy tốt tới e6, chọc thẳng vào f7 — nơi Vua Đen còn đứng. Con tốt này điều khiển toàn bộ phần còn lại."},{"at":19,"t":"<b>10…♕h4+?</b> — Chiếu cho có. Trắng chỉ có ba nước đáp và g3 là nước tự nhiên nhất; sau đó Hậu Đen đứng chơ vơ ở h4 và sẽ bị đuổi mất nhịp. Việc cần làm là lo cho con tốt e6 và cho Vua, không phải đi chiếu."},{"at":21,"t":"<b>11…♘xg3</b> — Mã ăn tốt g3 và dọa cả Xe h1. Ăn lại bằng hxg3 thì …♕xh1+, nên Trắng phải tìm đường khác."},{"at":22,"t":"<b>12 ♘f3!</b> — Nước gỡ mọi thứ cùng lúc: Mã từ d4 nhảy ra <b>đánh Hậu h4</b> và đồng thời bịt cột h. Hậu Đen phải chạy, còn con Mã g3 thì kẹt lại không ai đỡ."},{"at":24,"t":"<b>13 exf7+</b> — Con tốt đi tiếp tới f7, vừa chiếu vừa đứng sát hàng phong. Vua Đen phải chọn ô chạy và <b>mất quyền nhập thành vĩnh viễn</b>."},{"at":28,"t":"<b>15 ♘d5!</b> — Mã vào giữa với hai lời dọa: ♘b6 <b>đánh đôi</b> Xe a8 với Tượng c8, và ♗g5 chiếu. Đen phải bỏ dở mọi việc khác để đi ăn con tốt f7."},{"at":32,"t":"<b>17 ♕e2+!</b> — Chiếu để ép Đen tự bịt đường bằng …♗e6. Con Tượng đứng đó thành mục tiêu cố định: Tượng b3, Mã và cả hai Xe của Trắng đều có thể chĩa vào đúng ô ấy."},{"at":36,"t":"<b>19 0-0-0</b> — Nhập thành dài, đưa Xe vào cột d — đúng cột Vua Đen đang đứng, giữa chỉ có mỗi con tốt d6. Đến đây Trắng đã ra hết quân, Đen vẫn còn ba quân đứng nguyên ở nhà (Xe a8, Tượng f8, Xe h8)."},{"at":40,"t":"<b>21 ♕e4!</b> — <b>Đánh đôi</b> hai chỗ không ai đỡ cùng lúc: Mã f5 và tốt b7. Ngoài ra Hậu còn thêm một tay nữa vào ô e6, nơi đang có hai quân Trắng đánh và hai quân Đen đỡ."},{"at":42,"t":"<b>22 ♘xe6</b> — Ăn được vì Vua d7 <b>không được phép ăn lại</b> (Hậu e4 canh ô đó), còn …♕xe6 thì ♖xd6+ kéo Vua ra rồi ♕xe6+ — Trắng hơn hẳn quân. Đen hết cách giữ, ván dừng ở đây."}]},"56":{"tiv":"Biến tiếp của Fischer","ctx":"Olympiad Havana 1966, Fischer cầm Trắng gặp Gligorić trong <b>Ruy Lopez biến đổi quân</b>. Trắng đổi Tượng lấy Mã ở c6 ngay nước 4: chịu mất cặp Tượng để đổi lấy một cấu trúc tốt tốt hơn hẳn — Đen mang hai tốt chồng ở cột c suốt ván. Nước 5 nhập thành là cách xử lý Fischer hay dùng: chưa vội d4, cứ đưa Vua vào chỗ an toàn trước. Gligorić thủ chắc tới nước 17 thì đưa Vua sang a7 — đúng cột mà Hậu Trắng vừa đứng vào — và mất luôn quân. Trắng thắng ở nước 25.","end":"Hai thứ đáng nhớ. Một: đổi ở c6 là bán cặp Tượng để mua cấu trúc. Sau khi đổi tốt ở d4, Trắng có <b>4 tốt chọi 3 ở cánh Vua</b> (làm ra tốt thông được), Đen có 4 chọi 3 ở cánh Hậu nhưng hai tốt chồng ở cột c nên không làm ra tốt thông. Hai: nước thua không phải một đòn phối hợp dài — chỉ là đặt Vua sai ô. Khi Hậu đối phương đã chiếm một cột, đừng đưa Vua vào cột đó, kể cả khi giữa hai bên còn quân chắn — vì quân chắn thường bắt được.","notes":[{"at":6,"t":"<b>4 ♗xc6!</b> — Đổi Tượng lấy Mã. Đen ăn lại bằng tốt d để mở đường cho Tượng c8, nhưng từ đây Đen mang hai tốt chồng ở cột c. Trắng mất cặp Tượng, được cấu trúc."},{"at":8,"t":"<b>5 0-0!</b> — Chưa vội ăn tốt e5: sau 5 ♘xe5 thì 5…♕d4 đánh đôi Mã e5 và tốt e4, Mã e5 không có quân nào đỡ nên Đen lấy lại ngay. Nhập thành trước, để dành d4 cho nước sau."},{"at":9,"t":"<b>5…f6!</b> — Đen phải lấy tốt f giữ tốt e5. Cái giá là ô f6 mất chỗ cho Mã g8: nó sẽ phải đi vòng e7–g6 và mất hai nhịp."},{"at":11,"t":"<b>6…♗g4!</b> — Ghim Mã f3 vào Hậu d1. Chừng nào còn ghim thì tốt d4 chưa được Mã đỡ đủ, nên Trắng buộc phải chống bằng c3."},{"at":16,"t":"<b>9 h3!</b> — Hỏi thẳng Tượng g4: đổi ở f3 thì Đen mất cặp Tượng, thứ duy nhất bù lại cho hai tốt chồng. Gligorić lùi về e6 giữ Tượng, nhưng tốt h3 về sau thành mục tiêu."},{"at":20,"t":"<b>11 ♗f4!</b> — Đen vừa nhập thành cánh Hậu, tức là đưa Vua về đúng cánh có tốt hỏng. Tượng ra f4 với một việc cụ thể: nó ngắm ô c7, ngay cạnh Vua Đen, và cột c sắp mở."},{"at":21,"t":"<b>11…♘e7?</b> — Mã đi đường vòng g8–e7–g6 để tới một ô chẳng làm gì. Trong hai nhịp đó Trắng kịp ♖c1 rồi ♘a4–c5."},{"at":26,"t":"<b>14 ♘a4!</b> — Mã rời trung tâm để nhắm ô c5. Từ c5 nó đánh e6, d7, b7 và a6 — tất cả đều là ô quanh Vua Đen."},{"at":27,"t":"<b>14…♗xg3?</b> — Đen tự bỏ Tượng ô đen của mình. Trắng ăn lại bằng tốt f, được cột f mở cho Xe; còn Đen không còn quân nào tranh ô c5 với Mã Trắng nữa."},{"at":32,"t":"<b>17 ♕a4!</b> — Hậu cùng lúc đánh tốt a6 và tốt c6, nhưng điều quan trọng hơn là nó chiếm cột a."},{"at":33,"t":"<b>17…♔a7??</b> — Vua bước vào đúng cột Hậu Trắng đang đứng. Giữa hai quân chỉ còn mỗi tốt a6 làm vật chắn — mà vật chắn đó bắt được."},{"at":34,"t":"<b>18 ♘xa6!</b> — Ăn ngay vật chắn. Vua không bắt lại được vì Mã a6 có Hậu a4 đỡ dọc cột; còn 18…bxa6 thì cột b mở toang trước mặt Vua a7 trong khi Xe c1 đã chờ sẵn."},{"at":36,"t":"<b>19 e5!</b> — Đánh vào Hậu d6, buộc Đen phải trả lời ngay thay vì kịp thu xếp sau khi vừa ăn tốt h3."},{"at":40,"t":"<b>21 ♘c5+</b> — Đây mới là lý do Mã đứng ở a6: nó bước đi thì Hậu a4 chiếu thẳng lên cột a. <b>Chiếu mở</b>, và Trắng có nhịp để lấy lại quân."},{"at":42,"t":"<b>22 gxh3</b> — Ăn lại Tượng, kết toán xong. Trắng hơn hẳn hai Mã và chỉ kém hai tốt."},{"at":48,"t":"<b>25 ♕c2</b> và Đen xin thua. Hơn hai Mã đổi hai tốt thì không còn gì để chơi nữa."}]},"57":{"tiv":"Đổi nhịp","ctx":"Monaco 1967. Larsen cầm Trắng chơi <b>Phòng thủ Ấn Độ Vua</b> theo cách ít ai chờ: đổi Hậu ngay ở nước 10, biến một hệ khai cuộc vốn để hai bên chạy đua tấn công thành tàn cuộc dài. Từ nước 14 đến 17 hai bên đi vào một loạt đổi chác kết thúc với vật chất cân bằng, nhưng Xe Trắng thì kẹt sâu trong đất Đen. Fischer đổi Xe, đổi luôn Tượng ô đen của Trắng để lấy hai ô tiền tiêu c5 và d4 cho hai Mã, rồi mở cánh Hậu. Ván kéo tới nước 61: Trắng xin thua khi Mã của họ bị trói vĩnh viễn vào ô phong cấp c1.","end":"Đây là mẫu thắng một thế cờ \"hòa trên giấy\". Fischer không đi tìm đòn — anh <b>đổi đúng quân</b>: bỏ con Tượng ít việc để lấy con Tượng đang canh hai ô c5 và d4, sau đó hai Mã vào ở đó và không tốt nào đuổi được (Trắng đã hết tốt c). Tiếp theo là h5 cố định cánh Vua, rồi …c5 mở cánh Hậu đúng lúc Xe đã đứng sẵn ở cột a. Chi tiết tàn cuộc đáng chép lại: <b>một Mã phải đứng canh ô phong cấp thì coi như đã mất</b> — nó không đi đâu được nữa, và Vua đối phương rảnh tay ăn nốt tốt còn lại.","notes":[{"at":15,"t":"<b>8…♖e8!</b> — Xe về cột e đỡ tốt e5. Nhờ vậy Đen không phải chọn giữa việc giữ tốt và việc đổi ở d4 — cứ để ngỏ cả hai hướng."},{"at":19,"t":"<b>10…♘xd8</b> — Hậu đã đổi ở nước 10, ván cờ thành tàn cuộc từ rất sớm. Fischer ăn lại bằng Mã c6 chứ không bằng Xe, vì con Mã này sẽ đi d8–e6 vào chỗ có việc, còn Xe thì đang đứng tốt rồi."},{"at":25,"t":"<b>13…b6!</b> — Chặn nước c5 của Trắng và mở đường cho Tượng c8. Cái giá là tốt a7 hở ra, và Larsen sẽ ăn nó ngay."},{"at":26,"t":"<b>14 c5!?</b> — Larsen vẫn đẩy, thí tốt để mở đường cho hai Xe. Sau 14…♘xc5 15 ♖d8+ Đen phải chắn ở hàng 8 (Fischer chọn ♗f8) và Xe Trắng lọt hẳn vào đất Đen."},{"at":32,"t":"<b>17 ♖xc8</b> — Kết toán cả loạt đổi: Trắng mất một Mã và tốt c, Đen mất Tượng c8 và tốt a7 — vật chất bằng nhau. Nhưng Xe c8 đang đứng sâu trong đất Đen mà không có việc gì để làm."},{"at":33,"t":"<b>17…♔g7</b> — Vua bước ra, và từ đây Đen đi liền mấy nước có nhịp (…♘e8–d6, …♖e8) để đuổi con Xe đó. Trắng chỉ chạy Xe, không làm được gì khác."},{"at":45,"t":"<b>23…♘xe8</b> — Một cặp Xe rời bàn. Còn lại Trắng có Xe, hai Tượng và một Mã; Đen có Xe, một Tượng và hai Mã. Bằng nhau về điểm, nhưng Mã h3 của Trắng đứng ngoài rìa."},{"at":51,"t":"<b>26…♗c5!</b> — Đem con Tượng ít việc nhất của mình ra đổi. Lý do rất cụ thể: Tượng e3 của Trắng đang canh cả hai ô <b>c5 và d4</b> — đúng hai ô mà Mã Đen muốn vào. Đổi nó đi là lấy được cả hai ô đó vĩnh viễn."},{"at":55,"t":"<b>28…h5!</b> — Chiếm chỗ ở cánh Vua và chặn nước g4 của Trắng trước khi nó kịp đi. Tốt h còn để dành nước h4 cho sau."},{"at":59,"t":"<b>30…♔e7!</b> — Tàn cuộc rồi thì Vua là quân đánh: nó tiến vào giữa và dọn đường cho …c6 đuổi Xe d5. Hai nước sau Xe Trắng phải lùi về d2 thật."},{"at":63,"t":"<b>32…♘d4!</b> — Mã vào ô tiền tiêu giữa bàn: chặn cột d của Xe Trắng, đánh tốt f3, và <b>không tốt nào đuổi được nó</b> vì Trắng đã hết tốt c từ nước 14."},{"at":67,"t":"<b>34…b5!</b> — Không lùi Mã c5 mà đẩy tốt b đánh vào Tượng c4. Nếu 35 bxc5 bxc4 thì đổi ngang quân, nhưng tốt c4 của Đen thành tốt thông còn tốt c5 của Trắng bị chính tốt c6 chặn đứng. Larsen chọn lùi Tượng ra g8, tức là đưa nó ra rìa."},{"at":75,"t":"<b>38…c5!</b> — Phá ở cánh Hậu, nơi Xe a6 đã đứng sẵn từ nước trước. Trắng không có tốt c để đối lại, nên mọi đường mở ra đều mở về phía Đen."},{"at":77,"t":"<b>39…c4</b> — Tốt vượt qua và thành tốt thông. Từ đây tới cuối ván nó quyết định mọi thứ: quân Trắng phải bỏ việc khác để đi canh nó."},{"at":105,"t":"<b>53…♘b3</b> — Mã đâm vào Xe c1. Trắng gỡ bằng 54 ♔g2 đánh lại Xe h3, hai bên đổi Xe ngang nhau — nhưng sau khi đổi Đen hơn một tốt và có tốt thông c4 chạy trước."},{"at":118,"t":"<b>60 ♘b3</b> — Mã Trắng phải quay về canh ô c1, và từ giờ nó đứng chết ở đó. Vua Đen rảnh tay đi ăn tốt b6; sau 61…♔xb6 Trắng còn một Mã bị trói cùng một tốt h, không ngăn nổi hai tốt e và h của Đen. Trắng xin thua."}]},"58":{"tiv":"Kiệt tác có tì vết","ctx":"Skopje 1967. Fischer cầm Trắng gặp Geller trong <b>Phòng thủ Sicilian</b> với ♗c4 — hệ khai cuộc gắn với tên anh. Hai bên nhập thành hai phía: Trắng dồn tốt f để phá điểm e6, Đen đẩy tốt b để phá Mã c3. Ai nhanh hơn một nhịp thì bên kia chết. Fischer đi hai nước rất mạnh (15 f5 và 16 fxe6) đưa tốt tới f7 sát Vua Đen, chấp nhận mất Mã. Nhưng đến nước 20 anh đẩy tốt a2 lên a3 — và chính nước đó mở ô a2 cho Tượng Đen. Geller kết bằng hai nước Tượng; Trắng xin thua ở nước 24 vì không đỡ nổi chiếu hết.","end":"Ván này dạy hai thứ ngược chiều nhau. Thứ nhất: trong cuộc đua nhập thành hai phía, đừng đếm quân mà <b>đếm nhịp</b> — Fischer bỏ hẳn Mã c3 để tốt f kịp tới f7. Thứ hai, và quan trọng hơn: khi Vua mình ở b1 thì mỗi nước tốt cánh Hậu là một vết nứt. Tốt a2 lên a3 đuổi Hậu, được một nhịp, nhưng để lại ô a2 trống — và đúng ô đó là ô Tượng Đen đứng vào để dọn đường cho <b>♕xb2 chiếu hết</b>. Trước khi đẩy tốt ngay trước mặt Vua mình, hãy xem ô vừa bỏ trống có ai vào được không.","notes":[{"at":17,"t":"<b>9…♕a5</b> — Hậu ra a5 dọn đường cho Xe a8, đồng thời nhìn thẳng vào Mã c3 trên đường chéo a5–c3. Đen báo trước sẽ chơi ở cánh Hậu."},{"at":18,"t":"<b>10 0-0-0</b> — Nhập thành hai phía. Từ đây không còn nước nào được phép \"đi cho chắc\": mỗi nước phải là một nhịp trong cuộc đua tới Vua đối phương."},{"at":22,"t":"<b>12 ♔b1</b> — Vua rời cột c trước khi Đen kịp mở cột đó. Nước phòng xa quen thuộc của Trắng trong Sicilian."},{"at":24,"t":"<b>13 f4</b> — Bắt đầu. Tốt f sẽ đi f5 đập vào e6 — điểm tựa của cả thế Đen ở trung tâm."},{"at":27,"t":"<b>14…b5</b> — Đen chạy đua ở phía bên kia: tốt b sẽ đi b4 đuổi Mã c3, và khi Mã đó rời chỗ thì Hậu a5 nhìn thẳng vào vùng trước mặt Vua Trắng."},{"at":28,"t":"<b>15 f5!!</b> — Không giữ b5, không lùi, không đổi. Trắng đẩy thẳng vào e6: lúc này giá của một nhịp cao hơn giá của một quân."},{"at":30,"t":"<b>16 fxe6!</b> — Mã c3 đang bị tốt b4 đánh và Trắng không cứu nó. Ăn ở e6 trước, vì tốt e6 chỉ còn một bước là tới f7."},{"at":32,"t":"<b>17 exf7+</b> — Tốt tới f7, ngay sát Vua Đen, chặn ô f7 và có Xe f1 đứng ngay sau. Nhưng bên kia bàn cờ Đen cũng có một tốt c3 nằm sát Vua Trắng: Trắng có hai quân ăn được nó (tốt b2 và Tượng d4), mà ăn bằng tốt b2 thì tự mở cột b trước mặt Vua mình."},{"at":34,"t":"<b>18 ♖f5!</b> — Xe nhấc lên hàng 5 rồi đánh ngang sang Hậu a5. Vừa đuổi Hậu vừa đưa Xe ra chỗ có việc, không mất nhịp nào."},{"at":36,"t":"<b>19 ♕f1!</b> — Hậu về f1, xếp sau Xe f5 và tốt f7. Cả ba quân mạnh nhất của Trắng nằm trên một cột chĩa vào Vua Đen."},{"at":37,"t":"<b>19…♘xe4</b> — Đen ăn tốt trung tâm, và Mã e4 giữ luôn tốt c3. Đây là lúc căng nhất: Trắng có tốt f7, Đen có tốt c3, cả hai đều nằm sát Vua đối phương."},{"at":38,"t":"<b>20 a3?</b> — Đuổi Hậu b4, được một nhịp. Nhưng tốt vừa rời a2, và ô a2 để trống chính là ô Tượng Đen sẽ đứng vào. Đây là chỗ ván cờ đổi chủ."},{"at":40,"t":"<b>21 ♕f4</b> — Hậu đánh Mã e4. Chỉ là dọa suông: Mã ấy đang được Hậu b7 đỡ từ xa trên đường chéo b7–e4."},{"at":41,"t":"<b>21…♗a4!!</b> — Tượng rời c6 đâm vào Tượng b3, và không được ăn: 22 ♗xa4 thì 22…♕xb2 <b>chiếu hết</b> — Hậu vào b2 có tốt c3 đỡ, Vua b1 không bắt được. Chính nước Tượng này mở cột b cho Hậu."},{"at":43,"t":"<b>22…♗f6!</b> — Tượng vào f6 đánh Tượng d4 và chắn cột f. Trắng phải ăn bằng Xe f5 — mà một nhịp là đủ cho Đen."},{"at":45,"t":"<b>23…♗xb3!</b> — Ăn Tượng và dọa 24…♗a2+ 25 ♔xa2 ♕xb2 chiếu hết. Đỡ bằng 24 cxb3 thì 24…c2+ vừa chiếu vừa đánh Xe d1. Trắng xin thua."}]},"59":{"tiv":"Con Tượng đi lạc","ctx":"Skopje 1967, Kholmov cầm Trắng gặp Fischer. Trắng chọn cách chơi kiềm chế: fianchetto Tượng g2, b3 rồi ♗a3, không tranh trung tâm bằng tốt mà chờ. Đen đáp bằng hệ Ấn Độ mới, đẩy ...e5 sớm và sau khi đổi tốt d thì cả cột d bỏ trống. Toàn bộ ván cờ sau đó xoay quanh đúng một quân: con Tượng Trắng đi từ a3 lên d6, bị đuổi sang c7, rồi kẹt ở a5. Fischer không tấn công Vua — ông chỉ dí vào con Tượng đó cho tới khi Trắng phải bỏ nó.","end":"Bài học rõ nhất ở đây là <b>đếm ô lùi trước khi đẩy quân vào sâu</b>. Tượng d6 không mất ngay, nhưng mỗi nước của Đen lại bớt đi một ô cho nó, tới lúc chỉ còn a5 — nơi nó không đỡ ai và không ai đỡ nó. Bài học thứ hai là cách khai thác: khi đối phương có một quân kẹt, đừng đổi hướng liên tục. Fischer đưa Hậu về a3 hai lần, cùng một ô, cùng một mục tiêu; Trắng phải xoay hết quân nhẹ đi đỡ và mất luôn tốt lẫn thế cờ.","notes":[{"at":16,"t":"<b>9 e4</b> — Hai bên vừa đổi tốt d, nên cột d trống hoàn toàn và cấu trúc thành e4 đối e5. Trong thế này không bên nào có mục tiêu tốt để công, nên ai chiếm được cột d và ô tiền tiêu tốt hơn thì bên đó có việc để làm."},{"at":20,"t":"<b>11 ♗d6?</b> — Tượng lao vào giữa trại Đen. Nó chặn cột d và nhòm tốt e5, nhưng đứng ở đó thì xung quanh toàn quân Đen còn quân Trắng thì ở xa. Đây là nước khiến Trắng phải chạy theo giữ Tượng suốt phần còn lại của ván."},{"at":21,"t":"<b>11…♕a5!</b> — Hậu ra a5, theo đường chéo a5–e1 nhắm Mã c3. Nhưng ý chính không phải là ăn Mã: Hậu đứng đây để dọn đường cho ...♖e6 và ...♘e8, hai quân sẽ vây con Tượng d6."},{"at":23,"t":"<b>12…♖e6!</b> — Xe lên e6 đánh vào Tượng d6. Tượng đang có Hậu d3 đỡ nên chưa mất, nhưng Đen dọa ...♘e8 là quân thứ hai đánh vào cùng ô — lúc ấy hai đánh một, Tượng phải chạy."},{"at":25,"t":"<b>13…♕a3!</b> — Trắng vừa đẩy b4 đuổi Hậu; Hậu tránh sang a3 và từ đó <b>đánh cùng lúc tốt b4 và Mã c3</b>. Chỗ oái oăm: tốt b4 chỉ có đúng con Tượng d6 đỡ, mà Tượng ấy đang bị Xe e6 dí."},{"at":27,"t":"<b>14…♕xb4</b> — Trắng chọn cứu Tượng bằng 14 ♗c7, nên tốt b4 rơi. Đen hơn một tốt, mà con Tượng vẫn chưa về được nhà — hai vấn đề chứ không phải một."},{"at":31,"t":"<b>16…♘e8</b> — Mã lùi về e8 đánh Tượng c7. Thử đếm ô lùi của Tượng: b6 dính tốt a7, b8 dính Xe a8, d8 dính Hậu e7, d6 bị ba quân nhắm mà chỉ một quân đỡ, còn ăn e5 thì mất quân. <b>Chỉ còn đúng a5.</b>"},{"at":32,"t":"<b>17 ♗a5</b> — Ô duy nhất còn lại. Tượng ra rìa bàn cờ, không đỡ được quân nào và cũng không có quân nào đỡ nó. Từ đây kế hoạch của Đen gọn lại thành một câu: dí vào ô a5."},{"at":33,"t":"<b>17…♖d6</b> — Xe rời e6 sang cột d, đối mặt Xe d1. Đen lấy cột mở mà không bỏ mục tiêu cũ: Tượng a5 vẫn trơ trọi, và bây giờ Đen còn có thêm cột d để đổi quân."},{"at":37,"t":"<b>19…♗f8</b> — Tượng g7 rời đường chéo dài về f8. Nghe như đi lùi, nhưng f8 nằm trên đường chéo f8–a3, tức là nó <b>đỡ sẵn ô a3</b> cho Hậu sắp vào."},{"at":39,"t":"<b>20…♕a3!</b> — Hậu vào a3, cùng cột a với Tượng a5, và Tượng không có ai đỡ. Trắng phải bỏ mọi kế hoạch khác để lo cho một quân."},{"at":45,"t":"<b>23…♕a3!</b> — Lần thứ hai, đúng ô đó, đúng lý do đó. Mỗi lần Trắng gỡ tạm được thì Đen lại đưa Hậu về a3. Một quân kẹt biến cả cánh Hậu của Trắng thành nơi trói quân."},{"at":48,"t":"<b>25 ♗xb5</b> — Trắng bỏ Tượng lấy tốt b5, vì con Tượng a5 dù sao cũng không cứu nổi: Mã b3 đang phải đứng yên đỡ nó, mà chính Mã b3 lại bị Hậu a3 và Mã c5 nhắm. Vớt về hai tốt còn hơn mất trắng."},{"at":53,"t":"<b>27…♕xa5</b> — Cuối cùng Hậu cũng nhặt con Tượng lang thang. Đếm lại: Đen có Hậu, Xe, hai Tượng, một Mã; Trắng có Hậu, Xe, hai Mã và nhiều hơn một tốt. Đen hơn hẳn một quân nhẹ."},{"at":57,"t":"<b>29…♗h3!</b> — Quân cuối cùng của Đen vào cuộc. Tượng h3 lấy mất f1 và g2, sau nước này Vua Trắng chỉ còn đúng một ô h1 để đi. Đen sẵn sàng buông tốt e5 để đổi lấy chuyện đó."},{"at":63,"t":"<b>32…a6</b> và Trắng xin thua. Tốt a6 đuổi Mã b5 phải lùi về chỗ vô dụng, Đen vẫn hơn một quân nhẹ, còn Vua Trắng thì bị nhốt trong góc. Không còn gì để chơi tiếp."}]},"60":{"tiv":"Khi hai nhà vô địch gặp nhau","ctx":"Giải Liên khu vực Sousse 1967, Fischer cầm Trắng gặp Leonid Stein — một trong số ít người có thành tích đối đầu tốt với ông. Khai cuộc là Tây Ban Nha đóng, và Stein chơi kiểu Chigorin quen thuộc: đưa Mã ra rìa rồi vòng về. Con Mã đó đi mất bốn nước, và Fischer dùng đúng số nhịp ấy để chiếm không gian bằng b4 rồi bung trung tâm bằng e5. Đòn tấn công vào cánh Vua đến rất gần chiếu hết nhưng bị đẩy lùi; ván cờ chuyển sang tàn cuộc, ở đó Fischer thắng chất bằng một đòn đôi Mã rồi đẩy tốt thông thắng ở nước 56.","end":"Hai điều đáng nhớ. Một là <b>giá của nhịp</b>: con Mã đi c6–a5–c4–b6–d7 không mất quân nào, không hỏng nước nào, nhưng bốn nhịp đó đủ để Trắng dựng xong b4 và e5 — thiệt hại không nằm ở vật chất mà ở việc ai được đi trước. Hai là <b>đòn đôi dọn đường</b>: nước 35 ♗f3 nhìn như nước cứu Tượng hỏng, thật ra nó chỉ để dọn cột e cho Xe, nhờ đó ô e6 có quân đỡ và ♘e6+ mới thành đòn đôi vào Vua và Xe. Khi tính đòn đôi, câu hỏi đầu tiên luôn là ô nhảy tới có ai đỡ chưa.","notes":[{"at":25,"t":"<b>13…♘bd7</b> — Con Mã này đã đi c6–a5–c4–b6–d7, bốn nước liền, không đổi được quân nào và kết thúc ở một ô phòng thủ. Trong bốn nước đó Trắng dựng xong trung tâm d4+e4, đưa Tượng về c2 và Mã ra d2. Không ai mất quân, nhưng nhịp thì đã tiêu."},{"at":26,"t":"<b>14 b4!</b> — Chốt cứng cánh Hậu đúng lúc. Tốt b4 lấy mất hai ô a5 và c5 của quân Đen, và ghim tốt b5 lại làm mục tiêu lâu dài. Đen muốn phá bằng ...c5 thì tốt đó lập tức bị cả b4 lẫn d4 nhắm."},{"at":32,"t":"<b>17 e5!</b> — Nước bung trung tâm, và đây là bước ngoặt của thế cờ. Sau khi đổi ở e5, tốt Trắng cắm giữa bàn cờ, nhưng cái quan trọng hơn là <b>đường chéo b1–h7 thông hẳn</b> cho Tượng c2. Từ lúc này mọi quân Trắng đều có hướng đi về phía Vua Đen."},{"at":37,"t":"<b>19…♘b4!</b> — Mã nhảy vào b4 đánh Tượng c2, buộc nó phải rời ô. Stein hiểu rất rõ con Tượng ấy đang nhắm cái gì nên tìm cách đuổi ngay, dù phải đưa Mã ra biên lần nữa."},{"at":40,"t":"<b>21 ♕e2!</b> — Nhìn thì hiền lành. Nhưng Hậu đứng e2 là để chờ Mã f3 đi khỏi: khi f3 trống thì Hậu có sẵn đường e2–f3–g4–h5. Đây là nước chuẩn bị, chưa dọa gì cả — và vì chưa dọa nên rất dễ bị coi thường."},{"at":42,"t":"<b>22 ♘fg5!</b> — Mã f3 sang g5: vừa thêm một quân đánh h7, vừa mở đúng cái đường vừa nói. Dọa cụ thể là 23 ♕h5 rồi ♕xh7 chiếu hết, và trên bàn cờ lúc này h7 chỉ có mỗi Vua g8 canh."},{"at":43,"t":"<b>22…♗xe4!</b> — Đen đổi bỏ một trong hai con Mã, đó là cách chống trả tốt nhất. Nhưng Hậu ăn lại ở e4 thì đứng ngay trước Tượng b1: <b>Hậu và Tượng xếp thành hàng trên đường chéo b1–h7</b>, dọa ♕xh7 chiếu hết ngay lập tức, nên Đen buộc phải ...g6."},{"at":50,"t":"<b>26 ♘f3?</b> — Mã g5 là quân Trắng duy nhất còn chạm vào f7. Rút nó về f3 là buông hết sức ép: Stein lập tức chơi ...♔g7 rồi ...♖h8, nối lại quân và thoát hiểm."},{"at":54,"t":"<b>28 e6!</b> — Tốt xông lên e6, đâm vào chân tốt f7. Ăn bằng ...fxe6 thì cột f mở ra, Hậu f4 có ngay f7 và f8 để vào chiếu, còn Tượng b1 thì ăn g6. Đen chặn bằng ...f5, nhưng tốt e6 nằm lại như một cái nêm cắt đôi thế cờ."},{"at":56,"t":"<b>29 ♗xf5!</b> — Tượng ăn tốt f5. Ăn lại bằng ...gxf5 thì Vua g7 mất tấm tốt g6 che chắn cuối cùng, trong khi Hậu, Xe và Mã Trắng đều đứng gần. Stein không dám lấy quân."},{"at":58,"t":"<b>30 ♗e4?</b> — Tượng f5 đang bị tốt g6 và Hậu f8 nhắm mà chỉ có Hậu f4 đỡ, nên Fischer rút nó về. Nhưng vừa rời f5 là hai Hậu nhìn thẳng nhau trên cột f: Đen đổi Hậu, và đòn tấn công chấm dứt tại đây."},{"at":64,"t":"<b>33 ♖d7</b> — Xe vào hàng 7, đánh Tượng e7. Đen phải chơi ...♖xe6, vừa ăn lại tốt vừa đỡ Tượng — nhưng Xe đứng e6 thì rơi vào tầm Mã, và đó chính là chỗ Trắng nhắm."},{"at":68,"t":"<b>35 ♗f3!</b> — Tượng rời e4 không phải để cứu Tượng f4 (con đó đang bị Xe f6 ăn không). Ý là <b>dọn cột e</b> cho Xe e1: bây giờ ô e6 đã có Xe đỡ, nên ♘e6+ trở thành đòn đôi vào Vua g7 và Xe f4. Đen ăn Tượng rồi mất chất."},{"at":88,"t":"<b>45 ♗xb5+</b> — Nước trước Tượng đã sang e2 để vào đường chéo e2–b5. Tốt b5 bị Tượng và Xe b6 nhắm mà chỉ có Mã d4 đỡ, nên nó phải rụng. Đổi hết quân nhẹ xong, Trắng hơn chất cộng một tốt — đủ để chơi tàn cuộc thắng."},{"at":100,"t":"<b>51 f4</b> — Trắng phá ở cánh Vua để đẻ ra tốt thông. Sau ...gxf4 gxf4, tốt f có đường chạy, còn Đen còn lại hai tốt rời c5 và h5 không đỡ được nhau."},{"at":110,"t":"<b>56 f6</b> và Đen xin thua. Mã d6 chặn đường tốt, nhưng Xe e6 ăn luôn nó được: ...♔xd6 không hợp lệ vì Xe d2 đỡ ô đó, còn ...♗xd6 thì f7, Tượng phải về f8 chặn, và ♖d8 đánh nốt con Tượng. Trắng hơn chất, tốt lên Hậu."}]}};
