:root{
  --bg:#FFFFFF; --panel:#F6F6FA; --panel2:#EEEEF2; --ink:#2E2E38; --muted:#686874; --rule:#C4C4CD; --tren-dac:#FFFFFF;
  --q-than-t:#FFFFFF; --q-vien-t:#2E2E38; --q-than-d:#2E2E38; --q-vien-d:#2E2E38; --q-chi-d:#FFFFFF;
  --navy-line:#2E2E38; --navy-chu:#2E2E38; --navy-nhat:#EEEEF2; --navy-dac:#2E2E38;
  --accent-line:#1A9AFA; --accent-chu:#0A6DBE; --accent-nhat:#E6F3FE; --accent-dac:#0A6DBE;
  --sell-line:#747480; --sell-chu:#686874; --sell-nhat:#F6F6FA; --sell-dac:#747480;
  --use-line:#1A9AFA; --use-chu:#0A6DBE; --use-nhat:#E6F3FE; --use-dac:#0A6DBE;
  --ok-line:#1A9AFA; --ok-chu:#0A6DBE; --ok-nhat:#E6F3FE; --ok-dac:#0A6DBE;
  --bad-line:#747480; --bad-chu:#2E2E38; --bad-nhat:#F6F6FA; --bad-dac:#747480;
  --xam-line:#A3A3AE; --xam-chu:#686874; --xam-nhat:#F6F6FA; --xam-dac:#747480;
  /* v1.3.7 nhan KET LUAN (Quang 16-11: "cho mot mau do nau nhan manh"): cau chot, cau nho, o ket luan tren hinh */
  --chot-line:#9A3412; --chot-chu:#9A3412; --chot-nhat:#FBEDE6; --chot-dac:#9A3412; --chot-recap:#F2A88A;
  --font:Arial,'NotoJP','Liberation Sans',sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#23232B; --panel:#2E2E38; --panel2:#363641; --ink:#FFFFFF; --muted:#B0B0BA; --rule:#4E4E5A;
  --q-than-t:#FFFFFF; --q-vien-t:#0E0E14; --q-than-d:#0E0E14; --q-vien-d:#9A9AA6; --q-chi-d:#686874;
  --navy-line:#C4C4CD; --navy-chu:#FFFFFF; --navy-nhat:#363641; --navy-dac:#4E4E5A;
  --accent-line:#1A9AFA; --accent-chu:#7FC4FC; --accent-nhat:#163049; --accent-dac:#0A6DBE;
  --sell-line:#9A9AA6; --sell-chu:#C4C4CD; --sell-nhat:#2E2E38; --sell-dac:#747480;
  --use-line:#1A9AFA; --use-chu:#7FC4FC; --use-nhat:#1B2B3B; --use-dac:#0A6DBE;
  --ok-line:#1A9AFA; --ok-chu:#7FC4FC; --ok-nhat:#1B2B3B; --ok-dac:#0A6DBE;
  --bad-line:#9A9AA6; --bad-chu:#FFFFFF; --bad-nhat:#2A2A33; --bad-dac:#4E4E5A;
  --xam-line:#747480; --xam-chu:#B0B0BA; --xam-nhat:#2A2A33; --xam-dac:#4E4E5A;
  --chot-line:#F2A88A; --chot-chu:#F2A88A; --chot-nhat:#3A2A26; --chot-dac:#9A3412; --chot-recap:#F2A88A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media(min-width:900px){.wrap{padding-left:40px;padding-right:40px}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font-family:var(--font);font-size:calc(17px*var(--kk,1))}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg text{font-family:var(--font)}
.top{position:sticky;top:0;z-index:20;background:#2E2E38;color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top .t{font-weight:700;font-size:16px;margin-right:auto}
.toc{display:flex;gap:8px;flex-wrap:wrap}
.toc a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:3px 10px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4)}
.pill{font-size:14px;font-weight:700;background:rgba(255,255,255,.14);border-radius:14px;padding:3px 10px}
.theme{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;padding:2px 8px;font-size:13px}
/* co chu (v1.3.8c; Quang 17-11-2026: "them nut chu nho chu lon ... doc tren dien thoai"): zoom vung noi dung, thanh dau giu nguyen */
.cochu{display:inline-flex;gap:4px;flex:0 0 auto}.cochu button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:700;min-width:34px}.cochu button.het{opacity:.35}
.kick{font-size:calc(14px*var(--kk,1));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-chu)}
.part{padding:24px 0 4px}
.part>h2{font-size:calc(30px*var(--kk,1));line-height:1.15;margin:4px 0 4px}
.part>.lead{color:var(--muted);font-size:calc(18px*var(--kk,1));margin:0}
.les{padding:22px 0 18px;border-top:1px solid var(--rule)}
.les h3{font-size:calc(24px*var(--kk,1));margin:0 0 6px;line-height:1.2}
.les .no{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent-dac);color:#fff;font-weight:700;font-size:calc(15px*var(--kk,1));align-items:center;justify-content:center;margin-right:8px;vertical-align:3px}
.key{font-size:calc(19px*var(--kk,1));font-weight:600;color:var(--chot-chu);margin:0 0 12px;border-left:5px solid var(--chot-line);padding-left:12px}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}.lkb{display:inline-block;padding:9px 14px;border:1.5px solid var(--use-line);border-radius:8px;color:var(--ink);background:var(--use-nhat);text-decoration:none;font-weight:700;font-size:calc(16px*var(--kk,1))}.lkb:hover{border-color:var(--ink)}
.giang{font-size:calc(17.5px*var(--kk,1));line-height:1.62;margin:10px 0 14px;color:var(--ink)}.giang p{margin:0 0 10px}
/* v1.3.12 dan dat tung buoc (Quang 20-11-2026: "mang tinh tom tat va trinh bay ket qua nhieu hon la giup toi hieu"): moi buoc doi hinh, cau chot hien o CUOI */
.dan{border:1.5px solid var(--rule);border-left:5px solid var(--accent-line);border-radius:10px;background:var(--panel);padding:12px 16px 12px;margin:10px 0 14px}
.dan-dau{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.dan-so{font-size:calc(14px*var(--kk,1));font-weight:700;letter-spacing:.04em;color:var(--accent-chu)}
.dan-cham{display:inline-flex;gap:5px}.dan-cham i{width:9px;height:9px;border-radius:50%;background:var(--rule);display:inline-block}.dan-cham i.on{background:var(--accent-line)}
.dan-than{font-size:calc(18px*var(--kk,1));line-height:1.6;color:var(--ink)}.dan-than p{margin:0 0 8px}
.dan-hoi{margin:6px 0 4px}.dan-hoi .btns{margin-top:6px}
.dan-ph{font-size:calc(17px*var(--kk,1));line-height:1.55;margin:6px 0 4px;padding:8px 12px;border-radius:8px;background:var(--bg);border:1.5px solid var(--rule)}
.dan-ph.dung{border-color:var(--accent-line)}.dan-ph.sai{border-color:var(--chot-line)}
.dan-nut{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 0 0}.dan-nut .btn.het{opacity:.4}.dan-nut .btn{padding:6px 10px}.dan-dau{row-gap:6px}
/* v1.4.1 (Quang 24-11-2026: "thêm nút tới hết luôn hay về từ đầu" · "màn hình 14inch ... phải kéo lên kéo xuống"): nut ve dau / toi cuoi; thanh nut o DAU khoi (khong xe dich theo do dai chu); hinh + khoi dan dat gom vao .dan-cum, hinh thu nho cho ca cum vua mot man hinh */
.dan-cum{scroll-margin-top:var(--dan-tren,60px);scroll-margin-bottom:var(--dan-duoi,90px)}.dan-cum>.fig,.dan-cum>.row2{margin-bottom:8px}.dan-cum .dan{margin-top:0}.dan-noi{overflow:hidden}
.jp{cursor:pointer;color:var(--accent-chu);border-bottom:1.5px solid var(--accent-nhat)}.jp:hover{background:var(--accent-nhat)}
.dan .key{margin:12px 0 2px}.dan .key::before{content:"Rút ra: ";font-weight:700}
.ghi{display:inline-block;background:var(--use-nhat);border-left:5px solid var(--use-line);padding:8px 14px;border-radius:0 6px 6px 0;font-size:calc(17px*var(--kk,1));margin:8px 0 10px}
.fig{border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--bg);margin-bottom:10px;min-width:0}
.fig>svg{width:100%;height:auto;display:block}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.row2>*{min-width:0}
@media(max-width:900px){.row2{grid-template-columns:1fr !important}}
/* v1.3.3: cot loi giang lam phan giua hep lai -> do theo be rong phan giua, khong theo man hinh (hai hinh canh nhau thi xep doc) */
#trang{container-type:inline-size}
@container (max-width:1000px){.row2{grid-template-columns:1fr !important}}
.ctl{background:var(--panel);border-radius:8px;padding:14px 16px}
.ctl .tt{font-weight:700;margin-bottom:6px}
.ctl .row{margin-bottom:8px}
.buoc{display:flex;align-items:center;gap:10px}.buoc input{flex:1;min-width:0}.buoc .btn{flex:none;padding:6px 12px}.buoc .btn.het{opacity:.35}
.ctl label{display:flex;justify-content:space-between;font-weight:600;font-size:calc(16px*var(--kk,1));margin-bottom:2px}
input[type=range]{width:100%;height:28px;accent-color:var(--accent-line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{border:1.5px solid var(--accent-dac);background:transparent;color:var(--accent-chu);border-radius:6px;padding:7px 14px;font-weight:600}
.btn.on{background:var(--accent-dac);color:#fff}

i 5 giây đầu, làn Nhìn có dấu hiệu 1 'dịch người trên ghế', làn Nghe có dấu hiệu 2 'Ý chị là đáng lo kiểu gì?' (không hiểu câu hỏi đơn giản); sau đó cụm kéo tới câu hỏi kế, dấu hiệu lúc đang hỏi vẫn tính; cuối cùng ô kết luận: ứng viên nhận một chuyện nghiêm trọng, cụm chỉ ra chỗ cần đào"}}, {"dan": [{"ten": "Đoán trước", "loai": "doan", "gan": {"b1": 0}, "chu": ["Cuối buổi phỏng vấn cho một vị trí nhạy cảm của chính phủ Mỹ, Susan (cựu CIA, một tác giả) hỏi câu như ô trên hình.", "Ứng viên dịch người trên ghế, hỏi lại: 'Ý chị là những điều đáng lo kiểu gì?'. Anh đọc thế nào?"], "chon": [{"nhan": "Ứng viên đang giấu một chuyện cụ thể", "vi_sao": "Đi quá xa. Hai dấu hiệu chỉ nói câu hỏi chạm vào chỗ có vấn đề; chuyện gì thì chưa biết. Bấm Tiếp."}, {"nhan": "Chưa có gì: hỏi lại cho rõ là bình thường", "vi_sao": "Hỏi lại một câu khó thì bình thường. Câu này đơn giản, lại đi cùng một cử chỉ ngay lúc đó. Bấm Tiếp."}, {"nhan": "Câu hỏi này chạm chỗ cần hỏi tiếp", "dung": true, "vi_sao": "Đúng, Susan cũng đọc vậy. Bấm Tiếp để xem hai dấu hiệu nằm ở đâu trên trục thời gian."}]}, {"ten": "Kênh nhìn", "loai": "buoc", "gan": {"b1": 1}, "chu": ["Ngay sau câu hỏi, ứng viên dịch người trên ghế. Đó là dấu hiệu thứ nhất, rơi vào dải 5 giây đầu.", "Trang 1 đã nói về mốc này. Ở đây ta xem cách dùng nó khi chính mình là người hỏi."]}, {"ten": "Kênh nghe", "loai": "buoc", "gan": {"b1": 2}, "chu": ["Rồi tới lời: 'Ý chị là những điều đáng lo kiểu gì?'. Không hiểu một câu hỏi đơn giản là dấu hiệu thứ hai.", "Hai dấu hiệu nằm ở hai kênh. Ai chỉ nhìn, hoặc chỉ nghe, dễ bắt được một rồi bỏ qua."]}, {"ten": "Vì sao cả hai", "loai": "vi_sao", "gan": {"b1": 3}, "chu": ["Sách gọi việc vừa nhìn vừa nghe vài giây sau câu hỏi là 'L-squared' (look and listen). Đầu óc thích một kênh, nên giữ cả hai phải luyện.", "Mốc 5 giây: người ta nghĩ nhanh hơn nói nhiều lần, càng xa câu hỏi càng đã sang chuyện khác. Đây là lập luận và kinh nghiệm CIA, sách không đưa số đo."]}, {"ten": "Cụm dài tới đâu", "loai": "buoc", "gan": {"b1": 4}, "chu": ["Cụm tính từ dấu hiệu đầu tiên tới khi có câu hỏi mới. Dấu hiệu bật ra khi câu hỏi chưa dứt, vì người kia đoán ra câu hỏi, vẫn tính.", "Nhiều dấu hiệu thì tin hơn, nhưng không có nghĩa chuyện nghiêm trọng hơn."]}, {"ten": "Kết cục", "loai": "buoc", "gan": {"b1": 5}, "chu": ["Susan hỏi tiếp. Ứng viên nhận một chuyện nghiêm trọng với chính vợ mình, điều mà chưa câu hỏi nào trước đó chạm tới.", "Cụm chỉ ra chỗ cần đào. Chuyện gì thì phải hỏi mới ra; sách gọi đây là dấu hiệu, không phải bằng chứng."]}, {"ten": "Áp vào việc", "loai": "ap_dung", "chu": ["Họp với ban điều hành bên mục tiêu: sau mỗi câu then chốt, im lặng 5 giây, vừa nhìn người vừa nghe từng chữ.", "Ghi bên lề câu nào ra từ hai dấu hiệu trở lên. Cuối buổi quay lại hỏi sâu đúng những câu đó."]}]}]}, {"tieu_de": "Câu trả lời đẹp chưa phải câu trả lời", "chot": "Một câu thật nói về con người mình, không về sự việc, là chưa trả lời: ghi nhận lịch sự rồi quay lại câu hỏi.", "y": ["2.1", "2.2"], "khoi": [{"hinh": {"rong": 900, "cao": 456, "net": [{"k": "khung", "x": 20, "y": 20, "w": 440, "h": 74, "rx": 10, "kieu": "nhat", "mau": "navy", "dong": ["{b2>=4?'Anh hỏi: khoản phải thu quá hạn là của ai?':'Phil: 40 USD mất trong ví, chỉ anh vào phòng đó'}", "{b2>=4?'ví dụ đặt thêm, việc của anh':'ca trong sách, Spy the Lie ch4'}"], "co": 15, "co2": 14}, {"k": "dang", "x": 50, "y": 130, "co": 200}, {"k": "chu", "x": 100, "y": 352, "chu": "{b2>=4?'giám đốc':'Ronald'}", "co": 15, "dam": true}, {"k": "thoai", "x": 176, "y": 130, "w": 286, "h": 104, "rx": 10, "kieu": "nhat", "mau": "xam", "dong": ["{b2>=4?'“Năm ngoái chúng tôi được giải':'“Ra xem cốp xe tôi đi,'}", "{b2>=4?'doanh nghiệp tiêu biểu, khách':'toàn Kinh Thánh tôi chở'}", "{b2>=4?'toàn tập đoàn lớn.”':'cho nhà thờ.”'}"], "co": 15, "co2": 15, "canh": "trai", "le": 12, "duoi": [118, 150]}, {"k": "chu", "x": 320, "y": 256, "chu": "câu thật", "co": 14, "mau": "muted"}, {"k": "khung", "x": 500, "y": 20, "w": 380, "h": 140, "rx": 10, "kieu": "nhat", "mau": "{b2==2?'use':'xam'}", "hien": "b2>=1"}, {"k": "chu", "x": 690, "y": 46, "chu": "Trình bày (convey)", "co": 16, "dam": true, "hien": "b2>=1"}, {"k": "chu", "x": 690, "y": 70, "chu": "nói về sự việc được hỏi", "co": 14, "mau": "muted", "hien": "b2>=1"}, {"k": "khung", "x": 516, "y": 84, "w": 348, "h": 62, "rx": 10, "kieu": "nhat", "mau": "use", "dong": ["{b2>=4?'“Khoản lớn nhất là của khách X.”':'“Tôi không lấy 40 USD đó.”'}", "{b2>=4?'trả lời đúng việc (ví dụ)':'người nói thật thường đáp vậy'}"], "co": 15, "co2": 14, "hien": "b2>=2"}, {"k": "khung", "x": 500, "y": 180, "w": 380, "h": 140, "rx": 10, "kieu": "nhat", "mau": "{b2==1||b2==4?'chot':'xam'}", "hien": "b2>=1"}, {"k": "chu", "x": 690, "y": 206, "chu": "Thuyết phục (convince)", "co": 16, "dam": true, "hien": "b2>=1"}, {"k": "chu", "x": 690, "y": 230, "chu": "nói về con người mình", "co": 14, "mau": "muted", "hien": "b2>=1"}, {"k": "khung", "x": 516, "y": 244, "w": 348, "h": 62, "rx": 10, "kieu": "nhat", "mau": "xam", "dong": ["{b2>=4?'giải thưởng, khách lớn':'cốp xe đầy Kinh Thánh'}", "thật, nhưng chưa trả lời câu hỏi"], "co": 15, "co2": 14, "hien": "b2>=1"}, {"k": "ten", "diem": [[462, 200], [498, 238]], "mau": "navy", "day": 2, "hien": "b2>=1"}, {"k": "khung", "x": 20, "y": 380, "w": 860, "h": 64, "rx": 10, "kieu": "nhat", "mau": "xam", "dong": ["Vẻ bình tĩnh, trả lời thẳng, chú ý: người đã chuẩn bị cũng làm được", "không tính là dấu hiệu nói thật: bỏ qua"], "co": 15, "co2": 14, "hien": "b2>=3"}], "aria": "Bên trái: câu hỏi về 40 USD mất trong ví, Ronald dang tay mời ra xem cốp xe đầy Kinh Thánh (câu thật). Bên phải hai ô: Trình bày — nói về sự việc (người nói thật thường đáp 'Tôi không lấy 40 USD đó'); Thuyết phục — nói về con người mình, câu cốp xe rơi vào đây: thật nhưng chưa trả lời. Dưới: vẻ bình tĩnh, trả lời thẳng không tính là dấu hiệu nói thật. Bước sau đổi sang buổi họp: hỏi phải thu quá hạn, giám đốc kể giải thưởng, khách lớn"}}, {"dan": [{"ten": "Đoán trước", "loai": "doan", "gan": {"b2": 0}, "chu": ["Một nhân viên báo mất 40 USD trong ví; chỉ Ronald vào được phòng đó. Phil (cựu CIA, một tác giả) kể lại sự việc cho Ronald.", "Ronald không nói gì về 40 USD, mà kéo tay áo Phil, đòi ra xem cốp xe. Chuyện cốp xe là thật. Anh xử lý thế nào?"], "chon": [{"nhan": "Ghi nhận: người tử tế vậy khó lấy trộm", "vi_sao": "Đó đúng là điều Ronald muốn anh nghĩ. Chuyện thật về con người anh ta không trả lời câu 40 USD."}, {"nhan": "Vạch ra ngay: anh đang đánh lạc hướng", "vi_sao": "Đối đầu làm người kia phòng thủ. Các tác giả khuyên bình tĩnh, không đối đầu."}, {"nhan": "Ghi nhận lịch sự, rồi quay lại chuyện 40 USD", "dung": true, "vi_sao": "Đúng. Phil bình tĩnh hỏi tiếp, không để chuyện cốp xe kéo đi; chưa tới 10 phút, Ronald nhận đã lấy tiền. Ghi nhận rồi quay lại là cách sách khuyên ở ch11."}]}, {"ten": "Thuyết phục", "loai": "buoc", "gan": {"b2": 1}, "chu": ["Sách gọi đây là 'convince vs. convey': cố thuyết phục mình là người tốt, thay vì trình bày điều đã xảy ra.", "Câu cốp xe rơi vào ô dưới bên phải: thật, nhưng không trả lời câu hỏi."]}, {"ten": "Người nói thật", "loai": "buoc", "gan": {"b2": 2}, "chu": ["Theo các tác giả, nếu sự thật đứng về phía Ronald, anh ta thường sẽ phủ nhận thẳng: 'Tôi không lấy 40 USD đó'.", "Và những gì anh ta nói sẽ xoay quanh sự việc. Đó là ô trên."]}, {"ten": "Vì sao bỏ qua", "loai": "vi_sao", "gan": {"b2": 3}, "chu": ["Vẻ trả lời thẳng, bình tĩnh, chú ý thì người nói dối cũng làm được, nhất là khi đã chuẩn bị. Tính nó vào là tự đưa vũ khí cho họ.", "Bỏ qua còn giúp mình không bị điều mình ngưỡng mộ làm mềm lòng. Đây là kinh nghiệm thẩm vấn của các tác giả, không có số đo."]}, {"ten": "Ở bàn họp", "loai": "buoc", "gan": {"b2": 4}, "chu": ["Đặt vào việc của anh (ví dụ thêm): anh hỏi khoản phải thu quá hạn. Giám đốc kể công ty được giải doanh nghiệp tiêu biểu, khách toàn tập đoàn lớn.", "Có thể đúng hết, nhưng chưa nói khoản nào, của ai, bao giờ thu."]}, {"ten": "Áp vào việc", "loai": "ap_dung", "chu": ["Khi câu trả lời không nói gì sai; khác câu dẫn dắt; khác doạ ('Ai?' và mình thành đối thủ); mỗi loại không quá 2–3 lần mỗi buổi khoảng một giờ"}}, {"dan": [{"ten": "Đoán trước", "loai": "doan", "gan": {"b4": 0}, "chu": ["Y tá Tom bị cho nghỉ việc vì nghi lấy thuốc; suốt cuộc điều tra anh chối. Nay Tom xin việc ở bệnh viện mới, Phil phỏng vấn.", "Câu mở đầu nào dễ để lộ ra nhất?"], "chon": [{"nhan": "'Anh có lấy thuốc ở chỗ cũ không?'", "vi_sao": "Tom đã đáp câu này suốt cuộc điều tra. Như hình, một chữ 'Không' là xong, người có lấy hay không cũng đáp vậy."}, {"nhan": "'Anh không lấy thuốc, đúng không?'", "vi_sao": "Câu phủ định còn mở sẵn đường cho chữ 'không' (mục 3)."}, {"nhan": "'Trong số thuốc bị mất, anh đã lấy bao nhiêu?'", "dung": true, "vi_sao": "Đúng, đây là câu Phil dùng. Bấm Tiếp để xem vì sao nó khác."}]}, {"ten": "Câu giả định", "loai": "buoc", "gan": {"b4": 1}, "chu": ["Câu giả định coi như việc có thể đã xảy ra, rồi hỏi bao nhiêu, chuyện gì. Người không lấy thường đáp ngay, chẳng cần nghĩ.", "Người đã lấy phải tính: họ biết gì rồi? Tom ngừng rất lâu, Phil chỉ ngồi chờ. Rồi Tom nhận đã lấy phần lớn."]}, {"ten": "Câu mồi", "loai": "buoc", "gan": {"b4": 2}, "chu": ["Nếu Tom vẫn chối, câu kế của Phil sẽ là câu mồi, mở bằng 'Có lý do gì...?' như ô trên.", "Nó nêu một giả thuyết, không khẳng định gì. Giống khi nghe 'Sếp muốn gặp anh ngay': mình tự dựng kịch bản xấu. Sách gọi là 'virus tâm trí'."]}, {"ten": "Vì sao công bằng", "loai": "vi_sao", "gan": {"b4": 3}, "chu": ["Hai loại câu này không nói điều gì sai sự thật. Người nói thật thường đáp ngay; người có điều giấu mới hay phải dừng lại tính.", "Câu mồi càng chung ('hàng xóm nào đó') càng mạnh; cụ thể quá thì người kia biết để gạt đi. Câu dẫn dắt thì khác: nó đặt chữ vào miệng người ta."]}, {"ten": "Mồi khác doạ", "loai": "buoc", "gan": {"b4": 4}, "chu": ["Doạ là nói như có thật: 'Có người thấy anh ở đó.' Người kia hỏi 'Ai?'; mình ngập ngừng là thành đối thủ. Sách nói doạ hiếm khi ăn.", "Mỗi loại giả định, mồi dùng không quá 2–3 lần trong một buổi khoảng một giờ, giọng bình thường. Con số này là kinh nghiệm tác giả."]}, {"ten": "Áp vào việc", "loai": "ap_dung", "chu": ["Thay 'Có bảo lãnh nào chưa ghi sổ không?' bằng câu giả định: 'Ngoài các khoản trên sổ, công ty còn những cam kết, bảo lãnh nào?'.", "Nếu cần, thêm một câu mồi: 'Có lý do gì sau này lại lộ ra một bảo lãnh chưa có trong danh sách này không?'."]}]}]}, {"tieu_de": "Đừng để người kia cố thủ", "chot": "Người kia mới nói một phần thì đừng dồn họ nhắc lại lời cũ: hỏi rộng ra, đi từ mẩu nói sau cùng lùi về, và kết bằng câu vét.", "y": ["5.1", "5.2", "5.3"], "khoi": [{"hinh": {"rong": 900, "cao": 484, "net": [{"k": "khung", "x": 20, "y": 262, "w": 390, "h": 30, "rx": 0, "kieu": "dac", "mau": "xam"}, {"k": "dang", "x": 262, "y": 102, "co": 160, "to": "{b5==1?'chan':''}"}, {"k": "khung", "x": 20, "y": 116, "w": 228, "h": 66, "rx": 10, "kieu": "nhat", "mau": "navy", "dong": ["'Tôi thử cần sa một lần.'", "nói tới đây thôi"], "co": 15, "co2": 14}, {"k": "chu", "x": 406, "y": 252, "chu": "mép vực", "co": 15, "dam": true, "mau": "{b5==1?'chot':'navy'}", "canh": "phai", "hien": "b5>=1"}, {"k": "cum", "x": 430, "y": 40, "w": 450, "h": 270, "ten": "Phía bên kia mép vực", "mau": "xam", "hien": "b5>=1"}, {"k": "khung", "x": 20, "y": 306, "w": 390, "h": 66, "rx": 10, "kieu": "nhat", "mau": "bad", "dong": ["'Chỉ một lần thật sao?' · 'Khi nào, với ai?'", "nói lại lời cũ, càng cố thủ"], "co": 15, "co2": 14, "hien": "b5>=2"}, {"k": "chu", "x": 655, "y": 94, "chu": "'Còn đã thử những gì khác?'", "co": 15, "dam": true, "hien": "b5>=3"}, {"k": "chu", "x": 655, "y": 118, "chu": "'Lần gần nhất là khi nào?'", "co": 15, "dam": true, "hien": "b5>=3"}, {"k": "khung", "x": 450, "y": 150, "w": 125, "h": 60, "rx": 10, "kieu": "nhat", "mau": "{b5==3?'accent':'xam'}", "dong": ["mẩu 1", "nói ra trước"], "co": 15, "co2": 14, "hien": "b5>=3"}, {"k": "khung", "x": 595, "y": 150, "w": 125, "h": 60, "rx": 10, "kieu": "nhat", "mau": "{b5==3?'accent':'xam'}", "dong": ["mẩu 2", ""], "co": 15, "co2": 14, "hien": "b5>=3"}, {"k": "khung", "x": 740, "y": 150, "w": 125, "h": 60, "rx": 10, "kieu": "nhat", "mau": "{b5==3?'chot':'xam'}", "dong": ["mẩu 3", "nói sau cùng"], "co": 15, "co2": 14, "hien": "b5>=3"}, {"k": "ten", "diem": [[322, 150], [446, 180]], "mau": "navy", "day": 2, "hien": "b5>=3"}, {"k": "ten", "diem": [[800, 220], [800, 248], [512, 248], [512, 214]], "mau": "{b5==3?'chot':'navy'}", "day": 2, "hien": "b5>=3"}, {"k": "chu", "x": 656, "y": 276, "chu": "hỏi kỹ từ mẩu sau cùng lùi về", "co": 14, "dam": true, "hien": "b5>=3"}, {"k": "khung", "x": 430, "y": 330, "w": 450, "h": 66, "rx": 10, "kieu": "nhat", "mau": "accent", "dong": ["Lời đổi: 500 rồi 1.000 USD — đừng bắt lỗi", "'Có thể nhiều hơn 1.000 USD không?'"], "co": 15, "co2": 14, "hien": "b5>=4"}, {"k": "khung", "x": 20, "y": 412, "w": 860, "h": 60, "rx": 10, "kieu": "nhat", "mau": "navy", "dong": ["Câu vét, cuối mỗi chủ đề và cuối buổi", "'Tôi chưa hỏi điều gì mà anh nghĩ tôi nên biết?' · 'Còn gì nữa?'"], "co": 15, "co2": 14, "hien": "b5>=5"}], "aria": "Một người đứng sát mép một bậc đá, nói 'Tôi thử cần sa một lần' — nói tới đây thôi. Bên phải là vực: phía bên kia mép vực. Dưới bậc: hỏi dồn ('Chỉ một lần thật sao?', 'Khi nào, với ai?') làm người kia nói lại lời cũ và cố thủ. Trong vực: câu 'Còn đã thử những gì khác?', 'Lần gần nhất là khi nào?' mở ra mẩu 1, 2, 3; mũi tên hỏi kỹ từ mẩu sau cùng lùi về. Thêm ô lời đổi 500 rồi 1.000 USD và ô câu vét cuối chủ đề, cuối buổi"}}, {"dan": [{"ten": "Đoán trước", "loai": "doan", "gan": {"b5": 0}, "chu": ["Phỏng vấn sàng lọc ở CIA: 'Anh từng dùng chất cấm chưa?'. Người được hỏi đáp: 'Tôi thử cần sa một lần'.", "Câu tiếp theo nên là gì?"], "chon": [{"nhan": "'Khi nào? Với ai?'", "vi_sao": "Hỏi vậy là nhận luôn chữ 'một lần'. Người kia đứng vững ở đó, phần còn lại khó ra."}, {"nhan": "'Chỉ một lần thật sao?'", "vi_sao": "Câu này bắt người kia nói lại lời cũ. Mỗi lần nói lại, họ càng bám chặt vào nó."}, {"nhan": "'Còn đã thử những gì khác?'", "dung": true, "vi_sao": "Đúng. Đây là câu giả định mở rộng mà các tác giả dùng. Bấm Tiếp."}]}, {"ten": "Mép vực", "loai": "buoc", "gan": {"b5": 1}, "chu": ["Sách gọi đây là 'khoảnh khắc mép vực'. Người có điều giấu tự nhủ: nói tới đây thôi, bước thêm là mất hết.", "Câu 'một lần' là mép đó. Việc của mình là giúp họ bước qua, không đẩy họ lùi lại."]}, {"ten": "Vì sao không dồn", "loai": "vi_sao", "gan": {"b5": 2}, "chu": ["Mỗi lần người kia phải nói lại một lời 'không', họ càng cố thủ, và lần sau nói 'không' càng dễ.", "Hỏi 'Chỉ một lần thật sao?' là bắt họ nhắc lại. Hỏi 'Khi nào, với ai?' là chấp nhận mép vực họ đã vạch."]}, {"ten": "Mở rộng, đi ngược", "loai": "buoc", "gan": {"b5": 3}, "chu": ["Hỏi rộng hơn: 'Còn đã thử những gì khác?', 'Lần gần nhất là khi nào?'.", "Gom đủ các mẩu rồi hỏi kỹ từ mẩu nói ra sau cùng lùi về. Mẩu cuối thường nặng nhất, khó nói nhất."]}, {"ten": "Khi lời đổi", "loai": "buoc", "gan": {"b5": 4}, "chu": ["Lúc đầu người kia nói đã lấy 500 USD, lát sau nói 1.000 USD. Đừng bắt lỗi 'Lúc nãy anh nói khác'.", "Họ vừa nói gần sự thật hơn. Hỏi khả năng: 'Có thể số tiền nhiều hơn 1.000 USD không?'. Sách nói không cách nào đảm bảo kết quả."]}, {"ten": "Câu vét", "loai": "buoc", "gan": {"b5": 5}, "chu": ["Không hỏi thì không thấy. Phil quen thân Nicholson, sĩ quan CIA cấp cao nhất từng bị kết án gián điệp, nhưng chưa từng hỏi câu then chốt nào.", "Cuối mỗi chủ đề và cuối buổi, hỏi câu vét như ô dưới cùng. Ứng viên ở mục 1 lộ ra nhờ chính câu này."]}, {"ten": "Áp vào việc", "loai": "ap_dung", "chu": ["Bên bán nhận 'có một khoản vay chủ sở hữu nhỏ': đừng hỏi ngay số dư. Hỏi 'Còn những khoản nào khác với cổ đông?', gom đủ rồi đi từ khoản nói sau cùng.", "Nghe 'cơ bản là đã ghi nhận đúng kỳ' thì hỏi nhẹ: 'Nếu có phần chưa đúng kỳ thì là phần nào?'."]}]}]}, {"tieu_de": "Câu hỏi chẩn đoán: dễ với người thật", "chot": "Câu hỏi tốt là câu dễ với người nói thật mà khó với người nói dối; Levine đoán câu 'Vì sao tôi nên tin bạn?' làm người thật trông gian.", "y": ["6.1", "6.2", "6.3"], "khoi": [{"hinh": {"rong": 900, "cao": 482, "net": [{"k": "khung", "x": 20, "y": 20, "w": 280, "h": 50, "rx": 10, "kieu": "nhat", "mau": "{b6>=3?'use':'xam'}", "dong": ["{b6>=3?'Bạn biết đáp án bằng cách nào?':'Vì sao tôi nên tin bạn?'}"], "co": 15, "hien": "b6>=1"}, {"k": "mat", "x": 30, "y": 86, "co": 90, "mi": "{b6>=3?'thuong':'nhin_xuong'}", "hien": "b6>=1"}, {"k": "chu", "x": 132, "y": 112, "chu": "{b6>=3?'Người biết thật:':'Người thật vấp:'}", "co": 15, "dam": true, "canh": "trai", "hien": "b6>=1"}, {"k": "chu", "x": 132, "y": 136, "chu": "{b6>=3?'Tự nhiên biết thôi.':'Tôi không biết.'}", "co": 15, "canh": "trai", "hien": "b6>=1"}, {"k": "mat", "x": 30, "y": 206, "co": 90, "mieng": "{b6>=3?'thuong':'cuoi'}", "do": 1, "hien": "b6>=1"}, {"k": "chu", "x": 132, "y": 232, "chu": "Người gian lận:", "co": 15, "dam": true, "canh": "trai", "hien": "b6>=1"}, {"k": "chu", "x": 132, "y": 256, "chu": "{b6>=3?'tự đưa lý do vì sao':'Vì tôi là người'}", "co": 15, "canh": "trai", "hien": "b6>=1"}, {"k": "chu", "x": 132, "y": 278, "chu": "{b6>=3?'mình biết':'trung thực.'}", "co": 15, "canh": "trai", "hien": "b6>=1"}, {"k": "chu", "x": 160, "y": 340, "chu": "{b6>=3?'đọc nội dung,':''}", "co": 15, "dam": true, "mau": "accent", "hien": "b6>=3"}, {"k": "chu", "x": 160, "y": 362, "chu": "{b6>=3?'không đọc vẻ mặt':''}", "co": 15, "dam": true, "mau": "accent", "hien": "b6>=3"}, {"k": "chu", "x": 538.0, "y": 56, "chu": "tung đồng xu 50%", "co": 14, "dam": true, "hien": "b6>=2"}, {"k": "chu", "x": 340, "y": 86, "chu": "Bộ 1 · kết bằng 'Vì sao tôi nên tin bạn?'", "co": 15, "dam": true, "canh": "trai", "hien": "b6>=2"}, {"k": "khung", "x": 537.0, "y": 96, "w": 2, "h": 28, "rx": 0, "kieu": "dac", "mau": "navy", "hien": "b6>=2"}, {"k": "khung", "x": 340, "y": 109, "w": 540, "h": 2, "rx": 0, "kieu": "dac", "mau": "xam", "hien": "b6>=2"}, {"k": "chu", "x": 340, "y": 186, "chu": "Bộ 4 · nhiều câu, có 'biết bằng cách nào?'", "co": 15, "dam": true, "canh" , "w": 38.4, "h": 12, "rx": 6, "kieu": "dac", "mau": "xam", "hien": "b6>=5"}, {"k": "chu", "x": 439.0, "y": 140, "chu": "chuyên gia 29, 31, 42%", "co": 14, "dam": true, "mau": "{b6==2?'chot':'accent'}", "hien": "b6>=2"}, {"k": "chu", "x": 557.8, "y": 140, "chu": "sinh viên 51–55%", "co": 14, "canh": "trai", "hien": "b6>=2"}, {"k": "chu", "x": 703.0, "y": 240, "chu": "71, 75, 78%", "co": 14, "dam": true, "hien": "b6>=4"}, {"k": "chu", "x": 861.4, "y": 340, "chu": "33/33 · 87/89", "co": 14, "dam": true, "canh": "phai", "hien": "b6>=4"}, {"k": "chu", "x": 637.0, "y": 340, "chu": "điều có thể, chưa phải thường gặp", "co": 14, "mau": "muted", "hien": "b6>=4"}, {"k": "chu", "x": 557.8, "y": 440, "chu": "48, 51, 52%", "co": 14, "dam": true, "canh": "trai", "hien": "b6>=5"}, {"k": "chu", "x": 340.0, "y": 470, "chu": "20%", "co": 14, "mau": "muted"}, {"k": "chu", "x": 472.0, "y": 470, "chu": "40%", "co": 14, "mau": "muted"}, {"k": "chu", "x": 604.0, "y": 470, "chu": "60%", "co": 14, "mau": "muted"}, {"k": "chu", "x": 736.0, "y": 470, "chu": "80%", "co": 14, "mau": "muted"}, {"k": "chu", "x": 868.0, "y": 470, "chu": "100%", "co": 14, "mau": "muted"}], "aria": "Bên trái: câu 'Vì sao tôi nên tin bạn?' — người thật vấp 'Tôi không biết', người gian lận đáp trơn 'Vì tôi là người trung thực'; bước sau đổi sang 'Bạn biết đáp án bằng cách nào?' — người biết thật: tự nhiên biết thôi, người gian lận tự đưa lý do. Bên phải: thước 20–100% với vạch tung đồng xu 50%; bộ câu hỏi 1: sinh viên 51–55%, chuyên gia 29, 31, 42%; bộ 4: 71, 75, 78%; chuyên gia tự hỏi: 33/33 và 87/89; đổi kiểu hỏi chung (Vrij 2007): 48, 51, 52%"}}, {"dan": [{"ten": "Đoán trước", "loai": "doan", "gan": {"b6": 0}, "chu": ["Levine cho sinh viên chơi đố vui có thưởng; câu đố rất khó, và có dịp gian lận khi người coi ra ngoài. Sau đó mỗi người được phỏng vấn.", "Câu hỏi nào giúp tách người gian lận ra tốt nhất?"], "chon": [{"nhan": "'Vì sao tôi nên tin bạn?'", "vi_sao": "Nghe sắc, nhưng trong thí nghiệm, câu này làm vài người thật vấp. Bấm Tiếp để xem số."}, {"nhan": "Hỏi dồn bằng giọng nghi ngờ", "vi_sao": "Levine đo: giọng ủng hộ hay nghi ngờ gần như không đổi độ đoán đúng."}, {"nhan": "'Bạn biết đáp án đó bằng cách nào?'", "dung": true, "vi_sao": "Đúng. Người gian lận hay tự đưa lý do vì sao biết; người biết thật thường đáp 'tự nhiên biết thôi'."}]}, {"ten": "Câu làm vấp", "loai": "buoc", "gan": {"b6": 1}, "chu": ["Bộ câu hỏi đầu tiên kết bằng 'Vì sao tôi nên tin bạn?'. Người thật không ngờ bị nghi, lại không có cách tự minh oan, nên vấp: 'Tôi không biết'.", "Người gian lận đã lường trước, đáp trơn: 'Vì tôi là người trung thực'."]}, {"ten": "Ai bị lừa", "loai": "buoc", "gan": {"b6": 2}, "chu": ["Xem băng các buổi này, sinh viên đoán đúng 51–55%, như mọi khi. Các nhóm chuyên gia chỉ 29%, 31%, 42%, dưới cả tung đồng xu.", "Levine đoán (ông tự ghi là nghi, chưa đo riêng): chuyên gia nhạy với vẻ ngoài thay đổi, nên đọc cái vấp của người thật thành nói dối."]}, {"ten": "Ý của câu này", "loai": "vi_sao", "gan": {"b6": 3}, "chu": ["Levine tóm lại: hỏi câu khó với người nói dối nhưng dễ với người nói thật. Câu đố khó tới mức ít ai tự biết quá 1–2 câu.", "Nên ai đúng nhiều mà được hỏi 'biết bằng cách nào' thì phải dựng lý do. Câu hỏi làm lời nói dễ nhìn thấu, không bắt mình đoán vẻ mặt."]}, {"ten": "Số đo", "loai": "buoc", "gan": {"b6": 4}, "chu": ["Bộ câu hỏi 4 gồm nhiều câu: ai đúng bao nhiêu câu, biết bằng cách nào, có gian lận không, một câu mồi. Ba nhóm xem băng đoán đúng 71%, 78%, 75%.", "Sách không tách riêng phần của câu 'biết bằng cách nào'. Tự hỏi, không kịch bản, Pete Blair đúng 33/33 người, năm chuyên gia khác 87/89 buổi: điều có thể, chưa phải thường gặp."]}, {"ten": "Bằng chứng mỏng", "loai": "buoc", "gan": {"b6": 5}, "chu": ["Cao như vậy chỉ từ một loại thí nghiệm, một và năm chuyên gia. Đổi kiểu hỏi chung chung thì không giúp: Vrij (2007) đo 52%, 51%, 48%.", "Hai sách còn lệch nhau: Spy the Lie bảo đừng doạ, còn câu mồi trong thí nghiệm của Levine thật ra là doạ, vì chưa hề hỏi bạn cùng nhóm."]}, {"ten": "Áp vào việc", "loai": "ap_dung", "chu": ["Trước buổi làm việc, viết vài câu mà người nói thật đáp dễ, người bịa đáp khó: 'Con số này lấy từ đâu, ai tính, tính thế nào?'.", "Bỏ câu 'Sao tôi phải tin anh?': nó làm người thật vấp và làm anh đọc sai."]}]}]}], "tom": {"chuoi": [{"chu": "Hỏi xong: nhìn và nghe", "mau": "navy"}, {"chu": "Câu đẹp chưa phải trả lời", "mau": "navy"}, {"chu": "Ngắn, một nghĩa", "mau": "use"}, {"chu": "Giả định, mồi, không doạ", "mau": "use"}, {"chu": "Còn gì nữa? Câu vét", "mau": "use"}, {"chu": "Dễ với người thật, khó với người dối", "mau": "chot"}], "nho": "Đọc vị chỉ tốt bằng câu hỏi mình đặt ra."}, "cau_kiem": [{"id": "k1", "y": "1.1", "ten": "Cụm sau câu hỏi", "muc": 1, "xem": "mục 1 · Spy the Lie ch3", "A": {"y": "1.1", "hoi": "Anh hỏi: 'Dự báo đã tính việc mất khách X chưa?'. Trong 2 giây đầu, giám đốc đưa tay lên mặt và đáp: 'Câu hỏi hay đấy.' Nên làm gì?", "lua": [{"chu": "Đánh dấu câu này, hỏi sâu thêm và xin số liệu về khách X", "dung": true}, {"chu": "Kết luận dự báo đã bị thổi phồng", "giai": "Cụm chỉ cho biết câu hỏi chạm chỗ cần làm tiếp, không phải bằng chứng (mục 1)."}, {"chu": "Bỏ qua vì ông ấy vẫn trả lời bình thường", "giai": "Hai dấu hiệu ngay sau một câu, một ở cử chỉ, một ở lời, là đủ một cụm (mục 1)."}]}, "B": {"y": "1.1", "hoi": "Khoảng ba phút sau câu hỏi về nợ vay, trong lúc đang nói chuyện khác, đối tác gãi tai một lần. Đọc thế nào?", "lua": [{"chu": "Chưa nối được với câu nợ vay: quá xa câu hỏi và chỉ có một dấu hiệu", "dung": true}, {"chu": "Đó là phản ứng muộn với câu nợ vay", "giai": "Dấu hiệu đầu phải bật ra trong vài giây sau câu hỏi mới nối được với nó (mục 1)."}, {"chu": "Gãi tai cho thấy đối tác đang nói dối", "giai": "Một dấu hiệu lẻ thì bỏ qua, và cả cụm cũng chỉ là dấu hiệu, không phải bằng chứng (mục 1)."}]}}, {"id": "k2", "y": "2.1", "ten": "Thuyết phục hay trình bày", "muc": 2, "xem": "mục 2 · Spy the Lie ch4", "A": {"y": "2.1", "hoi": "Anh hỏi vì sao một lô hàng lớn bị trả về. Giám đốc kể 20 năm nay công ty chưa từng mất khách nào. Câu nào đúng nhất?", "lua": [{"chu": "Câu đó chưa trả lời lô hàng: ghi nhận rồi hỏi lại đúng lô hàng đó", "dung": true}, {"chu": "Uy tín 20 năm, lô hàng chắc chỉ là sự cố nhỏ", "giai": "Đó là điều câu trả lời muốn anh nghĩ; nó nói về công ty, không về lô hàng (mục 2)."}, {"chu": "Giám đốc đang nói dối về lô hàng", "giai": "Chưa trả lời chưa phải nói dối; quay lại câu hỏi để biết (mục 2)."}]}, "B": {"y": "2.1", "hoi": "Hỏi về một khoản chi không có hoá đơn, kế toán trưởng mở ngay tập ảnh công ty được khen thưởng. Xếp câu trả lời này vào đâu?", "lua": [{"chu": "Thuyết phục về con người, chưa trình bày gì về khoản chi", "dung": true}, {"chu": "Trình bày: có bằng chứng kèm theo", "giai": "Ảnh khen thưởng là thật nhưng không nói gì về khoản chi đang hỏi (mục 2)."}, {"chu": "Bằng chứng chắc chắn là có gian lận", "giai": "Đây là một dấu hiệu, chỉ cho anh biết phải hỏi tiếp (mục 1, 2)."}]}}, {"id": "k3", "y": "3.2", "ten": "Câu dễ hỏng", "muc": 3, "xem": "mục 3 · Spy the Lie ch10", "A": {"y": "3.2", "hoi": "Câu nào nên sửa trước khi hỏi bên bán?", "lua": [{"chu": "'Công ty không có tranh chấp nào đang chờ xử, đúng không?' — câu phủ định", "dung": true}, {"chu": "'Công ty đang có những tranh chấp nào?'", "giai": "Câu này ngắn, một nghĩa; không cần sửa (mục 3)."}, {"chu": "'Tranh chấp lớn nhất đang ở giai đoạn nào?'", "giai": "Câu một ý, hỏi thẳng điều cần biết (mục 3)."}]}, "B": {"y": "3.2", "hoi": "Anh hỏi: 'Biên lợi nhuận giảm vì giá vốn hay chi phí bán hàng, và năm sau sẽ ra sao?'. Lỗi chính là gì?", "lua": [{"chu": "Câu ghép: không biết phản ứng ứng với phần nào, người kia được chọn phần dễ", "dung": true}, {"chu": "Câu quá ngắn nên thiếu thông tin", "giai": "Ngược lại: câu gói nhiều ý; tách ra từng câu (mục 3)."}, {"chu": "Câu giả định, dễ làm người kia phật ý", "giai": "Đây không phải câu giả định; lỗi là ba ý trong một câu (mục 3, 4)."}]}}, {"id": "k4", "y": "4.2", "ten": "Mồi, không doạ", "muc": 4, "xem": "mục 4 · Spy the Lie ch10", "A": {"y": "4.2", "hoi": "Nghi một tài liệu deal bị lộ ra ngoài. Câu nào đúng kiểu câu mồi sách khuyên?", "lua": [{"chu": "'Có lý do gì ai đó sẽ nói tài liệu deal đi ra ngoài từ phía anh không?'", "dung": true}, {"chu": "'Bộ phận công nghệ đã thấy anh tải file đó.' (chưa ai thấy)", "giai": "Đó là doạ: người kia hỏi lại là lộ, mình thành đối thủ, lại nói sai sự thật (mục 4)."}, {"chu": "'Anh có tải file đó không?'", "giai": "Câu thẳng đã được chuẩn bị sẵn: một chữ 'Không' là xong (mục 4)."}]}, "B": {"y": "4.2", "hoi": "Anh nghi một nhân viên gửi bảng giá chào thầu ra ngoài. Cách hỏi nào sát sách nhất?", "lua": [{"chu": "'Có lý do gì ai đó sẽ nói đã thấy anh gửi file giá ra ngoài không?'", "dung": true}, {"chu": "'Đã có người thấy anh gửi file giá ra ngoài.' (thật ra chưa có ai)", "giai": "Doạ: bị hỏi 'Ai?' là mình kẹt; sách nói doạ hiếm khi ăn (mục 4)."}, {"chu": "Hỏi đi hỏi lại 'Anh có gửi không?' cho tới khi người đó nhận", "giai": "Mỗi lần nói lại chữ 'không' làm người kia càng cố thủ (mục 5)."}]}}, {"id": "k5", "y": "5.2", "ten": "Mở rộng, hỏi khả năng", "muc": 5, "xem": "mục 5 · Spy the Lie ch11", "A": {"y": "5.2", "hoi": "Bên bán nhận: 'Có một khoản vay chủ sở hữu nhỏ.' Câu tiếp theo tốt nhất?", "lua": [{"chu": "'Còn những khoản nào khác với cổ đông?'", "dung": true}, {"chu": "'Khoản đó bao nhiêu, ký khi nào?'", "giai": "Hỏi theo mẩu đầu là chấp nhận mép vực họ vạch; mở rộng trước (mục 5)."}, {"chu": "'Chỉ một khoản thôi thật sao?'", "giai": "Câu này bắt họ nói lại lời cũ, càng cố thủ (mục 5)."}]}, "B": {"y": "5.2", "hoi": "Lần đầu giám đốc nói chi phí phát sinh khoảng 2 tỷ đồng, lát sau nói 3 tỷ. Câu nào đúng kiểu sách?", "lua": [{"chu": "'Có thể con số còn cao hơn 3 tỷ không?'", "dung": true}, {"chu": "'Lúc nãy anh nói 2 tỷ mà?'", "giai": "Bắt lỗi làm người kia lùi lại; họ vừa nói gần sự thật hơn (mục 5)."}, {"chu": "Ghi 3 tỷ rồi chuyển chủ đề", "giai": "Lời đổi là chỗ nên hỏi khả năng, chưa nên dừng (mục 5)."}]}}, {"id": "k6", "y": "6.1", "ten": "Câu hỏi chẩn đoán", "muc": 6, "xem": "mục 6 · Levine, Duped ch14", "A": {"y": "6.1", "hoi": "Đối tác đưa một con số dự báo rất đẹp. Câu nào là câu hỏi chẩn đoán?", "lua": [{"chu": "'Con số này lấy từ đâu, ai tính, tính thế nào?'", "dung": true}, {"chu": "'Vì sao tôi nên tin con số này?'", "giai": "Kiểu câu này làm người thật vấp, mà người đã chuẩn bị thì đáp trơn (mục 6)."}, {"chu": "'Anh chắc chứ?'", "giai": "Chỉ mời một chữ 'chắc'; người thật hay người bịa đều đáp được (mục 6)."}]}, "B": {"y": "6.1", "hoi": "Theo Levine, vì sao câu 'Bạn biết đáp án đó bằng cách nào?' có ích trong thí nghiệm đố vui?", "lua": [{"chu": "Người biết thật đáp dễ, người gian lận phải dựng lý do", "dung": true}, {"chu": "Nó làm người nói dối lo, lộ ra trên mặt", "giai": "Levine không đọc vẻ mặt; câu hỏi có ích vì nội dung câu trả lời khác nhau (mục 6)."}, {"chu": "Nó đúng trong mọi buổi phỏng vấn", "giai": "Mới thử trong một loại thí nghiệm gian lận câu đố; Levine nói đây là điều có thể (mục 6)."}]}}], "ma_trang": "doc-vi-09-dat-cau-hoi-bb6c8d", "chua_kiem": [{"id": "1.2", "ten": "(mục 1)"}, {"id": "1.3", "ten": "(mục 1)"}, {"id": "2.2", "ten": "(mục 2)"}, {"id": "3.1", "ten": "(mục 3)"}, {"id": "3.3", "ten": "(mục 3)"}, {"id": "4.1", "ten": "(mục 4)"}, {"id": "4.3", "ten": "(mục 4)"}, {"id": "5.1", "ten": "(mục 5)"}, {"id": "5.3", "ten": "(mục 5)"}, {"id": "6.2", "ten": "(mục 6)"}, {"id": "6.3", "ten": "(mục 6)"}]}</script>

 if(!m||RE.lastIndex===i)throw new Error('ký tự lạ ở vị trí '+i+' trong '+s);
 if(m[1]!==undefined)ra.push(['so',parseFloat(m[1])]);else if(m[2]!==undefined)ra.push(['chuoi',m[2].slice(1,-1).replace(/\\'/g,"'")]);
 else if(m[3]!==undefined)ra.push(['ten',m[3]]);else ra.push(['dau',m[4]]);i=RE.lastIndex}ra.push(['het',null]);return ra}
function lamTron(x,d){var k=Math.pow(10,d),s=x<0?-1:1;return s*Math.floor(Math.abs(x)*k+0.5)/k}

 if(d===undefined||d===null)d=Math.abs(x-lamTron(x,0))<1e-9?0:1;d=d|0;var y=lamTron(x,d),am=y<0;y=Math.abs(y);
 var ng=Math.floor(y+1e-9),le='';if(d>0){le=String(lamTron((y-ng)*Math.pow(10,d),0));while(le.length<d)le='0'+le;if(le.length>d){ng+=1;le=new Array(d+1).join('0')}}
 var s=String(ng).replace(/\B(?=(\d{3})+(?!\d))/g,'.');if(d>0)s+=','+le;if(am&&(ng!==0||/[1-9]/.test(le)))s='-'+s;return s}
