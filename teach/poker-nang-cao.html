:root{
  --bg:#FFFFFF; --panel:#F6F6FA; --panel2:#EEEEF2; --ink:#2E2E38; --muted:#686874; --rule:#C4C4CD; --tren-dac:#FFFFFF;
  --q-than-t:#FFFFFF; --q-vien-t:#2E2E38; --q-than-d:#2E2E38; --q-vien-d:#2E2E38; --q-chi-d:#FFFFFF;
  --navy-line:#2E2E38; --navy-chu:#2E2E38; --navy-nhat:#EEEEF2; --navy-dac:#2E2E38;
  --accent-line:#1A9AFA; --accent-chu:#0A6DBE; --accent-nhat:#E6F3FE; --accent-dac:#0A6DBE;
  --sell-line:#747480; --sell-chu:#686874; --sell-nhat:#F6F6FA; --sell-dac:#747480;
  --use-line:#1A9AFA; --use-chu:#0A6DBE; --use-nhat:#E6F3FE; --use-dac:#0A6DBE;
  --ok-line:#1A9AFA; --ok-chu:#0A6DBE; --ok-nhat:#E6F3FE; --ok-dac:#0A6DBE;
  --bad-line:#747480; --bad-chu:#2E2E38; --bad-nhat:#F6F6FA; --bad-dac:#747480;
  --xam-line:#A3A3AE; --xam-chu:#686874; --xam-nhat:#F6F6FA; --xam-dac:#747480;
  /* v1.3.7 nhan KET LUAN (Quang 16-11: "cho mot mau do nau nhan manh"): cau chot, cau nho, o ket luan tren hinh */
  --chot-line:#9A3412; --chot-chu:#9A3412; --chot-nhat:#FBEDE6; --chot-dac:#9A3412; --chot-recap:#F2A88A;
  --font:Arial,'Liberation Sans',sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#23232B; --panel:#2E2E38; --panel2:#363641; --ink:#FFFFFF; --muted:#B0B0BA; --rule:#4E4E5A;
  --q-than-t:#FFFFFF; --q-vien-t:#0E0E14; --q-than-d:#0E0E14; --q-vien-d:#9A9AA6; --q-chi-d:#686874;
  --navy-line:#C4C4CD; --navy-chu:#FFFFFF; --navy-nhat:#363641; --navy-dac:#4E4E5A;
  --accent-line:#1A9AFA; --accent-chu:#7FC4FC; --accent-nhat:#163049; --accent-dac:#0A6DBE;
  --sell-line:#9A9AA6; --sell-chu:#C4C4CD; --sell-nhat:#2E2E38; --sell-dac:#747480;
  --use-line:#1A9AFA; --use-chu:#7FC4FC; --use-nhat:#1B2B3B; --use-dac:#0A6DBE;
  --ok-line:#1A9AFA; --ok-chu:#7FC4FC; --ok-nhat:#1B2B3B; --ok-dac:#0A6DBE;
  --bad-line:#9A9AA6; --bad-chu:#FFFFFF; --bad-nhat:#2A2A33; --bad-dac:#4E4E5A;
  --xam-line:#747480; --xam-chu:#B0B0BA; --xam-nhat:#2A2A33; --xam-dac:#4E4E5A;
  --chot-line:#F2A88A; --chot-chu:#F2A88A; --chot-nhat:#3A2A26; --chot-dac:#9A3412; --chot-recap:#F2A88A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media(min-width:900px){.wrap{padding-left:40px;padding-right:40px}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font-family:var(--font);font-size:calc(17px*var(--kk,1))}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg text{font-family:var(--font)}
.top{position:sticky;top:0;z-index:20;background:#2E2E38;color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top .t{font-weight:700;font-size:16px;margin-right:auto}
.toc{display:flex;gap:8px;flex-wrap:wrap}
.toc a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:3px 10px;border-radius:14px;border:1.5px solid rgba(255,255,255,.4)}
.pill{font-size:14px;font-weight:700;background:rgba(255,255,255,.14);border-radius:14px;padding:3px 10px}
.theme{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;padding:2px 8px;font-size:13px}
/* co chu (v1.3.8c; Quang 17-11-2026: "them nut chu nho chu lon ... doc tren dien thoai"): zoom vung noi dung, thanh dau giu nguyen */
.cochu{display:inline-flex;gap:4px;flex:0 0 auto}.cochu button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:700;min-width:34px}.cochu button.het{opacity:.35}
.kick{font-size:calc(14px*var(--kk,1));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-chu)}
.part{padding:24px 0 4px}
.part>h2{font-size:calc(30px*var(--kk,1));line-height:1.15;margin:4px 0 4px}
.part>.lead{color:var(--muted);font-size:calc(18px*var(--kk,1));margin:0}
.les{padding:22px 0 18px;border-top:1px solid var(--rule)}
.les h3{font-size:calc(24px*var(--kk,1));margin:0 0 6px;line-height:1.2}
.les .no{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--accent-dac);color:#fff;font-weight:700;font-size:calc(15px*var(--kk,1));align-items:center;justify-content:center;margin-right:8px;vertical-align:3px}
.key{font-size:calc(19px*var(--kk,1));font-weight:600;color:var(--chot-chu);margin:0 0 12px;border-left:5px solid var(--chot-line);padding-left:12px}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}.lkb{display:inline-block;padding:9px 14px;border:1.5px solid var(--use-line);border-radius:8px;color:var(--ink);background:var(--use-nhat);text-decoration:none;font-weight:700;font-size:calc(16px*var(--kk,1))}.lkb:hover{border-color:var(--ink)}
.ghi{display:inline-block;background:var(--use-nhat);border-left:5px solid var(--use-line);padding:8px 14px;border-radius:0 6px 6px 0;font-size:calc(17px*var(--kk,1));margin:8px 0 10px}
.fig{border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--bg);margin-bottom:10px;min-width:0}
.fig>svg{width:100%;height:auto;display:block}
.row2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.row2>*{min-width:0}
@media(max-width:900px){.row2{grid-template-columns:1fr !important}}
/* v1.3.3: cot loi giang lam phan giua hep lai -> do theo be rong phan giua, khong theo man hinh (hai hinh canh nhau thi xep doc) */
#trang{container-type:inline-size}
@container (max-width:1000px){.row2{grid-template-columns:1fr !important}}
.ctl{background:var(--panel);border-radius:8px;padding:14px 16px}
.ctl .tt{font-weight:700;margin-bottom:6px}
.ctl .row{margin-bottom:8px}
.buoc{display:flex;align-items:center;gap:10px}.buoc input{flex:1;min-width:0}.buoc .btn{flex:none;padding:6px 12px}.buoc .btn.het{opacity:.35}
.ctl label{display:flex;justify-content:space-between;font-weight:600;font-size:calc(16px*var(--kk,1));margin-bottom:2px}
input[type=range]{width:100%;height:28px;accent-color:var(--accent-line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.btn{border:1.5px solid var(--accent-dac);background:transparent;color:var(--accent-chu);border-radius:6px;padding:7px 14px;font-weight:600}
.btn.on{background:var(--accent-dac);color:#fff}
.btn.go{background:var(--navy-dac);border-color:var(--navy-dac);color:#fff}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.tile{flex:1 1 140px;background:var(--bg);border-radius:8px;padding:10px 14px;border-top:5px solid var(--rule)}
.tile b{display:block;font-size:calc(30px*var(--kk,1));line-height:1.1}
.tile span{font-size:calc(15px*var(--kk,1));color:var(--muted)}
.flowdash{stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
svg .dim{opacity:.28;transition:opacity .3s}
svg .hot{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.flowdash{animation:none}}
.recap{background:#2E2E38;color:#fff;border-radius:10px;padding:16px 18px;margin:8px 0 6px}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:calc(18px*var(--kk,1))}
.sum .b{border-radius:8px;padding:10px 14px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.sum .ar{font-size:calc(24px*var(--kk,1));color:#fff;opacity:.7}
.recap p{margin:10px 0 0;font-size:calc(18px*var(--kk,1))}
.recap p b{color:var(--chot-recap)}
.vt{padding:18px 0 6px;border-top:1px solid var(--rule);margin-top:14px;scroll-margin-top:64px}
.vt h3{font-size:calc(22px*var(--kk,1));margin:0 0 10px}
.vt dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:8px 18px;margin:0}
.vt .dong{display:flex;gap:10px;align-items:baseline;background:var(--panel);border-radius:6px;padding:7px 10px}
.vt dt{font-weight:700;color:var(--navy-chu);min-width:64px;flex:none}
.vt dd{margin:0;font-size:calc(16px*var(--kk,1))}
.quiz{display:grid;gap:12px;margin-top:10px}
.card{border:2px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--bg)}
.card.dat{border-color:var(--ok-line)} .card.sai{border-color:var(--bad-line)}
.card .hd{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);font-size:calc(15px*var(--kk,1));font-weight:700;flex-wrap:wrap}
.card .hd .st{margin-left:auto;font-size:calc(13.5px*var(--kk,1));padding:1px 9px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.card.dat .hd .st{background:var(--ok-dac);color:#fff} .card.sai .hd .st{background:var(--bad-nhat);color:var(--bad-chu)}
.card .bd{padding:12px 14px}
.qtext{font-size:calc(19px*var(--kk,1));font-weight:600;margin:2px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:calc(17px*var(--kk,1));line-height:1.35}
.opt:hover:not([disabled]){border-color:var(--accent-line)}
.opt.right{border-color:var(--ok-line);background:var(--ok-nhat)} .opt.wrong{border-color:var(--bad-line);background:var(--bad-nhat)}
.opt .why{display:block;font-size:calc(15px*var(--kk,1));color:var(--muted);margin-top:4px}
.opt .why[hidden]{display:none}
.numq{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numq input{width:140px;padding:9px 10px;border:2px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font-size:calc(18px*var(--kk,1))}
.fb{margin-top:10px;padding:9px 12px;border-radius:6px;font-size:calc(17px*var(--kk,1))}
.fb.ok{background:var(--ok-nhat);border-left:5px solid var(--ok-line)} .fb.no{background:var(--bad-nhat);border-left:5px solid var(--bad-line)}
.fb small{display:block;color:var(--muted);font-size:calc(14px*var(--kk,1));margin-top:3px}
.result{background:var(--panel);border-radius:10px;padding:14px 16px;margin:14px 0 40px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--rule);border-radius:14px;padding:3px 12px;font-size:calc(15px*var(--kk,1));background:var(--bg)}
.chip.dat{background:var(--ok-dac);border-color:var(--ok-dac);color:#fff} .chip.sai{border-color:var(--bad-line);color:var(--bad-chu);background:var(--bad-nhat)}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:calc(15px*var(--kk,1));background:var(--bg);border-radius:8px;padding:10px 14px}
.chuakiem{font-size:calc(15px*var(--kk,1));color:var(--muted);margin-bottom:8px}
.nguon{color:var(--muted);font-size:calc(14px*var(--kk,1));margin:14px 0 0}
/* thanh nghe (v1.3.3): loi giang doc san tung muc, nghe song song khi keo trang */
.nghebar{position:sticky;bottom:0;z-index:25;background:#2E2E38;color:#fff}
.nghebar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.nghebar button{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:16px;padding:4px 12px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.nghebar button.chinh{background:#fff;color:#2E2E38;border-color:#fff}
.nghebar .nhan{font-size:15px;font-weight:600;flex:1 1 220px;min-width:0}
.nghebar .gio{font-size:14px;opacity:.85}
.nghebar label{font-size:14px;display:inline-flex;align-items:center;gap:6px}
.nghebar .thanh{flex:1 1 100%;height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.nghebar .thanh i{display:block;height:100%;width:0;background:#1A9AFA}
.les .ui.nghemuc{display:inline-block;margin:0 0 8px}
.les .ui.nghemuc button{background:var(--accent-nhat);color:var(--accent-chu);border:1.5px solid var(--accent-line);border-radius:14px;padding:3px 12px;font-size:calc(15px*var(--kk,1));font-weight:600;display:inline-flex;align-items:center;gap:6px}
.les{position:relative}.les.dangnghe::before{content:"";position:absolute;left:-11px;top:14px;bottom:10px;width:4px;border-radius:2px;background:var(--accent-line)}

.lg{display:none}
