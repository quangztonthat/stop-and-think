<style>
:root {
  --rust: #8b3a2b; --copper: #c4923c;
  --cream: #ffffff; --cream-soft: #f7f7f7;
  --ink: #1a1410; --muted: #3d3d3d;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--cream); color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 19px; line-height: 1.6;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center;
}
.thanks-block { max-width: 540px; }
.mark {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 64px; color: var(--rust); margin-bottom: 24px;
  letter-spacing: 0.3em;
}
h1 {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: clamp(32px, 4.5vw, 48px); font-weight: 600; line-height: 1.1;
  margin-bottom: 16px; letter-spacing: -0.02em;
}
h1 em { font-style: normal; color: var(--rust); }
.lead {
  font-size: 19px; color: var(--muted); margin-bottom: 32px;
}
.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn {
  padding: 14px 28px;
  font-family: system-ui, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0.15em;
  text-transform: uppercase; text-decoration: none;
  border: 2px solid var(--ink); transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 10px;
}
.btn-primary { background: var(--ink); color: var(--cream); }
.btn-primary:hover { background: var(--rust); border-color: var(--rust); transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--copper); }
.btn-secondary { background: transparent; color: var(--ink); }
.btn-secondary:hover { background: var(--ink); color: var(--cream); }
</style>
<link rel="stylesheet" href="assets/dark.v5.css?v=20260713c"/>
<script defer src="assets/theme.v5.js"></script>
</head>
<body>
<div class="thanks-block">
<div class="mark">◆ ◆ ◆</div>
<h1>Cảm ơn — đã <em>đăng ký</em>.</h1>
<p class="lead">Email của bạn đã được lưu. Khi có cuốn mới, tôi sẽ gửi 1 bản tóm tắt 3 phút đọc.</p>

<a class="btn btn-secondary" href="/pages/gioi-thieu.html">Đọc về Quang Ton</a>
</div>
</div>
</body>
