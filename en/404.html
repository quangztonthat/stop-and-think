.btn.primary {

  color: var(--cream);

}

.btn.primary:hover {
  background: var(--rust-deep);
  border-color: var(--rust-deep);
  transform: translate(-2px, -2px);
  box-shadow: 4px 4px 0 var(--ink);
}

.btn.secondary {
  background: transparent;
  color: var(--ink);
}

.btn.secondary:hover {

  color: var(--cream);
